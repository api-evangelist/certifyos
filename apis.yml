x-duplicate-note: This repo and all/certifyos/ profile the SAME company (domain certifyos.com). "Certify" is the current brand and the name Forge
  Global lists the stock under; "CertifyOS" is the legal/domain name. The two entries should be merged by the duplicate-merge campaign — the artifacts
  harvested in this pass live HERE and all/certifyos/ has no openapi/, so merge by moving these directories into the surviving repo rather than
  deleting them.
