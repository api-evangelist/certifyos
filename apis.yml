apis:
- name: CertifyOS Provider Data API
  description: >-
    RESTful v2 API for healthcare provider data management. Endpoints create,
    retrieve, and manage provider and facility profiles, run real-time primary
    source verification (PSV), retrieve CAQH data, and drive credentialing,
    licensing, enrollment, and monitoring workflows. Real-time notifications are
    delivered via webhooks; bulk data is available via exports.
