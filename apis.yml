aid: certifyos
name: Certifyos
description: >-
  CertifyOS is a healthcare provider data platform that delivers a single,
  AI-enabled source of truth for provider information. Founded in 2021 by former
  Oscar Health employees and led by CEO Anshul Rathi, the New York-based company
  offers an API-first platform that automates every stage of provider network
  management: credentialing, licensing, payer enrollment, compliance monitoring,
  roster management, and provider data management. CertifyOS connects directly to
  600+ primary sources (including CAQH and NPPES) for real-time primary source
  verification (PSV), and exposes verified provider data to downstream systems
  through a RESTful v2 API, webhooks, and bulk exports. It serves payers, health
  systems, multi-state provider groups, and rapidly scaling digital-health
  companies. Backed by General Catalyst (Series A) and Transformation Capital
  (Series B).
