- name: CertifyOS API (v2)
  description: The CertifyOS v2 API is the application-tier REST surface published as an OpenAPI 3.0.0
    document. It covers provider and facility creation and retrieval, provider-with-groups lookups, credentialing
    workflow status transitions, monitoring flags, forms, API token issuance, and webhook registration
    for credentialing lifecycle events. Requests are bearer-JWT authenticated and scoped by a required
    organization-id header; list endpoints use offset/limit paging.
  humanURL: https://docs.certifyos.com/reference/application/api
  baseURL: https://ng-api-production.certifyos.com
