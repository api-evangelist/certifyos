aid: certifyos
name: Certifyos
description: 'Certify (operating as CertifyOS, certifyos.com) is a New York-based healthcare provider data platform that automates the end-to-end
  provider network management lifecycle: credentialing, licensing, payer enrollment, compliance monitoring, and roster management. Founded in
  2020 by CEO Anshul Rathi, the company describes itself as API-first and UI-agnostic, connecting directly to hundreds of primary sources for
  real-time primary source verification (PSV) and exposing verified provider data to downstream systems through REST APIs, webhooks, and bulk
  exports. Its public developer surface — the Certify ProviderHub API — is documented on a Redocly-hosted docs site and backed by three published
  OpenAPI documents covering 520 operations across practitioner, facility, credentialing-workflow, monitoring, roster, contract, network, and
  tenant/role administration. The company also publishes ~95 first-party JSON Schemas at stable canonical URLs on schemas.certifyos.com. Customers
  are payers, health systems, multi-state provider groups, and digital-health companies. Backed by General Catalyst, Transformation Capital, Upfront
  Ventures, and SemperVirens; total disclosed funding $70.45M through a $40M Series B in June 2025.'
url: https://raw.githubusercontent.com/api-evangelist/certifyos/refs/heads/main/apis.yml
