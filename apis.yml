apis:
- name: Certify ProviderHub API
  description: The Certify ProviderHub API is the platform's primary REST surface, published as two OpenAPI
    3.1.0 documents (the api-service API layer and the roster-service layer). It covers practitioner and
    facility records, credentialing and facility-credentialing workflows, monitoring workflows and runs,
    groups, locations, networks, payers, plans and contracts, rosters, roster records and templates, specialties,
    users, roles and permissions, outreach and email settings, file storage, form submissions, and webhook
    subscription management. Every request is JWT-authenticated and tenant-scoped via a required tenant-id
    header; list endpoints support page/size paging, cursor paging (startAfterId/endAtId), ordering, and
    a URL-encoded JSON filter grammar.
  humanURL: https://docs.certifyos.com/reference/api-service/openapi
  baseURL: https://api-service.certifyos.com
  tags:
