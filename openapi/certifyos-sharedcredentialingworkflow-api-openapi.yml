  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/members/specialties-to-credential:
    put:
      summary: Set one member's Specialties to Cred, under its own tenant
      description: Sets the specialties one member workflow of this shared credentialing run credentials, under the tenant named in the body. The body carries the member's desired list; the server adds what is new and removes what is gone through the shared Specialties section's own writes, for that tenant only. A removed specialty another tenant also holds is narrowed off this tenant; one only this tenant holds is deleted. The section writes need credentialing-workflow:details:create (to add) and details:delete (to remove) on every member tenant. Refuses a member outside the States to Cred editable statuses (PSV Complete and later, Withdrawn or Cancelled). A specialty is matched by taxonomy code, else by name; primarySpecialty, subspecialty and type only apply to a newly added specialty, and a specialty the member already holds is left as it is. Writes run removals first, one at a time, so a refusal part-way leaves the earlier writes in place and a retry recomputes the difference. **One member per call.** An empty array removes them all.
      operationId: setSharedMemberSpecialtiesToCredential
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing run id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedMemberSpecialtiesRequest'
        required: true
      responses:
        '204':
          description: The member's Specialties to Cred are as sent
        '400':
          description: Missing shared run id, a missing or blank workflowId or tenantId, an absent specialties list, an entry without a specialty, an invalid record, or a member whose status does not allow editing (WORKFLOW_NOT_EDITABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The caller may not update credentialing workflows in the body tenant, or lacks the section permission on a member tenant; a missing details:create is found only when the add runs, so earlier removals stand and a retry recomputes the difference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The workflow and tenant are not a member of this shared run in this anchor group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 'WORKFLOW_CONFLICT or STALE_RECORD: a concurrent writer changed the records; safe to retry'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'SPECIALTY_RECORD_COLLISION: two specialties differ only by taxonomy code and cannot be changed together (send them in separate calls), or another section refusal such as ALL_TENANTS_LOCKED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: The write failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/members/states-to-credential:
    put:
      summary: Set one member's States to Cred, under its own tenant
