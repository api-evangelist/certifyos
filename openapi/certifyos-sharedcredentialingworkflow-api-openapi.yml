        in: path
        schema:
          type: string
      - description: Section path name, e.g. board-certifications
        required: true
        name: section
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      responses:
        '200':
          description: Processed, even when some members failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedRecordVerifyResponse'
        '400':
          description: An unknown or non-verifiable section, or a key that is not 64 lowercase hex characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Insufficient permissions, here or in any member tenant (TENANT_PERMISSION_MISSING, naming the permission and no tenant); nothing was written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such run in this anchor group, no member left, or a member tenant the caller cannot read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: The verify failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/rollups/recompute:
    post:
      summary: Re-derive one shared credentialing group's rollups
      description: 'Reads the group''s member workflows, re-derives every rollup, and writes the result if anything moved. Idempotent: a second run reports UNCHANGED and writes nothing. Use dryRun to see the delta first — this is the only gate in front of a write that can close a group to new tenant joins permanently, and a dry run reports that outcome as closedToNewJoins.'
      operationId: recomputeSharedWorkflowRollups
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing group id
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: Required. 'true' reports what would change without writing it; 'false' writes it. Either value in any case; anything else, or an empty or missing value, is a 400 rather than a write.
        required: true
        name: dryRun
        in: query
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      responses:
        '200':
          description: Processed, whether or not anything was written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollupRecomputeResponse'
        '400':
          description: dryRun was missing, empty, or neither 'true' nor 'false'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The caller may not edit a credentialing workflow in the tenant-id header's tenant, or in one of the member tenants; nothing was derived or written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such group, it is not in this anchor group, or the caller holds none of its member tenants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Recompute is not enabled in this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/withdraw:
    post:
      summary: Withdraw one shared credentialing group's members
      description: Called by a Cloud Task, one group per task. Moves every member that the transition matrix permits to WITHDRAWN_CANCELLED and leaves the rest alone; nothing is written to the group row, whose status is re-derived from the members that moved.
      operationId: withdrawSharedCredentialingWorkflow
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing group id
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: Unsigned tenant header; must agree with the payload's tenantId
        name: tenant-id
        in: header
        schema:
          type: string
      - description: The acting analyst, set on every task by CloudTasksService
        name: user-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawSharedWorkflowRequest'
        required: true
      responses:
        '200':
          description: Processed - per-member outcomes and the re-derived shared status. Nothing eligible, or a malformed task, comes back as SharedWorkflowAssignmentSkippedResponse with skipped=true, because Cloud Tasks retries every non-2xx and a permanent no must not be retried.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SharedMemberStatusChangeResponse'
                - $ref: '#/components/schemas/SharedWorkflowAssignmentSkippedResponse'
        '503':
          description: NSCP_BULK_ACTIONS_DISABLED - the write flag is off in this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
        '400':
          description: Bad Request
      security:
      - jwt: []
components:
  schemas:
    DisplayGroupKeyRecomputeMember:
      type: object
      required:
      - memberWorkflowId
      - tenantId
      - outcome
      - sections
      description: One member workflow's result.
      properties:
        memberWorkflowId:
          type: string
        tenantId:
          type: string
        outcome:
          type: string
          enum:
          - REKEYED
          - UNCHANGED
          - SKIPPED_COMPLETED
          - FAILED
        sections:
          type: array
          items:
            $ref: '#/components/schemas/DisplayGroupKeyRecomputeSection'
        error:
          type: string
          description: Why the member failed; present only when outcome is FAILED.
    StatusOption:
      type: object
      description: Status option with required and optional fields
      properties:
        name:
          type: string
          examples:
          - CRED_APPROVED
          description: Status name
        required:
          type: array
          examples:
          - - name
            - credentialingDecisionDate
          items:
            type: string
          description: List of required field names for this status
        optional:
          type: array
          examples:
          - - nextCredentialingDate
          items:
            type: string
          description: List of optional field names for this status
    MemberPsvValidationRequest:
      type: object
      required:
      - workflowId
      - tenantId
      description: A member workflow of a shared credentialing workflow and the tenant that owns it.
      properties:
        workflowId:
          type: string
          pattern: \S
          description: The member credentialing workflow to evaluate.
        tenantId:
          type: string
          pattern: \S
          description: The tenant that owns the member workflow; its PSV rules are applied.
    RollupRecomputeResponse:
      type: object
      required:
      - sharedCredWorkflowId
      description: The result of recomputing one group's rollups.
      properties:
        sharedCredWorkflowId:
          type: string
          description: The group that was recomputed.
        applied:
          type: boolean
          description: Whether anything was written.
        dryRun:
          type: boolean
          description: Whether this was a report-only run.
        reason:
          type: string
          description: 'Why nothing was applied: UNCHANGED, NO_MEMBERS or DRY_RUN.'
        changed:
          type: array
          items:
            type: string
          description: Fields whose derived value differs from the stored one.
        before:
          type: object
          additionalProperties: {}
          description: Previous values of the changed fields.
        after:
          type: object
          additionalProperties: {}
          description: Newly derived values of the changed fields. firstPsvCompleteAt is the first time the group's status reached PSV Complete, or the time of the call if its history cannot place it.
        closedToNewJoins:
          type: boolean
          description: Whether this call closed the group to new tenant joins. Permanent.
    Status:
      type: string
      enum:
      - DERIVED
      - NOT_EVALUATED
    SharedFileTypeEvaluation:
      type: string
      enum:
      - DERIVED
      - NOT_EVALUATED
    SharedSpecialtyToCredentialDto:
      type: object
      description: One specialty to credential for a member.
      properties:
        specialty:
          type: string
        subspecialty:
          type: string
        taxonomyCode:
          type: string
        primarySpecialty:
          type: boolean
    AssignSharedWorkflowRequest:
      type: object
      required:
      - tenantId
      description: Assign or unassign one shared credentialing group
      properties:
        assignedTo:
          type: string
          description: Analyst for ordinary members; null or absent unassigns
        onshoreAssignedTo:
          type: string
          description: Analyst for onshore-only members, when the group has any
        reason:
          type: string
          maxLength: 1000
          description: Optional reason, carried to the audit row
        tenantId:
          type: string
          description: Tenant written by the enqueuer; asserted against the tenant-id header
        expectedAssignedTo:
          type: string
          description: 'The analyst this group held when the task was enqueued. Stamped by the dispatcher so a retried older task cannot undo a newer assignment: Cloud Tasks does not preserve order, and retries make it less ordered still.'
        hasExpectedAssignedTo:
          type: boolean
          description: Whether expectedAssignedTo was stamped at all. Needed because null is a real expectation -- the group was unassigned -- and absent is not.
        expectedMembersAssignedTo:
          type: array
          items:
            type: string
          description: The member-level analysts the group held when the task was enqueued. Compared as a set, because R15 legitimately splits one group across two analysts and a member-level reassignment can leave assignedTo untouched.
        unassign:
          type: boolean
    SharedIdentityFieldDto:
      type: object
      required:
      - field
      description: One compared identity field.
      properties:
        field:
          type: string
        agree:
          type: boolean
        combinations:
          type: array
          items:
            $ref: '#/components/schemas/SharedIdentityCombinationDto'
    SharedMemberStatusOptionsRequest:
      type: object
      required:
      - members
      description: Member workflows of a shared credentialing run and the tenants that own them.
      properties:
        members:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MemberRef'
          description: The members to evaluate, each with its owning tenant. At most 100 entries. Duplicate (workflow, tenant) pairs collapse to a single evaluation, so a repeated pair is not read twice.
    NextCredentialingDateChangeLogEntry:
      type: object
      required:
      - changedFrom
      - changedTo
      - changeReason
      - createdBy
      - createdAt
      description: Change log entry tracking changes to the next credentialing date
      properties:
        changedFrom:
          $ref: '#/components/schemas/LocalDate'
          type: string
          examples:
          - '2025-12-31'
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Previous next credentialing date in YYYY-MM-DD format
        changedTo:
          $ref: '#/components/schemas/LocalDate'
          type: string
          examples:
          - '2026-01-15'
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: New next credentialing date in YYYY-MM-DD format
        changeReason:
          type: string
          examples:
          - Updated based on new license expiration
          description: Reason for the change
        createdBy:
          type: string
          examples:
          - user_123456
          description: User who made the change
        createdAt:
          type: string
          format: date-time
          examples:
          - '2024-01-15T10:30:00Z'
          description: Timestamp when the change was made
    SharedRunHistoryDto:
      type: object
      description: Earlier shared runs for this practitioner.
      properties:
        count:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/SharedRunHistoryItemDto'
    SharedMemberVerificationDto:
      type: object
      required:
      - outcome
      - exceptions
      - recordedAt
      - atWithdrawal
      description: A member's recorded PSV Verification outcome.
      properties:
        outcome:
          $ref: '#/components/schemas/SharedVerificationOutcome'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/SharedVerificationExceptionDto'
          description: The recorded exceptions, hidden ones included and marked.
        recordedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: When the outcome was recorded, in UTC.
        atWithdrawal:
          type: boolean
          description: True when the outcome was recorded on a Withdraw/Cancel before PSV Complete; false when recorded at PSV Complete.
    SharedVerificationExceptionDto:
      type: object
      required:
      - ruleKey
      - hiddenFromPacket
      description: One recorded PSV Verification exception.
      properties:
        ruleKey:
          type: string
        psvType:
          type: string
        description:
          type: string
          description: The rules engine's message.
        hiddenFromPacket:
          type: boolean
          description: Whether an analyst hid this exception from the PSV packet.
    TimelineEventResponse:
      type: object
      description: Response containing timeline event information
      properties:
        id:
          type: string
          examples:
          - te_123456
          description: Unique identifier for the timeline event
        workflowId:
          type: string
          examples:
          - cw_123456
          description: ID of the associated credentialing workflow
        data:
          $ref: '#/components/schemas/TimelineEventData'
          type: object
          description: Timeline event data containing name, changeReason, and date fields
        createdBy:
          type: string
          examples:
          - user_123456
          description: ID of the user who created the timeline event
        updatedBy:
          type: string
          examples:
          - user_123456
          description: ID of the user who last updated the timeline event
        createdAt:
          $ref: '#/components/schemas/Instant'
          type: string
          examples:
          - '2024-01-01T00:00:00Z'
          description: Timestamp when the timeline event was created
        updatedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          examples:
          - '2024-01-01T00:00:00Z'
          description: Timestamp when the timeline event was last updated
    WithdrawSharedWorkflowRequest:
      type: object
      properties:
        reason:
          type: string
          description: Free text, recorded as the change reason of a member whose tenant has no entry in reasonsByTenantId.
        tenantId:
          type: string
          description: The enqueuer's tenant; must agree with the tenant-id header.
        reasonsByTenantId:
          type: object
          additionalProperties:
            type: string
          description: Optional change reason per tenant id.
    SharedTenantUdfDto:
      type: object
      required:
      - tenantId
      description: A tenant's user-defined field values.
      properties:
        tenantId:
          type: string
        tenantName:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SharedUdfFieldDto'
    BulkDispatchResponse:
      type: object
      properties:
        ineligible:
          type: array
          items:
            $ref: '#/components/schemas/IneligibleGroup'
          description: Groups refused by a rule before dispatch, with the reason.
        accepted:
          type: integer
          format: int32
          examples:
          - 300
          description: Tasks enqueued, NOT groups changed.
        ineligibleCount:
          type: integer
          format: int32
          examples:
          - 1
          description: Number of groups refused by a rule.
        authorityExcludedCount:
          type: integer
          format: int32
          examples:
          - 2
          description: Groups withheld for confidentiality; never itemised.
    PipelineTriggerResultDto:
      type: object
      required:
      - memberWorkflowId
      - source
      - outcome
      description: One pull's result.
      properties:
        memberWorkflowId:
          type: string
        source:
          type: string
        outcome:
          type: string
          description: STARTED, PENDING (did not confirm in time; may still be starting), REJECTED or FAILED.
        reason:
          type: string
    SharedMemberFileTypeRequest:
      type: object
      required:
      - workflowId
      - tenantId
      description: One member workflow's File Type and/or hidden findings, with the tenant that owns it.
      properties:
        workflowId:
          type: string
          description: The member credentialing workflow to write.
        tenantId:
          type: string
          description: The tenant that owns the member workflow.
        fileType:
          type: string
          enum:
          - CLEAN
          - NON_CLEAN
          description: The file type to set; leave out for a hide-only save.
        reason:
          type: string
          maxLength: 1000
          description: Why the file type changed; at most 1000 characters. Required for NON_CLEAN; for CLEAN while a finding stays unhidden; and for either value when the member's verdict could not be evaluated or there is none. Not needed for a hide-only save.
        hiddenFindingRuleKeys:
          type: array
          maxItems: 50
          items:
            type: string
          description: The full set of finding rule keys (findings[].ruleKey on the members read) to hide from the PSV packet. Leave out to keep the current hides; send [] to remove them all. At most 50 non-blank keys, each a current finding's rule key.
    SharedPageMembersResponse:
      type: object
      required:
      - members
      description: Members of a shared credentialing run, with identity agreement, tenant UDFs and prior runs.
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/SharedMemberDto'
          description: One row per participating tenant.
        identity:
          $ref: '#/components/schemas/SharedIdentityDto'
          type: object
          description: Identity agreement across the members.
        tenantUdfs:
          type: array
          items:
            $ref: '#/components/schemas/SharedTenantUdfDto'
          description: Per-tenant user-defined fields.
        history:
          $ref: '#/components/schemas/SharedRunHistoryDto'
          type: object
          description: Earlier shared runs for this practitioner.
    SharedVerifyAllVerifiedMemberDto:
      type: object
      required:
      - memberWorkflowId
      - verifiedCount
      description: A member workflow Verify All wrote.
      properties:
        memberWorkflowId:
          type: string
        verifiedCount:
          type: integer
          format: int32
          description: Records newly stamped; 0 when all were already verified.
    SharedWorkflowAssignmentResponse:
      type: object
      description: Outcome of assigning or unassigning one shared credentialing group
      properties:
        sharedCredentialingWorkflowId:
          type: string
          description: The group acted on
        assignedTo:
          type: string
          description: The group's analyst, or null after an unassign
        membersAssignedTo:
          type: array
          items:
            type: string
          description: Every analyst now held at member level; two when R15 split the group
        membersWritten:
          type: integer
          format: int32
          examples:
          - 3
          description: Member workflows actually updated
        membersExcluded:
          type: array
          items:
            $ref: '#/components/schemas/ExcludedMember'
          description: Members deliberately not written, with the reason
    SharedRecordVerifyResponse:
      type: object
      required:
      - section
      - credentialingDisplayGroupKey
      - verified
      - skippedLocked
      - failed
      description: The per-member result of verifying one record on the shared page.
      properties:
        section:
          type: string
          description: The record's section path name, e.g. board-certifications.
        credentialingDisplayGroupKey:
          type: string
          description: The record's credentialingDisplayGroupKey.
        verified:
          type: array
          items:
            type: string
          description: Member workflow ids whose copies were stamped as verified.
        skippedLocked:
          type: array
          items:
            type: string
          description: Locked member workflow ids holding the record, not written.
        failed:
          type: array
          items:
            $ref: '#/components/schemas/SharedRecordVerifyFailedMemberDto'
          description: Member workflows not confirmed as stamped, with the reason.
    SharedFrozenReason:
      type: string
      enum:
      - PSV_READY
      - WITHDRAWN
    DisplayGroupKeyRecomputeSection:
      type: object
      required:
      - section
      description: One section whose keys moved.
      properties:
        section:
          type: string
        rowsRekeyed:
          type: integer
          format: int32
    SharedMemberDto:
      type: object
      required:
      - memberWorkflowId
      - tenantId
      description: One participating tenant's member workflow.
      properties:
        memberWorkflowId:
          type: string
        tenantId:
          type: string
        tenantName:
          type: string
        status:
          type: string
          description: The member's current credentialing status.
        assignee:
          $ref: '#/components/schemas/SharedAssigneeDto'
        assignedBy:
          $ref: '#/components/schemas/SharedAssigneeDto'
          type: object
          description: Who made the current assignment, by display name where one resolved.
        credentialingCycle:
          type: string
        statesToCredential:
          type: array
          items:
            type: string
        practitionerTypesToCredential:
          type: array
          items:
            type: string
        linesOfBusiness:
          type: array
          items:
            type: string
          description: This member's lines of business; the page shows the union.
        credDueDate:
          type: string
        psvPdfAvailable:
          type: boolean
        locked:
          type: boolean
        fileType:
          $ref: '#/components/schemas/SharedMemberFileTypeDto'
          type: object
          description: The member's file type; null when PSV transparency is not switched on for the member's tenant.
        verification:
          $ref: '#/components/schemas/SharedMemberVerificationDto'
          type: object
          description: The member's PSV Verification outcome, recorded at PSV Complete or at a withdrawal before it (CP-42475); null when none is recorded since the member's latest move back, and when PSV transparency is not switched on for the member's tenant.
        specialtiesToCredential:
          type: array
          items:
            $ref: '#/components/schemas/SharedSpecialtyToCredentialDto'
          description: 'The member''s specialties to credential (CP-43997): roster and tenant entries and analyst-touched rows, never CAQH; de-duplicated; never null.'
    SharedMemberFileTypeDto:
      type: object
      description: A member's file type.
      properties:
        verdict:
          $ref: '#/components/schemas/SharedFileTypeVerdict'
        frozen:
          type: boolean
        frozenReason:
          $ref: '#/components/schemas/SharedFrozenReason'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/SharedFileTypeFindingDto'
        lastChange:
          $ref: '#/components/schemas/SharedFileTypeChangeDto'
        originalVerdict:
          $ref: '#/components/schemas/SharedOriginalVerdict'
        evaluation:
          $ref: '#/components/schemas/SharedFileTypeEvaluation'
          type: string
          description: DERIVED when the platform evaluated the file, NOT_EVALUATED when it could not (Couldn't evaluate); null when no verdict is stored.
    SharedPipelineMemberDto:
      type: object
      required:
      - memberWorkflowId
      - tenantId
      description: One member tenant's pipeline state.
      properties:
        memberWorkflowId:
          type: string
        tenantId:
          type: string
        status:
          type: string
        lastAttemptAt:
          $ref: '#/components/schemas/Instant'
        lastStepAt:
          $ref: '#/components/schemas/Instant'
        failureReason:
          type: string
        lastSuccessAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: 'When this source last succeeded for this member, or null if it never has. Not the latest request''s outcome: a member whose most recent pull failed may still hold data from an earlier success, which is the distinction R7 asks the card to draw.'
        firstAttemptAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: When the earliest request for this source was created — the run the platform raised automatically at workflow creation (R7).
        firstAttemptBy:
          type: string
          description: Who created that earliest request. SYSTEM, or absent, means the platform started it rather than a person.
        firstAttemptByName:
          type: string
          description: The name of the user in firstAttemptBy, for display. Null when firstAttemptBy is SYSTEM or absent, or when no name resolves; show the id then.
        repullTriggeredByTenantId:
          type: string
          description: 'Set only when this member''s latest request for the source is a CAQH re-pull (CP-38645 R11): the tenant whose pull, with a later CAQH attestation date, triggered it. A tenant id, not a name. Null for the member''s own pulls, and always null for NPDB.'
        repullTriggerAttestationDate:
          $ref: '#/components/schemas/LocalDate'
          type: string
          description: 'With repullTriggeredByTenantId: the triggering pull''s CAQH attestation date. Null otherwise.'
        repullHeldAttestationDate:
          $ref: '#/components/schemas/LocalDate'
          type: string
          description: 'With repullTriggeredByTenantId: the CAQH attestation date this member held before the re-pull. Null otherwise.'
    MemberFileTypeEvaluateRequest:
      type: object
      required:
      - workflowId
      - tenantId
      description: A member workflow of a shared credentialing workflow and the tenant that owns it.
      properties:
        workflowId:
          type: string
          pattern: \S
          description: The member credentialing workflow to evaluate.
        tenantId:
          type: string
          pattern: \S
          description: The tenant that owns the member workflow; its clean rules are applied.
    GatedRuleItem:
      type: object
      required:
      - ruleKey
      description: 'A PSV rule result: its key, the PSV type it belongs to and a description'
      properties:
        ruleKey:
          type: string
          examples:
          - LICENSE_ACTIVE
          description: Key of the rule
        psvType:
          type: string
          examples:
          - License
          description: PSV type the rule belongs to, '-' when unknown
        description:
          type: string
          examples:
          - License is expired
          description: Human readable description of the rule result
        coverKey:
          type: string
          examples:
          - LICENSE_ACTIVE|lic_1
          description: Stable key of the open blocker, used to match covers and acknowledgements
        hiddenFromPacket:
          type: boolean
          examples:
          - true
