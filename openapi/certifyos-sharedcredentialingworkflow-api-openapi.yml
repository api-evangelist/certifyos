        targets:
          type: array
          items:
            $ref: '#/components/schemas/TriggerTargetDto'
          description: The members to run, each with its sources.
    SharedIdentityEditRequest:
      type: object
      required:
      - field
      - memberWorkflowIds
      description: Write one identity field to the named member tenants of a shared credentialing run.
      properties:
        field:
          type: string
          description: The identity field to write.
        value:
          type: string
          description: The value to write. Empty clears the field.
        memberWorkflowIds:
          type: array
          items:
            type: string
          description: The member workflows to write to.
    SkippedMemberDto:
      type: object
      required:
      - memberWorkflowId
      description: A member the status lock protected.
      properties:
        memberWorkflowId:
          type: string
        status:
          type: string
    DisplayGroupKeyRecomputeResponse:
      type: object
      required:
      - sharedCredWorkflowId
      - members
      - totals
      description: The result of recomputing the display group keys on one shared run's member workflows.
      properties:
        sharedCredWorkflowId:
          type: string
          description: The run that was recomputed.
        dryRun:
          type: boolean
          description: Whether this was a report-only run.
        applied:
          type: boolean
          description: Whether any member's rows were written.
        reason:
          type: string
          description: 'Why nothing was written: DRY_RUN, NO_MEMBERS or UNCHANGED.'
        members:
          type: array
          items:
            $ref: '#/components/schemas/DisplayGroupKeyRecomputeMember'
          description: One entry per member workflow.
        totals:
          $ref: '#/components/schemas/DisplayGroupKeyRecomputeTotals'
          type: object
          description: The members and rows by outcome.
    MemberPsvProgressionState:
      type: string
      enum:
      - READY
      - BLOCKED
    ApiError:
      type: object
      description: Standard API error response containing a list of error objects
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
          description: List of error objects describing validation or processing failures
    SharedIdentityDto:
      type: object
      description: Identity values across members, and whether they agree.
      properties:
        name:
          $ref: '#/components/schemas/SharedIdentityNameDto'
        npi:
          type: string
        npiMismatch:
          type: boolean
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SharedIdentityFieldDto'
    WithdrawPreviewResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/WithdrawableGroup'
          description: Groups that will be withdrawn.
        excluded:
          type: array
          items:
            $ref: '#/components/schemas/WithdrawableGroup'
          description: Groups that would not be acted on, and why there is nothing to do.
        authorityExcludedCount:
          type: integer
          format: int32
          examples:
          - 2
          description: Groups withheld for confidentiality; counted, never named or itemised.
    SharedRecordVerifyFailedMemberDto:
      type: object
      required:
      - memberWorkflowId
      - reason
      description: A member workflow not confirmed as stamped.
      properties:
        memberWorkflowId:
          type: string
        reason:
          type: string
          description: 'Why: CONFLICT (concurrent writes after retries), RECORD_CHANGED (the record changed before it was written), TIMEOUT (no answer in time; the stamp may or may not have been written, and retrying is safe), or ERROR.'
    SharedFileTypeFindingDto:
      type: object
      description: One platform finding behind a verdict.
      properties:
        ruleKey:
          type: string
          description: The clean rule that found it; the key hiddenFindingRuleKeys names.
        itemKey:
          type: string
          description: The item the finding is about, when the rule reports several; else null.
        psvType:
          type: string
        description:
          type: string
        hiddenFromPacket:
          type: boolean
          description: Whether an analyst hid this finding from the PSV packet.
    TimelineEventData:
      type: object
      required:
      - name
      description: Timeline event data containing event details. Field requirements vary by event name (see oneOf conditions in schema).
      properties:
        name:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - OUTREACH_IN_PROGRESS
          - DATA_MISSING
          - PSV_COMPLETED
          - PSV_READY
          - SENT_TO_COMMITTEE
          - TABLED
          - WITHDRAWN_CANCELLED
          - CRED_DENIED
          - CRED_APPROVED
          examples:
          - CRED_APPROVED
          description: Name of the timeline event. Must be one of the TimelineStatus enum values.
        changeReason:
          type: string
          examples:
          - Application approved by committee
          description: 'Reason for the change or status update. REQUIRED for: DATA_MISSING, WITHDRAWN_CANCELLED. Optional for: CRED_APPROVED, CRED_DENIED, and other statuses. Note: Whether this field is required or optional varies based on the permissions assigned to the user performing the action.'
        credentialingDecisionDate:
          $ref: '#/components/schemas/LocalDate'
          type: string
          examples:
          - '2024-01-15'
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: 'Date when the credentialing decision was made (YYYY-MM-DD format). REQUIRED for: CRED_APPROVED, CRED_DENIED. Not applicable for other statuses.'
        nextCredentialingDate:
          $ref: '#/components/schemas/LocalDate'
          type: string
          examples:
          - '2026-01-15'
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: 'Date when the next credentialing is due (YYYY-MM-DD format). REQUIRED for: CRED_APPROVED. Not applicable for other statuses. Should reflect the latest value from nextCredentialingDateChangeLog if present.'
        nextCredentialingDateSource:
          type: string
          enum:
          - SYSTEM_CALCULATED
          - USER_INPUT
          examples:
          - SYSTEM_CALCULATED
          description: Indicates whether the next credentialing date was calculated by the system or entered by a user. Only applicable for CRED_APPROVED events.
        nextCredentialingDateChangeLog:
          type: array
          items:
            $ref: '#/components/schemas/NextCredentialingDateChangeLogEntry'
          description: Array to track changes to the next credentialing date. The nextCredentialingDate field should reflect the latest value from this array. Only applicable for CRED_APPROVED events.
        psvPdfPath:
          type: string
          format: uri-reference
          examples:
          - /files/psv_123456.pdf
          description: 'URI reference to the PSV (Provider Summary Verification) PDF document. '
        overrideReason:
          type: string
          format: string
          examples:
          - Test override reason
          description: Indicates the reason for the override
        isOverride:
          type: boolean
          format: boolean
          examples:
          - true
          description: Indicates if the timeline event is an override bypassing the default validations
  securitySchemes:
    jwt:
      type: http
      description: JWT Authentication - Provide only the raw token without Bearer prefix
      scheme: bearer
      bearerFormat: JWT
