openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer Shared Credentialing Workflow API
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: SharedCredentialingWorkflow
  description: The NSCP Shared Credentialing Groups listing and rollup repair (internal).
paths:
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows:
    get:
      summary: The Shared Credentialing Groups listing for one Anchor Group
      description: One row per Shared Credentialing Group, with the group's derived status, coverage, cycle and due date read from the group row. Ordered by due date, earliest first and empty dates last, by default. Closed groups — those with no open member workflow — are excluded unless includeClosedGroups is set; no filter admits one implicitly. The search and filter parameters are accepted and ignored until CP-39680 implements them.
      operationId: listSharedCredentialingWorkflows
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Analyst ids; repeat or comma-join for several. The literal UNASSIGNED matches groups with no analyst.
        name: analystId
        in: query
        schema:
          type: array
          items:
            type: string
      - description: ONSHORE_ONLY or UNRESTRICTED. UNRESTRICTED is a value, not an absent filter.
        name: analystType
        in: query
        schema:
          type: string
      - description: Group created at, from (inclusive, ISO yyyy-MM-dd)
        name: createdAtFrom
        in: query
        schema:
          type: string
      - description: Group created at, to (inclusive, ISO yyyy-MM-dd)
        name: createdAtTo
        in: query
        schema:
          type: string
      - description: Cred status last updated from (inclusive, ISO yyyy-MM-dd)
        name: credStatusLastUpdatedFrom
        in: query
        schema:
          type: string
      - description: Cred status last updated to (inclusive, ISO yyyy-MM-dd)
        name: credStatusLastUpdatedTo
        in: query
        schema:
          type: string
      - description: INITIAL or RECREDENTIALING; repeat or comma-join for several
        name: credentialingCycle
        in: query
        schema:
          type: array
          items:
            type: string
      - description: Credentialing due date from (inclusive, ISO yyyy-MM-dd)
        name: credentialingDueDateFrom
        in: query
        schema:
          type: string
      - description: Credentialing due date to (inclusive, ISO yyyy-MM-dd)
        name: credentialingDueDateTo
        in: query
        schema:
          type: string
      - description: Group statuses; repeat or comma-join for several. CLOSED is accepted and means no open member workflow — it is a display value, never stored, and returns nothing unless includeClosedGroups is set.
        name: credentialingStatus
        in: query
        schema:
          type: array
          items:
            type: string
      - description: First name search (contains, case-insensitive)
        name: firstName
        in: query
        schema:
          type: string
      - description: Admit groups with no open member workflow. The ONLY mechanism that does so — a gate, not a filter.
        name: includeClosedGroups
        in: query
        schema:
          type: boolean
          default: false
      - description: Last name search (contains, case-insensitive)
        name: lastName
        in: query
        schema:
          type: string
      - description: Lines of business; repeat or comma-join for several
        name: lineOfBusiness
        in: query
        schema:
          type: array
          items:
            type: string
      - description: 'NPI: exact at 10 digits, or a prefix of at least 4 digits'
        name: npi
        in: query
        schema:
          type: string
      - description: 'Sort, as JSON: {"orderBy":"createdAt","orderByDirection":"DESC"}. Sortable: practitionerName, npi, credentialingCycle, credentialingStatus, credentialingDueDate, createdAt. Defaults to credentialingDueDate ASC, empty dates last; a named column with no direction sorts ascending, except createdAt, which sorts newest first.'
        name: order
        in: query
        schema:
          type: string
      - description: Page number (0-based)
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: '0'
      - description: Practitioner types to credential; repeat or comma-join for several
        name: practitionerTypeToCredential
        in: query
        schema:
          type: array
          items:
            type: string
      - description: PSV completed from (inclusive, ISO yyyy-MM-dd)
        name: psvCompletedFrom
        in: query
        schema:
          type: string
      - description: PSV completed to (inclusive, ISO yyyy-MM-dd)
        name: psvCompletedTo
        in: query
        schema:
          type: string
      - description: PSV ready from (inclusive, ISO yyyy-MM-dd)
        name: psvReadyFrom
        in: query
        schema:
          type: string
      - description: PSV ready to (inclusive, ISO yyyy-MM-dd)
        name: psvReadyTo
        in: query
        schema:
          type: string
      - description: Page size (max 100)
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: '10'
      - description: States to credential; repeat or comma-join for several
        name: stateToCredential
        in: query
        schema:
          type: array
          items:
            type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      responses:
        '200':
          description: One page of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedCredentialingWorkflowPagedResponse'
        '400':
          description: Invalid pagination or an unsupported sort column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The caller holds no credentialing-workflow read in the tenant-id header's tenant
        '503':
          description: The listing is not enabled in this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/bulk-assign:
    post:
      summary: Enqueue an assignment for each eligible group in the selection
      description: 'Answers 202 once the tasks are enqueued, NOT once the work is done: a 500-row selection cannot be held open for a synchronous answer. One task per group, so a group that keeps failing retries and dead-letters alone instead of dragging the rest of the selection through every redelivery. Outcomes are read back from the listing and the audit log.'
      operationId: bulkAssignSharedWorkflows
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssignSharedWorkflowsRequest'
        required: true
      responses:
        '202':
          description: Tasks enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDispatchResponse'
        '400':
          description: No groups selected, no analyst, or more than the configured cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Assignment writes are not enabled in this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/bulk-withdraw:
    post:
      summary: Enqueue a withdrawal for each eligible group in the selection
      description: 'Same dispatch shape as bulk-assign: 202 once enqueued, one task per group. No analyst is involved, so shore is never resolved and R15''s routing question does not arise — the selection is checked for scope, authority and open members only.'
      operationId: bulkWithdrawSharedWorkflows
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Required, no default. true returns the confirmation dialog's data and writes nothing; false enqueues the tasks.
        required: true
        name: dryRun
        in: query
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkWithdrawSharedWorkflowsRequest'
        required: true
      responses:
        '200':
          description: dryRun=true - the confirmation dialog's data. Nothing is written or enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawPreviewResponse'
        '202':
          description: Tasks enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDispatchResponse'
        '400':
          description: No groups selected, more than the configured cap, no reason, a reason over 1000 characters or more than 500 per-tenant reasons, a reasonsByTenantId key that is not a member tenant of the groups to be withdrawn, or a tenant to be withdrawn with no reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Assignment writes are not enabled in this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}:
    get:
      summary: One shared credentialing run
      description: 'The run''s own row: its derived shared status, the coverage rollups, the cycle and the credentialing due date. Every value is derived and persisted by the Core story; this read exposes the row and computes nothing.'
      operationId: readSharedCredentialingRun
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing run id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedCredentialingRunResponse'
        '404':
          description: No such run in this anchor group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/assign:
    post:
      summary: Assign or unassign one shared credentialing group
      description: 'Called by a Cloud Task, one group per task. A null or absent assignedTo unassigns. onshoreAssignedTo is required when the group holds onshore-only members: R15 forbids an offshore analyst taking them, so one group can legitimately need two people. Every non-terminal member is written, each resolved to the analyst its own scope demands; an all-terminal group is a no-op with membersWritten 0.'
      operationId: assignSharedCredentialingWorkflow
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing group id
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: Unsigned tenant header; must agree with the payload's tenantId
        name: tenant-id
        in: header
        schema:
          type: string
      - description: The acting analyst, set on every task by CloudTasksService
        name: user-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignSharedWorkflowRequest'
        required: true
      responses:
        '200':
          description: Processed, or acknowledged without assigning. A partially-written group is data, not an error. A settled-ineligible group, or a malformed task, comes back as SharedWorkflowAssignmentSkippedResponse with skipped=true, because Cloud Tasks retries every non-2xx and a permanent no must not be retried.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SharedWorkflowAssignmentResponse'
                - $ref: '#/components/schemas/SharedWorkflowAssignmentSkippedResponse'
        '503':
          description: NSCP_BULK_ACTIONS_DISABLED - the write flag is off in this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
        '400':
          description: Bad Request
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/display-group-keys/recompute:
    post:
      summary: Recompute the display group keys on one shared run's member workflows
      description: 'Recomputes credentialingDisplayGroupKey on every row of every catalog section of each member workflow, and writes only the sections where a stored key is missing or different. Idempotent: a second run reports UNCHANGED and writes nothing. Completed members are skipped, and a member that fails is reported without stopping the others. Use dryRun to see what would move first.'
      operationId: recomputeSharedWorkflowDisplayGroupKeys
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing run id
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: Required. 'true' reports what would change without writing it; 'false' writes it. Either value in any case; anything else, or an empty or missing value, is a 400 rather than a write.
        required: true
        name: dryRun
        in: query
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      responses:
        '200':
          description: Processed, member by member, whether or not anything was written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplayGroupKeyRecomputeResponse'
        '400':
          description: dryRun was missing, empty, or neither 'true' nor 'false', or the run id is blank
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The caller may not edit a credentialing workflow in the tenant-id header's tenant, or in one of the member tenants; nothing was written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such run, it is not in this anchor group, or the caller holds none of its member tenants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/identity/edits:
    post:
      summary: Write one identity field to the named member tenants
      description: 'The analyst chooses the targets, so the status lock does not apply and no confirmation is asked for: no tenant gains data it did not already hold.'
      operationId: editSharedCredentialingIdentity
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing run id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedIdentityEditRequest'
        required: true
      responses:
        '200':
          description: What the write did, member by member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedIdentityWriteResponse'
        '400':
          description: Missing field or targets, or a field that is never editable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The caller may not edit a practitioner in one of the target tenants; nothing was written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/identity/fields/{field}:
    put:
      summary: Set one identity field on every member the lock allows
      description: The server chooses the targets, so it applies the status lock and requires the tenant-share confirmation. Members the lock protected come back named.
      operationId: setSharedCredentialingIdentityField
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: The identity field to set
        required: true
        name: field
        in: path
        schema:
          type: string
      - description: Shared credentialing run id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedIdentityFieldRequest'
        required: true
      responses:
        '200':
          description: What the write did, member by member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedIdentityWriteResponse'
        '400':
          description: Missing confirmation, or a field this route may not set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The caller may not edit a practitioner in one of the target tenants; nothing was written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/members:
    get:
      summary: The shared credentialing page's head
      description: Every participating tenant, the identity agreement across them, their user-defined fields and the practitioner's earlier runs — from one read of the member documents.
      operationId: readSharedCredentialingMembers
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing run id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      responses:
        '200':
          description: The page head
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedPageMembersResponse'
        '400':
          description: Missing run id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/members/file-type:
    put:
      summary: Set one member's File Type (Clean or Non-Clean) or hide its findings, under its…
      description: 'Writes a File Type change on one member workflow of this shared credentialing run, under the tenant named in the body, while the member is at PSV Complete. The shared page spans tenants and the tenant-scoped `PATCH /credentialing-workflows/{workflowId}/practitioner-file-type` can only answer for the caller''s selected one, so the member''s real tenant travels in the body. `hiddenFindingRuleKeys` is the full set of findings to hide from the PSV packet; without `fileType` the save is hide-only: it writes no analyst File Type, so the verdict stays the platform''s, and needs no reason. A Non-Clean change always needs a reason; a Clean change needs one while a finding stays unhidden; either needs one when the member''s verdict could not be evaluated or there is none. The caller must hold the File Type permission in the body tenant, and the member''s tenant must have PSV transparency switched on. Repeating the newest analyst change with the same hides is a 204 that writes nothing.'
      operationId: setSharedMemberFileType
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing run id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedMemberFileTypeRequest'
        required: true
      responses:
        '204':
          description: The change was written, or the same change was already in place
        '400':
          description: 'VALIDATION_ERROR: a missing run id, workflowId or tenantId, neither fileType nor hiddenFindingRuleKeys, an unknown fileType, a reason over 1000 characters, more than 50 or blank hide keys, or a hide key that is not one of the member''s findings. FILE_TYPE_REASON_REQUIRED: the reason rule refused. WORKFLOW_NOT_EDITABLE: the member is not at PSV Complete, its verdict is frozen, or its tenant is not switched on'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 'TENANT_UPDATE_NOT_PERMITTED: the caller lacks the File Type permission in the body tenant; nothing was written'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The workflow and tenant are not a member of this shared run in this anchor group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 'WORKFLOW_CONFLICT: a concurrent writer modified this workflow and the retry budget was exhausted; safe to retry'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: The write failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/members/file-type/evaluate:
    post:
      summary: Retry one member's file-type verdict, under its own tenant
      description: 'Evaluates the clean / non-clean rules again for one member workflow of this shared credentialing run whose verdict could not be evaluated, under the tenant named in the body, and stores the result. Synchronous: bounded by the rule-engine timeout plus a read and a write. The member must be at PSV Complete with a verdict that is not frozen. A verdict that is already derived answers DERIVED without calling the rules engine. The caller must hold the File Type permission in the body tenant. Re-read the members for the value.'
      operationId: evaluateSharedMemberFileTypeVerdict
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing run id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberFileTypeEvaluateRequest'
        required: true
      responses:
        '200':
          description: 'The verdict''s state after the call: DERIVED, or NOT_EVALUATED when the evaluation still could not run'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTypeVerdictEvaluateResponse'
        '400':
          description: Missing shared run id, or a missing or blank workflowId or tenantId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 'TENANT_UPDATE_NOT_PERMITTED: the caller lacks the File Type permission in the body tenant; nothing ran'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'The workflow and tenant are not a member of this shared run in this anchor group, or FILE_TYPE_VERDICT_NOT_ENABLED: PSV transparency is not switched on for the body tenant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 'FILE_TYPE_VERDICT_NOT_RETRYABLE: the member is not at PSV Complete, its verdict is frozen, or it moved on during the call'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: The member workflow could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/members/line-of-business:
    put:
      summary: Set one member's Lines of Business to Cred, under its own tenant
      description: Writes `lineOfBusiness` on one member workflow of this shared credentialing run, under the tenant named in the body. The write itself is the service behind `PATCH /credentialing-workflows/{workflowId}/line-of-business`, so the conflict retry and the change log behave as they do from the tenant's own page. Unlike that route, this one refuses a member outside the States to Cred editable statuses (PSV Complete and later, Withdrawn or Cancelled). **One member per call — this scope field has no bulk overwrite.** An empty array unsets the field.
      operationId: setSharedMemberLineOfBusiness
      tags:
      - SharedCredentialingWorkflow
      parameters:
      - description: Anchor Group id
