          name: endAtId
          in: query
          schema:
            type: string
        - description: >
            Filter criteria. The filter parameter must be URL encoded when sent.


            Examples (before URL encoding):

            - - Filter by id: `{"id":{"eq":"123"}}`

            Example curl commands:

            ```bash

            # Filter by id

            curl -X GET
            '<BaseURL>/roster?filter=%7B%22id%22%3A%7B%22eq%22%3A%223%22%7D%7D'

            ```


            Available filter operations:

            - eq: Equal to

            - neq: Not equal to

            - gt: Greater than

            - gte: Greater than or equal to

            - lt: Less than

            - lte: Less than or equal to

            - in: Value must be one of these (array)

            - nin: Value must not be any of these (array)

            - contains: String contains (case-sensitive, string fields only)


            Note: When using the filter parameter in a browser or code, make
            sure to properly URL encode the JSON string.
          name: filter
          in: query
          schema:
            type: string
        - description: Page number (0-based), for offset-based pagination
          name: page
          in: query
          schema:
            type: integer
            format: int32
        - description: Page size
          name: size
          in: query
          schema:
            type: integer
            format: int32
            default: '50'
        - description: Field to order by. Defaults to 'createdAt'.
          example: createdAt
          name: sortBy
          in: query
          schema:
            type: string
            default: createdAt
        - description: 'Order direction: ASC or DESC. Defaults to ''DESC''.'
          example: DESC
          name: sortDirection
          in: query
          schema:
            type: string
            default: DESC
        - description: Start after document ID, for forward cursor-based pagination
          name: startAfterId
          in: query
          schema:
            type: string
        - description: Tenant ID for source type generation
          required: true
          name: tenant-id
          in: header
          schema:
            type: string
      responses:
        '200':
          description: List of roster jobs
