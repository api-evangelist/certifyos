        '404':
          description: Credentialing workflow not found
          content:
            application/json: {}
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
        - jwt: []
  /file/download:
    get:
      operationId: downloadFile
      parameters:
        - name: path
          in: query
          schema:
            type: string
        - name: tenant-id
          in: header
          required: true
          description: Tenant ID
          schema:
            type: string
      responses:
        '200':
          description: File downloaded successfully
          content:
            text/csv: {}
        '400':
          description: Bad Request - Invalid file path
          content:
            text/csv: {}
        '401':
          description: Unauthorized - Authentication required
          content:
            text/csv: {}
        '404':
          description: File not found
          content:
            text/csv: {}
        '500':
          description: Internal Server Error - File download failed
          content:
            text/csv: {}
      security:
        - jwt: []
      summary: Download File
      tags:
        - File Storage Resource
  /file/read:
    get:
      operationId: readFile
      parameters:
        - name: path
          in: query
          schema:
            type: string
        - name: tenant-id
          in: header
          required: true
          description: Tenant ID
          schema:
            type: string
      responses:
        '200':
