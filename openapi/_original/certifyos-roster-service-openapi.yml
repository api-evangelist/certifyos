          description: Forbidden - User does not have required permissions
        '404':
          description: credentialing workflow not found
          content:
            application/json: {}
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
        - jwt: []
  /credentialing-workflows/{workflowId}/timeline-events:
    post:
      summary: Create a timeline event for a credentialing workflow
      description: Creates a new timeline event for the specified credentialing workflow
      operationId: createTimelineEvent
