        - jwt: []
      summary: Upload Csv File
      tags:
        - File Storage Resource
      parameters:
        - name: tenant-id
          in: header
          required: true
          description: Tenant ID
          schema:
            type: string
  /networks:
    get:
      summary: Get all networks
      description: >-
        Returns a list of networks for the provided tenant. The networks are
        returned sorted by creation date, with the most recent networks
        appearing first.
      operationId: getNetworks
      tags:
        - Network
      parameters:
        - description: >-
            Page number for offset-based pagination (0-based index). Defaults to
            0 if not specified.
          in: query
          name: page
          schema:
            type: integer
            format: int32
        - description: >-
            Number of items per page in offset-based pagination. Defaults to 10
            if not specified.
          in: query
          name: size
          schema:
            type: integer
            format: int32
        - description: The tenant identifier.
          in: header
          name: tenant-id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returned if the request is successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllNetworksResponse'
        '400':
          description: >-
            Returned if the request is invalid. `tenant-id` and `user-id`
            headers are required.
        '401':
          description: Returned if the request is unauthorized. Authentication required.
        '403':
          description: Returned if the request is forbidden. Insufficient permissions.
        '500':
          description: Returned if the request is an internal server error.
        '502':
          description: Returned if the request is a bad gateway. Downstream service error.
        '503':
          description: >-
            Returned if the request is a service unavailable. Network
            connectivity issues.
      security:
        - jwt:
            - R:ORGE
