components:
  schemas:
    ApiError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
    ApproveTemplateResponse:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        status:
          type: string
    BadRequestErrorResponse:
      description: >-
        Standard error response structure for 400 Bad Request validation and
        client errors
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
          description: List of error messages
          examples:
            - - Validation failed
              - Required field missing
        errorDetails:
          description: Detailed error information with specific validation failures
          type: array
          $ref: '#/components/schemas/JsonNode'
    Contract:
      type: object
      properties:
        id:
          type: string
        planId:
          type: string
        networkId:
          type: string
        documentId:
          type: string
        createdBy:
          type: string
        updatedBy:
          type: string
        generalInfo:
          $ref: '#/components/schemas/ContractGeneralInfo'
        lifecycle:
          $ref: '#/components/schemas/ContractLifeCycleInfo'
        financial:
          $ref: '#/components/schemas/ContractFinancialInfo'
        administrativeAndLegal:
          $ref: '#/components/schemas/ContractAdministrativeAndLegalInfo'
        clinicalAndQuality:
          $ref: '#/components/schemas/ContractClinicalAndQualityInfo'
    ContractAdministrativeAndLegalInfo:
      type: object
      properties:
        amendmentOnFile:
          type: boolean
        amendmentNumber:
          type: string
        practitionersTerminationNoticePeriod:
          type: string
        providersManualUpdatesNoticePeriod:
          type: string
        policyUpdateNotificationRequired:
          type: boolean
        claimFilingLimit:
          type: string
        reimbursementScheduleUpdateFrequency:
          type: string
        timelyPaymentCommitment:
          type: integer
          format: int32
    ContractClinicalAndQualityInfo:
      type: object
      properties:
        hasQualityProgram:
          type: boolean
        qualityProgramInitiatives:
          type: string
        averageStarsAndPmpmBonus:
          type: string
        hasMlrTarget:
          type: boolean
        mlrTargetDescription:
          type: string
        performanceReportingRequirements:
          type: string
        credentialingDelegation:
          type: boolean
        recredentialingInterval:
          type: string
        referralRequirements:
          type: boolean
        priorAuthorizationRequired:
          type: boolean
        panelSizeLimits:
          type: string
        providerRosterUpdateFrequency:
          type: string
    ContractFinancialInfo:
      type: object
      properties:
        feeSchedule:
          type: string
        additionalFeeSchedule:
          type: string
        contractPaymentType:
          type: string
        nonTypicalContractTerms:
          type: string
        providerRateCalculation:
          type: string
        rateLesserOfClaimAllowed:
          type: boolean
        sequestrationAllowed:
          type: boolean
        sharedSavings:
          type: boolean
        bonus:
          type: boolean
        claimSubmissionCycle:
          type: string
