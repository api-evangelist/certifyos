    CredentialingWorkflow.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.certifyos.com/entities/CredentialingWorkflow.schema.json
      title: CredentialingWorkflow
      description: >-
        Represents the credentialing workflow data stored in the data JSON
        field.
      type: object
      properties:
        practitioner:
          $ref: '#/components/schemas/Practitioner.schema'
        credentialingCycle:
          description: Cycle of credentialing the provider.
          type: string
          enum:
            - INITIAL
            - RECREDENTIALING
        externalId:
          description: Entity responsible for credentialing the provider.
          type: string
        assignedBy:
          description: User or system that assigned the credentialing task.
          type: string
        assignedTo:
          description: User or system assigned to handle the credentialing task.
          type: string
        practitionerFileType:
          description: >-
            Type of practitioner file associated with this credentialing
            workflow.
          type: string
          enum:
            - CLEAN
            - NON_CLEAN
            - PENDING
        credentialedStates:
          description: States involved in the credentialing process.
          type: array
          items:
            type: string
        previousCredentialedDate:
          description: Date of the previous credentialing.
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        credentialingDueDate:
          description: Date of the credentialing due.
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        receivedForCredentialingDate:
          description: Date of the received for credentialing.
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
      required:
        - practitioner
      additionalProperties: false
      unevaluatedProperties: false
    NetworkResponse.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: >-
        https://schemas.certifyos.com/api-contracts/response/network-response.schema.json
      title: NetworkResponse
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            contractId:
              type: string
    Network.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.certifyos.com/entities/Network.schema.json
      title: Network
      description: >-
        Represents collection of health care providers associated with a plan
        through a contract.
      type: object
      properties:
        name:
          description: The name of the network.
          type: string
        contractId:
          description: The identifier of the associated contract.
          type: string
    Payer.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.certifyos.com/entities/Payer.schema.json
      title: Payer
      description: >-
        Represents an entity responsible for financing or reimbursing the cost
        of healthcare services.
      type: object
      properties:
        name:
          description: The name of the payer.
          type: string
      required:
        - name
    LineOfBusiness.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.certifyos.com/enums/LineOfBusiness.schema.json
      title: Line of Business Enum
      description: Specifies the line of business associated with a healthcare plan.
      type: string
      enum:
        - Medicare
        - Medicaid
        - Commercial
    NetworkType.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.certifyos.com/enums/LineOfBusiness.schema.json
      title: Line of Business Enum
      description: >-
        Specifies the line of business and network type combination for a
        healthcare plan.
      type: string
      enum:
        - Commercial - HMO
        - Commercial - PPO
        - Medicare - HMO
        - Medicaid - HMO
    Plan.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.certifyos.com/entities/Plan.schema.json
      title: Plan
      description: >-
        Represents a healthcare plan with business line, network type, and
        benefits information.
      type: object
      properties:
        lineOfBusiness:
          description: >-
            The line of business under which the plan operates (e.g.,
            Commercial, Medicare, Medicaid).
          $ref: '#/components/schemas/LineOfBusiness.schema'
        networkType:
          description: The type of network associated with the plan (e.g., HMO, PPO).
          $ref: '#/components/schemas/NetworkType.schema'
        benefits:
          description: The benefits offered under the plan.
          type: string
        name:
          description: The name of the plan.
          type: string
    NuccSpecialtyCategory.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.certifyos.com/enums/NuccSpecialtyCategory.json
      title: NUCC Specialty Category
      description: Allowed categories for NUCC Specialty
      type: string
      enum:
        - Individual
        - Non-Individual
    Specialty.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.certifyos.com/entities/Specialty.schema.json
      title: Specialty
      description: >-
        Represents the master specialty list, including custom specialties, to
        include crosswalk between NUCC, HSD, and ABMS Specialties.  References
        the entities for NUCC, HSD, and ABMS specialties.
      type: object
      properties:
        name:
          description: The name of the specialty.
          type: string
        classificationSource:
          description: The source of the specialty classification (e.g., NUCC, HSD, ABMS).
          type: string
        subSpecialtyName:
          description: The sub specialty name of the specialty.
          type: string
        specialtyCategory:
          $ref: '#/components/schemas/NuccSpecialtyCategory.schema'
        taxonomyCode:
          description: The taxonomy code associated with the specialty.
          type: string
        taxonomyDescription:
          description: The description of the taxonomy code.
          type: string
      required:
        - name
        - classificationSource
        - specialtyCategory
      additionalProperties: false
    NuccSpecialty.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.certifyos.com/entities/NuccSpecialty.schema.json
      title: NuccSpecialty
      description: >-
        Represents the NUCC specialty information options for a healthcare
        provider.
      type: object
      properties:
        classification:
          type: string
          description: The classification of the NUCC specialty
          minLength: 1
        specialization:
          type:
            - string
            - 'null'
          description: The specific specialization within the NUCC classification
        category:
          $ref: '#/components/schemas/NuccSpecialtyCategory.schema'
          description: The category of the NUCC specialty (Individual or Non-individual)
        displayName:
          type: string
          description: The human-readable name of the NUCC specialty
          minLength: 1
        specialtyNuccTaxonomyCode:
          type: string
          description: The NUCC taxonomy code associated with the specialty
          minLength: 1
      required:
        - classification
        - category
        - specialtyNuccTaxonomyCode
        - displayName
      additionalProperties: false
    TenantSpecialty.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.certifyos.com/entities/TenantSpecialty.schema.json
      title: TenantSpecialty
      description: Represents a specialty associated with a tenant.
      type: object
      properties:
        displayName:
          type: string
          description: Display name for the specialty.
        description:
          type: string
          description: Detailed description of the specialty.
        changeReason:
          type: string
          description: Reason for any change to the specialty.
      additionalProperties: false
  securitySchemes:
    jwt:
      type: http
      description: JWT Authentication - Provide only the raw token without Bearer prefix
      scheme: bearer
      bearerFormat: JWT
