          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimelineEventRequest'
        required: true
      responses:
        '201':
          description: Successfully created the timeline event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEventResponse'
        '400':
          description: Invalid request data
          content:
