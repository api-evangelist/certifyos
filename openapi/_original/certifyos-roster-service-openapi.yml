openapi: 3.1.0
info:
  description: API for Certify application
  title: Certify API Layer
  version: 1.0.0
servers:
  - url: http://localhost:9001
    description: Local Development Server
  - url: https://api-service.staging.certifyos.com
    description: Staging Server
  - url: https://api-service.test.certifyos.com
    description: Test Server
tags:
  - name: Contracts
    description: APIs for managing contracts entities
  - name: CredentialingWorkflow
    description: APIs for managing credentialing workflows
  - name: Network
    description: APIs for managing network entities
  - name: Payers
    description: >-
      This resource represents a payer in the healthcare system. A payer refers
      to an entity that finances or reimburses the cost of health services. Use
      it to get, create, and update payers.
  - name: Permission
    description: APIs for managing permissions
  - name: Plan
    description: APIs for managing plan entities
  - name: Roster
    description: APIs for managing roster file uploads and processing
  - name: Roster upload
    description: APIs for roster upload file column mappings
  - name: RosterRecord
    description: APIs for managing individual roster record entries
  - name: Specialty
    description: Endpoints for managing medical specialties.
  - name: Template
    description: APIs for managing roster templates and configurations
  - name: Tenant Specialty
    description: Endpoints for managing tenant-specific specialties.
paths:
  /auth/login:
    post:
      summary: User Login
      description: Authenticates a user with email and password and returns a JWT token
      operationId: authenticateUser
      requestBody:
        description: User credentials
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Authentication successful
          content:
            application/json: {}
        '400':
          description: Bad Request
        '401':
          description: Authentication failed - Invalid credentials
          content:
            application/json: {}
        '500':
          description: Internal server error
          content:
            application/json: {}
      tags:
        - Auth Resource
      parameters:
        - name: tenant-id
          in: header
          required: true
          description: Tenant ID
          schema:
            type: string
  /contracts:
    get:
      summary: Find Contract by filter criteria with pagination
      description: >-
        Returns a paginated filtered list of all Contracts based on the provided
        criteria. Supports both offset-based (page/size) and cursor-based
        (startAfter/endAt) pagination.
      operationId: contractsFindMany
      tags:
        - Contracts
      parameters:
        - description: End at document ID, for backward cursor-based pagination
          name: endAtId
          in: query
          schema:
            type: string
        - description: Page number (0-based), for offset-based pagination
          name: page
          in: query
          schema:
            type: integer
            format: int32
        - description: Page size
          name: size
          in: query
          schema:
            type: integer
            format: int32
            default: '50'
        - description: Start after document ID, for forward cursor-based pagination
          name: startAfterId
          in: query
          schema:
            type: string
        - description: Tenant ID
          required: true
          name: tenant-id
          in: header
          schema:
            type: string
      responses:
        '200':
          description: List of Contracts found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedContractResponse'
        '400':
          description: Invalid filter criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Insufficient permissions
      security:
        - jwt: []
    post:
      summary: Create a new Contract
      description: Creates a new Contract with the provided details
      operationId: contractsCreate
      tags:
        - Contracts
      parameters:
        - description: Tenant ID
          required: true
          name: tenant-id
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contract'
        required: true
      responses:
        '201':
          description: Contract created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Insufficient permissions
      security:
        - jwt: []
  /contracts/{id}:
    put:
      summary: Update (replace) an existing Contract
      description: Replace the data for an existing Contract
      operationId: contractsReplace
      tags:
        - Contracts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - description: Tenant ID
          required: true
          name: tenant-id
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contract'
        required: true
      responses:
        '200':
          description: Contract updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          description: Invalid Contract details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Insufficient permissions
        '404':
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - jwt: []
    get:
      summary: Find a Contract by their ID
      description: Returns a single Contract by their ID
      operationId: contractsFindById
      tags:
        - Contracts
      parameters:
        - description: ID of Contract to fetch
          required: true
          name: id
          in: path
          schema:
            type: string
        - description: Tenant ID
          required: true
          name: tenant-id
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Contract found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Insufficient permissions
        '404':
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - jwt: []
    delete:
      summary: Delete a Contract
      description: Deletes a Contract by their ID
      operationId: contractsDelete
      tags:
        - Contracts
      parameters:
        - description: ID of Contract to delete
          required: true
          name: id
          in: path
          schema:
            type: string
        - description: Tenant ID
          required: true
          name: tenant-id
          in: header
          schema:
            type: string
      responses:
        '204':
          description: Contract successfully deleted
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Insufficient permissions
        '404':
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - jwt: []
  /credentialing-workflows:
    get:
      summary: Get credentialing workflows
      description: Retrieves a list of credentialing workflows based on filter criteria
      operationId: getCredentialingWorkflows
      tags:
        - CredentialingWorkflow
      parameters:
        - description: End at document ID, for backward cursor-based pagination
          name: endAtId
          in: query
          schema:
            type: string
        - description: >
            Filter criteria. The filter parameter must be URL encoded when sent.


            Examples (before URL encoding):

            - Filter by id: `{"id":{"eq":"123"}}`

            - Filter by tenant_id: `{"tenantId":{"eq":"tenant123"}}`

            - Filter by tenantPractitionerId:
            `{"tenantPractitionerId":{"eq":"practitioner456"}}`

            - Filter by practitioner firstName (case-insensitive contains):
            `{"data.practitioner.firstName":{"contains":"Alice"}}`

            - Filter by practitioner NPI (exact match):
            `{"data.practitioner.npi":{"eq":"1234567890"}}`

            - Combined filter:
            `{"data.practitioner.firstName":{"contains":"Ali"},"data.practitioner.npi":{"eq":"1234567890"}}`


            Example curl commands:

            ```bash

            # Filter by id

            curl -X GET
            'http://localhost:8080/credentialing-workflows?filter=%7B%22id%22%3A%7B%22eq%22%3A%223%22%7D%7D'


            # Filter by tenant_id

            curl -X GET
            'http://localhost:8080/credentialing-workflows?filter=%7B%22tenantId%22%3A%7B%22eq%22%3A%22tenant123%22%7D%7D'


            # Filter by practitioner firstName (case-insensitive contains)

            curl -X GET
            'http://localhost:8080/credentialing-workflows?filter=%7B%22data.practitioner.firstName%22%3A%7B%22contains%22%3A%22Alice%22%7D%7D'


            # Filter by practitioner NPI

            curl -X GET
            'http://localhost:8080/credentialing-workflows?filter=%7B%22data.practitioner.npi%22%3A%7B%22eq%22%3A%221234567890%22%7D%7D'

            ```


            Available filter operations:

            - eq: Equal to

            - neq: Not equal to

            - gt: Greater than

            - gte: Greater than or equal to

            - lt: Less than

            - lte: Less than or equal to

            - in: Value must be one of these (array)

            - nin: Value must not be any of these (array)

            - contains: String contains (case-sensitive for most fields, but
            data.practitioner.firstName uses case-insensitive matching)


            Note: When using the filter parameter in a browser or code, make
            sure to properly URL encode the JSON string.
          name: filter
          in: query
          schema:
            type: string
        - description: Ordering criteria for the results
          name: order
          in: query
          schema:
            type: string
        - description: Page number (0-based), for offset-based pagination
          name: page
          in: query
          schema:
            type: integer
            format: int32
            default: '0'
        - description: Page size
          name: size
          in: query
          schema:
            type: integer
            format: int32
            default: '50'
        - description: Start after document ID, for forward cursor-based pagination
          name: startAfterId
          in: query
          schema:
            type: string
        - description: Tenant ID
          required: true
          name: tenant-id
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved credentialing workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCredentialingWorkflowsResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
        - jwt: []
    post:
      summary: Create a new credentialing workflow
      description: Creates a new credentialing workflow
      operationId: createCredentialingWorkflow
      tags:
        - CredentialingWorkflow
      parameters:
        - description: Tenant ID
          required: true
          name: tenant-id
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialingWorkflowRequest'
        required: true
      responses:
        '201':
          description: Successfully created the credentialing workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialingWorkflowResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
        - jwt: []
