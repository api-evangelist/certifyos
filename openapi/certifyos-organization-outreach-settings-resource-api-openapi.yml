openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer Organization Outreach Settings Resource…
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: Organization Outreach Settings Resource
paths:
  /organizations/{organizationId}/outreach-settings:
    get:
      summary: List all outreach settings for an organization
      description: Returns every outreach settings record configured for the organization, one entry per outreach type that has been saved, grouped by type. Use this when the full configuration across all three outreach types (`PRACTITIONER_CREDENTIALING`, `FACILITY_CREDENTIALING`, `PRACTITIONER_MONITORING`) is needed in a single call; use `GET /organizations/{organizationId}/outreach-settings/{type}` instead when only one type is needed. Requires the `TENANT_SETTINGS_OUTREACH_READ` permission.
      operationId: getAllOutreachSettings
      parameters:
      - description: Organization ID whose outreach settings to list.
        required: true
        name: organizationId
        in: path
        schema:
          type: string
      - description: Tenant ID of the requesting user; must be a non-blank string or the request fails with 400.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: The organization's configured outreach settings, one OutreachSettingsResponse per outreach type that has been saved (type, credentialing cycle, email recipient preferences, template, outreach reasons, and smart-outreach settings). Returns an empty array - not 404 - when the organization has not saved any outreach settings yet.
          content:
            application/json:
              examples:
                populatedSettings:
                  summary: One type configured
                  value:
                  - type: PRACTITIONER_CREDENTIALING
                    credentialingCycle: INITIAL
                    emailRecipientPreferences:
                      primaryEmail: true
                      caqhPrimaryEmail: false
                      credentialingPrimaryContact: true
                      credentialingOfficeManager: false
                    template:
                      ccEmails:
                      - credentialing-team@certifyos.com
                      subject: 'Action Required: Update Needed for {{provider_name}}'
                      body: Hi {{provider_name}}, please review the items below.
                      logo:
                        enabled: true
                        url: https://storage.googleapis.com/certifyos-public-assets/images/county-header-nevada.png
                        width: 100%
                    outreachReasons:
                    - id: reason-1
                      reason: Missing License
                      instruction: Your state license is either missing or has expired.
                    smartOutreach:
                      enabled: false
                      businessDaysBetweenAttempts: 5
                      maxAttemptsPerReason: 5
                      recredCadenceDays: 2
                      dryRunEnabled: false
                      caqhValidStatuses: null
                noSettingsSaved:
                  summary: Nothing configured for this organization yet
                  value: []
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutreachSettingsResponse'
        '400':
          description: The tenant-id header is missing or blank.
          content:
            application/json:
              examples:
                missingTenantId:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: tenant-id header missing.
                      title: Missing Headers
                      detail: tenant-id header missing.
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Organization not found
          content:
            application/json:
              examples:
                organizationNotFound:
                  value:
                    error: Organization not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                internalError:
                  value:
                    error: <exception message>
      tags:
      - Organization Outreach Settings Resource
      security:
      - jwt: []
  /organizations/{organizationId}/outreach-settings/cc-emails:
    put:
      summary: Set global outreach CC email addresses
      description: 'Accepts a new list of CC email addresses to apply globally, across all outreach types, for the organization. As currently implemented this endpoint is a no-op: the backing service accepts the request body but does not persist it anywhere, so a subsequent GET to this same path will not reflect the values submitted here. The response body echoes back the submitted list, which can be misleading given the lack of persistence. Every entry in `ccEmails` must be a non-blank string, or the request fails with 400. Requires the `TENANT_SETTINGS_OUTREACH_UPDATE` permission.'
      operationId: updateOutreachCcEmailAddresses
      parameters:
      - description: Organization ID whose global outreach CC emails to set.
        required: true
        name: organizationId
        in: path
        schema:
          type: string
      - description: Tenant ID of the requesting user; must be a non-blank string or the request fails with 400.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: The global CC email list to save. `ccEmails` is optional (a null or missing list is accepted), but every entry present must be a non-blank string.
        content:
          application/json:
            examples:
              setCcEmails:
                value:
                  ccEmails:
                  - compliance@certifyos.com
                  - credentialing-alerts@certifyos.com
            schema:
              $ref: '#/components/schemas/OutreachCcEmailAddressesRequest'
        required: true
      responses:
        '200':
          description: An OutreachCcEmailAddressesResponse that echoes the `ccEmails` submitted in the request body. Nothing is persisted in the current implementation; see the operation description.
          content:
            application/json:
              examples:
                echoedCcEmails:
                  value:
                    ccEmails:
                    - compliance@certifyos.com
                    - credentialing-alerts@certifyos.com
              schema:
                $ref: '#/components/schemas/OutreachCcEmailAddressesResponse'
        '400':
          description: The request body is missing, or one or more entries in `ccEmails` is blank, or the tenant-id header is missing or blank.
          content:
            application/json:
              examples:
                blankCcEmail:
                  summary: An entry in ccEmails is blank
                  value:
                    errors:
                    - httpStatus: 400
                      reason: VALIDATION_ERROR
                      title: 'Validation failed for field: updateOutreachCcEmailAddresses.request.ccEmails[0].<list element>'
                      detail: must not be blank
                missingTenantId:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: tenant-id header missing.
                      title: Missing Headers
                      detail: tenant-id header missing.
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Organization not found
          content:
            application/json:
              examples:
                organizationNotFound:
                  value:
                    error: Organization not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                internalError:
                  value:
                    error: <exception message>
      tags:
      - Organization Outreach Settings Resource
      security:
      - jwt: []
    get:
      summary: Retrieve global outreach CC email addresses
      description: 'Returns the CC email addresses configured globally for the organization, meant to apply across all outreach types (as opposed to the template-specific `ccEmails` on an individual type''s template). As currently implemented this endpoint is a stub: the backing service does not read from any store, so the response''s `ccEmails` field is always null here regardless of what was previously submitted via PUT to this same path. Requires the `TENANT_SETTINGS_OUTREACH_READ` permission.'
      operationId: getOutreachCcEmailAddresses
      parameters:
      - description: Organization ID whose global outreach CC emails to retrieve.
        required: true
        name: organizationId
        in: path
        schema:
          type: string
      - description: Tenant ID of the requesting user; must be a non-blank string or the request fails with 400.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: An OutreachCcEmailAddressesResponse. In the current implementation `ccEmails` is always null; see the operation description.
          content:
            application/json:
              examples:
                ccEmailsAlwaysNull:
                  summary: Current stub response
                  value:
                    ccEmails: null
              schema:
                $ref: '#/components/schemas/OutreachCcEmailAddressesResponse'
        '400':
          description: The tenant-id header is missing or blank.
          content:
            application/json:
              examples:
                missingTenantId:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: tenant-id header missing.
                      title: Missing Headers
                      detail: tenant-id header missing.
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Organization not found
          content:
            application/json:
              examples:
                organizationNotFound:
                  value:
                    error: Organization not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                internalError:
                  value:
                    error: <exception message>
      tags:
      - Organization Outreach Settings Resource
      security:
      - jwt: []
  /organizations/{organizationId}/outreach-settings/provider-portal:
    put:
      summary: Update provider portal settings
      description: Updates the organization-wide provider outreach portal settings. When disabled, outreach emails stop including portal submission links and previously issued portal links stop resolving.
      operationId: updateProviderPortalSettings
      parameters:
      - description: Organization ID
        required: true
        name: organizationId
        in: path
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderPortalSettingsDto'
        required: true
      responses:
        '200':
          description: Provider portal settings updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPortalSettingsDto'
        '400':
          description: Invalid request data
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '404':
          description: Organization not found
        '500':
          description: Internal Server Error
      tags:
      - Organization Outreach Settings Resource
      security:
      - jwt: []
    get:
      summary: Get provider portal settings
      description: Returns the organization-wide provider outreach portal settings. enabled defaults to false when the organization has never saved the setting.
      operationId: getProviderPortalSettings
      parameters:
      - description: Organization ID
        required: true
        name: organizationId
        in: path
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Provider portal settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPortalSettingsDto'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '404':
          description: Organization not found
        '500':
          description: Internal Server Error
      tags:
      - Organization Outreach Settings Resource
      security:
      - jwt: []
  /organizations/{organizationId}/outreach-settings/state-specific-plan:
    put:
      summary: Update state-specific plan settings
      description: Updates the organization-wide state-specific plan settings. Mapping keys must be 2-letter uppercase state codes and plan names must be non-empty. When disabled, the state_specific_plan email field resolves to the tenant name.
      operationId: updateStateSpecificPlanSettings
      parameters:
      - description: Organization ID
        required: true
        name: organizationId
        in: path
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateSpecificPlanSettingsDto'
        required: true
      responses:
        '200':
          description: State-specific plan settings updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateSpecificPlanSettingsDto'
        '400':
          description: Invalid request data
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '404':
          description: Organization not found
        '500':
          description: Internal Server Error
      tags:
      - Organization Outreach Settings Resource
      security:
      - jwt: []
    get:
      summary: Get state-specific plan settings
      description: Returns the organization-wide state-specific plan settings driving the state_specific_plan dynamic email field. enableStateSpecificPlan defaults to false with an empty mapping when the organization has never saved the setting.
      operationId: getStateSpecificPlanSettings
      parameters:
      - description: Organization ID
        required: true
        name: organizationId
        in: path
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: State-specific plan settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateSpecificPlanSettingsDto'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '404':
          description: Organization not found
        '500':
          description: Internal Server Error
      tags:
      - Organization Outreach Settings Resource
      security:
      - jwt: []
  /organizations/{organizationId}/outreach-settings/{type}:
    put:
      summary: Update outreach settings for a type
      description: Saves outreach settings for a single outreach type and credentialing cycle. Only the cycle named in the request body's `credentialingCycle` field (defaults to `INITIAL`) is affected; the other cycle's previously saved data for this type is left untouched. Calling this twice with the same body produces the same stored state (idempotent), and no events are emitted. This method and `POST /organizations/{organizationId}/outreach-settings/{type}` call the exact same underlying operation and behave identically, including creating settings that did not previously exist; there is currently no functional difference between the two. An invalid `type` value results in a generic 500, not a 400 - see the 500 response description. Requires the `TENANT_SETTINGS_OUTREACH_UPDATE` permission.
      operationId: updateOutreachSettingsByType
      parameters:
      - description: Organization ID whose outreach settings to save.
        required: true
        name: organizationId
        in: path
        schema:
          type: string
      - description: Outreach type. Must be exactly one of PRACTITIONER_CREDENTIALING, FACILITY_CREDENTIALING, or PRACTITIONER_MONITORING (case-sensitive).
        required: true
        name: type
        in: path
        schema:
          type: string
      - description: Tenant ID of the requesting user; must be a non-blank string or the request fails with 400.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Outreach settings to save for the type in the path. `credentialingCycle` is optional (defaults to INITIAL). `template.subject` and `template.body` are required when `template` is supplied; `template.ccEmails` and `template.logo` are optional. Each entry in `outreachReasons` requires `reason` and `instruction`; `id` is optional and is generated when omitted. `emailRecipientPreferences` and `smartOutreach` are both optional.
        content:
          application/json:
            examples:
              saveSettings:
                value:
                  credentialingCycle: INITIAL
                  emailRecipientPreferences:
                    primaryEmail: true
                    caqhPrimaryEmail: false
                    credentialingPrimaryContact: true
                    credentialingOfficeManager: false
                  template:
                    ccEmails:
                    - credentialing-team@certifyos.com
                    subject: 'Action Required: Update Needed for {{provider_name}}'
                    body: Hi {{provider_name}}, please review the items below.
                    logo:
                      enabled: true
                      url: https://storage.googleapis.com/certifyos-public-assets/images/county-header-nevada.png
                      width: 100%
                  outreachReasons:
                  - reason: Missing License
                    instruction: Your state license is either missing or has expired.
                  smartOutreach:
                    enabled: false
                    businessDaysBetweenAttempts: 5
                    maxAttemptsPerReason: 5
                    recredCadenceDays: 2
                    dryRunEnabled: false
            schema:
              $ref: '#/components/schemas/OutreachSettingsRequest'
        required: true
      responses:
        '200':
          description: The saved OutreachSettingsResponse for this type and cycle, reflecting the request body that was just written.
          content:
            application/json:
              examples:
                savedSettings:
                  value:
                    type: PRACTITIONER_CREDENTIALING
                    credentialingCycle: INITIAL
                    emailRecipientPreferences:
                      primaryEmail: true
                      caqhPrimaryEmail: false
                      credentialingPrimaryContact: true
                      credentialingOfficeManager: false
                    template:
                      ccEmails:
                      - credentialing-team@certifyos.com
                      subject: 'Action Required: Update Needed for {{provider_name}}'
                      body: Hi {{provider_name}}, please review the items below.
                      logo:
                        enabled: true
                        url: https://storage.googleapis.com/certifyos-public-assets/images/county-header-nevada.png
                        width: 100%
                    outreachReasons:
                    - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      reason: Missing License
                      instruction: Your state license is either missing or has expired.
                    smartOutreach:
                      enabled: false
                      businessDaysBetweenAttempts: 5
                      maxAttemptsPerReason: 5
                      recredCadenceDays: 2
                      dryRunEnabled: false
                      caqhValidStatuses: null
              schema:
                $ref: '#/components/schemas/OutreachSettingsResponse'
        '400':
          description: The request body is missing, `template.subject` or `template.body` is blank, an outreach reason is missing its `reason` or `instruction` text, a `ccEmails` entry is blank, or the tenant-id header is missing or blank.
          content:
            application/json:
              examples:
                blankTemplateSubject:
                  summary: template.subject is blank
                  value:
                    errors:
                    - httpStatus: 400
                      reason: VALIDATION_ERROR
                      title: 'Validation failed for field: updateOutreachSettingsByType.request.template.subject'
                      detail: must not be blank
                missingTenantId:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: tenant-id header missing.
                      title: Missing Headers
                      detail: tenant-id header missing.
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Organization not found
          content:
            application/json:
              examples:
                organizationNotFound:
                  value:
                    error: Organization not found
        '500':
          description: Internal Server Error. Also currently returned - instead of a 400 - when `type` is not one of PRACTITIONER_CREDENTIALING, FACILITY_CREDENTIALING, or PRACTITIONER_MONITORING.
          content:
            application/json:
              examples:
                internalError:
                  value:
                    error: <exception message>
      tags:
      - Organization Outreach Settings Resource
      security:
      - jwt: []
    get:
      summary: Retrieve outreach settings for one type and cycle
      description: Returns the outreach settings saved for a single outreach type and credentialing cycle. Use `GET /organizations/{organizationId}/outreach-settings` instead when the full set across all types is needed. Supply either `credentialingCycle` (defaults to `INITIAL` when omitted) or `workflowId` - not both; when `workflowId` is supplied, the cycle is extracted from that workflow and `credentialingCycle` is ignored. If nothing has been saved yet for the requested type and cycle, this still returns 200 with an empty-shell OutreachSettingsResponse (all fields null except `type` and `credentialingCycle`) rather than 404; 404 is reserved for an organization that does not exist, or a `workflowId` that does not resolve to an existing credentialing workflow. An invalid `type` value is not validated explicitly here; as currently implemented it results in a generic 500, not a 400 - see the 500 response description. Requires the `TENANT_SETTINGS_OUTREACH_READ` permission.
      operationId: getOutreachSettingsByType
      parameters:
      - description: Organization ID whose outreach settings to retrieve.
        required: true
        name: organizationId
        in: path
        schema:
          type: string
      - description: Outreach type. Must be exactly one of PRACTITIONER_CREDENTIALING, FACILITY_CREDENTIALING, or PRACTITIONER_MONITORING (case-sensitive).
        required: true
        name: type
        in: path
        schema:
          type: string
      - description: 'Credentialing cycle to fetch settings for: INITIAL or RECREDENTIALING. Defaults to INITIAL when omitted. Ignored when workflowId is supplied.'
        required: false
        name: credentialingCycle
        in: query
        schema:
          type: string
      - description: Credentialing workflow ID; when supplied, the cycle is extracted from this workflow instead of from credentialingCycle. Supply either this or credentialingCycle, not both.
        required: false
        name: workflowId
        in: query
        schema:
          type: string
      - description: Tenant ID of the requesting user; must be a non-blank string or the request fails with 400.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: The saved OutreachSettingsResponse for this type and cycle (email recipient preferences, template, outreach reasons, smart-outreach settings), or an empty-shell OutreachSettingsResponse with all fields null besides `type` and `credentialingCycle` when nothing has been saved yet for this combination.
          content:
            application/json:
              examples:
                configuredSettings:
                  summary: Settings saved for this type and cycle
                  value:
                    type: PRACTITIONER_CREDENTIALING
                    credentialingCycle: INITIAL
                    emailRecipientPreferences:
                      primaryEmail: true
                      caqhPrimaryEmail: false
                      credentialingPrimaryContact: true
                      credentialingOfficeManager: false
                    template:
                      ccEmails:
                      - credentialing-team@certifyos.com
                      subject: 'Action Required: Update Needed for {{provider_name}}'
                      body: Hi {{provider_name}}, please review the items below.
                      logo:
                        enabled: true
                        url: https://storage.googleapis.com/certifyos-public-assets/images/county-header-nevada.png
                        width: 100%
                    outreachReasons:
                    - id: reason-1
                      reason: Missing License
                      instruction: Your state license is either missing or has expired.
                    smartOutreach:
                      enabled: false
                      businessDaysBetweenAttempts: 5
                      maxAttemptsPerReason: 5
                      recredCadenceDays: 2
                      dryRunEnabled: false
                      caqhValidStatuses: null
                emptyShell:
                  summary: Nothing saved yet for this type/cycle combination
                  value:
                    type: PRACTITIONER_CREDENTIALING
                    credentialingCycle: INITIAL
                    emailRecipientPreferences: null
                    template: null
                    outreachReasons: null
                    smartOutreach: null
              schema:
                $ref: '#/components/schemas/OutreachSettingsResponse'
        '400':
          description: The tenant-id header is missing or blank.
          content:
            application/json:
              examples:
                missingTenantId:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: tenant-id header missing.
                      title: Missing Headers
                      detail: tenant-id header missing.
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Organization not found, or workflowId was supplied but does not resolve to an existing credentialing workflow.
          content:
            application/json:
              examples:
                organizationNotFound:
                  value:
                    error: Organization not found
        '500':
          description: Internal Server Error. Also currently returned - instead of a 400 - when `type` is not one of PRACTITIONER_CREDENTIALING, FACILITY_CREDENTIALING, or PRACTITIONER_MONITORING.
          content:
            application/json:
              examples:
                internalError:
                  value:
                    error: <exception message>
      tags:
      - Organization Outreach Settings Resource
      security:
      - jwt: []
    delete:
      summary: Delete all outreach settings for one type
      description: 'Deletes the saved outreach settings for a single outreach type, removing both the INITIAL and RECREDENTIALING cycle records for that type in one call - there is no way to delete a single cycle in isolation. Calling this on a type that has nothing saved is a silent success: it still returns 204 rather than 404. Calling it twice in a row has the same end state as calling it once (idempotent). Requires the `TENANT_SETTINGS_OUTREACH_UPDATE` permission.'
      operationId: deleteOutreachSettingsByType
      parameters:
      - description: Organization ID whose outreach settings to delete.
        required: true
        name: organizationId
        in: path
        schema:
          type: string
      - description: Outreach type. Must be exactly one of PRACTITIONER_CREDENTIALING, FACILITY_CREDENTIALING, or PRACTITIONER_MONITORING (case-sensitive). Both credentialing cycles for this type are deleted.
        required: true
        name: type
        in: path
        schema:
          type: string
      - description: Tenant ID of the requesting user; must be a non-blank string or the request fails with 400.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '204':
          description: The type's settings (both cycles) were deleted, or there was nothing to delete.
        '400':
          description: The tenant-id header is missing or blank.
          content:
            application/json:
              examples:
                missingTenantId:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: tenant-id header missing.
                      title: Missing Headers
                      detail: tenant-id header missing.
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Organization not found
          content:
            application/json:
              examples:
                organizationNotFound:
                  value:
                    error: Organization not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                internalError:
                  value:
                    error: <exception message>
      tags:
      - Organization Outreach Settings Resource
      security:
      - jwt: []
    post:
      summary: Create or update outreach settings for a type
      description: Saves outreach settings for a single outreach type and credentialing cycle. Only the cycle named in the request body's `credentialingCycle` field (defaults to `INITIAL`) is affected; the other cycle's previously saved data for this type is left untouched. Calling this twice with the same body produces the same stored state (idempotent), and no events are emitted. This method and `PUT /organizations/{organizationId}/outreach-settings/{type}` call the exact same underlying operation and behave identically; there is currently no functional difference between creating new settings and updating existing ones. An invalid `type` value results in a generic 500, not a 400 - see the 500 response description. Requires the `TENANT_SETTINGS_OUTREACH_UPDATE` permission.
      operationId: createOrUpdateOutreachSettings
      parameters:
      - description: Organization ID whose outreach settings to save.
        required: true
        name: organizationId
        in: path
        schema:
          type: string
      - description: Outreach type. Must be exactly one of PRACTITIONER_CREDENTIALING, FACILITY_CREDENTIALING, or PRACTITIONER_MONITORING (case-sensitive).
        required: true
        name: type
        in: path
        schema:
          type: string
      - description: Tenant ID of the requesting user; must be a non-blank string or the request fails with 400.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Outreach settings to save for the type in the path. `credentialingCycle` is optional (defaults to INITIAL). `template.subject` and `template.body` are required when `template` is supplied; `template.ccEmails` and `template.logo` are optional. Each entry in `outreachReasons` requires `reason` and `instruction`; `id` is optional and is generated when omitted. `emailRecipientPreferences` and `smartOutreach` are both optional.
        content:
          application/json:
            examples:
              saveSettings:
                value:
                  credentialingCycle: INITIAL
                  emailRecipientPreferences:
                    primaryEmail: true
                    caqhPrimaryEmail: false
                    credentialingPrimaryContact: true
                    credentialingOfficeManager: false
                  template:
                    ccEmails:
                    - credentialing-team@certifyos.com
                    subject: 'Action Required: Update Needed for {{provider_name}}'
                    body: Hi {{provider_name}}, please review the items below.
                    logo:
                      enabled: true
                      url: https://storage.googleapis.com/certifyos-public-assets/images/county-header-nevada.png
                      width: 100%
                  outreachReasons:
                  - reason: Missing License
                    instruction: Your state license is either missing or has expired.
                  smartOutreach:
                    enabled: false
                    businessDaysBetweenAttempts: 5
                    maxAttemptsPerReason: 5
                    recredCadenceDays: 2
                    dryRunEnabled: false
            schema:
              $ref: '#/components/schemas/OutreachSettingsRequest'
        required: true
      responses:
        '200':
          description: The saved OutreachSettingsResponse for this type and cycle, reflecting the request body that was just written.
          content:
            application/json:
              examples:
                savedSettings:
                  value:
                    type: PRACTITIONER_CREDENTIALING
                    credentialingCycle: INITIAL
                    emailRecipientPreferences:
                      primaryEmail: true
                      caqhPrimaryEmail: false
                      credentialingPrimaryContact: true
                      credentialingOfficeManager: false
                    template:
                      ccEmails:
                      - credentialing-team@certifyos.com
                      subject: 'Action Required: Update Needed for {{provider_name}}'
                      body: Hi {{provider_name}}, please review the items below.
                      logo:
                        enabled: true
                        url: https://storage.googleapis.com/certifyos-public-assets/images/county-header-nevada.png
                        width: 100%
                    outreachReasons:
                    - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      reason: Missing License
                      instruction: Your state license is either missing or has expired.
                    smartOutreach:
                      enabled: false
                      businessDaysBetweenAttempts: 5
                      maxAttemptsPerReason: 5
                      recredCadenceDays: 2
                      dryRunEnabled: false
                      caqhValidStatuses: null
              schema:
                $ref: '#/components/schemas/OutreachSettingsResponse'
        '400':
          description: The request body is missing, `template.subject` or `template.body` is blank, an outreach reason is missing its `reason` or `instruction` text, a `ccEmails` entry is blank, or the tenant-id header is missing or blank.
          content:
            application/json:
              examples:
                blankTemplateSubject:
                  summary: template.subject is blank
                  value:
                    errors:
                    - httpStatus: 400
                      reason: VALIDATION_ERROR
                      title: 'Validation failed for field: createOrUpdateOutreachSettings.request.template.subject'
                      detail: must not be blank
                missingTenantId:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: tenant-id header missing.
                      title: Missing Headers
                      detail: tenant-id header missing.
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Organization not found
          content:
            application/json:
              examples:
                organizationNotFound:
                  value:
                    error: Organization not found
        '500':
          description: Internal Server Error. Also currently returned - instead of a 400 - when `type` is not one of PRACTITIONER_CREDENTIALING, FACILITY_CREDENTIALING, or PRACTITIONER_MONITORING.
          content:
            application/json:
              examples:
                internalError:
                  value:
                    error: <exception message>
      tags:
      - Organization Outreach Settings Resource
      security:
      - jwt: []
  /organizations/{organizationId}/outreach-settings/{type}/email-composer-data:
    get:
      summary: Fetch email composer autopopulation data for a workflow
      description: 'Returns the combined data needed to pre-populate the outreach email composer for one credentialing workflow: the saved template''s subject/body, resolved dynamic field values (provider/facility details, outreach attempt counts, client name), selected reason instructions, and the merged CC email list (template-specific plus global plus any bundled workflows''). Call this right before rendering the composer UI. `type` must be PRACTITIONER_CREDENTIALING or FACILITY_CREDENTIALING - PRACTITIONER_MONITORING and any other value are rejected with 400. `workflowId` is required. `reasonIds` is an optional comma-separated list; when omitted, the response''s reason-related fields (`reasons`, and the reason title baked into `dynamicFields`) are empty. `additionalWorkflowIds` is an optional comma-separated list of other bundled workflow IDs (used for cross-tenant multi-party outreach) whose owning tenants'' outreach-settings CC emails are merged into `ccEmails`. As currently implemented, this operation does not propagate organization or workflow resolution failures as an error: if the organization or `workflowId` cannot be resolved, it still returns 200 with empty/default field values (empty `subject`/`body`, empty `ccEmails`/`reasons`, null `emailConfiguration`, empty `dynamicFields`) rather than a 4xx/5xx. Requires the `TENANT_SETTINGS_OUTREACH_READ` permission.'
      operationId: getEmailComposerAutopopulationData
      parameters:
      - description: Organization ID that owns the outreach settings to autopopulate from.
        required: true
        name: organizationId
        in: path
        schema:
          type: string
      - description: Outreach type. Must be PRACTITIONER_CREDENTIALING or FACILITY_CREDENTIALING; PRACTITIONER_MONITORING and any other value are rejected with 400.
        required: true
        name: type
        in: path
        schema:
          type: string
      - description: Comma-separated IDs of other bundled workflows (cross-tenant multi-party outreach) whose owning tenants' outreach-settings CC emails should be merged into this response's ccEmails.
        example: wf-id-b,wf-id-c
        name: additionalWorkflowIds
        in: query
        schema:
          type: string
      - description: Comma-separated outreach reason IDs to include instructions for. When omitted or empty, the response's reason-related fields are empty.
        example: reason1,reason2
        name: reasonIds
        in: query
        schema:
          type: string
      - description: Credentialing workflow ID to autopopulate the composer for; required.
        required: true
        name: workflowId
        in: query
        schema:
          type: string
      - description: Tenant ID of the requesting user; must be a non-blank string or the request fails with 400.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: An EmailComposerAutopopulationResponse with the resolved template, CC emails, reason instructions, recipient preferences, and dynamic fields for this workflow. When the organization or workflow cannot be resolved, this is still what is returned, populated with empty/default values instead of failing; see the operation description.
          content:
            application/json:
              examples:
                populatedComposerData:
                  summary: Workflow and organization resolved normally
                  value:
                    subject: 'Action Required: Update Needed for Dr. John Smith, MD'
                    body: Hi Dr. John Smith, MD, please review the items below.
                    ccEmails:
                    - credentialing-team@certifyos.com
                    reasons:
                    - title: Missing License
                      instruction: Your state license is either missing or has expired.
                    emailConfiguration:
                      primaryEmail: true
                      caqhPrimaryEmail: false
                      credentialingPrimaryContact: true
                      credentialingOfficeManager: false
                    dynamicFields:
                      provider_name: Dr. John Smith, MD
                      provider_npi: '1234567890'
                      number_of_outreach_attempts: 1
                defaultsOnResolutionFailure:
                  summary: Organization or workflow could not be resolved - see the operation description
                  value:
                    subject: ''
                    body: ''
                    ccEmails: []
                    reasons: []
                    dynamicFields: {}
              schema:
                $ref: '#/components/schemas/EmailComposerAutopopulationResponse'
        '400':
          description: type is not PRACTITIONER_CREDENTIALING or FACILITY_CREDENTIALING, workflowId is missing or blank, or the tenant-id header is missing or blank.
          content:
            application/json:
              examples:
                invalidType:
                  value:
                    error: This endpoint only supports PRACTITIONER_CREDENTIALING or FACILITY_CREDENTIALING type
                missingWorkflowId:
                  value:
                    error: workflowId query parameter is required
                missingTenantId:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: tenant-id header missing.
                      title: Missing Headers
                      detail: tenant-id header missing.
              schema:
                type: object
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Reserved for an organization or workflow that cannot be resolved. As currently implemented this operation does not return 404 for that case; see the 200 response description and the operation description.
          content:
            application/json:
              examples:
                workflowNotFound:
                  summary: Not currently reachable - see the description
                  value:
                    error: Workflow not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                internalError:
                  value:
                    error: <exception message>
      tags:
      - Organization Outreach Settings Resource
      security:
      - jwt: []
components:
  schemas:
    ApiError:
      type: object
      description: Standard API error response containing a list of error objects
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
          description: List of error objects describing validation or processing failures
    OutreachSettingsRequest:
      type: object
      description: Request to create or update outreach settings for a specific outreach type. The type is specified in the URL path, not in the request body.
      properties:
        credentialingCycle:
          type: string
          enum:
          - INITIAL
          - RECREDENTIALING
          examples:
          - INITIAL
          description: Credentialing cycle for which these settings apply
        emailRecipientPreferences:
          $ref: '#/components/schemas/EmailRecipientPreferencesDto'
          type: object
          description: Email recipient preferences
        template:
          $ref: '#/components/schemas/OutreachTemplateDto'
          type: object
          description: Email template configuration
        outreachReasons:
          type: array
          items:
            $ref: '#/components/schemas/OutreachReasonDto'
          description: List of outreach reasons with instructions
        smartOutreach:
          $ref: '#/components/schemas/SmartOutreachSettingsDto'
          type: object
          description: Smart outreach automation settings
    OutreachReasonValueDto:
      type: object
      description: Outreach reason value with title and instruction
      properties:
        title:
          type: string
          examples:
          - Missing License
          description: Reason title
        instruction:
          type: string
          examples:
          - Your state license is either missing or has expired.
          description: Reason instruction
    OutreachType:
      type: string
      enum:
      - PRACTITIONER_CREDENTIALING
      - FACILITY_CREDENTIALING
      - PRACTITIONER_MONITORING
      description: The outreach configuration category a settings record applies to. PRACTITIONER_CREDENTIALING covers outreach for individual practitioners going through initial or recredentialing review. FACILITY_CREDENTIALING covers the same for facilities. PRACTITIONER_MONITORING covers ongoing monitoring-triggered outreach for practitioners, outside the credentialing review cycle.
    OutreachTemplateDto:
      type: object
      required:
      - subject
      - body
      description: Email template configuration for outreach
      properties:
        ccEmails:
          type: array
          examples:
          - - cc1@example.com
            - cc2@example.com
          items:
            type: string
          description: Template-specific CC email addresses
        subject:
          type: string
          examples:
          - 'Action Required: Update Needed for {{provider_name}} for {{client_name}} Credentialing - Notice #{{number_of_outreach_attempts}}'
          pattern: \S
          description: Email subject line with placeholders
        body:
          type: string
          examples:
          - Hi {{provider_name}}, {{provider_type}} (NPI = {{provider_npi}}),\n{{client_name}} has partnered with Certify for provider credentialing.
          pattern: \S
          description: Email body content with placeholders (supports HTML/rich text)
        logo:
          $ref: '#/components/schemas/OutreachLogoDto'
          type: object
          description: Logo settings
    OutreachReasonDto:
      type: object
      required:
      - reason
      - instruction
      description: Outreach reason with instruction
      properties:
        id:
          type: string
          examples:
          - reason-123e4567-e89b-12d3-a456-426614174000
          description: Unique identifier for the outreach reason
        reason:
          type: string
          examples:
          - Malpractice Insurance Missing
          pattern: \S
          description: Reason title
        instruction:
          type: string
          examples:
          - Your state license is either missing or has expired.
          pattern: \S
          description: Instruction text
        isCaqhResolvable:
          type: boolean
          examples:
          - false
          description: Whether the reason is resolvable directly in CAQH (external action, no upload)
        submitFormText:
          type: string
          examples:
          - Please upload a current copy of your malpractice insurance certificate.
          description: Text shown to the provider on the submit form for this reason
    StateSpecificPlanSettingsDto:
      type: object
      description: State-specific plan settings for an organization
      properties:
        enableStateSpecificPlan:
          type: boolean
          examples:
          - false
          description: Whether the state_specific_plan email field resolves through the mapping. Defaults to false when the organization has never saved this setting.
        stateSpecificPlanMapping:
          type: object
          examples:
          - OH: Sample Health Plan of Ohio
          additionalProperties:
            type: string
          description: Map of 2-letter uppercase state code to plan name
    EmailComposerAutopopulationResponse:
      type: object
      description: Response containing all data needed to autopopulate the email composer for Practitioner Initial workflow
      properties:
        subject:
          type: string
          examples:
          - 'Action Required: Update Needed for {{provider_name}}'
          description: Email subject line from template (may be empty if not configured)
        body:
          type: string
          examples:
          - Hi {{provider_name}}, {{provider_type}} (NPI = {{provider_npi}})
          description: Email body/template from settings (may be empty if not configured)
        ccEmails:
          type: array
          examples:
          - - cc1@example.com
            - cc2@example.com
          items:
            type: string
          description: CC email addresses (template-specific + global)
        reasons:
          type: array
          examples:
          - - title: Missing License
              instruction: Your state license is either missing or has expired.
          items:
            $ref: '#/components/schemas/OutreachReasonValueDto'
          description: Array of selected outreach reasons with title and instruction, sorted by selection order
        emailConfiguration:
          type: object
          description: Email recipient preferences configuration. Null when no outreach settings are saved for this type/cycle (see the operation description).
          anyOf:
          - $ref: '#/components/schemas/EmailRecipientPreferencesDto'
          - type: 'null'
        dynamicFields:
          type: object
          examples:
          - provider_name: Dr. John Smith, MD
            provider_npi: '1234567890'
            speciality: Internal Medicine
            reasons:
            - title: Missing License
              instruction: Please provide...
          additionalProperties: {}
          description: Map of dynamic field keys to their resolved values (can include strings, arrays, or objects)
        toEmails:
          type: array
          examples:
          - - contact@example.com
          items:
            type: string
          description: Recipient email addresses to prefill on the composer's To field (CP-37576). Empty unless the org has enabled CAQH-extraction autopopulation for a single, eligible practitioner-credentialing workflow.
    OutreachSettingsResponse:
      type: object
      description: Response containing outreach settings for a specific outreach type
      properties:
        type:
          $ref: '#/components/schemas/OutreachType'
          type: string
          examples:
          - PRACTITIONER_CREDENTIALING
          description: Type of outreach
        credentialingCycle:
          type: string
          enum:
          - INITIAL
          - RECREDENTIALING
          examples:
          - INITIAL
          description: Credentialing cycle for which these template/reasons apply
        emailRecipientPreferences:
          type:
          - object
          - 'null'
          description: Email recipient preferences. Null when nothing has been saved for this type/cycle.
          anyOf:
          - $ref: '#/components/schemas/EmailRecipientPreferencesDto'
          - type: 'null'
        template:
          type:
          - object
          - 'null'
          description: Email template configuration. Null when nothing has been saved for this type/cycle.
          anyOf:
          - $ref: '#/components/schemas/OutreachTemplateDto'
          - type: 'null'
        outreachReasons:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/OutreachReasonDto'
          description: List of outreach reasons with instructions. Null when nothing has been saved for this type/cycle.
        smartOutreach:
          type:
          - object
          - 'null'
          description: Smart outreach automation settings. Null when nothing has been saved for this type/cycle.
          anyOf:
          - $ref: '#/components/schemas/SmartOutreachSettingsDto'
          - type: 'null'
        providerPortalEnabled:
          type:
          - boolean
          - 'null'
          description: Whether the provider outreach portal is enabled for this organization. Organization-wide (not per type/cycle); null when the organization has never saved the setting, which consumers must treat as disabled.
        stateSpecificPlan:
          type: object
          description: Organization-wide state-specific plan settings driving the state_specific_plan dynamic email field (CP-36692). Not per type/cycle; null when the organization has never saved the setting, which consumers must treat as disabled.
          anyOf:
          - $ref: '#/components/schemas/StateSpecificPlanSettingsDto'
          - type: 'null'
    OutreachLogoDto:
      type: object
      description: Logo settings for outreach email template
      properties:
        enabled:
          type: boolean
          examples:
          - true
          description: Whether to include the logo in emails
        url:
          type: string
          examples:
          - https://storage.googleapis.com/certifyos-public-assets/images/county-header-nevada.png
          description: Logo URL/address
        width:
          type: string
          examples:
          - 100%
          description: Logo display width
    SmartOutreachSettingsDto:
      type: object
      description: Smart outreach automation settings
      properties:
        enabled:
          type: boolean
          examples:
          - false
          description: Enable smart outreach automation
        businessDaysBetweenAttempts:
          type: integer
          format: int32
          examples:
          - 5
          description: Business days between outreach attempts (display value, persisted as hours)
          minimum: 1
        maxAttemptsPerReason:
          type: integer
          format: int32
          examples:
          - 5
          description: Maximum outreach attempts per reason
          minimum: 1
        recredCadenceDays:
          type:
          - integer
          - 'null'
          format: int32
          examples:
          - 2
          description: Recredentialing cadence in days (null disables recred override)
          minimum: 1
        dryRunEnabled:
          type: boolean
          examples:
          - false
          description: 'Dry run mode: evaluate exclusions without sending (per client)'
        useCalendarDays:
          type: boolean
          examples:
          - false
          description: Count days between attempts on calendar days (weekends/holidays included) instead of business days. Defaults to false (business days).
        caqhValidStatuses:
          type:
          - array
          - 'null'
          items:
            type: string
          description: CAQH provider_status values that qualify as a valid update and suppress outreach. Defaults to ["Reattestation", "Initial Application Complete"] when null or empty.
    ErrorObject:
      type: object
      description: Individual error object containing details about a specific validation or processing error
      properties:
        httpStatus:
          type: integer
          format: int32
          examples:
          - 400
          description: HTTP status code for this error
        reason:
          type: string
          examples:
          - VALIDATION_ERROR
          description: Error reason/code
        title:
          type: string
          examples:
          - 'Validation failed for field: eventTypes'
          description: Error title/summary
        detail:
          type: string
          examples:
          - eventTypes is required and cannot be empty or null
          description: Detailed error message
        rejectedValue:
          type: string
          description: The value that was rejected, omitted for sensitive fields such as SSN
    ProviderPortalSettingsDto:
      type: object
      required:
      - enabled
      description: Provider outreach portal settings for an organization
      properties:
        enabled:
          type: boolean
          examples:
          - false
          description: Whether outreach emails include a provider portal submission link. Defaults to false when the organization has never saved this setting.
    OutreachCcEmailAddressesRequest:
      type: object
      description: Request to update global outreach CC email addresses
      properties:
        ccEmails:
          type: array
          examples:
          - - sunayana.kalekar@certifyos.com
            - mail@certifyos.com
          items:
            type: string
          description: List of global CC email addresses for all outreach types
    OutreachCcEmailAddressesResponse:
      type: object
      description: Response containing global outreach CC email addresses
      properties:
        ccEmails:
          type:
          - array
          - 'null'
          examples:
          - - sunayana.kalekar@certifyos.com
            - mail@certifyos.com
          items:
            type: string
          description: List of global CC email addresses for all outreach types. Null in the current implementation, which does not persist or read this value; see the operation description on GET/PUT .../outreach-settings/cc-emails.
