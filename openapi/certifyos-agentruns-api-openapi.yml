openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer Agent Runs API
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: AgentRuns
  description: Pass-through proxy to the agentOS application-release agent
paths:
  /agent/practitioners/{practitionerId}/runs:
    post:
      summary: Start an application-release run for a practitioner
      operationId: agentRunsStartRun
      tags:
      - AgentRuns
      parameters:
      - name: practitionerId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        '400':
          description: Bad Request - missing or blank tenant-id, or the request body is not a valid JSON object
          content:
            application/json: {}
        '502':
          description: Bad Gateway - a network/timeout failure reaching agentOS, or a genuine 5xx from agentOS itself
          content:
            application/json: {}
        '503':
          description: 'Service Unavailable - agentos_not_configured (no credential configured) or agentos_credential_unavailable (m2m mode: Auth0 unreachable and no still-valid cached token); api-layer never called agentOS'
          content:
            application/json: {}
        '202':
          description: Accepted - agentOS's response, passed through unchanged; the run itself proceeds asynchronously
          content:
            application/json: {}
        '404':
          description: Not Found - agentOS integration is off, this tenant is not enrolled for the credentialing agent, credentialingWorkflowId is missing/blank, credentialingWorkflowId does not belong to the caller's tenant, credentialingWorkflowId does not belong to the path practitionerId, or the practitioner id is unknown to agentOS
          content:
            application/json: {}
        '409':
          description: Conflict - agentOS's response, passed through unchanged (e.g. this practitioner already has a run in progress)
          content:
            application/json: {}
        '422':
          description: Unprocessable Entity - agentOS's response, passed through unchanged (e.g. an invalid state in statesToCredential)
          content:
            application/json: {}
      security:
      - jwt: []
  /agent/runs/{runId}:
    get:
      summary: Get an agentOS run record
      operationId: agentRunsGetRun
      tags:
      - AgentRuns
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '400':
          description: Bad Request - missing or blank tenant-id
          content:
            application/json: {}
        '502':
          description: Bad Gateway - a network/timeout failure reaching agentOS, or a genuine 5xx from agentOS itself
          content:
            application/json: {}
        '503':
          description: 'Service Unavailable - agentos_not_configured (no credential configured), agentos_credential_unavailable (m2m mode: Auth0 unreachable and no still-valid cached token), or agentos_credential_rejected (agentOS rejected api-layer''s own bearer token, after one retry with a freshly fetched credential, on this run fetch)'
          content:
            application/json: {}
        '200':
          description: OK - agentOS's response, passed through unchanged
          content:
            application/json: {}
        '404':
          description: Not Found - agentOS integration is off, this tenant is not enrolled for the credentialing agent, the run belongs to a different tenant, or agentOS itself has no record of this run_id
          content:
            application/json: {}
      security:
      - jwt: []
