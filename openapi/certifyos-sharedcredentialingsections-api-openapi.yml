openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer Shared Credentialing Sections API
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: SharedCredentialingSections
  description: The NSCP shared credentialing workflow's sections, aggregated across member tenants (internal).
paths:
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/notes:
    get:
      summary: The Notes section of a shared credentialing workflow
      description: 'Every member tenant''s notes, shaped like one entry of the sections read: identical notes are grouped into one record, whose coverage lists the tenants holding it. Each record''s copies give every tenant''s note ids, author and times, and the record carries the latest change across them. Needs credentialing-workflow:note:read on every participating member tenant.'
      operationId: readSharedCredentialingNotes
      tags:
      - SharedCredentialingSections
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing workflow id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      responses:
        '200':
          description: The Notes section
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedNotesResponse'
        '404':
          description: No such shared workflow in this anchor group, no member to read, or, in an active run, no note read permission on one of its participating tenants (all-tenant authority). A closed run, every member Withdrawn/Cancelled, answers 200 with the notes of the members the caller can read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
    post:
      summary: Add a note to tenants of a shared credentialing workflow
      description: Adds the note to each member workflow of the tenants named in targetTenantIds; locked workflows are skipped and reported, and a workflow already holding the note gets no second copy. Needs credentialing-workflow:note:create on every member tenant.
      operationId: addSharedCredentialingNote
      tags:
      - SharedCredentialingSections
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing workflow id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedSectionRecordAddRequest'
        required: true
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSectionWriteResponse'
        '400':
          description: 'INVALID_REQUEST: no target tenant, a target outside the workflow, a missing, blank or over-long message, or recordKind SHARED (a body that can''t be bound: VALIDATION_ERROR)'
        '403':
          description: 'TENANT_PERMISSION_MISSING: note:create is missing on a member tenant'
        '404':
          description: No such shared workflow, or a member tenant the caller has no note read on (all-tenant authority)
        '409':
          description: 'WORKFLOW_CONFLICT: another write kept changing the notes'
        '422':
          description: 'ALL_TENANTS_LOCKED: every workflow the note would reach is at PSV Complete or later, so nothing was added; or TOO_MANY_NOTES: a member workflow holds more notes than can be read at once'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/notes/{credentialingDisplayGroupKey}:
    patch:
      summary: Edit every copy of a note
      description: Replaces the message of every copy the note has, in every member workflow that is not locked. With targetTenantIds the save also sets the note's holders. Needs credentialing-workflow:note:update on every member tenant, and note:create or note:delete when coverage widens or narrows. The response carries the note's new credentialingDisplayGroupKey.
      operationId: editSharedCredentialingNote
      tags:
      - SharedCredentialingSections
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: The note's credentialingDisplayGroupKey, as GET /notes returns it
        required: true
        name: credentialingDisplayGroupKey
        in: path
        schema:
          type: string
      - description: Shared credentialing workflow id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedSectionRecordEditRequest'
        required: true
      responses:
        '200':
          description: Edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSectionWriteResponse'
        '400':
          description: A malformed request or an invalid message
        '403':
          description: 'TENANT_PERMISSION_MISSING: a note permission is missing on a member tenant'
        '404':
          description: No such shared workflow, or a member tenant the caller has no note read on (all-tenant authority)
        '409':
          description: STALE_RECORD or WORKFLOW_CONFLICT; nothing was changed
        '422':
          description: 'TOO_MANY_NOTES: a member workflow holds more notes than can be read at once; or ALL_TENANTS_LOCKED: the coverage change would leave the note on no workflow, every tenant it keeps or adds being locked (delete the note instead). Nothing was changed'
      security:
      - jwt: []
    delete:
      summary: Delete every unlocked copy of a note
      description: Deletes every copy the note has in member workflows that are not locked; locked members keep theirs. A note is hard-deleted, so the reason fields are not used. Needs credentialing-workflow:note:delete on every member tenant.
      operationId: deleteSharedCredentialingNote
      tags:
      - SharedCredentialingSections
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: The note's credentialingDisplayGroupKey, as GET /notes returns it
        required: true
        name: credentialingDisplayGroupKey
        in: path
        schema:
          type: string
      - description: Shared credentialing workflow id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedSectionRecordDeleteRequest'
        required: true
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSectionWriteResponse'
        '400':
          description: A malformed request
        '403':
          description: 'TENANT_PERMISSION_MISSING: note:delete is missing on a member tenant'
        '404':
          description: No such shared workflow, or a member tenant the caller has no note read on (all-tenant authority)
        '409':
          description: STALE_RECORD or WORKFLOW_CONFLICT; nothing was changed
        '422':
          description: 'TOO_MANY_NOTES: a member workflow holds more notes than can be read at once; nothing was changed'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/notes/{credentialingDisplayGroupKey}/coverage:
    put:
      summary: Set which tenants hold a note
      description: 'Adds a copy to each added, unlocked tenant and deletes the copy from each removed one; locked tenants keep what they have. The last tenant can''t be removed: delete the note instead. Needs credentialing-workflow:note:create (widening) and note:delete (narrowing) on every member tenant.'
      operationId: setSharedCredentialingNoteCoverage
      tags:
      - SharedCredentialingSections
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: The note's credentialingDisplayGroupKey, as GET /notes returns it
        required: true
        name: credentialingDisplayGroupKey
        in: path
        schema:
          type: string
      - description: Shared credentialing workflow id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedSectionCoverageRequest'
        required: true
      responses:
        '200':
          description: Coverage set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSectionWriteResponse'
        '400':
          description: A malformed request, or no tenant left
        '403':
          description: 'TENANT_PERMISSION_MISSING: a note permission is missing on a member tenant'
        '404':
          description: No such shared workflow, or a member tenant the caller has no note read on (all-tenant authority)
        '409':
          description: STALE_RECORD or WORKFLOW_CONFLICT; nothing was changed
        '422':
          description: 'TOO_MANY_NOTES: a member workflow holds more notes than can be read at once; or ALL_TENANTS_LOCKED: the coverage change would leave the note on no workflow, every tenant it keeps or adds being locked (delete the note instead). Nothing was changed'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/sections:
    get:
      summary: Every section of a shared credentialing workflow
      description: 'One call for the whole page: every catalog section, with member tenants'' identical records grouped into one record and each record''s coverage listing the readable tenants that hold it. Only tenants the caller holds credentialing-workflow:read on are returned; the rest are counted in hiddenTenantCount. Notes are read from their own endpoint.'
      operationId: readSharedCredentialingSections
      tags:
      - SharedCredentialingSections
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing workflow id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      responses:
        '200':
          description: The sections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSectionsResponse'
        '404':
          description: No such shared workflow in this anchor group, no member the caller can read, or, in an active run, no read permission on one of its participating tenants (all-tenant authority). A closed run, every member Withdrawn/Cancelled, answers 200 read-only instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/sections/supporting-documents:
    post:
      summary: Upload a Supporting Document for the tenants named
      description: Stores the file once and gives each named tenant's unlocked workflows a Supporting Documents row holding it, so the page shows one document whose one file covers every tenant. Locked workflows are skipped and reported; when every one is locked, nothing is stored. Needs credentialing-workflow:details:create, details:update, details:delete and details:supporting-documents:create on every member tenant. The file is checked as the tenant upload checks it.
      operationId: uploadSharedCredentialingSupportingDocument
      tags:
      - SharedCredentialingSections
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing workflow id
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - request
              - file
              properties:
                request:
                  $ref: '#/components/schemas/SharedSupportingDocumentUploadRequest'
                  type: string
                  description: The tenants that get the document, and its fields
                file:
                  type: string
                  format: binary
                  description: The document
            encoding:
              request:
                contentType: application/json
        required: true
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSectionWriteResponse'
        '400':
          description: 'INVALID_REQUEST: no file, an oversize file, a request part that isn''t JSON, no targetTenantIds or one that isn''t a participating tenant of this run, a blank fileType, or an expirationDate that isn''t YYYY-MM-DD'
        '403':
          description: The permission is missing on a member tenant
        '404':
          description: No such shared workflow, or a member tenant the caller has no read on (all-tenant authority)
        '409':
          description: 'WORKFLOW_CONFLICT: another write kept changing the rows'
        '422':
          description: 'ALL_TENANTS_LOCKED: every workflow the document would reach is at PSV Complete or later, so no row was written. Nothing is stored, unless they locked while the upload was being saved: then the stored file is kept, referenced by no row'
        '415':
          description: Not multipart/form-data. A JSON body to this path is refused here; it never reaches POST /{section}, which adds no Supporting Document
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/sections/{section}:
    post:
      summary: Add a record to a section of a shared credentialing workflow
      description: A shared PSV record (the default in the six PSV sections) reaches every participating, unlocked tenant and the shared workflow itself; any other record reaches the tenants named in targetTenantIds. Locked tenants are skipped and reported. Needs credentialing-workflow:details:create on every member tenant.
      operationId: addSharedCredentialingSectionRecord
      tags:
      - SharedCredentialingSections
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: Shared credentialing workflow id
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: The section's kebab-case name
        required: true
        name: section
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedSectionRecordAddRequest'
        required: true
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSectionWriteResponse'
        '400':
          description: 'INVALID_REQUEST: an unknown section, a missing field or an invalid record (a body that can''t be bound: VALIDATION_ERROR)'
        '403':
          description: The permission is missing on a member tenant
        '404':
          description: No such shared workflow, or a member tenant the caller has no read on (all-tenant authority)
        '409':
          description: 'WORKFLOW_CONFLICT: another write kept changing the rows'
        '422':
          description: 'An NPDB result or client preclusion for more than one tenant, or ALL_TENANTS_LOCKED: every workflow the record would reach is at PSV Complete or later, so nothing was added'
      security:
      - jwt: []
  ? /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/sections/{section}/{credentialingDisplayGroupKey}/attachments
  : delete:
      summary: Remove an attachment from every copy of a record
      description: Removes the attachment version named by fileUrl from every copy of the record held by a member workflow that is not locked; locked workflows keep theirs, and the file itself is kept. Needs credentialing-workflow:details:create, details:update, details:delete and details:attachments:delete on every member tenant.
      operationId: removeSharedCredentialingSectionRecordAttachment
      tags:
      - SharedCredentialingSections
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: The record's credentialingDisplayGroupKey, as GET /sections returns it
        required: true
        name: credentialingDisplayGroupKey
        in: path
        schema:
          type: string
      - description: Shared credentialing workflow id
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: The section's kebab-case name
        required: true
        name: section
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedSectionAttachmentRemoveRequest'
        required: true
      responses:
        '200':
          description: 'Removed, or already removed: when no copy of the record holds that fileUrl (the same remove received twice), nothing is written and no tenant is listed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSectionWriteResponse'
        '400':
          description: 'INVALID_REQUEST: a section whose records carry no attachments, no expectedTenantIds or no fileUrl'
        '403':
          description: The permission is missing on a member tenant
        '404':
          description: No such shared workflow, or a member tenant the caller has no read on (all-tenant authority)
        '409':
          description: 'STALE_RECORD (the record''s holders no longer match expectedTenantIds), WORKFLOW_CONFLICT, or ATTACHMENT_DELETE_BLOCKED: an attachment the tenant attachment delete won''t remove either (the shared State Medicaid Exclusion List PDF); nothing was changed'
      security:
      - jwt: []
    post:
      summary: Attach a file to every copy of a record
      description: 'Stores the file once and adds it to the attachments of every copy of the record held by a member workflow that is not locked, so the page shows one version for every tenant it reached. Locked workflows are skipped and reported; when every holder is locked, nothing is stored. Only the sections whose records carry attachments take one. Needs credentialing-workflow:details:create, details:update, details:delete and details:attachments:create on every member tenant. The file is checked as the tenant attachment upload checks it: PDF, JPG or PNG, within the size limit.'
      operationId: addSharedCredentialingSectionRecordAttachment
      tags:
      - SharedCredentialingSections
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: The record's credentialingDisplayGroupKey, as GET /sections returns it
        required: true
        name: credentialingDisplayGroupKey
        in: path
        schema:
          type: string
      - description: Shared credentialing workflow id
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: The section's kebab-case name
        required: true
        name: section
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - request
              - file
              properties:
                request:
                  $ref: '#/components/schemas/SharedSectionAttachmentAddRequest'
                  type: string
                  description: The tenants that held the record when it was read, and the attachment's expiration date
                file:
                  type: string
                  format: binary
                  description: The file
            encoding:
              request:
                contentType: application/json
        required: true
      responses:
        '201':
          description: Attached; the response's attachment names the stored file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSectionWriteResponse'
        '400':
          description: 'INVALID_REQUEST: a section whose records carry no attachments, no file, a file that isn''t PDF, JPG or PNG, an oversize file, a request part that isn''t JSON, no expectedTenantIds, or an expirationDate that isn''t YYYY-MM-DD'
        '403':
          description: The permission is missing on a member tenant
        '404':
          description: No such shared workflow, or a member tenant the caller has no read on (all-tenant authority)
        '409':
          description: 'STALE_RECORD or WORKFLOW_CONFLICT; nothing was changed. Nothing is stored either, unless the conflict came after the file was stored (a retry that found the record changed, or retries that ran out): then the stored file is kept, referenced by no row'
        '415':
          description: Not multipart/form-data
        '422':
          description: 'ALL_TENANTS_LOCKED: every workflow holding the record is at PSV Complete or later, so nothing was attached. Nothing is stored, unless they locked while the file was being saved: then the stored file is kept, referenced by no row'
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/sections/{section}/{deduplicationId}:
    patch:
      summary: Edit every copy of a record
      description: Merges the changed fields into every copy the record has, in every member workflow that is not locked; a null clears a field. With targetTenantIds the save also sets the record's holders. Needs credentialing-workflow:details:update on every member tenant, and details:create or details:delete when coverage widens or narrows (a Supporting Document widens with the upload's four permissions, details:supporting-documents:create among them; a record with attachments, whose new copies carry them, with details:attachments:create too). The response carries the record's new credentialingDisplayGroupKey.
      operationId: editSharedCredentialingSectionRecord
      tags:
      - SharedCredentialingSections
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: The record's credentialingDisplayGroupKey, as GET /sections returns it
        required: true
        name: deduplicationId
        in: path
        schema:
          type: string
      - description: Shared credentialing workflow id
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: The section's kebab-case name
        required: true
        name: section
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedSectionRecordEditRequest'
        required: true
      responses:
        '200':
          description: Edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSectionWriteResponse'
        '400':
          description: A malformed request, an unknown section or an invalid record
        '403':
          description: The permission is missing on a member tenant
        '404':
          description: No such shared workflow, or a member tenant the caller has no read on (all-tenant authority)
        '409':
          description: STALE_RECORD, SHARE_CONFIRMATION_REQUIRED or WORKFLOW_CONFLICT; nothing was changed
        '422':
          description: A coverage change the record can't take (NPDB_NOT_SHAREABLE, PRIVATE_ROW_NOT_SHAREABLE, SUPPORTING_DOCUMENT_NOT_SHAREABLE, ATTACHMENT_NOT_SHAREABLE, COVERAGE_NARROWING_UNSUPPORTED)
      security:
      - jwt: []
    delete:
      summary: Delete every unlocked copy of a record
      description: Removes every copy the record has in member workflows that are not locked, and the shared workflow's own copy; locked members keep theirs. Takes the tenant delete's reason fields. Needs credentialing-workflow:details:delete on every member tenant.
      operationId: deleteSharedCredentialingSectionRecord
      tags:
      - SharedCredentialingSections
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: The record's credentialingDisplayGroupKey, as GET /sections returns it
        required: true
        name: deduplicationId
        in: path
        schema:
          type: string
      - description: Shared credentialing workflow id
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: The section's kebab-case name
        required: true
        name: section
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedSectionRecordDeleteRequest'
        required: true
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSectionWriteResponse'
        '400':
          description: A malformed request, an unknown section or an invalid reason
        '403':
          description: The permission is missing on a member tenant
        '404':
          description: No such shared workflow, or a member tenant the caller has no read on (all-tenant authority)
        '409':
          description: STALE_RECORD or WORKFLOW_CONFLICT; nothing was changed
      security:
      - jwt: []
  /api/v1/anchor-groups/{anchorGroupId}/shared-credentialing-workflows/{id}/sections/{section}/{deduplicationId}/coverage:
    put:
      summary: Set which tenants hold a record
      description: Adds a copy to each added, unlocked tenant and removes the copy from each removed one; locked tenants keep what they have. Widening a system-originated record needs coverageExpansionConfirmed. Needs credentialing-workflow:details:create (widening) and details:delete (narrowing) on every member tenant; widening a Supporting Document needs the upload's four permissions instead, details:supporting-documents:create among them, and a file that is its own workflow's upload or already shared with the run. The new copies of a record with attachments carry them, which needs details:attachments:create on every member tenant too, and files that are their holders' own uploads or already shared with the run. Removed copies take their attachments with them; no file is deleted.
      operationId: setSharedCredentialingSectionRecordCoverage
      tags:
      - SharedCredentialingSections
      parameters:
      - description: Anchor Group id
        required: true
        name: anchorGroupId
        in: path
        schema:
          type: string
      - description: The record's credentialingDisplayGroupKey, as GET /sections returns it
        required: true
        name: deduplicationId
        in: path
        schema:
          type: string
      - description: Shared credentialing workflow id
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: The section's kebab-case name
        required: true
        name: section
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedSectionCoverageRequest'
        required: true
      responses:
        '200':
          description: Coverage set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSectionWriteResponse'
        '400':
          description: A malformed request, an unknown section or no tenant left
        '403':
          description: The permission is missing on a member tenant
        '404':
          description: No such shared workflow, or a member tenant the caller has no read on (all-tenant authority)
        '409':
          description: STALE_RECORD, SHARE_CONFIRMATION_REQUIRED or WORKFLOW_CONFLICT; nothing was changed
        '422':
          description: NPDB_NOT_SHAREABLE, PRIVATE_ROW_NOT_SHAREABLE, SUPPORTING_DOCUMENT_NOT_SHAREABLE, ATTACHMENT_NOT_SHAREABLE or COVERAGE_NARROWING_UNSUPPORTED
      security:
      - jwt: []
components:
  schemas:
    SharedNotesResponse:
      type: object
      required:
      - section
      - scope
      - status
      - records
      description: The Notes section of a shared credentialing workflow, shaped like one entry of the sections read, with each note grouped across the member tenants whose notes the caller can read.
      properties:
        section:
          type: string
          description: The section's name, always notes.
        scope:
          type: string
          enum:
          - SHARED_PSV
          - TENANT_SCOPED
          - SUPPORTING
          - OUTREACH_DATA
          description: The catalog group, always SUPPORTING for notes.
        status:
          type: string
          enum:
          - ISSUE
          - ALL_VERIFIED
          - POPULATED
          - EMPTY
          description: The rolled-up status; a note carries no verification, so notes read POPULATED or EMPTY.
        records:
          type: array
          items:
            $ref: '#/components/schemas/SharedNoteRecordDto'
          description: The grouped notes, oldest first.
    SharedSectionRecordEditRequest:
      type: object
      required:
      - expectedTenantIds
      description: Edit a record of a shared workflow section.
      properties:
        expectedTenantIds:
          type: array
          items:
            type: string
          description: The readable tenants that held the record when it was read.
        targetTenantIds:
          type: array
          items:
            type: string
          description: The full set of readable tenants that should hold the record after the save.
        record:
          type: object
          description: The changed fields; null clears one.
        coverageExpansionConfirmed:
          type: boolean
          description: The share confirmation for widening a system-originated record.
    ObjectNode:
      type: array
      items:
        $ref: '#/components/schemas/JsonNode'
    SharedSectionRecordDto:
      type: object
      required:
      - credentialingDisplayGroupKey
      - deduplicationId
      - recordKind
      - provenance
      - privateData
      - coverage
      - capabilities
      - record
      - attachments
      description: One aggregated record.
      properties:
        credentialingDisplayGroupKey:
          type: string
          description: The record's identity, the value the write routes take as {deduplicationId}. It changes whenever a visible field does, so use the latest one received.
        deduplicationId:
          type: string
          deprecated: true
          description: 'Deprecated: the same value as credentialingDisplayGroupKey, which replaces it. Read credentialingDisplayGroupKey; this field will be removed.'
        recordKind:
          type: string
          enum:
          - SHARED
          - TENANT
        provenance:
          type: string
          enum:
          - SYSTEM
          - MODIFIED
          - MANUAL
        privateData:
          type: boolean
        coverage:
          $ref: '#/components/schemas/SharedRecordCoverageDto'
        eligibleTenantIds:
          type: array
          items:
            type: string
          description: 'Tenants a coverage change may add: readable, unlocked and not holding the record. Absent for NPDB, client preclusion and private PSV records, which are never shared; empty when no tenant remains.'
        capabilities:
          type: array
          items:
            type: string
          description: What the caller may do to this record; each value is one of update, delete, share.
        record:
          $ref: '#/components/schemas/ObjectNode'
          type: array
          description: The fields the page shows. A record every copy of which is verified also carries verifiedBy (user id), verifiedDate and verifiedByName, as the tenant workflow GET does; any other record carries none of them (CP-42861).
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/SharedAttachmentDto'
          description: 'The record''s attachments: one entry per file name, each listing every URL the name is held at with the readable tenants holding it. Empty when there are none, and always empty for Supporting Documents (their files are versions) and the contact sections.'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SharedFileVersionDto'
          description: 'Supporting Documents only: the document''s file URLs, each with the readable tenants holding it; empty for a document stored without a URL. Absent in every other section.'
        memberRecordIds:
          type: array
          items:
            type: string
          description: The ids the member workflows store for the copies this record stands for (every readable copy merged into a shared record, the record's own for a tenant record), sorted and distinct. Match a rule result's targetItemId on them. Absent when no copy stores an id.
    ErrorObject:
      type: object
      description: Individual error object containing details about a specific validation or processing error
      properties:
        httpStatus:
          type: integer
          format: int32
          examples:
          - 400
          description: HTTP status code for this error
        reason:
          type: string
          examples:
          - VALIDATION_ERROR
          description: Error reason/code
        title:
          type: string
          examples:
          - 'Validation failed for field: eventTypes'
          description: Error title/summary
        detail:
          type: string
          examples:
          - eventTypes is required and cannot be empty or null
          description: Detailed error message
        rejectedValue:
          type: string
          description: The value that was rejected, omitted for sensitive fields such as SSN
    SharedSectionAttachmentAddRequest:
      type: object
      required:
      - expectedTenantIds
      description: The request part of an attachment add to a shared workflow record.
      properties:
        expectedTenantIds:
          type: array
          items:
            type: string
          description: The readable tenants that held the record when it was read.
        expirationDate:
          type: string
          description: The attachment's expiration date, YYYY-MM-DD. Absent or blank for none, which is stored as 9999-12-31, as the tenant attachment upload stores it.
    SharedFileVersionDto:
      type: object
      required:
      - fileUrl
      - tenantIds
      description: One file URL and the readable tenants holding it.
      properties:
        fileUrl:
          type: string
          description: 'The file''s storage key, exactly as stored: fetch it through a signed URL, never use it as a link.'
        tenantIds:
          type: array
          items:
            type: string
          description: The readable tenants holding this URL.
    JsonNode:
      type: object
      properties:
        empty:
          type: boolean
        valueNode:
          type: boolean
        containerNode:
          type: boolean
        missingNode:
          type: boolean
        array:
          type: boolean
        object:
          type: boolean
        nodeType:
          $ref: '#/components/schemas/JsonNodeType'
        pojo:
          type: boolean
        number:
          type: boolean
        integralNumber:
          type: boolean
        floatingPointNumber:
          type: boolean
        short:
          type: boolean
        int:
          type: boolean
        long:
          type: boolean
        float:
          type: boolean
        double:
          type: boolean
        bigDecimal:
          type: boolean
        bigInteger:
          type: boolean
        textual:
          type: boolean
        boolean:
          type: boolean
        'null':
          type: boolean
        binary:
          type: boolean
    SharedSectionsResponse:
      type: object
      required:
      - sharedCredentialingWorkflowId
      - hiddenTenantCount
      - tenants
      - sections
      description: Every section of a shared credentialing workflow, aggregated across the member tenants the caller can read.
      properties:
        sharedCredentialingWorkflowId:
          type: string
          description: The shared credentialing workflow id.
        hiddenTenantCount:
          type: integer
          format: int32
          description: Participating tenants the caller cannot read; counted, never named. A write response's hiddenTenantCount counts only the tenants that write reached or skipped.
          minimum: 0
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/SharedSectionsTenantDto'
          description: One entry per readable, participating tenant.
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SharedSectionDto'
          description: Every section, in catalog order.
    SharedNoteRecordDto:
      type: object
      required:
      - credentialingDisplayGroupKey
      - deduplicationId
      - recordKind
      - provenance
      - privateData
      - coverage
      - record
      - copies
      description: One note, grouped across the tenants that hold it.
      properties:
        credentialingDisplayGroupKey:
          type: string
          description: 'The note''s identity: a hash of its trimmed message, so the same text is one note. It changes when the message does.'
        deduplicationId:
          type: string
          deprecated: true
          description: 'Deprecated: the same value as credentialingDisplayGroupKey, which replaces it. Read credentialingDisplayGroupKey; this field will be removed.'
        recordKind:
          type: string
          enum:
          - SHARED
          - TENANT
        provenance:
          type: string
          enum:
          - SYSTEM
          - MODIFIED
          - MANUAL
        privateData:
          type: boolean
        coverage:
          $ref: '#/components/schemas/SharedRecordCoverageDto'
        record:
          $ref: '#/components/schemas/ObjectNode'
          type: array
          description: 'The fields the page shows: message.'
        copies:
          type: array
          items:
            $ref: '#/components/schemas/SharedNoteCopyDto'
          description: Each tenant's note in the group, with the ids the tenant note routes take.
        updatedBy:
          type:
          - string
          - 'null'
          description: 'The latest change across the copies: the user of the copy with the most recent updatedAt (else createdAt, and then its createdBy); the lowest tenant id on a tie.'
        updatedByName:
          type:
          - string
          - 'null'
          description: That user's name, or the user id when no name resolves.
        updatedAt:
          type:
          - string
          - 'null'
          description: 'When that copy last changed: its updatedAt, else its createdAt.'
          anyOf:
          - $ref: '#/components/schemas/Instant'
          - type: 'null'
    SharedSectionsTenantDto:
      type: object
      required:
      - id
      - locked
      - capabilities
      description: A member tenant the caller can read.
      properties:
        id:
          type: string
        name:
          type: string
        locked:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
          description: What the caller may do in this tenant; each value is one of read, create, update, delete, share, attach, detach, upload, verify.
    SharedAttachmentDto:
      type: object
      required:
      - originalFileName
      - versions
      description: One attachment file name and every URL it is held at.
      properties:
        originalFileName:
          type: string
          description: The file name, trimmed. Empty for an attachment stored without one, which is then an entry of its own for each URL.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SharedFileVersionDto'
          description: Each URL the file name is held at.
    SharedSectionRecordAddRequest:
      type: object
      required:
      - record
      description: Add a record to a shared workflow section.
      properties:
        targetTenantIds:
          type: array
          items:
            type: string
          description: The tenants that get the record; not sent for a shared PSV record.
        record:
          type: object
          description: The section's fields.
        recordKind:
          type: string
          enum:
          - SHARED
          - TENANT
          description: Defaults by section.
    SharedSectionWriteResponse:
      type: object
      required:
      - credentialingDisplayGroupKey
      - deduplicationId
      - outcomes
      - hiddenTenantCount
      description: The result of a shared workflow record write.
      properties:
        credentialingDisplayGroupKey:
          type: string
          description: 'The record''s identity after the write: the value the next write takes as {deduplicationId}.'
        deduplicationId:
          type: string
          deprecated: true
          description: 'Deprecated: the same value as credentialingDisplayGroupKey, which replaces it. Read credentialingDisplayGroupKey; this field will be removed.'
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/SharedSectionWriteOutcome'
          description: One entry per affected tenant the caller can read.
        hiddenTenantCount:
          type: integer
          format: int32
          description: Tenants this write reached or skipped that the caller cannot read. Not the Sections GET's hiddenTenantCount, which counts every participating tenant the caller cannot read.
          minimum: 0
        attachment:
          $ref: '#/components/schemas/SharedSectionWriteAttachment'
          type: object
          description: 'An attachment add only: the file it stored, once, for every copy it reached. Absent from every other write''s response.'
    SharedSectionRecordDeleteRequest:
      type: object
      required:
      - expectedTenantIds
      description: Delete a record of a shared workflow section.
      properties:
        expectedTenantIds:
          type: array
          items:
            type: string
          description: The readable tenants that held the record when it was read.
        intent:
          type: string
          enum:
          - WORKFLOW_IRRELEVANCE
          - INCORRECT_PRACTITIONER_ASSOCIATION
        reason:
          type: string
          enum:
          - OUT_OF_CREDENTIALING_SCOPE
          - DUPLICATE_RECORD
          - EXPIRED_DATA
          - OTHER
        reasonText:
          type: string
          maxLength: 2000
          description: Required when reason is OTHER.
    SharedSectionCoverageRequest:
      type: object
      required:
      - expectedTenantIds
      - targetTenantIds
      description: Set the tenants holding a shared workflow record.
      properties:
        expectedTenantIds:
          type: array
          items:
            type: string
          description: The readable tenants that held the record when it was read.
        targetTenantIds:
          type: array
          items:
            type: string
          description: The full set of readable tenants that should hold the record.
        coverageExpansionConfirmed:
          type: boolean
          description: The share confirmation for widening a system-originated record.
    SharedSupportingDocumentUploadRequest:
      type: object
      required:
      - targetTenantIds
      - record
      description: The request part of a Supporting Document upload to a shared workflow.
      properties:
        targetTenantIds:
          type: array
          items:
            type: string
          description: The tenants that get the document.
        record:
          type: object
          description: fileType (required), state, expirationDate (YYYY-MM-DD).
    ApiError:
      type: object
      description: Standard API error response containing a list of error objects
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
          description: List of error objects describing validation or processing failures
    SharedSectionWriteAttachment:
      type: object
      required:
      - originalFileName
      - fileUrl
      description: The file an attachment add stored.
      properties:
        originalFileName:
          type: string
          description: The file's name as uploaded.
        fileUrl:
          type: string
          description: 'The stored file''s storage key, which every copy it reached holds and an attachment remove takes: fetch it through a signed URL, never use it as a link.'
    Instant:
      type: string
      format: date-time
      examples:
      - '2022-03-10T16:15:50Z'
    SharedSectionDto:
      type: object
      required:
      - section
      - scope
      - status
      - records
      description: One section of the shared workflow page.
      properties:
        section:
          type: string
          description: The section's kebab-case path name.
        scope:
          type: string
          enum:
          - SHARED_PSV
          - TENANT_SCOPED
          - SUPPORTING
          - OUTREACH_DATA
        status:
          type: string
          enum:
          - ISSUE
          - ALL_VERIFIED
          - POPULATED
          - EMPTY
        records:
          type: array
          items:
            $ref: '#/components/schemas/SharedSectionRecordDto'
    SharedSectionWriteOutcome:
      type: object
      required:
      - tenantId
      - status
      description: One tenant's outcome.
      properties:
        tenantId:
          type: string
        status:
          type: string
          enum:
          - APPLIED
          - SKIPPED_LOCKED
        detail:
          type: string
    JsonNodeType:
      type: string
      enum:
      - ARRAY
      - BINARY
      - BOOLEAN
      - MISSING
      - 'NULL'
      - NUMBER
      - OBJECT
      - POJO
      - STRING
    SharedNoteCopyDto:
      type: object
      required:
      - tenantId
      - memberWorkflowId
      - noteId
      description: One tenant's note, with the ids the tenant note routes take.
      properties:
        tenantId:
          type: string
        memberWorkflowId:
          type: string
        noteId:
          type: string
        createdBy:
          type:
          - string
          - 'null'
          description: The user who wrote the note.
        createdByName:
          type:
          - string
          - 'null'
          description: That user's name, or the user id when no name resolves.
        createdAt:
          type:
          - string
          - 'null'
          description: When the note was written.
          anyOf:
          - $ref: '#/components/schemas/Instant'
          - type: 'null'
        updatedBy:
          type:
          - string
          - 'null'
          description: The user who last changed the note.
        updatedByName:
          type:
          - string
          - 'null'
          description: That user's name, or the user id when no name resolves.
        updatedAt:
          type:
          - string
          - 'null'
          description: When the note last changed.
          anyOf:
          - $ref: '#/components/schemas/Instant'
          - type: 'null'
    SharedSectionAttachmentRemoveRequest:
      type: object
      required:
      - expectedTenantIds
      - fileUrl
      description: Remove an attachment from a shared workflow record.
      properties:
        expectedTenantIds:
          type: array
          items:
            type: string
          description: The readable tenants that held the record when it was read.
        fileUrl:
          type: string
          description: 'The attachment version to remove: its fileUrl exactly as the Sections GET returns it.'
    SharedRecordCoverageDto:
      type: object
      required:
      - tenantIds
      description: The readable tenants that hold a record.
      properties:
        tenantIds:
          type: array
          items:
            type: string
  securitySchemes:
    jwt:
      type: http
      description: JWT Authentication - Provide only the raw token without Bearer prefix
      scheme: bearer
      bearerFormat: JWT
