          description: Invalid request data or business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '404':
          description: Timeline event or facility credentialing workflow not found
          content:
            application/json: {}
      security:
      - jwt: []
  /facility-credentialing-workflows/{workflowId}/userdefinedfields:
    put:
      summary: Replace user-defined fields on a facility workflow
      description: Replaces the entire `userDefinedFields` object on the specified facility credentialing workflow with the object provided in the request body (replace-all / RESTful PUT semantics). **When to use:** Use to set or update custom metadata for a workflow. Omitting a key removes it. To clear all user-defined fields, send an empty object `{}`. **Constraints:** This field cannot be modified once the workflow reaches a completed or invalid status — a `400 Bad Request` is returned in that case (`WorkflowCompletedException` or `WorkflowStatusInvalidException`). **Schema:** **Returns:** `200 OK`. Returns `400` if the workflow is in a terminal status or if the input is otherwise invalid.
      operationId: updateFacilityCredentialingWorkflowUserDefinedFields
      tags:
      - FacilityCredentialingWorkflow
      parameters:
      - description: Facility credentialing workflow ID
        example: fcw_1234567890
        in: path
        required: true
        name: workflowId
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              updateFacilityCredentialingWorkflowUserDefinedFields:
                value:
                  customFieldA: fac-harvest-a
            schema:
              type: object
              description: User defined fields object with custom properties
        required: true
      responses:
        '200':
          description: User defined fields updated successfully
          content:
            application/json:
              examples:
                updateFacilityCredentialingWorkflowUserDefinedFieldsResponse:
                  value:
                    message: Updated user defined fields with 1 field(s)
                    status: success
              schema:
                type: object
        '400':
          description: Bad request - Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Facility credentialing workflow not found
          content:
            application/json: {}
        '500':
          description: Internal server error
          content:
            application/json: {}
      security:
      - jwt: []
