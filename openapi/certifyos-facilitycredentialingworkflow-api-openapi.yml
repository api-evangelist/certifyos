      description: Returns the most recent facility timeline event (by creation date) for each requested facility credentialing workflow ID, including data.changeReason when present. Accepts 1–10 workflow IDs. If a workflow has no timeline events, that ID is still included with an error message; other IDs are unaffected (partial success).
