  /facility-credentialing-workflows/timeline-events:
    post:
      summary: Change status of multiple facility workflows via timeline events
      description: Creates a timeline event for each supplied facility credentialing workflow in a single synchronous call, advancing each workflow's `credentialingStatus` to the requested state. **When to use:** Use to transition multiple workflows at once — for example, moving a cohort of facilities to a new credentialing stage. For a single workflow, use `POST /facility-credentialing-workflows/{workflowId}/timeline-events`. To discover which status values are permitted for a given workflow, call `GET /{workflowId}/timeline-events/status-options` first. **Preconditions:** Each workflow must belong to the caller's tenant. Permitted status transitions depend on the workflow's current state and the caller's permissions. **Each workflow is processed independently:** the response contains `successful` and `failed` arrays — inspect both even on `200 OK`. **Returns:** `200 OK` with bulk-result arrays.
      operationId: bulkFacilityStatusChange
      tags:
      - FacilityCredentialingWorkflow
      parameters:
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Bulk status change request with workflow IDs and timeline event data
        content:
          application/json:
            examples:
              bulkFacilityStatusChange:
                value:
                  workflowIds:
                  - 22222222-2222-4222-8222-222222222222
                  timelineEventData:
                    name: OUTREACH_IN_PROGRESS
                    changeReason: Bulk facility status change
                  isSelectAll: false
            schema:
              $ref: '#/components/schemas/BulkFacilityStatusChangeRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
        '200':
          description: Bulk status change operation completed. Check successful and failed arrays for details.
          content:
            application/json:
              examples:
                bulkStatusChangeResult:
                  value:
                    successful:
                    - workflowId: 33333333-3333-4333-8333-333333333333
                      timelineEvent:
                        id: 33333333-3333-4333-8333-333333333333
                        workflowId: 33333333-3333-4333-8333-333333333333
                        data:
                          credentialingDecisionDate: '2024-01-15'
                          nextCredentialingDate: '2027-01-15'
                          changeReason: Bulk facility status change
                        createdBy: 33333333-3333-4333-8333-333333333333
                        updatedBy: 33333333-3333-4333-8333-333333333333
                        createdAt: '2024-01-15'
                        updatedAt: '2024-01-15'
                    failed: []
                    totalCount: 1
                    successCount: 1
                    failureCount: 0
              schema:
                $ref: '#/components/schemas/BulkFacilityStatusChangeResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
      security:
      - jwt: []
