openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer Facility Credentialing Workflow API
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: FacilityCredentialingWorkflow
  description: APIs for managing facility credentialing workflows
paths:
  /facility-credentialing-workflows:
    get:
      summary: List facility credentialing workflows with filters
      description: 'Returns a paginated, tenant-scoped list of facility credentialing workflows matching the supplied filter and sort criteria. **When to use:** Use this endpoint to browse or search workflows in bulk. For a single known workflow, use `GET /facility-credentialing-workflows/{workflowId}` instead. **Pagination:** Two mutually exclusive modes are supported. Offset-based: supply `page` (0-based, default 0) and `size` (default 50). Cursor-based: supply `startAfterId` (forward) or `endAtId` (backward) using an `id` value from a previous response page — do not mix cursor and offset params in the same request. **Sorting:** If `order` is omitted, a tenant-level default sort is applied automatically. **Returns:** A paginated envelope containing the matching workflow records, a total count, and cursor fields for the next/previous page. Query params are forwarded to the DAL with the same tenant-id force/override pattern as practitioner workflow list. This endpoint does not accept skipEnrichment.'
      operationId: getFacilityCredentialingWorkflows
      tags:
      - FacilityCredentialingWorkflow
      parameters:
      - description: End at document ID, for backward cursor-based pagination
        name: endAtId
        in: query
        schema:
          type: string
      - description: "## Filter Criteria\n\nThe filter parameter must be URL encoded when sent. Filters are specified as JSON objects where each field can have\none or more filter operations.\n\n### Filterable Fields\n\n#### Core Workflow Fields\n- **id**: Workflow unique identifier (String)\n- **createdAt**: Workflow creation timestamp (Timestamp)\n- **updatedAt**: Workflow last update timestamp (Timestamp)\n\n#### Data Fields - Workflow Information\n- **data.credentialingCycle**: Credentialing cycle (String)\n- **data.facilityFileType**: Type of facility file (String)\n- **data.assignedTo**: User assigned to the workflow (String)\n- **data.assignedBy**: User who assigned the workflow (String)\n\n#### Data Fields - Status & Dates\n- **data.credentialingStatus**: Current workflow status (String)\n- **data.psvReadyDate**: PSV ready date (Timestamp)\n- **data.psvCompletedDate**: PSV completed date (Timestamp)\n- **data.credentialingStatusLastUpdatedDate**: Status last updated date (Timestamp)\n- **data.previousCredentialedDate**: Previous credentialing date (Date)\n- **data.credentialingDueDate**: Credentialing due date (Date)\n- **data.nextCredentialingDate**: Next credentialing date (Date)\n- **data.credentialingDecisionDate**: Credentialing decision date (Date)\n\n#### Data Fields - Facility Information\n- **data.facility.npi**: National Provider Identifier (String)\n- **data.facility.name**: Facility name (String)\n- **data.facility.tin**: Tax Identification Number (String)\n- **data.facility.externalId**: External identifier (String)\n- **data.facility.primaryEmail**: Primary email address (String)\n- **data.facility.facilityType**: Type of facility (String)\n- **data.facility.lineOfBusiness**: Array of lines of business (Array - eq/in only)\n- **data.facility.licensedStates**: Array of licensed states (Array - eq/in only)\n\n### Supported Filter Operations\n\n#### String Fields (eq, neq, in, nin, contains)\n- **eq**: Exact match - `{\"field\":{\"eq\":\"value\"}}`\n- **neq**: Not equal - `{\"field\":{\"neq\":\"value\"}}`\n- **in**: Match any value in array - `{\"field\":{\"in\":[\"value1\",\"value2\"]}}`\n- **nin**: Not match any value in array - `{\"field\":{\"nin\":[\"value1\",\"value2\"]}}`\n- **contains**: Substring match - `{\"field\":{\"contains\":\"partial\"}}`\n\n#### Timestamp/Date Fields (eq, neq, gt, gte, lt, lte)\n- **eq**: Exact match - `{\"field\":{\"eq\":\"2023-01-01T00:00:00Z\"}}`\n- **neq**: Not equal - `{\"field\":{\"neq\":\"2023-01-01T00:00:00Z\"}}`\n- **gt**: Greater than - `{\"field\":{\"gt\":\"2023-01-01T00:00:00Z\"}}`\n- **gte**: Greater than or equal - `{\"field\":{\"gte\":\"2023-01-01T00:00:00Z\"}}`\n- **lt**: Less than - `{\"field\":{\"lt\":\"2023-01-01T00:00:00Z\"}}`\n- **lte**: Less than or equal - `{\"field\":{\"lte\":\"2023-01-01T00:00:00Z\"}}`\n\n#### Array Fields (eq, in only)\n- **eq**: Array contains value - `{\"field\":{\"eq\":\"value\"}}`\n- **in**: Array contains any of these values - `{\"field\":{\"in\":[\"value1\",\"value2\"]}}`\n\n### Filter Examples\n\n#### Basic Filters (before URL encoding)\n```json\n// Filter by id\n{\"id\":{\"eq\":\"123\"}}\n\n// Filter by credentialing status\n{\"data.credentialingStatus\":{\"eq\":\"PSV_READY\"}}\n\n// Filter by assigned user\n{\"data.assignedTo\":{\"eq\":\"user123\"}}\n\n// Filter by facility file type\n{\"data.facilityFileType\":{\"eq\":\"INITIAL\"}}\n```\n\n#### Facility Filters\n```json\n// Search by facility name\n{\"data.facility.name\":{\"contains\":\"Hospital\"}}\n\n// Filter by NPI (exact match)\n{\"data.facility.npi\":{\"eq\":\"1234567890\"}}\n\n// Filter by TIN\n{\"data.facility.tin\":{\"eq\":\"12-3456789\"}}\n\n// Filter by email\n{\"data.facility.primaryEmail\":{\"contains\":\"@example.com\"}}\n\n// Filter by facility type\n{\"data.facility.facilityType\":{\"eq\":\"HOSPITAL\"}}\n\n// Filter by external ID\n{\"data.facility.externalId\":{\"eq\":\"EXT123\"}}\n```\n\n#### Array Field Filters\n```json\n// Filter by line of business\n{\"data.facility.lineOfBusiness\":{\"eq\":\"MEDICARE\"}}\n\n// Filter by multiple lines of business\n{\"data.facility.lineOfBusiness\":{\"in\":[\"MEDICARE\",\"MEDICAID\"]}}\n\n// Filter by licensed states\n{\"data.facility.licensedStates\":{\"in\":[\"CA\",\"NY\",\"TX\"]}}\n```\n\n#### Date/Timestamp Filters\n```json\n// Workflows created after a date\n{\"createdAt\":{\"gt\":\"2023-01-01T00:00:00Z\"}}\n\n// PSV ready within a date range\n{\"data.psvReadyDate\":{\"gte\":\"2023-01-01T00:00:00Z\",\"lte\":\"2023-12-31T23:59:59Z\"}}\n\n// Workflows updated in last 7 days\n{\"updatedAt\":{\"gte\":\"2023-01-15T00:00:00Z\"}}\n\n// Credentialing due date in range\n{\"data.credentialingDueDate\":{\"gte\":\"2023-01-01\",\"lte\":\"2023-12-31\"}}\n```\n\n#### Combined Filters\n```json\n// Multiple conditions (AND logic)\n{\n  \"data.facility.name\":{\"contains\":\"Hospital\"},\n  \"data.facility.npi\":{\"eq\":\"1234567890\"},\n  \"data.credentialingStatus\":{\"eq\":\"PSV_READY\"}\n}\n\n// Filter by status and date range\n{\n  \"data.credentialingStatus\":{\"eq\":\"CRED_APPROVED\"},\n  \"data.credentialingDecisionDate\":{\"gte\":\"2023-01-01\",\"lte\":\"2023-12-31\"}\n}\n\n// Filter by facility type and line of business\n{\n  \"data.facility.facilityType\":{\"eq\":\"HOSPITAL\"},\n  \"data.facility.lineOfBusiness\":{\"in\":[\"MEDICARE\",\"MEDICAID\"]}\n}\n```\n\n### cURL Examples\n```bash\n# Filter by id\ncurl -X GET 'http://localhost:8080/facility-credentialing-workflows?filter=%7B%22id%22%3A%7B%22eq%22%3A%22123%22%7D%7D'\n\n# Filter by facility name (case-sensitive)\ncurl -X GET 'http://localhost:8080/facility-credentialing-workflows?filter=%7B%22data.facility.name%22%3A%7B%22contains%22%3A%22Hospital%22%7D%7D'\n\n# Filter by NPI\ncurl -X GET 'http://localhost:8080/facility-credentialing-workflows?filter=%7B%22data.facility.npi%22%3A%7B%22eq%22%3A%221234567890%22%7D%7D'\n\n# Filter by licensed states\ncurl -X GET 'http://localhost:8080/facility-credentialing-workflows?filter=%7B%22data.facility.licensedStates%22%3A%7B%22in%22%3A%5B%22CA%22%2C%22NY%22%5D%7D%7D'\n\n# Filter by credentialing status\ncurl -X GET 'http://localhost:8080/facility-credentialing-workflows?filter=%7B%22data.credentialingStatus%22%3A%7B%22eq%22%3A%22PSV_READY%22%7D%7D'\n\n# Combined filter\ncurl -X GET 'http://localhost:8080/facility-credentialing-workflows?filter=%7B%22data.facility.name%22%3A%7B%22contains%22%3A%22Hospital%22%7D%2C%22data.credentialingStatus%22%3A%7B%22eq%22%3A%22PSV_READY%22%7D%7D'\n```\n\n**Note**: Always URL encode the JSON filter string before sending the request.\n"
        name: filter
        in: query
        schema:
          type: string
      - description: "## Sorting/Ordering\n\nSort results by specifying a field name and direction. The order parameter must be URL encoded when sent.\n\n### Sortable Fields\nYou can sort by any of the following fields:\n- **id**: Workflow unique identifier\n- **createdAt**: Workflow creation timestamp\n- **createdBy**: User who created the workflow (sortable only, not filterable)\n- **updatedAt**: Last update timestamp\n- **updatedBy**: User who last updated the workflow (sortable only, not filterable)\n- **data.credentialingDueDate**: Credentialing due date (index-backed)\n- **data.nextCredentialingDate**: Next credentialing date (index-backed)\n- **data**: JSON data field (lexicographic ordering)\n\n### Sort Direction\n- **ASC**: Ascending order (default)\n- **DESC**: Descending order\n\n**Note**: Sort direction is case-insensitive, but uppercase is recommended (ASC/DESC).\n\n### Sort Format\n```json\n{\n  \"orderBy\": \"fieldName\",\n  \"orderByDirection\": \"ASC|DESC\"\n}\n```\n\n### Sort Examples\n\n#### Basic Sorting (before URL encoding)\n```json\n// Sort by creation date (newest first)\n{\"orderBy\":\"createdAt\",\"orderByDirection\":\"DESC\"}\n\n// Sort by id (ascending)\n{\"orderBy\":\"id\",\"orderByDirection\":\"ASC\"}\n\n// Sort by last update (newest first)\n{\"orderBy\":\"updatedAt\",\"orderByDirection\":\"DESC\"}\n```\n\n### cURL Examples\n```bash\n# Sort by creation date (newest first)\ncurl -X GET 'http://localhost:8080/facility-credentialing-workflows?order=%7B%22orderBy%22%3A%22createdAt%22%2C%22orderByDirection%22%3A%22DESC%22%7D'\n\n# Sort by id (ascending)\ncurl -X GET 'http://localhost:8080/facility-credentialing-workflows?order=%7B%22orderBy%22%3A%22id%22%2C%22orderByDirection%22%3A%22ASC%22%7D'\n\n# Sort by last update (newest first)\ncurl -X GET 'http://localhost:8080/facility-credentialing-workflows?order=%7B%22orderBy%22%3A%22updatedAt%22%2C%22orderByDirection%22%3A%22DESC%22%7D'\n\n# Combine filter and sort\ncurl -X GET 'http://localhost:8080/facility-credentialing-workflows?filter=%7B%22data.credentialingStatus%22%3A%7B%22eq%22%3A%22PSV_READY%22%7D%7D&order=%7B%22orderBy%22%3A%22createdAt%22%2C%22orderByDirection%22%3A%22DESC%22%7D'\n\n# Combine filter, sort, and pagination\ncurl -X GET 'http://localhost:8080/facility-credentialing-workflows?filter=%7B%22data.facility.name%22%3A%7B%22contains%22%3A%22Hospital%22%7D%7D&order=%7B%22orderBy%22%3A%22updatedAt%22%2C%22orderByDirection%22%3A%22DESC%22%7D&size=20&page=0'\n```\n\n**Note**: Always URL encode the JSON order string before sending the request.\n"
        name: order
        in: query
        schema:
          type: string
      - description: Page number (0-based), for offset-based pagination
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: '0'
      - description: Page size
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: '50'
      - description: Start after document ID, for forward cursor-based pagination
        name: startAfterId
        in: query
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
        '200':
          description: Successfully retrieved facility credentialing workflows
          content:
            application/json:
              examples:
                getFacilityCredentialingWorkflowsResponse:
                  value:
                    data:
                    - id: 33333333-3333-4333-8333-333333333333
                      tenantId: 11111111-1111-4111-8111-111111111111
                      certifyFacilityId: 77777777-7777-4777-8777-777777777777
                      data:
                        credentialingCycle: INITIAL
                        facility:
                          name: Jane Example
                          npi: '1999999999'
                    totalCount: 1
              schema:
                $ref: '#/components/schemas/GetFacilityCredentialingWorkflowsResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
    post:
      summary: Create a single facility credentialing workflow
      description: Creates a new facility credentialing workflow for one facility and immediately hydrates it with facility data from upstream systems. **When to use:** Use this to onboard an individual facility into the credentialing process. For multiple facilities at once, use `POST /facility-credentialing-workflows/v2/bulk-create` (preferred) or `POST /facility-credentialing-workflows/bulk-create`. **Preconditions:** The facility identified by `certifyFacilityId` in the request body must already exist in the system. Only one active workflow per facility is allowed — if an active workflow exists, a `409 Conflict` is returned. **Returns:** `201 Created` with the full, hydrated `GetFacilityCredentialingWorkflowResponse` in the body, including facility data populated from upstream. On business-rule violations (e.g., invalid facility state), a `422 Unprocessable Entity` is returned.
      operationId: createFacilityCredentialingWorkflow
      tags:
      - FacilityCredentialingWorkflow
      parameters:
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Facility credentialing workflow request with certifyFacilityId
        content:
          application/json:
            examples:
              createFacilityWorkflow:
                value:
                  certifyFacilityId: 77777777-7777-4777-8777-777777777777
            schema:
              $ref: '#/components/schemas/CreateFacilityCredentialingWorkflowRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
        '201':
          description: Successfully created the facility credentialing workflow
          content:
            application/json:
              examples:
                createdFacilityWorkflow:
                  value:
                    id: 33333333-3333-4333-8333-333333333333
                    tenantId: 11111111-1111-4111-8111-111111111111
                    certifyFacilityId: 77777777-7777-4777-8777-777777777777
                    data:
                      credentialingCycle: INITIAL
                      facility:
                        name: Jane Example
                        npi: '1999999999'
              schema:
                $ref: '#/components/schemas/GetFacilityCredentialingWorkflowResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '409':
          description: Conflict - An active facility credentialing workflow already exists for this facility. Complete or withdraw the existing workflow before creating a new one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '422':
          description: Unprocessable Entity - Business rule violation
      security:
      - jwt: []
  /facility-credentialing-workflows/assignments:
    post:
      summary: Bulk-assign or unassign facility credentialing workflows
      description: Assigns one or more facility credentialing workflows to a set of users in a single call, distributing workflows evenly across the supplied user IDs using round-robin. **When to use:** Use to reassign a batch of workflows or to clear all assignees at once. To assign a single workflow, use `POST /facility-credentialing-workflows/{id}/assignments`. **Key behaviors:** * Existing assignees are replaced by the new assignment — this is not additive. * To unassign all workflows in the batch, pass an empty array for `assignedTo`. * Each workflow is processed independently; the response contains separate `successful` and `failed` arrays — inspect both. * * **Returns:** `200 OK` with bulk-result arrays listing which workflow IDs succeeded and which failed.
      operationId: createBulkFacilityAssignment
      tags:
      - FacilityCredentialingWorkflow
      parameters:
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              createBulkFacilityAssignment:
                value:
                  workflowIds:
                  - 22222222-2222-4222-8222-222222222222
                  assignedTo:
                  - 55555555-5555-4555-8555-555555555555
                  reason: Bulk facility assignment
                  isSelectAll: false
            schema:
              $ref: '#/components/schemas/BulkCreateFacilityAssignmentRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
        '200':
          description: Bulk assignment operation completed. Check successful and failed arrays for individual results.
          content:
            application/json:
              examples:
                createBulkFacilityAssignmentResponse:
                  value:
                    successful:
                    - workflowId: 22222222-2222-4222-8222-222222222222
                      assignment:
                        workflowId: 22222222-2222-4222-8222-222222222222
                        tenantId: 11111111-1111-4111-8111-111111111111
                        tenantFacilityId: 11111111-1111-4111-8111-111111111111
                        assignments:
                        - assignedFrom: 22222222-2222-4222-8222-222222222222
                          assignedTo: 55555555-5555-4555-8555-555555555555
                          assignedBy: 22222222-2222-4222-8222-222222222222
                          assignedOn: '2026-07-24T10:02:25.962283632Z'
                          reason: Bulk facility assignment
                        - assignedFrom: 22222222-2222-4222-8222-222222222222
                          assignedTo: 55555555-5555-4555-8555-555555555555
                          assignedBy: 22222222-2222-4222-8222-222222222222
                          assignedOn: '2026-07-24T10:02:13.671183997Z'
                          reason: Workflow update
                      error: ''
                    failed: []
                    totalProcessed: 1
                    successCount: 1
                    failureCount: 0
              schema:
                $ref: '#/components/schemas/BulkFacilityAssignmentResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
      security:
      - jwt: []
  /facility-credentialing-workflows/bulk-create:
    post:
      summary: Asynchronously create workflows for multiple facilities (v1)
      description: Accepts a list of facility identifiers and begins creating a credentialing workflow for each in the background. Processing starts immediately; the endpoint returns `202 Accepted` without waiting for completion. **When to use:** Prefer `POST /facility-credentialing-workflows/v2/bulk-create` for new integrations — v2 provides reliable processing via a queue and a trackable bulk-request record. Use v1 only for legacy compatibility. **Preconditions:** Each facility must already exist in the system. Facilities that do not exist will fail silently during background processing. **Side effects:** Each workflow is created independently with automatic facility data hydration. Failures are logged server-side but are not surfaced to the caller — there is no completion notification, callback, or polling mechanism. **Returns:** `202 Accepted` immediately. Individual results are not returned.
      operationId: createBulkFacilityCredentialingWorkflows
      tags:
      - FacilityCredentialingWorkflow
      parameters:
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              createBulkFacilityCredentialingWorkflows:
                value:
                  certifyFacilityIds:
                  - 77777777-7777-4777-8777-777777777777
                  data:
                    credentialingCycle: INITIAL
                    facility:
                      name: Jane Example
                      npi: '1999999999'
                  isSelectAll: false
            schema:
              $ref: '#/components/schemas/BulkCreateFacilityCredentialingWorkflowRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
        '202':
          description: Bulk workflow creation request accepted and processing started. The operation will complete in the background.
          content:
            application/json:
              examples:
                createBulkFacilityCredentialingWorkflowsResponse:
                  value:
                    message: Bulk facility workflow creation request accepted and processing started
              schema:
                type: object
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
      security:
      - jwt: []
  /facility-credentialing-workflows/bulk-delete:
    post:
      summary: Bulk delete facility workflows asynchronously
      description: Asynchronously deletes multiple facility credentialing workflows via a chunked Cloud Tasks fan-out. Returns 202 immediately with a jobId and accepted ID count — not per-ID outcomes. Chunk and per-ID cascade-delete callbacks complete out of band.
      operationId: bulkDeleteFacilityCredentialingWorkflows
      tags:
      - FacilityCredentialingWorkflow
      parameters:
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: List of facility credentialing workflow IDs to delete
        content:
          application/json:
            examples:
              bulkDeleteFacilityCredentialingWorkflows:
                value:
                  workflowIds:
                  - 33333333-3333-4333-8333-333333333333
            schema:
              $ref: '#/components/schemas/BulkDeleteCredentialingWorkflowsRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - failed to enqueue any chunk task
        '202':
          description: Bulk delete accepted. The body reports the jobId and how many IDs were accepted.
          content:
            application/json:
              examples:
                bulkDeleteFacilityCredentialingWorkflowsResponse:
                  value:
                    jobId: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee
                    requestedCount: 1
                    acceptedCount: 1
                    status: ACCEPTED
                    message: Bulk delete request accepted
              schema:
                $ref: '#/components/schemas/BulkDeleteCredentialingWorkflowsResponse'
        '400':
          description: Invalid request - empty workflowIds list, or more IDs than the per-request maximum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '503':
          description: Bulk delete is disabled by the server kill switch
      security:
      - jwt: []
  /facility-credentialing-workflows/cloud-create:
    post:
      summary: Internal Cloud Tasks callback — create one facility workflow
      description: 'Internal endpoint called by the v2 bulk-create Cloud Tasks queue to create a single facility credentialing workflow and record the result against the parent bulk-request item. **When to use:** This endpoint is invoked automatically by the platform''s task queue as part of `POST /v2/bulk-create` processing. It is not intended for direct API consumer use. **Authentication:** **Required body fields:** `certifyFacilityId` (string), `tenantFacilityId` (string), `credentialingWorkflowBulkRequestId` (string), `credentialingWorkflowBulkRequestItemId` (string). Optional: `data` (object) — workflow creation payload. **Returns:** `201 Created` with the created workflow on success. Returns `401` for a missing or invalid API key.'
      operationId: cloudCreateFacilityCredentialingWorkflow
      tags:
      - FacilityCredentialingWorkflow
      parameters:
      - description: Tenant ID
        name: tenant-id
        in: header
        schema:
          type: string
      - description: User ID for service-to-service calls
        name: user-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              cloudCreateFacilityCredentialingWorkflow:
                value: {}
            schema:
              $ref: '#/components/schemas/JsonNode'
        required: true
      responses:
        '201':
          description: Workflow created successfully
          content:
            application/json:
              examples:
                cloudCreateFacilityCredentialingWorkflowResponse:
                  value:
                    id: 33333333-3333-4333-8333-333333333333
                    tenantId: 11111111-1111-4111-8111-111111111111
                    certifyFacilityId: 77777777-7777-4777-8777-777777777777
                    data:
                      credentialingStatus: NOT_STARTED
                      credentialingCycle: INITIAL
                      linesOfBusiness:
                      - Medicare
        '400':
          description: Missing required fields in request body
        '401':
          description: Invalid or missing X-Credentialing-Api-Key
        '409':
          description: Active workflow already exists or duplicate active item
