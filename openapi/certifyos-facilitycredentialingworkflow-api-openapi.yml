        source:
          type: string
          description: The source of the specialty
          examples:
          - Board Certification
          pattern: \S
        createdAt:
          type: string
          description: The date the record was created
          examples:
          - '2024-01-01'
        createdBy:
          type: string
          description: The user who created the record
          examples:
          - user@example.com
        updatedAt:
          type: string
          description: The date the record was last updated
          examples:
          - '2024-01-01'
        updatedBy:
          type: string
          description: The user who last updated the record
