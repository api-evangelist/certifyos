    patch:
      summary: Verify a record in a facility credentialing workflow section
      description: 'Marks a specific record as verified by setting verifiedBy (current user) and verifiedDate (current timestamp). The recordId format is ''{section}-{index}'' (e.g., ''specialties-0'', ''licenses-1''). Note: This operation uses a read-modify-write pattern on the entire workflow document. While only verification fields are modified, concurrent updates to other parts of the document may result in lost updates.'
      operationId: verifyFacilityCredentialingWorkflowRecord
      tags:
      - FacilityCredentialingWorkflow
      parameters:
      - description: Record identifier in format '{section}-{index}' (e.g., 'specialties-0', 'licenses-1', 'accreditations-2')
        example: specialties-0
        in: path
        required: true
        name: recordId
        schema:
          type: string
          pattern: \S
      - description: Facility credentialing workflow ID
        example: fcw_1234567890
        in: path
        required: true
        name: workflowId
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Record verified successfully
          content:
            application/json:
              example:
                workflowId: fcw_1234567890
                recordId: specialties-0
                section: specialties
                index: 0
                verifiedBy: user_abc123
                verifiedDate: '2024-10-29T15:30:00Z'
                message: Record verified successfully
              schema:
                type: object
        '400':
          description: Bad request - Invalid record ID format or record not found
          content:
            application/json:
              example:
                errors:
                - 'Invalid record ID format. Expected format: {section}-{index} (e.g., ''specialties-0'')'
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Insufficient permissions
        '404':
          description: Facility credentialing workflow not found or record not found in section
        '500':
          description: Internal server error
      security:
      - jwt: []
