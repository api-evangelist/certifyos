    ReplayWebhooksRequest:
      description: Request to replay webhooks for credentialing workflows that missed webhook delivery
      type: object
      required:
      - workflowIds
      properties:
        workflowIds:
          type: array
          items:
            type: string
            pattern: \S
          description: List of credentialing workflow IDs to replay webhooks for
          examples:
          - - a2b4f213-f56e-49b7-9ffe-070ff70f0539
            - b3c5f324-f67e-49b8-0aff-181ff81f1640
          maxItems: 500
          minItems: 1
    AssignmentResult1:
      type: object
      description: Result of an individual assignment operation
      properties:
        workflowId:
          type: string
          description: ID of the facility credentialing workflow
          examples:
          - 44c8fa75-15a1-4790-a0dd-139058d1f86d
        assignment:
          description: Assignment history response if successful
          type: object
          $ref: '#/components/schemas/FacilityAssignmentHistoryResponse'
        error:
          type: string
          description: Error message if assignment failed
    UpdateFacilityCredentialingWorkflowRequest:
      description: Request to update existing facility credentialing workflow
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FacilityCredentialingWorkflow.schema'
          description: Facility credentialing workflow data
    BulkCreateFacilityCredentialingWorkflowRequest:
      description: Request to create credentialing workflows for multiple facilities
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FacilityCredentialingWorkflow.schema'
          description: Shared facility credentialing workflow data to be used for all facilities
        certifyFacilityIds:
          type: array
          items:
            type: string
          description: List of certify facility IDs to create workflows for. Required when isSelectAll is false. Ignored when isSelectAll is true (facility IDs will be fetched using the filter).
          examples:
          - - cf_123456
            - cf_789012
        filter:
          type: string
          description: 'Filter criteria as JSON string (URL encoded). Used to find facilities when isSelectAll is true. Facility IDs from matching facilities will be used to create new workflows. See GET /facilities endpoint documentation for filter format. Filterable fields include: data.npi, data.name.'
          examples:
          - '{"data.npi":{"eq":"1234567890"}}'
        isSelectAll:
          type: boolean
          description: If true, find all facilities matching the filter criteria and create workflows for those facilities, instead of using certifyFacilityIds. When true, filter parameter is required and certifyFacilityIds will be ignored.
          examples:
          - false
          default: false
  securitySchemes:
    jwt:
      type: http
      description: JWT Authentication - Provide only the raw token without Bearer prefix
      scheme: bearer
      bearerFormat: JWT
