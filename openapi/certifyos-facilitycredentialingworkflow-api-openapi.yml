      - FacilityCredentialingWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
        required: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - id
              - file
              properties:
                id:
                  type: string
                  pattern: \S
                file:
                  type: string
                  format: binary
                expirationDate:
                  type: string
        required: true
      responses:
        '201':
          description: Attachment uploaded successfully
          content:
            application/json:
              examples:
                uploadFacilityCredentialingWorkflowAttachmentResponse:
                  value:
                    message: Attachment uploaded successfully
