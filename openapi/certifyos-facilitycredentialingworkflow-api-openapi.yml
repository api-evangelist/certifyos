    post:
      summary: Replay missed webhooks for facility workflows
      description: Triggers a background re-delivery of webhooks that were not received or processed for the specified facility credentialing workflows. **When to use:** Use when a downstream system missed webhook events for one or more facility workflows — for example, after a consumer outage. Supply the target `workflowIds` in the request body; the replay runs asynchronously. **Side effects:** Webhook events are re-emitted in the background. There is no completion notification — the caller cannot determine when replay has finished. **Returns:** `202 Accepted` once the replay job is enqueued. Returns `400` if the request body is malformed.
      operationId: replayFacilityWebhooks
