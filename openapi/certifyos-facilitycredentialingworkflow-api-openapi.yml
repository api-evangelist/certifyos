    FacilityCredentialingWorkflowResponse.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.certifyos.com/api-contracts/response/FacilityCredentialingWorkflowResponse.schema.json
      title: FacilityCredentialingWorkflowResponse
      description: 'Defines the structure for facility credentialing workflow response data, extending the base schema with system-computed fields.


        Computed fields are automatically derived by the system and returned as read-only values. They should not be included when creating or updating records.'
      allOf:
      - $ref: '#/components/schemas/FacilityCredentialingWorkflow.schema'
      - type: object
        properties:
          credentialingStatus:
            type: string
            description: Current status of the facility credentialing workflow.
            enum:
            - NOT_STARTED
            - IN_PROGRESS
            - OUTREACH_IN_PROGRESS
            - DATA_MISSING
            - PSV_READY
            - PSV_COMPLETED
            - SENT_TO_COMMITTEE
            - TABLED
            - WITHDRAWN_CANCELLED
            - CRED_DENIED
            - CRED_APPROVED
            example: IN_PROGRESS
            readOnly: true
          credentialingDecisionDate:
            type:
            - string
            - 'null'
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Date when the facility credentialing decision was made.
            example: '2024-06-15'
            readOnly: true
          nextCredentialingDate:
            type:
            - string
            - 'null'
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Next scheduled facility credentialing date.
            example: '2025-06-15'
            readOnly: true
          psvReadyDate:
            type:
            - string
            - 'null'
            format: date-time
            description: Date when facility PSV (Primary Source Verification) was marked as ready.
            example: '2024-05-01T14:20:00Z'
            readOnly: true
          psvCompletedDate:
            type:
            - string
            - 'null'
            format: date-time
            description: Date when facility PSV (Primary Source Verification) was completed.
            example: '2024-06-01T16:45:00Z'
            readOnly: true
          credentialingStatusLastUpdatedDate:
            type:
            - string
            - 'null'
            format: date-time
            description: Date when facility credentialing status was last updated.
            example: '2024-01-15T10:30:00Z'
            readOnly: true
