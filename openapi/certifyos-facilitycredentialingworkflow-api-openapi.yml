  /facility-credentialing-workflows/v2/bulk-create:
    post:
      summary: Queue bulk facility workflow creation with progress tracking (v2)
      description: Accepts a bulk workflow creation request, creates a trackable bulk-request record, and enqueues one creation task per facility for reliable background processing. Returns immediately with `202 Accepted`. **When to use:** Prefer this over `POST /bulk-create` (v1) for new integrations. v2 records a bulk-request entry that can be used to track per-facility progress. For a single facility, use `POST /facility-credentialing-workflows`. **Preconditions:** Each facility must already exist in the system. **Side effects:** Individual creation tasks are dispatched to a background queue. Each task calls the `POST /cloud-create` internal callback. Processing is asynchronous — the caller receives `202 Accepted` before any workflow is created. **Returns:** `202 Accepted`.
