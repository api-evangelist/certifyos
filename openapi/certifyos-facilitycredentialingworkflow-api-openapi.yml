components:
  schemas:
    LocalDate:
      type: string
      format: date
      examples:
      - '2022-03-10'
    FacilityAssignmentHistoryResponse:
      type: object
      description: Response containing assignment history for a facility credentialing workflow
      properties:
        workflowId:
          type: string
          description: Unique identifier for the facility credentialing workflow
          examples:
          - '1234'
        tenantId:
          type: string
          description: ID of the tenant
          examples:
          - tenant_123456
        tenantFacilityId:
          type: string
          description: ID of the tenant facility
          examples:
          - tf_123456
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentEntry1'
          description: Assignment history entries, with latest at index 0
    GetFacilityCredentialingWorkflowResponse:
      description: Response containing a single facility credentialing workflow
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the facility credentialing workflow
          examples:
          - '1234'
        tenantId:
          type: string
          description: ID of the tenant
          examples:
          - tenant_123456
        certifyFacilityId:
          type: string
          description: Certify facility ID
          examples:
          - cf_123456
        tenantFacilityId:
          type: string
          description: ID of the tenant facility
          examples:
          - tf_123456
        data:
          $ref: '#/components/schemas/FacilityCredentialingWorkflowResponse.schema'
          description: Facility credentialing workflow data including facility information and computed fields
        createdBy:
          type: string
          description: ID of the user who created the facility credentialing workflow
          examples:
          - user_123456
        updatedBy:
          type: string
          description: ID of the user who updated the facility credentialing workflow
          examples:
          - user_123456
        createdAt:
          description: Timestamp of the facility credentialing workflow creation
          type: string
          examples:
          - '2021-01-01T00:00:00Z'
          $ref: '#/components/schemas/Instant'
        updatedAt:
          description: Timestamp of the facility credentialing workflow update
          type: string
          examples:
          - '2021-01-01T00:00:00Z'
          $ref: '#/components/schemas/Instant'
    Instant:
      type: string
      format: date-time
      examples:
      - '2022-03-10T16:15:50Z'
    FacilitySpecialtyUpdateRequest:
      description: Facility specialty data for PUT operations that replace the entire specialties array
      type: object
      required:
      - type
