                      section: licenses
                      fileName: openapi-fac-harvest.pdf
                      index: 0
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '500':
          description: Internal server error
      security:
      - jwt: []
    delete:
      summary: Delete an attachment from a facility workflow record
      description: Deletes an attachment record from the specified facility credentialing workflow. **When to use:** Use to remove a file attachment that was uploaded in error or is no longer relevant. **Request body:** Supply the attachment `id` and `fileUrl` to identify which attachment to delete. **Idempotency:** **Returns:** `200 OK` with the updated attachment state.
