openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer User API
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: User
  description: Endpoints for managing users.
paths:
  /users:
    get:
      summary: Get All Users
      description: Returns all users for the current tenant with optional filtering and pagination. If includeRoles is true, the response includes roles for each user. If includeRoles is false or not provided, only user objects are returned without roles.
      operationId: getAllUsers
      tags:
      - User
      parameters:
      - description: End at ID for pagination
        name: endAtId
        in: query
        schema:
          type: string
      - description: Filter string for querying users
        name: filter
        in: query
        schema:
          type: string
      - description: If true, includes roles for each user in the response. When true, the response returns a roles field for each user. When false or not provided, the response returns only user objects without roles.
        example: true
        name: includeRoles
        in: query
        schema:
          type: boolean
      - description: Page number for pagination
        name: page
        in: query
        schema:
          type: integer
          format: int32
      - description: Search string to find users by first name, last name, or email. If provided, returns users matching the search criteria.
        example: john
        name: searchUser
        in: query
        schema:
          type: string
      - description: Page size for pagination
        name: size
        in: query
        schema:
          type: integer
          format: int32
      - description: Start after ID for pagination
        name: startAfterId
        in: query
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Users retrieved successfully. When includeRoles is true, returns UserListResponseWithRolesDto containing users with their roles. When includeRoles is false or not provided, returns UserListResponseDto containing only user objects without roles.
          content:
            application/json:
              examples:
                withoutRoles:
                  summary: includeRoles omitted or false
                  value:
                    data:
                    - id: 5f9d7a3e-2b1c-4e8a-9f6d-1a2b3c4d5e6f
                      email: jane.doe@example.com
                      firstName: Jane
                      lastName: Doe
                      tenantId: tenant-123-mock
                      createdAt: '2026-01-15T09:30:00Z'
                      updatedAt: '2026-02-20T14:05:00Z'
                      createdBy: admin-user-001
                      updatedBy: admin-user-001
                      roles: []
                    totalCount: 42
                    links:
                      self: /users?page=0&size=50
                      next: /users?page=1&size=50
                withRoles:
                  summary: includeRoles=true
                  value:
                    data:
                    - id: 5f9d7a3e-2b1c-4e8a-9f6d-1a2b3c4d5e6f
                      email: jane.doe@example.com
                      firstName: Jane
                      lastName: Doe
                      tenantId: tenant-123-mock
                      createdAt: '2026-01-15T09:30:00Z'
                      updatedAt: '2026-02-20T14:05:00Z'
                      createdBy: admin-user-001
                      updatedBy: admin-user-001
                      roles:
                      - id: role_a1b2c3d4
                        name: Analyst
                        description: Standard analyst role
                        tenantId: tenant-123-mock
                        createdAt: '2026-01-10T08:00:00Z'
                        createdBy: admin-user-001
                        updatedAt: '2026-01-10T08:00:00Z'
                        updatedBy: admin-user-001
                    totalCount: 42
                    links:
                      self: /users?page=0&size=50&includeRoles=true
                      next: /users?page=1&size=50&includeRoles=true
              schema:
                oneOf:
                - $ref: '#/components/schemas/UserListResponseDto'
                - $ref: '#/components/schemas/UserListResponseWithRolesDto'
                description: Response varies based on includeRoles parameter. When includeRoles is false or not provided, returns UserListResponseDto. When includeRoles is true, returns UserListResponseWithRolesDto.
        '400':
          description: Bad request - Invalid request parameters or missing required headers
        '401':
          description: Authentication required - Valid authentication token is missing or invalid
        '403':
          description: Forbidden - User does not have the required permissions to read users
        '500':
          description: Internal server error - An unexpected error occurred while processing the request
      security:
      - jwt: []
    post:
      summary: Create User
      description: Creates a new user in both Auth0 and DAL with validation
      operationId: createUser
      tags:
      - User
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Details of the user to create
        content:
          application/json:
            examples:
              createUser:
                value:
                  email: jane.doe@example.com
                  password: S3curePass!23
                  firstName: Jane
                  lastName: Doe
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              examples:
                userCreated:
                  value:
                    id: 5f9d7a3e-2b1c-4e8a-9f6d-1a2b3c4d5e6f
                    auth0UserId: auth0|64f1a2b3c4d5e6f7a8b9c0d1
                    email: jane.doe@example.com
                    firstName: Jane
                    lastName: Doe
                    status: active
              schema:
                $ref: '#/components/schemas/UserCreationResponse'
        '400':
          description: Bad request - Invalid request data or missing required fields
        '401':
          description: Authentication required - Valid authentication token is missing or invalid
        '403':
          description: Forbidden - User does not have the required permissions to create users
        '409':
          description: Conflict - A user with the specified email address already exists
        '500':
          description: Internal server error - An unexpected error occurred while processing the request
      security:
      - jwt: []
  /users/analysts:
    get:
      summary: Get Analyst Users
      description: Returns all analyst users for the current tenant
      operationId: getAnalysts
      tags:
      - User
      parameters:
      - description: If true, includes only users who can be assigned to practitioner workflows
        example: true
        name: includeAssignable
        in: query
        schema:
          type: boolean
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Analyst users retrieved successfully
          content:
            application/json:
              examples:
                analysts:
                  value:
                    data:
                    - id: 5f9d7a3e-2b1c-4e8a-9f6d-1a2b3c4d5e6f
                      email: analyst.one@example.com
                      firstName: Alex
                      lastName: Analyst
                      tenantId: tenant-123-mock
                      createdAt: '2026-01-15'
                      updatedAt: '2026-02-20'
                      createdBy: admin-user-001
                      updatedBy: admin-user-001
                      roles:
                      - id: role_a1b2c3d4
                        name: Analyst
                        description: Standard analyst role
                        tenantId: tenant-123-mock
                        isInternal: false
                        createdAt: '2026-01-10'
                        createdBy: admin-user-001
                        updatedAt: '2026-01-10'
                        updatedBy: admin-user-001
              schema:
                type: object
                description: Wraps the DAL UserResponse list returned by UserApi#getAnalysts.
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
        '400':
          description: Missing tenant-id header
          content:
            application/json: {}
        '401':
          description: Authentication required
          content:
            application/json: {}
        '500':
          description: Internal server error
          content:
            application/json: {}
      security:
      - jwt: []
  /users/facility-analysts:
    get:
      summary: Get Facility Analyst Users
      description: Returns all facility analyst users for the current tenant
      operationId: getFacilityAnalysts
      tags:
      - User
      parameters:
      - description: If true, includes only users who can be assigned to facility workflows
        example: true
        name: includeAssignable
        in: query
        schema:
          type: boolean
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Facility analyst users retrieved successfully
          content:
            application/json:
              examples:
                facilityAnalysts:
                  value:
                    data:
                    - id: 7a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                      email: facility.analyst@example.com
                      firstName: Blair
                      lastName: Reviewer
                      tenantId: tenant-123-mock
                      createdAt: '2026-01-15'
                      updatedAt: '2026-02-20'
                      createdBy: admin-user-001
                      updatedBy: admin-user-001
                      roles:
                      - id: role_b2c3d4e5
                        name: FacilityAnalyst
                        description: Facility review analyst role
                        tenantId: tenant-123-mock
                        isInternal: false
                        createdAt: '2026-01-10'
                        createdBy: admin-user-001
                        updatedAt: '2026-01-10'
                        updatedBy: admin-user-001
              schema:
                type: object
                description: Wraps the DAL UserResponse list returned by UserApi#getFacilityAnalysts.
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
        '400':
          description: Missing tenant-id header
          content:
            application/json: {}
        '401':
          description: Authentication required
          content:
            application/json: {}
        '500':
          description: Internal server error
          content:
            application/json: {}
      security:
      - jwt: []
  /users/invite:
    post:
      summary: Invite User
      description: Invites a user to the organization.
      operationId: inviteUser
      tags:
      - User
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Details of the user to invite
        content:
          application/json:
            examples:
              inviteUser:
                value:
                  email: jane.doe@example.com
                  firstName: Jane
                  lastName: Doe
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
        required: true
      responses:
        '200':
          description: User invited successfully
          content:
            application/json:
              schema:
                type: object
                examples:
                - userId: user_123456
                description: user id of the invited user
                properties:
                  userId:
                    type: string
                    description: user id of the invited user
        '400':
          description: Bad Request - Malformed request body
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Insufficient permissions
      security:
      - jwt: []
  /users/me:
    get:
      summary: Get User Profile
      description: Returns user profile and permissions
      operationId: getCurrentUser
      tags:
      - User
      parameters:
      - description: use "default" as tenant-id
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              examples:
                userProfile:
                  value:
                    id: 5f9d7a3e-2b1c-4e8a-9f6d-1a2b3c4d5e6f
                    email: jane.doe@example.com
                    firstName: Jane
                    lastName: Doe
                    tenants:
                    - id: tenant-123-mock
                      name: Acme Health
                    - id: tenant-456-mock
                      name: Springfield Clinic
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Authentication required - Valid authentication token is missing or invalid
        '403':
          description: Forbidden - User does not have the required permissions to access their profile
      security:
      - jwt: []
  /users/me/permissions:
    get:
      summary: Get Current User Permissions
      description: 'Returns the current authenticated user''s permissions organized by tenant and resource. Response format: {"tenant-id": {"resource-name": ["action1", "action2"]}}'
      operationId: getCurrentUserPermissions
      tags:
      - User
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: User permissions retrieved successfully. Returns a map where keys are tenant IDs and values are resource permission maps.
          content:
            application/json:
              example:
                tenant-123-mock:
                  roster:
                  - read
                  - create
                  - update
                  role:
                  - read
              schema:
                type: object
                description: "Map of tenant IDs to resource permission maps.\n\nExample shape:\n```json\n{\n  \"tenant-123-mock\": {\n    \"roster\": [\"read\", \"create\", \"update\"],\n    \"role\": [\"read\"],\n    ...\n  },\n  \"tenant-456-mock\": {\n    ...\n  },\n  ...\n}\n```\n"
        '401':
          description: Authentication required - Valid authentication token is missing or invalid
        '403':
          description: Forbidden - User does not have the required permissions to view permissions
        '500':
          description: Internal server error - An unexpected error occurred while processing the request
      security:
      - jwt: []
  /users/{userId}:
    put:
      summary: Replace User
      description: Replaces a user's details (full update - email address cannot be changed)
      operationId: replaceUser
      tags:
      - User
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Full set of updatable user fields
        content:
          application/json:
            examples:
              replaceUser:
                value:
                  firstName: Jane
                  lastName: Doe-Smith
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        '200':
          description: User replaced successfully
          content:
            application/json:
              examples:
                userReplaced:
                  value:
                    id: 5f9d7a3e-2b1c-4e8a-9f6d-1a2b3c4d5e6f
                    email: jane.doe@example.com
                    firstName: Jane
                    lastName: Doe-Smith
                    tenantId: tenant-123-mock
                    createdAt: '2026-01-15T09:30:00Z'
                    updatedAt: '2026-07-21T11:15:00Z'
                    createdBy: admin-user-001
                    updatedBy: admin-user-002
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: Bad request - Invalid request parameters or missing required headers
        '401':
          description: Authentication required - Valid authentication token is missing or invalid
        '403':
          description: Forbidden - User does not have the required permissions to update users
        '404':
          description: User not found - The specified user ID does not exist
        '500':
          description: Internal server error - An unexpected error occurred while processing the request
      security:
      - jwt: []
    patch:
      summary: Patch User
      description: Partially updates a user's details (email address cannot be changed)
      operationId: patchUser
      tags:
      - User
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Subset of user fields to update; omitted fields are left unchanged
        content:
          application/json:
            examples:
              patchUser:
                value:
                  firstName: Jane
                  lastName: Doe-Smith
            schema:
              $ref: '#/components/schemas/PartialUpdateUserRequest'
        required: true
      responses:
        '200':
          description: User patched successfully
          content:
            application/json:
              examples:
                userPatched:
                  value:
                    id: 5f9d7a3e-2b1c-4e8a-9f6d-1a2b3c4d5e6f
                    email: jane.doe@example.com
                    firstName: Jane
                    lastName: Doe-Smith
                    tenantId: tenant-123-mock
                    createdAt: '2026-01-15T09:30:00Z'
                    updatedAt: '2026-07-21T11:20:00Z'
                    createdBy: admin-user-001
                    updatedBy: admin-user-002
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: Bad request - Invalid request parameters or missing required headers
        '401':
          description: Authentication required - Valid authentication token is missing or invalid
        '403':
          description: Forbidden - User does not have the required permissions to update users
        '404':
          description: User not found - The specified user ID does not exist
        '500':
          description: Internal server error - An unexpected error occurred while processing the request
      security:
      - jwt: []
    get:
      summary: Get User by ID
      description: Returns a specific user by their ID
      operationId: getUserById
      tags:
      - User
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              examples:
                user:
                  value:
                    id: 5f9d7a3e-2b1c-4e8a-9f6d-1a2b3c4d5e6f
                    email: jane.doe@example.com
                    firstName: Jane
                    lastName: Doe
                    tenantId: tenant-123-mock
                    createdAt: '2026-01-15T09:30:00Z'
                    updatedAt: '2026-02-20T14:05:00Z'
                    createdBy: admin-user-001
                    updatedBy: admin-user-001
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: Bad request - Invalid request parameters or missing required headers
        '401':
          description: Authentication required - Valid authentication token is missing or invalid
        '403':
          description: Forbidden - User does not have the required permissions to read users
        '404':
          description: User not found - The specified user ID does not exist
        '500':
          description: Internal server error - An unexpected error occurred while processing the request
      security:
      - jwt: []
    delete:
      summary: Delete User
      description: Deletes a user from both Auth0 and DAL
      operationId: deleteUser
      tags:
      - User
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              examples:
                userDeleted:
                  value:
                    message: User deleted successfully
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request - Invalid request parameters or missing required headers
        '401':
          description: Authentication required - Valid authentication token is missing or invalid
        '403':
          description: Forbidden - User does not have the required permissions to delete users
        '404':
          description: User not found - The specified user ID does not exist
        '500':
          description: Internal server error - An unexpected error occurred while processing the request
      security:
      - jwt: []
  /users/{userId}/permissions:
    get:
      summary: Get User Permissions
      description: Returns permissions for a specific user
      operationId: getUserPermissionsById
      tags:
      - User
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: User permissions retrieved successfully
          content:
            application/json:
              example:
                roster:
                - read
                - create
                - update
                role:
                - read
              schema:
                type: object
                description: "Returns a list of resources with their permissions.\n\nExample shape:\n```json\n{\n    \"roster\": [\"read\", \"create\", \"update\"],\n    \"role\": [\"read\"],\n    ...\n}\n```\n"
        '400':
          description: Bad request - Invalid request parameters or missing required headers
        '401':
          description: Authentication required - Valid authentication token is missing or invalid
        '403':
          description: Forbidden - User does not have the required permissions to read user permissions
        '500':
          description: Internal server error - An unexpected error occurred while processing the request
      security:
      - jwt: []
  /users/{userId}/roles:
    get:
      summary: Get User Roles
      description: Returns roles for a specific user
      operationId: getUserRolesById
      tags:
      - User
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: User roles retrieved successfully
          content:
            application/json:
              examples:
                userRoles:
                  value:
                    data:
                    - id: ur_7c3e9a1b2d4f
                      userId: 5f9d7a3e-2b1c-4e8a-9f6d-1a2b3c4d5e6f
                      tenantId: tenant-123-mock
                      roleId: role_a1b2c3d4
                      createdAt: '2026-01-15T09:30:00Z'
                      createdBy: admin-user-001
                    totalCount: 1
                    links:
                      self: /users/5f9d7a3e-2b1c-4e8a-9f6d-1a2b3c4d5e6f/roles?page=0&size=50
              schema:
                $ref: '#/components/schemas/UserRolesResponseDto'
        '400':
          description: Bad request - Invalid request parameters or missing required headers
        '401':
          description: Authentication required - Valid authentication token is missing or invalid
        '403':
          description: Forbidden - User does not have the required permissions to read user roles
        '500':
          description: Internal server error - An unexpected error occurred while processing the request
      security:
      - jwt: []
  /users/{userId}/roles/bulk:
    patch:
      summary: Bulk Update User Roles
      description: Adds and/or removes roles for a single user in one operation. Remove operations are processed before add operations.
      operationId: bulkUpdateUserRoles
      tags:
      - User
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Role IDs to add and/or remove for the user
        content:
          application/json:
            examples:
              bulkRoleUpdate:
                value:
                  add:
                  - role_a1b2c3d4
                  - role_e5f6a7b8
                  remove:
                  - role_c9d0e1f2
            schema:
              $ref: '#/components/schemas/UserRoleBulkUpdateRequest'
        required: true
      responses:
        '200':
          description: User roles updated successfully
          content:
            application/json:
              examples:
                bulkRoleUpdated:
                  value:
                    message: User roles updated successfully
              schema:
                $ref: '#/components/schemas/BulkRoleUpdateResponse'
        '400':
          description: Bad Request
          content:
            application/json: {}
        '500':
          description: Internal Server Error
          content:
            application/json: {}
      security:
      - jwt: []
  /users/{userId}/roles/{roleId}:
    delete:
      summary: Remove Role from User
      description: Remove a specific role from a user
      operationId: removeRoleFromUser
      tags:
      - User
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Role removed successfully
          content:
            application/json:
              examples:
                roleRemoved:
                  value:
                    message: Role removed successfully
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request - Invalid request parameters or missing required headers
        '401':
          description: Authentication required - Valid authentication token is missing or invalid
        '403':
          description: Forbidden - User does not have the required permissions to remove roles from users
        '500':
          description: Internal server error - An unexpected error occurred while processing the request
      security:
      - jwt: []
    post:
      summary: Update User Roles (Deprecated)
      description: Add or remove roles for a specific user. Use PUT /users/{userId}/roles/{roleId} to assign a role or DELETE /users/{userId}/roles/{roleId} to remove a role
      operationId: updateUserRoles
      tags:
      - User
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: User roles updated successfully
          content:
            application/json:
              examples:
                roleAssigned:
                  value:
                    message: User roles updated successfully
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request - Invalid request parameters or missing required headers
        '401':
          description: Authentication required - Valid authentication token is missing or invalid
        '403':
          description: Forbidden - User does not have the required permissions to update user roles
        '500':
          description: Internal server error - An unexpected error occurred while processing the request
      security:
      - jwt: []
components:
  schemas:
    CreateUserRequest:
      type: object
      required:
      - email
      - password
      - firstName
      - lastName
      description: Request body for creating a new user
      properties:
        email:
          type: string
          examples:
          - user@example.com
          pattern: \S
          description: User email address
        password:
          type: string
          minLength: 8
          examples:
          - password123
          pattern: \S
          description: User password
        firstName:
          type: string
          examples:
          - John
          maxLength: 100
          pattern: \S
          description: User first name
        lastName:
          type: string
          examples:
          - Doe
          maxLength: 100
          pattern: \S
          description: User last name
    BulkRoleUpdateResponse:
      type: object
      description: Response for bulk role update operation
      properties:
        message:
          type: string
          description: Success message
    OffsetDateTime:
      type: string
      format: date-time
      examples:
      - '2022-03-10T12:15:50-04:00'
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
    UserProfileResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/Tenant1'
    PartialUpdateUserRequest:
      type: object
      description: Request body for partially updating user details (email is not updatable)
      properties:
        firstName:
          type: string
          examples:
          - John
          maxLength: 100
          description: User first name
        lastName:
          type: string
          examples:
          - Doe
          maxLength: 100
          description: User last name
    RoleResponse1:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tenantId:
          type: string
        isInternal:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Date'
        createdBy:
          type: string
        updatedAt:
          $ref: '#/components/schemas/Date'
        updatedBy:
          type: string
    UserRolesResponseDto:
      type: object
      description: User roles response containing list of roles
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RoleDetails1'
          description: List of roles assigned to the user
        totalCount:
          type: integer
          format: int64
          description: Total number of roles assigned to the user
        links:
          $ref: '#/components/schemas/PageLinks'
          type: object
          description: Pagination links
    PageLinks:
      type: object
      description: HATEOAS-style pagination links.
      properties:
        self:
          type: string
          description: Link to the current page.
        next:
          type: string
          description: Link to the next page; null on the last page.
        prev:
          type: string
          description: Link to the previous page; null on the first page.
    RoleDetails1:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        tenantId:
          type: string
        roleId:
          type: string
        createdAt:
          $ref: '#/components/schemas/OffsetDateTime'
        createdBy:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        tenantId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Date'
        createdBy:
          type: string
        updatedAt:
          $ref: '#/components/schemas/Date'
        updatedBy:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleResponse1'
    Date:
      type: string
      format: date
    UserListResponseDto:
      type: object
      description: Paginated list of users
      title: UserListResponseDto
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResponseDto'
          description: List of users
        totalCount:
          type: integer
          format: int64
          description: Total number of users
        links:
          $ref: '#/components/schemas/PageLinks'
          type: object
          description: Pagination links
    UserRoleBulkUpdateRequest:
      type: object
      properties:
        add:
          type: array
          items:
            type: string
        remove:
          type: array
          items:
            type: string
    Tenant1:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    UserListResponseWithRolesDto:
      type: object
      description: Paginated list of users with roles
      title: UserListResponseWithRolesDto
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResponseWithRolesDto'
          description: List of users with roles
        totalCount:
          type: integer
          format: int64
          description: Total number of users
        links:
          $ref: '#/components/schemas/PageLinks'
          type: object
          description: Pagination links
    InviteUserRequest:
      type: object
      required:
      - email
      - firstName
      - lastName
      description: Request body for inviting a new user
      properties:
        email:
          type: string
          examples:
          - user@example.com
          pattern: \S
          description: User email address
        firstName:
          type: string
          examples:
          - John
          maxLength: 100
          pattern: \S
          description: User first name
        lastName:
          type: string
          examples:
          - Doe
          maxLength: 100
          pattern: \S
          description: User last name
    UpdateUserRequest:
      type: object
      required:
      - firstName
      - lastName
      description: Request body for updating user details (full update - email is not updatable)
      properties:
        firstName:
          type: string
          examples:
          - John
          maxLength: 100
          pattern: \S
          description: User first name
        lastName:
          type: string
          examples:
          - Doe
          maxLength: 100
          pattern: \S
          description: User last name
    UserResponseWithRolesDto:
      type: object
      description: User response with roles included
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        tenantId:
          type: string
        createdAt:
          $ref: '#/components/schemas/OffsetDateTime'
        updatedAt:
          $ref: '#/components/schemas/OffsetDateTime'
        createdBy:
          type: string
        updatedBy:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleDetails'
          description: List of roles assigned to the user
    UserResponseDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        tenantId:
          type: string
        createdAt:
          $ref: '#/components/schemas/OffsetDateTime'
        updatedAt:
          $ref: '#/components/schemas/OffsetDateTime'
        createdBy:
          type: string
        updatedBy:
          type: string
    UserCreationResponse:
      type: object
      properties:
        id:
          type: string
        auth0UserId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
    RoleDetails:
      type: object
      description: Role details with full role information
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tenantId:
          type: string
        createdAt:
          $ref: '#/components/schemas/OffsetDateTime'
        createdBy:
          type: string
        updatedAt:
          $ref: '#/components/schemas/OffsetDateTime'
        updatedBy:
          type: string
  securitySchemes:
    jwt:
      type: http
      description: JWT Authentication - Provide only the raw token without Bearer prefix
      scheme: bearer
      bearerFormat: JWT
