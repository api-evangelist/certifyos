    BulkEventEmailRequest:
      type: object
      required:
      - eventType
      - workflowIds
      description: Request to send event-agnostic notification emails for multiple credentialing workflows
      properties:
        eventType:
          type: string
          examples:
          - CRED_APPROVED
          pattern: \S
          description: Event type to send, e.g. CRED_APPROVED, IN_PROGRESS. Must be a value accepted by EventEmailConstants.shouldSendEventEmail.
        workflowIds:
          type: array
          maxItems: 500
          minItems: 1
          examples:
          - - a2b4f213-f56e-49b7-9ffe-070ff70f0539
            - b3c5f324-f67e-49b8-0aff-181ff81f1640
          items:
            type: string
            pattern: \S
          description: List of credentialing workflow IDs to send to. At most 500 entries; duplicates are removed (first occurrence wins), so a repeated id is sent to only once.
        templateDataOverrides:
          type: object
          examples:
          - first_name: Jane
          additionalProperties:
            type: string
          description: 'Optional per-send template-variable overrides (CP-37783). Merged over the computed template-data map AFTER it is built from the workflow/tenant config — a key here wins on conflict. Keys are used exactly as given (no snake/camel twinning). Does NOT bypass the tenant enabled/recipient checks: a disabled event type or a workflow with no recipient still skips-as-success.'
        subjectOverride:
          type: string
          examples:
          - Your credentialing status has been updated
          description: Optional override for the email subject (CP-37783), used INSTEAD of the tenant-configured subject when non-blank. Does NOT bypass the tenant enabled/recipient checks.
        bodyHtmlOverride:
          type: string
          examples:
          - <p>Hi {{first_name}}, your status is now Cred Approved.</p>
          description: Optional override for the email body HTML (CP-37783), used INSTEAD of the tenant-configured body when non-blank. Placeholder substitution (e.g. {{first_name}}) still runs against this override using the (possibly overridden) template-data map. Does NOT bypass the tenant enabled/recipient checks.
