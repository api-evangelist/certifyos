  /credentialing-workflows/{workflowId}/records/{recordId}/verify:
    patch:
      summary: Mark a workflow section record as verified
      description: Marks the record identified by `recordId` as verified, recording the current user as `verifiedBy` and setting `verifiedDate` to the current timestamp. The `recordId` format is `{section}-{index}` (e.g. `dea-0`, `licenses-1`). This is an atomic partial update — only the verification fields are modified; all other record data is unchanged. Use this after manually confirming a practitioner credential. Returns 200 with the updated record on success.
      operationId: verifyCredentialingWorkflowRecord
      tags:
      - CredentialingWorkflow
      parameters:
      - description: Record identifier in format '{section}-{index}' (e.g., 'dea-0', 'licenses-1', 'boardCertifications-2')
        example: dea-0
        in: path
        required: true
        name: recordId
        schema:
          type: string
          pattern: \S
      - description: Credentialing workflow ID
        example: cw_1234567890
        in: path
        required: true
        name: workflowId
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Record verified successfully
          content:
            application/json:
              examples:
                verifyCredentialingWorkflowRecordResponse:
                  value:
                    workflowId: 22222222-2222-4222-8222-222222222222
                    recordId: licenses-0
                    section: licenses
                    index: 0
                    verifiedBy: 22222222-2222-4222-8222-222222222222
                    verifiedDate: '2025-01-15T00:00:00.000Z'
                    message: Record verified successfully
              example:
                workflowId: cw_1234567890
                recordId: dea-0
                section: dea
                index: 0
                verifiedBy: user_abc123
                verifiedDate: '2024-10-29T15:30:00Z'
                message: Record verified successfully
              schema:
                type: object
        '400':
          description: Bad request - Invalid record ID format or record not found
          content:
            application/json:
              example:
                errors:
                - 'Invalid record ID format. Expected format: {section}-{index} (e.g., ''dea-0'')'
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Insufficient permissions
        '404':
          description: Credentialing workflow not found or record not found in section
        '409':
          description: Conflict — a concurrent writer modified this section and the retry budget was exhausted. Safe to retry the request. The error's "reason" field is WORKFLOW_CONFLICT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
      security:
      - jwt: []
