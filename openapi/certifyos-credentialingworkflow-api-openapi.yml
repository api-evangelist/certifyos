        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Successfully deleted the latest timeline event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEventResponse'
        '400':
          description: Invalid request - cannot delete CRED_APPROVED or CRED_DENIED events
          content:
            application/json: {}
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
