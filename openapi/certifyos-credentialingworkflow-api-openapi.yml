      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Record identifiers to delete, in '{section}-{index}' format
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteSupportingDocumentsRequest'
