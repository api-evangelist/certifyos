  /credentialing-workflows/{workflowId}/timeline-events/latest:
    delete:
      summary: Undo the most recent timeline event on a workflow
      description: 'Deletes the most recent timeline event (by creation date) for the credentialing workflow identified by `workflowId` and returns the deleted event object. Use this to reverse an incorrectly applied status transition. Only works on the latest workflow version for a practitioner. Cannot delete events of type `CRED_APPROVED` or `CRED_DENIED` because their side effects (e.g. downstream notifications) cannot be reversed. Note: there is a small race window — if another timeline event is created concurrently between the fetch and the delete, the previously-latest event will be deleted instead of the one you intended.'
      operationId: deleteLatestTimelineEvent
      tags:
      - CredentialingWorkflow
      parameters:
      - description: ID of the credentialing workflow
        in: path
        required: true
