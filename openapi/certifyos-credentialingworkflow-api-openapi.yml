          type: integer
          format: int32
          description: Count of favorable disclosure answers (only for Disclosure Questions verification type)
        unfavorableAnswerCounts:
          type: integer
          format: int32
          description: Count of unfavorable disclosure answers (only for Disclosure Questions verification type)
        deceasedCheckDetails:
          $ref: '#/components/schemas/DeceasedCheckDetails'
          type: object
          description: DMF check details for pop-up (only for Deceased Check verification type)
        formType:
          type: string
          enum:
          - application
          - application_release
          - state_release
          - state_authorization
          - disclosure
          - attestation
          - claims_history
          - acknowledgement
          examples:
          - state_release
          pattern: ^(application|application_release|state_release|state_authorization|disclosure|attestation|claims_history|acknowledgement)$
          description: 'The category of form this verification is for; `state` carries which state''s form. application: the CAQH application (ProviderHub label: Application). application_release: the CAQH standard authorization/attestation/release page (Application Release). state_release: a state release form (State Release). state_authorization: a state authorization form (State Authorization). disclosure: a state disclosure form, e.g. OR, WA (Disclosure). attestation: a state attestation-question form, e.g. OK Section 13, MS Section D (Section D - Attestation Questions). claims_history: a professional-liability claims information form, e.g. GA Schedule B (Schedule-B Professional Liability Claims Information Form for Georgia State). acknowledgement: a regulation acknowledgement form, e.g. GA Schedule C (Schedule C - Regulation Acknowledgement).'
        state:
          type: string
          examples:
          - TX
          pattern: ^[A-Za-z]{2}$
          description: The 2-letter state this form is for
        signaturePresent:
          type: boolean
          examples:
          - true
          description: Whether the form shows a signature
        signatureType:
          type: string
          enum:
          - wet
          - electronic
          - unknown
          examples:
          - electronic
          pattern: ^(wet|electronic|unknown)$
          description: wet (ink/scanned handwritten), electronic, or unknown when the signature's kind could not be determined
        signatureDate:
          $ref: '#/components/schemas/Date'
          type: string
          examples:
          - '2024-01-15'
          description: The date the form was signed
        attestationDate:
          $ref: '#/components/schemas/Date'
          type: string
          examples:
          - '2024-01-15'
          description: The date of the form's own attestation
        clientReference:
          type: string
          minLength: 1
          examples:
          - ext-req-8f3c2a
          maxLength: 128
          description: Caller-supplied idempotency key. When a create request for this section carries a clientReference equal to an existing record's, the create is deduped and the existing record is returned instead of appending a duplicate.
