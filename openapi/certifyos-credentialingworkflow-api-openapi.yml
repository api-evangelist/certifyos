openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer Credentialing Workflow API
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: CredentialingWorkflow
  description: APIs for managing credentialing workflows
paths:
  /credentialing-workflows:
    get:
      summary: List credentialing workflows by filter criteria
      description: Returns a paginated list of credentialing workflows that match the supplied filter criteria. Use this endpoint to search and browse workflows across practitioners; for facility-scoped workflows use the facility-specific endpoint instead. Requires a valid JWT with the appropriate workflow read permission. Supports offset-based pagination (`page`, default 0; `size`, default 50); Pass the `X-PII-View` header to include unmasked PII fields in the response. When `skipEnrichment` is true, DAL enrichment and verifiedBy user lookups are skipped and those fields will be absent from each workflow object. Returns an empty list (not 404) when no workflows match. Query params (filter, page default 0, size default 50, cursors, order, skipEnrichment) are forwarded to the DAL. The tenant-id header is forced into the filter and any client filter.tenantId is stripped. Max size is not validated in api-layer. Optional default-sort behavior may rewrite blank or malformed order when enabled.
      operationId: getCredentialingWorkflows
      tags:
      - CredentialingWorkflow
      parameters:
      - description: End at document ID, for backward cursor-based pagination
        name: endAtId
        in: query
        schema:
          type: string
      - description: "## Filter Criteria\n\nThe filter parameter must be URL encoded when sent. Filters are specified as JSON objects where each field can have\none or more filter operations.\n\n### Filterable Fields\n\n#### Core Workflow Fields\n- **id**: Workflow unique identifier (String)\n- **tenantId**: Tenant identifier (String)\n- **tenantPractitionerId**: Tenant practitioner identifier (String)\n- **createdAt**: Workflow creation timestamp (Timestamp)\n- **updatedAt**: Workflow last update timestamp (Timestamp)\n\n#### Data Fields - Workflow Information\n- **data.externalId**: External identifier (String)\n- **data.practitionerFileType**: Type of practitioner file (String)\n- **data.psvProgression**: Stored PSV Progression, `READY` or `BLOCKED` (String, eq/neq/in/nin).\n  Written only for tenants switched on for PSV transparency, while the workflow is Not Started,\n  In Progress, Outreach In Progress or Data Missing; null from PSV Complete on (null never matches)\n- **psvVerificationOutcome**: Current PSV Verification outcome, `VERIFIED` or\n  `VERIFIED_WITH_EXCEPTIONS` (String, eq/neq/in/nin). The platform outcome recorded at PSV Complete\n  (or at a withdrawal before it), cleared on a move back. Exceptions hidden from the PSV packet\n  still count, so it can differ from `psvSummary.psvVerification.outcome`\n- **data.credentialingCycle**: Credentialing cycle (String)\n- **data.credentialedStates**: Array of credentialed states (Array - eq/in only)\n- **data.assignedTo**: User assigned to the workflow (String)\n- **data.assignedBy**: User who assigned the workflow (String)\n\n#### Data Fields - Status & Dates\n- **data.credentialingStatus**: Current workflow status (String)\n- **data.psvReadyDate**: PSV ready date (Timestamp)\n- **data.psvCompletedDate**: PSV completed date (Timestamp)\n- **data.credentialingStatusLastUpdatedDate**: Status last updated date (Timestamp)\n- **data.previousCredentialedDate**: Previous credentialing date (Date)\n- **data.credentialingDueDate**: Credentialing due date (Date)\n- **data.nextCredentialingDate**: Next credentialing date (Date)\n- **data.credentialingDecisionDate**: Credentialing decision date (Date)\n\n#### Data Fields - Practitioner Information\n- **data.practitioner.firstName**: Practitioner first name (String, case-insensitive contains)\n- **data.practitioner.middleName**: Practitioner middle name (String)\n- **data.practitioner.lastName**: Practitioner last name (String, case-insensitive contains)\n- **data.practitioner.npi**: National Provider Identifier (String)\n- **data.practitioner.caqhProviderId**: CAQH Provider ID (String)\n- **data.practitioner.primaryEmail**: Primary email address (String)\n- **data.practitioner.licensedStates**: Array of licensed states (Array - eq/in only)\n- **data.practitioner.practitionerTypesToCredential**: Array of practitioner types to credential (Array - eq/in only)\n- **data.practitioner.statesToCredential**: Array of states to credential (Array - eq/in only)\n- **data.practitioner.lineOfBusiness**: Array of lines of business (Array - eq/in only)\n- **data.practitioner.userDefinedFields.market**: Array of markets (Array - eq/in only)\n\n### Supported Filter Operations\n\n#### String Fields (eq, neq, in, nin, contains)\n- **eq**: Exact match - `{\"field\":{\"eq\":\"value\"}}`\n- **neq**: Not equal - `{\"field\":{\"neq\":\"value\"}}`\n- **in**: Match any value in array - `{\"field\":{\"in\":[\"value1\",\"value2\"]}}`\n- **nin**: Not match any value in array - `{\"field\":{\"nin\":[\"value1\",\"value2\"]}}`\n- **contains**: Substring match - `{\"field\":{\"contains\":\"partial\"}}` (case-insensitive for name fields)\n\n#### Timestamp/Date Fields (eq, neq, gt, gte, lt, lte)\n- **eq**: Exact match - `{\"field\":{\"eq\":\"2023-01-01T00:00:00Z\"}}`\n- **neq**: Not equal - `{\"field\":{\"neq\":\"2023-01-01T00:00:00Z\"}}`\n- **gt**: Greater than - `{\"field\":{\"gt\":\"2023-01-01T00:00:00Z\"}}`\n- **gte**: Greater than or equal - `{\"field\":{\"gte\":\"2023-01-01T00:00:00Z\"}}`\n- **lt**: Less than - `{\"field\":{\"lt\":\"2023-01-01T00:00:00Z\"}}`\n- **lte**: Less than or equal - `{\"field\":{\"lte\":\"2023-01-01T00:00:00Z\"}}`\n\n#### Array Fields (eq, in only)\n- **eq**: Array contains value - `{\"field\":{\"eq\":\"value\"}}`\n- **in**: Array contains any of these values - `{\"field\":{\"in\":[\"value1\",\"value2\"]}}`\n\n### Filter Examples\n\n#### Basic Filters (before URL encoding)\n```json\n// Filter by id\n{\"id\":{\"eq\":\"123\"}}\n\n// Filter by tenant\n{\"tenantId\":{\"eq\":\"tenant123\"}}\n\n// Filter by practitioner ID\n{\"tenantPractitionerId\":{\"eq\":\"practitioner456\"}}\n\n// Filter by credentialing status\n{\"data.credentialingStatus\":{\"eq\":\"PSV_READY\"}}\n\n// Filter by assigned user\n{\"data.assignedTo\":{\"eq\":\"user123\"}}\n```\n\n#### Practitioner Filters\n```json\n// Search by practitioner first name (case-insensitive)\n{\"data.practitioner.firstName\":{\"contains\":\"Alice\"}}\n\n// Filter by NPI (exact match)\n{\"data.practitioner.npi\":{\"eq\":\"1234567890\"}}\n\n// Filter by CAQH Provider ID\n{\"data.practitioner.caqhProviderId\":{\"eq\":\"12345678\"}}\n\n// Filter by email\n{\"data.practitioner.primaryEmail\":{\"contains\":\"@example.com\"}}\n```\n\n#### Array Field Filters\n```json\n// Filter by practitioner type to credential\n{\"data.practitioner.practitionerTypesToCredential\":{\"eq\":\"MD\"}}\n\n// Filter by multiple states to credential\n{\"data.practitioner.statesToCredential\":{\"in\":[\"CA\",\"NY\",\"TX\"]}}\n\n// Filter by licensed states\n{\"data.practitioner.licensedStates\":{\"in\":[\"CA\",\"NY\"]}}\n\n// Filter by line of business\n{\"data.practitioner.lineOfBusiness\":{\"eq\":\"MEDICARE\"}}\n\n// Filter by multiple lines of business\n{\"data.practitioner.lineOfBusiness\":{\"in\":[\"MEDICARE\",\"MEDICAID\"]}}\n\n// Filter by market\n{\"data.practitioner.userDefinedFields.market\":{\"eq\":\"MARKET1\"}}\n\n// Filter by multiple markets\n{\"data.practitioner.userDefinedFields.market\":{\"in\":[\"MARKET1\",\"MARKET2\"]}}\n\n// Filter by credentialed states\n{\"data.credentialedStates\":{\"eq\":\"CA\"}}\n```\n\n#### Date/Timestamp Filters\n```json\n// Workflows created after a date\n{\"createdAt\":{\"gt\":\"2023-01-01T00:00:00Z\"}}\n\n// PSV ready within a date range\n{\"data.psvReadyDate\":{\"gte\":\"2023-01-01T00:00:00Z\",\"lte\":\"2023-12-31T23:59:59Z\"}}\n\n// Workflows updated in last 7 days\n{\"updatedAt\":{\"gte\":\"2023-01-15T00:00:00Z\"}}\n```\n\n#### Combined Filters\n```json\n// Multiple conditions (AND logic)\n{\n  \"data.practitioner.firstName\":{\"contains\":\"Alice\"},\n  \"data.practitioner.npi\":{\"eq\":\"1234567890\"},\n  \"data.credentialingStatus\":{\"eq\":\"PSV_READY\"}\n}\n\n// Filter by status and date range\n{\n  \"data.credentialingStatus\":{\"eq\":\"CRED_APPROVED\"},\n  \"data.credentialingDecisionDate\":{\"gte\":\"2023-01-01\",\"lte\":\"2023-12-31\"}\n}\n\n// Filter by line of business and status\n{\n  \"data.practitioner.lineOfBusiness\":{\"in\":[\"MEDICARE\"]},\n  \"data.credentialingStatus\":{\"eq\":\"PSV_READY\"}\n}\n\n// Filter by market and status\n{\n  \"data.practitioner.userDefinedFields.market\":{\"in\":[\"MARKET1\"]},\n  \"data.credentialingStatus\":{\"eq\":\"PSV_READY\"}\n}\n```\n\n### cURL Examples\n```bash\n# Filter by id\ncurl -X GET 'http://localhost:8080/credentialing-workflows?filter=%7B%22id%22%3A%7B%22eq%22%3A%22123%22%7D%7D'\n\n# Filter by practitioner firstName (case-insensitive)\ncurl -X GET 'http://localhost:8080/credentialing-workflows?filter=%7B%22data.practitioner.firstName%22%3A%7B%22contains%22%3A%22Alice%22%7D%7D'\n\n# Filter by NPI\ncurl -X GET 'http://localhost:8080/credentialing-workflows?filter=%7B%22data.practitioner.npi%22%3A%7B%22eq%22%3A%221234567890%22%7D%7D'\n\n# Filter by states to credential\ncurl -X GET 'http://localhost:8080/credentialing-workflows?filter=%7B%22data.practitioner.statesToCredential%22%3A%7B%22in%22%3A%5B%22CA%22%2C%22NY%22%5D%7D%7D'\n\n# Filter by line of business\ncurl -X GET 'http://localhost:8080/credentialing-workflows?filter=%7B%22data.practitioner.lineOfBusiness%22%3A%7B%22in%22%3A%5B%22MEDICARE%22%5D%7D%7D'\n\n# Filter by market\ncurl -X GET 'http://localhost:8080/credentialing-workflows?filter=%7B%22data.practitioner.userDefinedFields.market%22%3A%7B%22in%22%3A%5B%22MARKET1%22%5D%7D%7D'\n\n# Combined filter\ncurl -X GET 'http://localhost:8080/credentialing-workflows?filter=%7B%22data.practitioner.firstName%22%3A%7B%22contains%22%3A%22Alice%22%7D%2C%22data.credentialingStatus%22%3A%7B%22eq%22%3A%22PSV_READY%22%7D%7D'\n```\n\n**Note**: Always URL encode the JSON filter string before sending the request.\n"
        name: filter
        in: query
        schema:
          type: string
      - description: "## Sorting/Ordering\n\nSort results by specifying a field name and direction. The order parameter must be URL encoded when sent.\n\n### Sortable Fields\nYou can sort by any of the following fields:\n- **id**: Workflow unique identifier\n- **tenantPractitionerId**: Tenant practitioner identifier\n- **createdAt**: Workflow creation timestamp\n- **createdBy**: User who created the workflow (sortable only, not filterable)\n- **updatedAt**: Last update timestamp\n- **updatedBy**: User who last updated the workflow (sortable only, not filterable)\n- **data.credentialingDueDate**: Credentialing due date (index-backed)\n- **data.nextCredentialingDate**: Next credentialing date (index-backed)\n- **data**: JSON data field (lexicographic ordering)\n\n### Sort Direction\n- **ASC**: Ascending order (default)\n- **DESC**: Descending order\n\n**Note**: Sort direction is case-insensitive, but uppercase is recommended (ASC/DESC).\n\n### Sort Format\n```json\n{\n  \"orderBy\": \"fieldName\",\n  \"orderByDirection\": \"ASC|DESC\"\n}\n```\n\n### Sort Examples\n\n#### Basic Sorting (before URL encoding)\n```json\n// Sort by creation date (newest first)\n{\"orderBy\":\"createdAt\",\"orderByDirection\":\"DESC\"}\n\n// Sort by id (ascending)\n{\"orderBy\":\"id\",\"orderByDirection\":\"ASC\"}\n\n// Sort by last update (newest first)\n{\"orderBy\":\"updatedAt\",\"orderByDirection\":\"DESC\"}\n```\n\n### cURL Examples\n```bash\n# Sort by creation date (newest first)\ncurl -X GET 'http://localhost:8080/credentialing-workflows?order=%7B%22orderBy%22%3A%22createdAt%22%2C%22orderByDirection%22%3A%22DESC%22%7D'\n\n# Sort by id (ascending)\ncurl -X GET 'http://localhost:8080/credentialing-workflows?order=%7B%22orderBy%22%3A%22id%22%2C%22orderByDirection%22%3A%22ASC%22%7D'\n\n# Sort by tenant practitioner (ascending)\ncurl -X GET 'http://localhost:8080/credentialing-workflows?order=%7B%22orderBy%22%3A%22tenantPractitionerId%22%2C%22orderByDirection%22%3A%22ASC%22%7D'\n\n# Combine filter and sort\ncurl -X GET 'http://localhost:8080/credentialing-workflows?filter=%7B%22data.credentialingStatus%22%3A%7B%22eq%22%3A%22PSV_READY%22%7D%7D&order=%7B%22orderBy%22%3A%22createdAt%22%2C%22orderByDirection%22%3A%22DESC%22%7D'\n```\n\n**Note**: Always URL encode the JSON order string before sending the request.\n"
        name: order
        in: query
        schema:
          type: string
      - description: Page number (0-based), for offset-based pagination
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: '0'
      - description: Page size
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: '50'
      - description: When true, skips DAL enrichment and verifiedBy user lookups
        name: skipEnrichment
        in: query
        schema:
          type: boolean
          default: false
      - description: Start after document ID, for forward cursor-based pagination
        name: startAfterId
        in: query
        schema:
          type: string
      - description: Include PII in response; requires practitioner read:pii permission
        in: header
        name: X-PII-View
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
        '200':
          description: Successfully retrieved credentialing workflows
          content:
            application/json:
              examples:
                getCredentialingWorkflowsResponse:
                  value:
                    data:
                    - id: 22222222-2222-4222-8222-222222222222
                      tenantId: 11111111-1111-4111-8111-111111111111
                      certifyPractitionerId: 66666666-6666-4666-8666-666666666666
                      data:
                        credentialingCycle: INITIAL
                        practitioner:
                          firstName: Jane
                          lastName: Example
                          npi: '1999999999'
                      psvSummary:
                        fileType:
                          value: PENDING
                          frozen: false
                          reasons: []
                        psvProgression: BLOCKED
              schema:
                $ref: '#/components/schemas/GetCredentialingWorkflowsResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
    post:
      summary: Create a single credentialing workflow for a practitioner
      description: Creates a new credentialing workflow for a practitioner and returns the created object with a server-assigned `id` and initial status. Use this endpoint for single-practitioner workflow creation; use `POST /credentialing-workflows/bulk-create` or `POST /credentialing-workflows/v2/bulk-create` for batch operations. The practitioner identified in the request body must already exist in the system. Returns 409 if an active workflow already exists for the same practitioner and tenant.
      operationId: createCredentialingWorkflow
      tags:
      - CredentialingWorkflow
      parameters:
      - description: 'When true, skips recomputing the practitioner''s Anchor Group participation before the workflow is created. Default false: the participation is computed first (best effort, never blocks the create), so a practitioner created moments ago can join their group''s shared run on this create.'
        name: skipAnchorGroupComputation
        in: query
        schema:
          type: boolean
          default: false
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              createWorkflow:
                value:
                  certifyPractitionerId: 66666666-6666-4666-8666-666666666666
                  additionalInfo:
                    source: ROSTER
                    sourceId: R12345:42
            schema:
              $ref: '#/components/schemas/CreateCredentialingWorkflowRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
        '201':
          description: Successfully created the credentialing workflow
          content:
            application/json:
              examples:
                createdWorkflow:
                  value:
                    id: 22222222-2222-4222-8222-222222222222
                    tenantId: 11111111-1111-4111-8111-111111111111
                    certifyPractitionerId: 66666666-6666-4666-8666-666666666666
                    data: {}
              schema:
                $ref: '#/components/schemas/CredentialingWorkflowResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '409':
          description: Conflict - An active credentialing workflow already exists for this practitioner. Complete or withdraw the existing workflow before creating a new one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '422':
          description: Unprocessable Entity - Business rule violation
      security:
      - jwt: []
  /credentialing-workflows/assignments:
    post:
      summary: Assign multiple workflows to users via round-robin distribution
      description: 'Creates user assignments for multiple credentialing workflows in a single synchronous operation. Workflows in the request are distributed evenly across the provided user IDs using round-robin assignment. Each workflow is processed independently: the response body contains both a `successful` array and a `failed` array so callers can identify any workflows that could not be assigned without needing to retry the entire batch. Returns 400 if the request body is invalid.'
      operationId: createBulkAssignment
      tags:
      - CredentialingWorkflow
      parameters:
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              createBulkAssignment:
                value:
                  workflowIds:
                  - 22222222-2222-4222-8222-222222222222
                  assignedTo:
                  - 55555555-5555-4555-8555-555555555555
                  reason: Bulk workflow assignment
                  isSelectAll: false
            schema:
              $ref: '#/components/schemas/BulkCreateAssignmentRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
        '200':
          description: Bulk assignment operation completed. Check successful and failed arrays for individual results.
          content:
            application/json:
              examples:
                createBulkAssignmentResponse:
                  value:
                    successful:
                    - workflowId: 22222222-2222-4222-8222-222222222222
                      assignment:
                        workflowId: 22222222-2222-4222-8222-222222222222
                        tenantId: 11111111-1111-4111-8111-111111111111
                        tenantPractitionerId: 11111111-1111-4111-8111-111111111111
                        assignments:
                        - assignedFrom: 22222222-2222-4222-8222-222222222222
                          assignedTo: 55555555-5555-4555-8555-555555555555
                          assignedBy: 22222222-2222-4222-8222-222222222222
                          assignedOn: '2026-07-24T10:02:25.359984409Z'
                          reason: Bulk workflow assignment
                        - assignedFrom: 22222222-2222-4222-8222-222222222222
                          assignedTo: 55555555-5555-4555-8555-555555555555
                          assignedBy: 22222222-2222-4222-8222-222222222222
                          assignedOn: '2026-07-24T10:02:09.113481728Z'
                          reason: Workflow update
                      error: ''
                    failed: []
                    totalProcessed: 1
                    successCount: 1
                    failureCount: 0
              schema:
                $ref: '#/components/schemas/BulkAssignmentResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
      security:
      - jwt: []
  /credentialing-workflows/bulk-create:
    post:
      summary: Asynchronously create workflows for multiple practitioners (v1)
      description: Accepts a list of practitioners and asynchronously creates a credentialing workflow for each one. The request returns 202 immediately; creation for each practitioner runs in the background and is independent — a failure for one practitioner does not block others. Results are logged server-side but are not returned in the response body and there is no polling endpoint to check completion status. Use `POST /credentialing-workflows/v2/bulk-create` for a Cloud Tasks–backed version with a trackable bulk request record.
      operationId: createBulkCredentialingWorkflows
      tags:
      - CredentialingWorkflow
      parameters:
      - description: 'When true, skips recomputing the practitioner''s Anchor Group participation before the workflow is created. Default false: the participation is computed first (best effort, never blocks the create), so a practitioner created moments ago can join their group''s shared run on this create.'
        name: skipAnchorGroupComputation
        in: query
        schema:
          type: boolean
          default: false
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              createBulkCredentialingWorkflows:
                value:
                  certifyPractitionerIds:
                  - 66666666-6666-4666-8666-666666666666
                  isSelectAll: false
            schema:
              $ref: '#/components/schemas/BulkCreateCredentialingWorkflowRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
        '202':
          description: Bulk workflow creation request accepted and processing started. The operation will complete in the background.
          content:
            application/json:
              examples:
                createBulkCredentialingWorkflowsResponse:
                  value:
                    message: Bulk workflow creation request accepted and processing started
              schema:
                type: object
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
      security:
      - jwt: []
  /credentialing-workflows/bulk-delete:
    post:
      summary: Bulk delete credentialing workflows asynchronously
      description: Asynchronously deletes multiple credentialing workflows via a chunked Cloud Tasks fan-out. Deduplicates IDs, splits into chunks, enqueues chunk tasks, and returns 202 immediately with a jobId and accepted ID count — not per-ID delete outcomes. Each chunk later enqueues per-workflow cascade-delete tasks using the same cascade path as single delete. Queue rate and retries are server-owned.
      operationId: bulkDeleteCredentialingWorkflows
      tags:
      - CredentialingWorkflow
      parameters:
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: List of credentialing workflow IDs to delete
        content:
          application/json:
            examples:
              bulkDeleteCredentialingWorkflows:
                value:
                  workflowIds:
                  - 22222222-2222-4222-8222-222222222222
            schema:
              $ref: '#/components/schemas/BulkDeleteCredentialingWorkflowsRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - failed to enqueue any chunk task
        '202':
          description: Bulk delete accepted. The body reports the jobId and how many IDs were accepted.
          content:
            application/json:
              examples:
                bulkDeleteCredentialingWorkflowsResponse:
                  value:
                    jobId: cccccccc-cccc-4ccc-8ccc-cccccccccccc
                    requestedCount: 1
                    acceptedCount: 1
                    status: ACCEPTED
                    message: Bulk delete request accepted
              schema:
                $ref: '#/components/schemas/BulkDeleteCredentialingWorkflowsResponse'
        '400':
          description: Invalid request - empty workflowIds list, or more IDs than the per-request maximum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '503':
          description: Bulk delete is disabled by the server kill switch
      security:
      - jwt: []
  /credentialing-workflows/cloud-create:
    post:
      summary: Internal Cloud Tasks callback — create one workflow in bulk job
      description: 'Internal callback endpoint invoked by Google Cloud Tasks as part of the v2 bulk-create flow. Creates a single credentialing workflow for one practitioner and updates the corresponding bulk request item status on completion. This endpoint is not intended for direct client use — authenticate with the `X-Credentialing-Api-Key` header; JWT authentication is not used. Required body fields: `certifyPractitionerId`, `tenantPractitionerId`, `credentialingWorkflowBulkRequestId`, `credentialingWorkflowBulkRequestItemId`. Optional: `data` object containing the workflow creation payload; `skipAnchorGroupComputation` boolean (default false), true when the bulk request asked to skip the creation-time Anchor Group computation.'
      operationId: cloudCreateCredentialingWorkflow
      tags:
      - CredentialingWorkflow
      parameters:
      - description: Tenant ID
        name: tenant-id
        in: header
        schema:
          type: string
      - description: User ID for service-to-service calls
        name: user-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              cloudCreateCredentialingWorkflow:
                value: {}
            schema:
              $ref: '#/components/schemas/JsonNode'
        required: true
      responses:
        '201':
          description: Workflow created successfully
          content:
            application/json:
              examples:
                cloudCreateCredentialingWorkflowResponse:
                  value:
                    id: 22222222-2222-4222-8222-222222222222
                    tenantId: 11111111-1111-4111-8111-111111111111
                    certifyPractitionerId: 66666666-6666-4666-8666-666666666666
                    data:
                      credentialingStatus: NOT_STARTED
                      credentialingCycle: INITIAL
                      linesOfBusiness:
                      - Medicare
                      statesToCredential:
                      - TX
        '400':
          description: Missing required fields in request body
        '401':
          description: Invalid or missing X-Credentialing-Api-Key
        '409':
          description: Active workflow already exists or duplicate active item
        '500':
          description: Failed to create workflow
      security:
      - jwt: []
  /credentialing-workflows/data-pipeline-callback:
    post:
      summary: Data pipeline callback
      description: Receives callback from DI team after MDM Orchestration completes. Marks workflow data-pipeline status and syncs practitioner OV sections. The pipeline is identified by the referenced data pipeline request's pipelineName (CAQH, NPDB or LICENSE), not by the request body. The referenced request must already carry a CROSSWALK_INGESTION step in SUCCESS or ERROR status. CAQH and NPDB callbacks sync while the workflow is in any editable status; LICENSE (ODDP state license) callbacks sync only while the workflow is still NOT_STARTED and otherwise return 200 with status "skipped" and the skip reason.
      operationId: dataPipelineCallback
      tags:
      - CredentialingWorkflow
      parameters:
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      - name: user-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              dataPipelineCallback:
                value:
                  dataPipelineRequestId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                  eventSource: MDM_ORCHESTRATION
            schema:
              $ref: '#/components/schemas/DataPipelineCallbackRequest'
        required: true
      responses:
        '200':
          description: Callback processed successfully
          content:
            application/json:
              examples:
                dataPipelineCallbackResponse:
                  value:
                    status: success
                    message: Callback processed successfully
                    workflowId: 22222222-2222-4222-8222-222222222222
                    dataPipelineRequestId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
              schema:
                $ref: '#/components/schemas/DataPipelineCallbackResponse'
        '400':
          description: Bad request - missing or invalid parameters
        '401':
          description: Invalid or missing X-Credentialing-Api-Key
        '404':
          description: Data pipeline request not found
        '500':
          description: Internal server error
      security:
      - jwt: []
  /credentialing-workflows/dmf-check:
    post:
      summary: Run a Death Master File check for a practitioner
      description: Calls the downstream Death Master File (DMF) deceased-provider check service with the supplied SSN and date of birth. Use this endpoint to verify that the DMF integration is reachable and functioning; it is intended primarily as a diagnostic or administrative tool rather than a routine production call. Both `ssn` (9-digit string) and `dateOfBirth` (format `yyyy-MM-dd`) are required. Returns the raw DMF check result on 200. Returns 502 when the downstream DMF service is unavailable or returns an error.
      operationId: dmfCheck
      tags:
      - CredentialingWorkflow
      parameters:
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: SSN (9 digits) and dateOfBirth (yyyy-MM-dd)
        content:
          application/json:
            examples:
              dmfCheck:
                value:
                  ssn: '000000000'
                  dateOfBirth: '1980-01-01'
            schema:
              $ref: '#/components/schemas/DmfRequest'
        required: true
      responses:
        '200':
          description: DMF check result
          content:
            application/json:
              examples:
                dmfCheckResponse:
                  value:
                    isDeceased: false
              schema:
                $ref: '#/components/schemas/DmfResponse'
        '400':
          description: Invalid request (e.g. SSN/dateOfBirth validation)
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '502':
          description: DAL DMF (Deceased) check failed or unavailable
      security:
      - jwt: []
  /credentialing-workflows/event-emails:
    post:
      summary: Send an event-agnostic notification email for multiple workflows
      description: 'Sends the requested event email (e.g. CRED_APPROVED) for multiple credentialing workflows in a single operation, WITHOUT writing a timeline event — no status mutation, no webhook/PSV trigger. Each workflow is processed independently — a failure for one does not block others — and the response includes both `successful` and `failed` arrays. Optionally accepts `templateDataOverrides` (merged over the computed template-variable map, override wins on conflict), `subjectOverride` (replaces the tenant-configured subject when non-blank), and `bodyHtmlOverride` (replaces the tenant-configured body when non-blank; placeholders inside it still substitute from the, possibly overridden, template-variable map). All three are optional — omitting them preserves the tenant-configured email exactly. Overrides replace template CONTENT only: they do NOT bypass the per-tenant enabled check or the recipient-email resolution, so a disabled event type or a workflow with no recipient still reports as successful without sending, even when overrides are supplied.'
      operationId: bulkSendEventEmails
      tags:
      - CredentialingWorkflow
      parameters:
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Bulk event-email request with event type and workflow IDs
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkEventEmailRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
        '502':
          description: Downstream service failure
        '200':
          description: Bulk event-email send operation completed. Check successful and failed arrays for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkEventEmailResponse'
        '400':
          description: Invalid request data, e.g. unsupported event type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
      security:
      - jwt: []
  /credentialing-workflows/replay-webhooks:
    post:
      summary: Replay credential_workflow.status.changed webhooks for given workflows
      description: Accepts a list of workflow IDs and asynchronously replays `credential_workflow.status.changed` webhook events for each one. Returns 202 immediately; replay runs in the background. Each workflow is fetched and routed through the same webhook dispatch path used during normal status changes, so downstream subscribers receive the same payload they would have received during the original status change. Progress is logged server-side with the `[webhook-replay]` prefix. There is no polling endpoint to track completion.
      operationId: replayWebhooks
      tags:
      - CredentialingWorkflow
      parameters:
      - description: Tenant ID
        in: header
        required: true
        name: tenant-id
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              replayWebhooks:
                value:
                  workflowIds:
                  - 22222222-2222-4222-8222-222222222222
            schema:
              $ref: '#/components/schemas/ReplayWebhooksRequest'
        required: true
      responses:
        '202':
          description: Webhook replay accepted and processing in the background
          content:
            application/json:
              examples:
                replayWebhooksResponse:
                  value:
                    message: Webhook replay accepted. Processing 1 workflows in the background.
                    workflowCount: 1
        '400':
          description: Invalid request data
        '401':
          description: Unauthorized - Authentication required
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
      - jwt: []
  /credentialing-workflows/timeline-events:
    post:
      summary: Change the status of multiple workflows in one request
      description: Creates timeline events for multiple credentialing workflows in a single operation, effectively changing the status of each workflow. Each workflow is processed independently — a failure for one does not block others — and the response includes both `successful` and `failed` arrays. Use this endpoint for batch status transitions; to change the status of a single workflow use `POST /credentialing-workflows/{workflowId}/timeline-events`.
