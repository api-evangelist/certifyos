      description: Deletes multiple supporting-document records in one action. Each recordId uses the '{section}-{index}' format (e.g. 'supportingDocuments-3'); section must be supportingDocuments. Deletion is a single read-modify-write and hard-deletes the records (no tombstone), matching single-record delete behaviour. Partial failures (malformed, wrong section, out-of-bounds, duplicate recordIds) are reported per record and do not block the valid deletions.
