  /credentialing-workflows/v2/bulk-create:
    post:
      summary: Queue bulk workflow creation via Cloud Tasks with tracking (v2)
      description: Accepts a bulk workflow creation request, writes a tracking record to the database, and enqueues one Cloud Tasks task per practitioner for reliable, independent processing. Returns 202 immediately with the bulk request tracking ID. Poll the tracking record or check individual workflow creation results using the tracking ID. Each task calls `POST /credentialing-workflows/cloud-create` internally. Use this endpoint in preference to the v1 `/bulk-create` when you need per-item status tracking or retry guarantees via Cloud Tasks.
      operationId: createBulkCredentialingWorkflowsV2
      tags:
      - CredentialingWorkflow
      parameters:
      - description: 'When true, skips recomputing the practitioner''s Anchor Group participation before the workflow is created. Default false: the participation is computed first (best effort, never blocks the create), so a practitioner created moments ago can join their group''s shared run on this create.'
        name: skipAnchorGroupComputation
        in: query
        schema:
          type: boolean
          default: false
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              createBulkCredentialingWorkflowsV2:
                value:
                  certifyPractitionerIds:
                  - 66666666-6666-4666-8666-666666666666
                  isSelectAll: false
            schema:
              $ref: '#/components/schemas/BulkCreateCredentialingWorkflowRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
        '202':
          description: Bulk workflow creation request accepted. Individual workflows will be created via Cloud Tasks.
          content:
            application/json:
              examples:
                createBulkCredentialingWorkflowsV2Response:
                  value:
                    message: Bulk workflow creation request accepted. Workflows will be created via Cloud Tasks.
              schema:
                type: object
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
      security:
      - jwt: []
