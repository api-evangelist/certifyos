                    changedOn: '2026-07-24T10:01:49.465960066Z'
              schema:
                type: object
        '400':
          description: Invalid request data, or the workflow is in a completed status (plain error messages). For a tenant with PSV transparency switched on (CP-42927), an ApiError whose reason is WORKFLOW_NOT_EDITABLE (the workflow is not at PSV Complete, or its verdict is frozen) or FILE_TYPE_REASON_REQUIRED (the reason rule refused), as on the file-type-verdict route
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BadRequestErrorResponse'
                - $ref: '#/components/schemas/ApiError1'
        '404':
          description: Credentialing workflow not found
          content:
            application/json: {}
      security:
      - jwt:
        - U:CW
  /credentialing-workflows/{workflowId}/psv-progression:
    get:
      summary: Read the workflow's PSV progression and open blockers
      description: Evaluates the PSV rules of the credentialing workflow identified by `workflowId` once and answers READY or BLOCKED with every failed rule, each with its `coverKey`. A rule already acknowledged by an earlier move in the current PSV stretch reads `covered` and does not block. The same logic and shape as the shared page's member progression read. The standalone tenant page's Withdraw / Cancel prompt lists the uncovered items before PSV Complete and sends the chosen `coverKey`s back as `hiddenCoverKeys` on `POST /{workflowId}/timeline-events`. Writes nothing. Answers 404 when PSV transparency is not switched on for the tenant.
      operationId: getPsvProgression
      tags:
      - CredentialingWorkflow
      parameters:
      - description: ID of the credentialing workflow
        in: path
        required: true
        name: workflowId
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - the caller lacks credentialing-workflow:read in the tenant-id header's tenant
        '200':
          description: The workflow's progression state and failed rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPsvProgressionResponse'
        '404':
          description: 'Credentialing workflow not found in this tenant, or FILE_TYPE_VERDICT_NOT_ENABLED: PSV transparency is not switched on for this tenant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - The evaluation failed
        '503':
          description: 'RULES_NOT_EVALUATED: the PSV rules could not be evaluated (no usable result, or the state sanctions check could not run); try again'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt:
        - R:CW
  /credentialing-workflows/{workflowId}/psv-validation:
    get:
      summary: Validate PSV rules for a credentialing workflow
      description: Pre-checks PSV rule-engine validations for the credentialing workflow without attempting a PSV_COMPLETED timeline transition. Returns the same rule-engine map shape used when a PSV_COMPLETED transition fails validation. Use before creating a PSV_COMPLETED timeline event. Requires credentialing workflow read permission. Returns 404 when the workflow is not found.
