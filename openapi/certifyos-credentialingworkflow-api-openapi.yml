        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Bulk status change request with workflow IDs and timeline event data
        content:
          application/json:
            examples:
              bulkStatusChange:
                value:
                  workflowIds:
                  - 22222222-2222-4222-8222-222222222222
                  timelineEventData:
                    name: OUTREACH_IN_PROGRESS
                    changeReason: Bulk status change
                  isSelectAll: false
            schema:
              $ref: '#/components/schemas/BulkStatusChangeRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
        '502':
          description: Downstream service failure
        '200':
          description: Bulk status change operation completed. Check successful and failed arrays for details.
          content:
            application/json:
              examples:
                bulkStatusChangeResponse:
                  value:
                    successful:
                    - workflowId: 22222222-2222-4222-8222-222222222222
                      timelineEvent:
                        id: 22222222-2222-4222-8222-222222222222
                        workflowId: 22222222-2222-4222-8222-222222222222
                        data:
                          name: OUTREACH_IN_PROGRESS
                          changeReason: Bulk status change
                        createdBy: 22222222-2222-4222-8222-222222222222
                        updatedBy: 22222222-2222-4222-8222-222222222222
                        createdAt: '2026-07-24T10:02:23.675Z'
                        updatedAt: '2026-07-24T10:02:23.675Z'
                    failed: []
                    totalCount: 1
                    successCount: 1
                    failureCount: 0
              schema:
                $ref: '#/components/schemas/BulkStatusChangeResponse'
        '400':
