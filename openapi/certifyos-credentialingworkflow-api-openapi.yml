  /credentialing-workflows/{workflowId}/app-verifications/bulk-delete:
    post:
      summary: Bulk-delete application-verification records from a credentialing workflow
      description: 'Deletes multiple appVerifications records in one action. Each recordId uses the ''{section}-{index}'' format (e.g. ''appVerifications-3''); section must be appVerifications. Deletion is a single read-modify-write and archives each removed record into deletedData.practitioner.appVerifications (CP-37047), matching single-record delete behaviour for this section; appVerifications keeps its own endpoint because its request DTO differs from the generic section bulk-delete. Partial failures (malformed, wrong section, out-of-bounds, duplicate recordIds) are reported per record and do not block the valid deletions. NOTE: recordIds are positional, so this request must not be retried automatically — a replay after a successful-but-unseen response would delete whatever records shifted into those indices. The removed records are kept in deletedData, but there is no restore endpoint and they stay removed from the live section. Re-fetch the section and rebuild recordIds before any retry.'
      operationId: bulkDeleteAppVerifications
      tags:
      - CredentialingWorkflow
      parameters:
      - description: Credentialing workflow ID
        example: cw_1234567890
        in: path
        required: true
        name: workflowId
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Record identifiers to delete, in '{section}-{index}' format
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteAppVerificationsRequest'
        required: true
      responses:
        '200':
          description: At least one record was deleted; body reports the deleted and failed records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteAppVerificationsResponse'
        '400':
          description: Empty/blank/invalid recordIds, a blank tenant-id, or a missing request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '422':
          description: No record was deleted — every recordId failed (malformed, wrong section, out-of-bounds, or duplicate); the body carries the per-record failure reasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteAppVerificationsResponse'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Credentialing workflow not found
          content:
            application/json: {}
        '503':
          description: Feature disabled by kill switch
          content:
            application/json: {}
        '500':
          description: Internal server error
          content:
            application/json: {}
      security:
      - jwt: []
