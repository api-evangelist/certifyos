          examples:
          - - cp_123456
            - cp_789012
        filter:
          type: string
          description: 'Filter criteria as JSON string (URL encoded). Used to find practitioners when isSelectAll is true. Practitioner IDs from matching practitioners will be used to create new workflows. See GET /practitioners endpoint documentation for filter format. Filterable fields include: data.npi, data.firstName, data.lastName.'
          examples:
          - '{"data.npi":{"eq":"1234567890"}}'
        isSelectAll:
          type: boolean
          description: If true, find all practitioners matching the filter criteria and create workflows for those practitioners, instead of using certifyPractitionerIds. When true, filter parameter is required and certifyPractitionerIds will be ignored.
          examples:
          - false
          default: false
    CredentialingWorkflow.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.certifyos.com/entities/CredentialingWorkflow.schema.json
      title: CredentialingWorkflow
      description: Represents the credentialing workflow data stored in the data JSON field.
      type: object
      properties:
        practitioner:
          $ref: '#/components/schemas/Practitioner.schema'
        credentialingCycle:
          description: Cycle of credentialing the provider.
          type: string
          enum:
          - INITIAL
          - RECREDENTIALING
        externalId:
          description: Entity responsible for credentialing the provider.
          type: string
        practitionerFileType:
          description: Type of practitioner file associated with this credentialing workflow.
          type: string
          enum:
          - CLEAN
          - NON_CLEAN
          - PENDING
          deprecated: true
        credentialedStates:
          description: States involved in the credentialing process.
          type: array
          items:
            type: string
          deprecated: true
        previousCredentialedDate:
          description: Date of the previous credentialing.
          type:
          - string
          - 'null'
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        credentialingDueDate:
          description: Date of the credentialing due.
          type:
          - string
          - 'null'
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        assignments:
          description: History of assignment changes for this workflow.
          type: array
          items:
            type: object
            properties:
              reason:
                description: Reason for the assignment change.
                type:
                - string
                - 'null'
              assignedBy:
                description: User or system that made the change.
                type: string
              assignedFrom:
                description: Previous assignee (if any).
                type:
                - string
                - 'null'
              assignedTo:
                description: Assignee after the change.
                type:
                - string
                - 'null'
              assignedOn:
                description: Timestamp when the change occurred.
                type: string
                format: date-time
            required:
            - assignedBy
            - assignedTo
            - assignedOn
            additionalProperties: false
        practitionerFileTypeChanges:
          description: Tracks practitionerFileType changes, with the most recent value always at index 0.
          type: array
          items:
            type: object
            properties:
              reason:
                description: Reason for the practitionerFileType change.
                type: string
              fileType:
                description: Type of practitioner file associated with this credentialing workflow.
                type: string
                enum:
                - CLEAN
                - NON_CLEAN
                - PENDING
              changedBy:
                description: User or system that made the change.
                type: string
              changedOn:
                description: Timestamp when the change occurred.
                type: string
                format: date-time
            required:
            - fileType
            - changedBy
            - changedOn
            additionalProperties: false
        credentialingCycleChangeLog:
          description: Tracks credentialingCycle changes, with the most recent value always at index 0.
          type: array
          items:
            type: object
            properties:
              reason:
                description: Reason for the credentialingCycle change.
                type:
                - string
                - 'null'
              credentialingCycle:
                description: Cycle of credentialing the provider after the change.
                type:
                - string
                - 'null'
              createdBy:
                description: User or system that created the change log entry.
                type: string
              createdAt:
                description: Timestamp when the change log entry was created.
                type: string
                format: date-time
            required:
            - credentialingCycle
            - createdBy
            - createdAt
            additionalProperties: false
        statesToCredentialChangeLog:
          description: Tracks states to credential changes, with the most recent value always at index 0.
          type: array
          items:
            type: object
            properties:
              reason:
                description: Reason for the states to credential change.
                type:
                - string
                - 'null'
              statesToCredential:
                description: States involved in the credentialing process after the change.
                type:
                - array
                - 'null'
                items:
                  type: string
              createdBy:
                description: User or system that created the change log entry.
                type: string
              createdAt:
                description: Timestamp when the change log entry was created.
                type: string
                format: date-time
            required:
            - statesToCredential
            - createdBy
            - createdAt
            additionalProperties: false
      required:
      - practitioner
      additionalProperties: false
      unevaluatedProperties: false
    PractitionerFileTypeUpdateRequest:
      description: Request to update practitioner file type in credentialing workflow
      type: object
