              - $ref: '#/components/schemas/SupportingDocumentUpdateRequest'
        required: true
      responses:
        '200':
          description: Record updated successfully
          content:
            application/json:
              examples:
                updateSectionRecordResponse:
                  value:
                    workflowId: 22222222-2222-4222-8222-222222222222
                    recordId: licenses-0
                    section: licenses
                    index: 0
                    message: Licenses record updated successfully
              schema:
                type: object
        '400':
          description: Bad request - Invalid record ID format, section name, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Credentialing workflow not found or record not found
          content:
            application/json: {}
        '409':
          description: Conflict — a concurrent writer modified this section and the retry budget was exhausted. Safe to retry the request. The error's "reason" field is WORKFLOW_CONFLICT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
          content:
            application/json: {}
      security:
      - jwt: []
    delete:
      summary: Delete a record from a named section of a credentialing workflow
      description: Deletes the section record identified by `recordId` from the specified `sectionName` of the credentialing workflow identified by `workflowId`. The `recordId` format is `{section}-{index}` (e.g. `dea-0`, `licenses-1`). Works for all sections that support record-level CRUD operations. This operation is not idempotent — a second delete for the same `recordId` returns 404.
      operationId: deleteSectionRecord
      tags:
      - CredentialingWorkflow
      parameters:
      - description: 'Record identifier format: ''{section}-{index}'' (e.g., ''appVerifications-0'')'
        example: appVerifications-0
        in: path
        required: true
        name: recordId
        schema:
          type: string
          pattern: \S
      - description: 'Section name. Available sections: appVerifications, boardCertifications, cds, dea, educationTraining, hospitalAffiliations, licenses, licensureActions, malpracticeInsurance, npdbReports, performanceIndicators, practiceLocations, professionalIds, sanctions, siteVisits, specialties, supportingDocuments'
        example: appVerifications
        in: path
        required: true
        name: sectionName
        schema:
          type: string
          pattern: \S
      - description: Credentialing workflow ID
        example: cw_1234567890
        in: path
        required: true
        name: workflowId
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Deletion metadata (intent, reason, and optional reasonText). Required for soft-delete sections; omit for hard-delete sections such as supportingDocuments.
        content:
          application/json:
            examples:
              deleteSectionRecord:
                value:
                  intent: WORKFLOW_IRRELEVANCE
                  reason: OUT_OF_CREDENTIALING_SCOPE
                  reasonText: Record no longer relevant to credentialing scope
            schema:
              $ref: '#/components/schemas/DeleteSectionRecordRequest'
        required: false
      responses:
        '200':
          description: Record deleted successfully
          content:
            application/json:
              examples:
                deleteSectionRecordResponse:
                  value:
                    workflowId: 22222222-2222-4222-8222-222222222222
                    recordId: dea-1
                    section: dea
                    index: 1
                    message: DEA record deleted successfully
              schema:
                type: object
        '400':
          description: Bad request - Invalid record ID format, section name, or missing deletion metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Credentialing workflow not found or record not found
          content:
            application/json: {}
        '409':
          description: Conflict — a concurrent writer modified this section and the retry budget was exhausted. Safe to retry the request. The error's "reason" field is WORKFLOW_CONFLICT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
          content:
            application/json: {}
      security:
      - jwt: []
