            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
      security:
      - jwt: []
  /credentialing-workflows/timeline-events/latest:
    get:
      summary: Get latest timeline events for credentialing workflows
      description: Returns the most recent timeline event (by creation date) for each requested credentialing workflow ID, including data.changeReason when present. Accepts 1–10 workflow IDs. If a workflow has no timeline events, that ID is still included with an error message; other IDs are unaffected (partial success).
