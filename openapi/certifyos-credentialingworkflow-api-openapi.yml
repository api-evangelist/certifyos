  /credentialing-workflows/{id}/latest-psv-pdf:
    get:
      summary: Retrieve the path of the latest PSV PDF for a workflow
      description: 'Returns the storage path of the most recently generated Provider Summary Verification (PSV) PDF for the credentialing workflow identified by `id`, without triggering a new generation. Use `POST /credentialing-workflows/{id}/generate-psv` to generate a new PSV. Returns 200 with `{workflowId, psvPdfPath}` when a completed PSV PDF is available. Returns 202 with `{workflowId, status: "GENERATING"}` when a PSV generation is currently in progress for the latest status transition — poll this endpoint again after a delay. Returns 404 when no PSV PDF has ever been generated for this workflow; call `generate-psv` to create one.'
      operationId: getLatestPsvPdf
      tags:
      - CredentialingWorkflow
      parameters:
      - description: ID of the credentialing workflow
        in: path
        required: true
        name: id
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
        '200':
          description: Successfully retrieved the latest PSV PDF path
          content:
            application/json:
              examples:
                getLatestPsvPdfResponse:
                  value:
                    psvPdfPath: practitioner-psv/example-tenant/example-practitioner/psv_merged_example.pdf
                    workflowId: 22222222-2222-4222-8222-222222222222
              schema:
                type: object
        '202':
          description: PSV PDF is being generated for the latest status transition
          content:
            application/json: {}
        '404':
          description: No PSV PDF found for this workflow
          content:
            application/json: {}
      security:
      - jwt: []
