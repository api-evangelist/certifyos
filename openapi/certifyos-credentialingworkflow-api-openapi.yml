    BulkCreateAssignmentRequest:
      type: object
      required:
      - assignedTo
      description: Request to create assignments for multiple credentialing workflows
      properties:
        workflowIds:
          type: array
          examples:
          - - 44c8fa75-15a1-4790-a0dd-139058d1f86d
            - 55d9fb86-26b2-5801-b1ee-240169e2f97e
          items:
            type: string
          description: List of credentialing workflow IDs to assign. Required when isSelectAll is false. Ignored when isSelectAll is true (workflow IDs will be fetched using the filter).
        assignedTo:
          type: array
          examples:
          - - user_123456
            - user_789012
          items:
            type: string
          description: List of user IDs to assign workflows to. Workflows will be evenly distributed across these users. If empty array, all workflows will be unassigned (assignedTo set to null).
        reason:
          type: string
          examples:
          - Load balancing
          description: Optional reason for the assignment
        filter:
          type: string
          examples:
          - '{"data.credentialingStatus":{"eq":"PENDING"}}'
          description: Filter criteria as JSON string (URL encoded). Used to fetch workflow IDs when isSelectAll is true. See GET /credentialing-workflows endpoint documentation for filter format.
        isSelectAll:
          type: boolean
          examples:
          - false
          description: If true, fetch all workflow IDs matching the filter criteria instead of using workflowIds. When true, filter parameter is required and workflowIds will be ignored.
          default: false
    GetCredentialingWorkflowResponse:
      type: object
      description: Response containing a single credentialing workflow
      properties:
        id:
          type: string
          examples:
          - '1234'
          description: Unique identifier for the credentialing workflow
        tenantId:
          type: string
          examples:
          - tenant_123456
          description: ID of the tenant
        tenantPractitionerId:
          type: string
          examples:
          - tp_123456
          description: ID of the tenant practitioner
        certifyPractitionerId:
          type: string
          examples:
          - cp_123456
          description: Certify practitioner ID
        data:
          $ref: https://schemas.certifyos.com/api-contracts/response/CredentialingWorkflowResponse.schema.json
          examples:
          - id: 22222222-2222-4222-8222-222222222222
            tenantId: 11111111-1111-4111-8111-111111111111
            certifyPractitionerId: 66666666-6666-4666-8666-666666666666
            data:
              credentialingCycle: INITIAL
              practitioner:
                firstName: Jane
                lastName: Example
                npi: '1999999999'
            additionalInfo:
              source: ROSTER
              sourceId: R12345:42
            psvSummary:
              fileType:
                value: NON_CLEAN
                frozen: false
                reasons:
                - psvType: State License
                  description: License is expired
              psvProgression: null
              psvVerification:
                outcome: VERIFIED_WITH_EXCEPTIONS
                exceptions:
                - psvType: NPDB
                  description: NPDB report has not returned
          description: Credentialing workflow data including practitioner information and computed fields
        deletedData:
          $ref: '#/components/schemas/JsonNode'
          type: object
          description: Soft-deleted records archived from this workflow's sections
        createdBy:
          type: string
          examples:
          - user_123456
          description: ID of the user who created the credentialing workflow
        updatedBy:
          type: string
          examples:
          - user_123456
          description: ID of the user who updated the credentialing workflow
        createdAt:
          $ref: '#/components/schemas/Instant'
          type: string
          examples:
          - '2021-01-01T00:00:00Z'
          description: Timestamp of the credentialing workflow creation
        updatedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          examples:
          - '2021-01-01T00:00:00Z'
          description: Timestamp of the credentialing workflow update
        applicationCompleteDate:
          $ref: '#/components/schemas/Instant'
          type: string
          examples:
          - '2021-01-01T00:00:00Z'
          description: Timestamp when the practitioner's application was marked complete
        applicationCompleteSource:
          type: string
          examples:
          - WORKFLOW_CREATED
          description: 'Source that marked the application complete (one of: WORKFLOW_CREATED, NO_SECTION_B_OUTREACH, LATEST_INFORMATION_RECEIVED_EMAIL, LATEST_INFORMATION_RECEIVED_CAQH, NO_VALID_RESPONSE, CANCELLED_BEFORE_PSV)'
        anchorGroupId:
          type: string
          examples:
          - ag_123456
          description: 'NSCP: the Anchor Group this workflow belongs to. Stamped at creation for every shared-eligible workflow (any credentialing cycle); null = not a shared credentialing workflow. Read-only — set by the platform, never by callers.'
        sharedCredWorkflowId:
          type: string
          examples:
          - scw_123456
          description: 'NSCP: the shared credentialing run this workflow belongs to. Stamped at creation together with anchorGroupId; null = standalone. Read-only.'
        additionalInfo:
          $ref: '#/components/schemas/CredentialingWorkflowAdditionalInfo'
          type: object
          description: Where the workflow was created from; omitted when it was created directly
        psvSummary:
          $ref: '#/components/schemas/PsvSummary'
          type: object
          description: PSV transparency values as the workflow's PSV packet shows them (File Type, PSV Progression, PSV Verification). Omitted unless the tenant is switched on for PSV transparency.
    StatusOption:
      type: object
      description: Status option with required and optional fields
      properties:
        name:
          type: string
          examples:
          - CRED_APPROVED
          description: Status name
        required:
          type: array
          examples:
          - - name
            - credentialingDecisionDate
          items:
            type: string
          description: List of required field names for this status
        optional:
          type: array
          examples:
          - - nextCredentialingDate
          items:
            type: string
          description: List of optional field names for this status
