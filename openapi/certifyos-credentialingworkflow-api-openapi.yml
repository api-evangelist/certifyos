  /credentialing-workflows/{workflowId}/{sectionName}/bulk-delete:
    post:
      summary: Bulk-delete records from one credentialing workflow section
      description: 'Deletes multiple records from a single section in one action (CP-36357, CP-37276). The supported sections are enumerated on the sectionName parameter; any other section is rejected with 400. Each recordId uses the ''{section}-{index}'' format (e.g. ''practiceLocations-3'') and its section must match the sectionName path parameter, so a request can never delete outside the section it targets. Deletion is a single read-modify-write and soft-deletes the records: each removed record is archived into deletedData with the supplied intent/reason/reasonText, exactly as the single-record delete does. Partial failures (malformed, wrong section, out-of-bounds recordIds) are reported per record and do not block the valid deletions. NOTE: recordIds are positional, so this request must not be retried automatically — a replay after a successful-but-unseen response would delete whatever records shifted into those indices. Re-fetch the section and rebuild recordIds before any retry.'
      operationId: bulkDeleteSectionRecords
      tags:
      - CredentialingWorkflow
      parameters:
      - description: 'Section to delete from. Supported sections: boardCertifications, cds, dea, educationTraining, hospitalAffiliations, licenses, licensureActions, malpracticeInsurance, npdbReports, practiceLocations, professionalIds, sanctions, specialties. Any other section is rejected with 400 — note that supportingDocuments has its own dedicated bulk-delete endpoint.'
        example: practiceLocations
        in: path
        required: true
        name: sectionName
        schema:
          type: string
          pattern: \S
      - description: Credentialing workflow ID
        example: cw_1234567890
        in: path
        required: true
        name: workflowId
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Record identifiers to delete, in '{section}-{index}' format, plus the deletion metadata applied to every record in the batch
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteSectionRecordsRequest'
        required: true
      responses:
        '200':
          description: At least one record was deleted; body reports the deleted and failed records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteSectionRecordsResponse'
        '400':
          description: Unsupported section, empty/blank/invalid recordIds, invalid deletion metadata, a blank tenant-id, or a missing request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '422':
          description: No record was deleted — every recordId failed (malformed, wrong section, or out-of-bounds); the body carries the per-record failure reasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteSectionRecordsResponse'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Credentialing workflow not found
          content:
            application/json: {}
        '503':
          description: Feature disabled by kill switch
          content:
            application/json: {}
        '500':
          description: Internal server error
          content:
            application/json: {}
