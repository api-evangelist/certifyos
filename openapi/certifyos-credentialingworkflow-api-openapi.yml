          - - a2b4f213-f56e-49b7-9ffe-070ff70f0539
            - b3c5f324-f67e-49b8-0aff-181ff81f1640
          items:
            type: string
            pattern: \S
          description: List of credentialing workflow IDs to update. Required when isSelectAll is false. Ignored when isSelectAll is true (workflow IDs will be fetched using the filter).
        timelineEventData:
          $ref: '#/components/schemas/CreateTimelineEventRequest'
          type: object
          description: Timeline event data to apply to all workflows
        filter:
          type: string
          examples:
          - '{"data.credentialingStatus":{"eq":"PENDING"}}'
          description: Filter criteria as JSON string (URL encoded). Used to fetch workflow IDs when isSelectAll is true. See GET /credentialing-workflows endpoint documentation for filter format.
        isSelectAll:
          type: boolean
          examples:
          - false
          description: If true, fetch all workflow IDs matching the filter criteria instead of using workflowIds. When true, filter parameter is required and workflowIds will be ignored.
          default: false
