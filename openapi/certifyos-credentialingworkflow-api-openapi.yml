  /credentialing-workflows/{workflowId}/file-type-verdict:
    get:
      summary: Read the Clean / Non-Clean verdict and its reasons
      description: 'Returns the file-type verdict of the credentialing workflow identified by `workflowId` as a typed view: the displayed verdict (the analyst''s value in force, else the derived one; PENDING before PSV Complete), whether it is frozen and why, the platform findings with their `ruleKey` and whether each is hidden from the packet, the newest analyst change, the verdict derived at PSV Complete, and `evaluation` (DERIVED, NOT_EVALUATED for Couldn''t evaluate, or null). The same shape as `fileType` on the shared members read. Works for standalone workflows and a shared member''s own tenant page. Answers 404 when PSV transparency is not switched on for the tenant.'
      operationId: getFileTypeVerdict
      tags:
      - CredentialingWorkflow
      parameters:
      - description: ID of the credentialing workflow
        in: path
        required: true
        name: workflowId
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - the caller lacks credentialing-workflow:read in the tenant-id header's tenant
        '200':
          description: The verdict view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedMemberFileTypeDto'
        '404':
          description: 'Credentialing workflow not found in this tenant, or FILE_TYPE_VERDICT_NOT_ENABLED: PSV transparency is not switched on for this tenant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
      - jwt:
        - R:CW
    put:
      summary: Change the Clean / Non-Clean verdict or hide its reasons
      description: 'Sets the analyst''s File Type on the credentialing workflow identified by `workflowId`, and/or which of its findings are hidden from the PSV packet, while the workflow is at PSV Complete and its verdict is not frozen. The same change as the shared page''s member File Type route, for a workflow whose tenant has PSV transparency switched on. `hiddenFindingRuleKeys` is the full set of findings to hide; without `fileType` the save is hide-only: it writes no analyst File Type, so the verdict stays the platform''s, and needs no reason. A Non-Clean change always needs a reason; a Clean change needs one while a finding stays unhidden; either needs one when the verdict could not be evaluated or there is none. Repeating the newest analyst change with the same hides is a 204 that writes nothing. A written change asks for the PSV packet to be regenerated. Answers 404 when PSV transparency is not switched on.'
      operationId: changeFileTypeVerdict
      tags:
      - CredentialingWorkflow
      parameters:
      - description: ID of the credentialing workflow
        in: path
        required: true
        name: workflowId
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileTypeVerdictChangeRequest'
        required: true
      responses:
        '204':
          description: The change was written, or the same change was already in place
        '400':
          description: 'VALIDATION_ERROR: neither fileType nor hiddenFindingRuleKeys, an unknown fileType, a reason over 1000 characters, more than 50 or blank hide keys, or a hide key that is not one of the workflow''s findings. FILE_TYPE_REASON_REQUIRED: the reason rule refused. WORKFLOW_NOT_EDITABLE: the workflow is not at PSV Complete, or its verdict is frozen'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - the caller lacks the File Type permission in the tenant-id header's tenant
        '404':
          description: 'Credentialing workflow not found in this tenant, or FILE_TYPE_VERDICT_NOT_ENABLED: PSV transparency is not switched on for this tenant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 'WORKFLOW_CONFLICT: a concurrent writer modified this workflow and the retry budget was exhausted; safe to retry'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
      - jwt:
        - U:CW
  /credentialing-workflows/{workflowId}/file-type-verdict/evaluate:
    post:
      summary: Retry the file-type verdict that could not be evaluated
      description: 'Evaluates the clean / non-clean rules again for the workflow identified by `workflowId` when its file-type verdict could not be evaluated, and stores the result. Synchronous: bounded by the rule-engine timeout plus a read and a write. The workflow must be at PSV Complete with a verdict that is not frozen. A verdict that is already derived answers DERIVED without calling the rules engine; a workflow at PSV Complete with no verdict yet is evaluated. Re-read the workflow for the value.'
      operationId: evaluateFileTypeVerdict
      tags:
      - CredentialingWorkflow
      parameters:
      - description: ID of the credentialing workflow
        in: path
        required: true
        name: workflowId
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - the caller lacks the File Type permission in the tenant-id header's tenant
        '200':
          description: 'The verdict''s state after the call: DERIVED, or NOT_EVALUATED when the evaluation still could not run'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTypeVerdictEvaluateResponse'
        '404':
          description: 'Credentialing workflow not found in this tenant, or FILE_TYPE_VERDICT_NOT_ENABLED: PSV transparency is not switched on for this tenant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 'FILE_TYPE_VERDICT_NOT_RETRYABLE: the workflow is not at PSV Complete, its verdict is frozen, or it moved on during the call'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
      - jwt:
        - U:CW
