openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer Webhook API
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: Webhook
  description: APIs for managing webhook entities
paths:
  /webhooks:
    get:
      summary: Find Webhooks by filter criteria with pagination and sorting
      description: Returns a paginated filtered list of all Webhooks based on the provided criteria. Supports both offset-based (page/size) and cursor-based (startAfter/endAt) pagination. Results can be sorted by any Webhook field using the order parameter.
      operationId: webhookFindMany
      tags:
      - Webhook
      parameters:
      - description: End at document ID, for backward cursor-based pagination
        name: endAtId
        in: query
        schema:
          type: string
      - description: 'Filter criteria. The filter parameter must be URL encoded when sent.


          Examples (before URL encoding):


          - Filter by tenant: `{"tenantId":{"eq":"tenant-123"}}`


          - Filter by event type: `{"data.eventTypes":{"contains":"credential_workflow.status.changed"}}`


          - Filter by active status: `{"data.isActive":{"eq":true}}`


          - Combined filter: `{"tenantId":{"eq":"tenant-123"},"data.eventTypes":{"contains":"event.type"},"data.isActive":{"eq":true}}`


          Example curl commands:


          ```bash


          # Filter by tenant and event type


          curl -X GET ''http://localhost:8080/webhooks?filter=%7B%22tenantId%22%3A%7B%22eq%22%3A%22tenant-123%22%7D%2C%22data.eventTypes%22%3A%7B%22contains%22%3A%22credential_workflow.status.changed%22%7D%7D''


          ```


          Available filter operations:


          - eq: Equal to


          - neq: Not equal to


          - in: Value must be one of these (array)


          - nin: Value must not be any of these (array)


          - contains: String contains (case-sensitive, string fields only) or array contains (for data.eventTypes)


          Filterable fields:


          - tenantId: Tenant identifier (String)


          - data.eventTypes: Array of event types (Array - supports contains, eq, in)


          - data.isActive: Whether the webhook is active (Boolean - supports eq, neq)


          - data.webhookUrl: Webhook URL (String - optional)


          Note: When using the filter parameter in a browser or code, make sure to properly URL encode the JSON string.


          '
        name: filter
        schema:
          type: string
        in: query
      - description: 'Sort criteria. The order parameter must be URL encoded when sent.


          Example (before URL encoding):


          - Sort by createdAt descending: `{"orderBy":"createdAt","orderByDirection":"DESC"}`


          Example curl command:


          ```bash


          # Sort by createdAt descending


          curl -X GET ''http://localhost:8080/webhooks?order=%7B%22orderBy%22%3A%22createdAt%22%2C%22orderByDirection%22%3A%22DESC%22%7D''


          ```


          Note: When using the order parameter in a browser or code, make sure to properly URL encode the JSON string.


          '
        name: order
        schema:
          type: string
        in: query
      - description: Page number (0-based), for offset-based pagination
        name: page
        in: query
        schema:
          type: integer
          format: int32
      - description: Page size
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: '50'
      - description: Start after document ID, for forward cursor-based pagination
        name: startAfterId
        in: query
        schema:
          type: string
      - description: Tenant ID
        in: header
        required: true
        name: tenant-id
        schema:
          type: string
      responses:
        '200':
          description: List of Webhooks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebhooksResponse'
        '400':
          description: Invalid filter criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
      - jwt: []
    post:
      summary: Create a new webhook
      description: 'Creates a new webhook subscription with the provided details. The webhook will receive events asynchronously when the specified event types occur.


        **Available Event Types:**


        - `credential_workflow.status.changed` - Triggered automatically when a credentialing workflow status changes (timeline event is created). See webhook-api-credential-workflow-events.md for detailed payload structure and documentation.


        - `facility_credential_workflow.status.changed` - Triggered automatically when a facility credentialing workflow status changes (timeline event is created).


        - `form.submission.submitted` - Triggered when a form submission is received by POST /forms/submissions.


        - `roster_job.status.changed` - Triggered when a roster job reaches a client-facing status (PENDING_CORRECTION, PENDING_APPROVAL, IMPORTED, FAILED).


        - `facility.global_termination.completed` - Triggered once per facility when a facility global termination (POST /facilities/terminate) completes. Payload: `certifyFacilityId`, `facilityName`, `npi`, `tin`, `terminationDate`, `terminationReason`, `status`. A global termination ends everything the facility has, so there is no per-location detail. `facilityName`, `npi` and `tin` are read from the facility and are `null` when unavailable.


        - `practitioner.terminated` - Triggered when a practitioner is terminated, for all 9 `terminationType` values accepted by PUT /practitioners/terminate (including `FULL_EXIT`, the full-departure case) and for roster STOP rows. Payload: `certifyPractitionerId`, `npi`, `terminationType`, `terminationDate`, `terminationReason`; keys are always present, with an explicit `null` where a value is unknown or not applicable. Note that PUT /practitioners/terminate-partial emits one event per terminated scope, so a single request there can produce several events.


        You can subscribe to multiple different event types in a single webhook.


        **Custom event types are accepted.** `eventTypes` is an open namespace: any lowercase `domain.entity.action` value of 2-4 dot-separated segments may be registered, and triggered with POST /webhooks/events. Matching is exact and case-sensitive.'
      operationId: createWebhook
      tags:
      - Webhook
      parameters:
      - description: Tenant ID
        in: header
        required: true
        name: tenant-id
        schema:
          type: string
      requestBody:
        description: Webhook creation request data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
        required: true
      responses:
        '201':
          description: Successfully created the webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Invalid request data. Returns constraint violations for an empty eventTypes list, an event type that is not 2-4 lowercase dot-separated segments, or an invalid URL format, as well as validation errors for deserialization failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
      - jwt: []
  /webhooks/events:
    post:
      summary: Trigger a webhook event for a tenant's subscriptions
      description: 'Publishes an event to every active webhook in the tenant that subscribes to the given event type. Delivery is asynchronous: a 202 means the event was accepted and handed to the delivery pipeline, not that subscribers have received it.


        **Event types are an open namespace.** Any lowercase `domain.entity.action` value of 2-4 dot-separated segments is accepted. The value is not checked against a list of known events — a webhook receives the event if, and only if, it was registered for that exact string. Matching is exact and case-sensitive: a webhook registered only for `facility_credential_workflow.status.changed` does not receive `credential_workflow.status.changed`.


        **`matchedWebhooks` is not a delivery receipt.** It reports how many active subscriptions matched at the moment the request was accepted. Delivery repeats the lookup, so the set can change in between. Its purpose is to surface typos: because the namespace is open, a misspelled event type is accepted and then matches nothing. `matchedWebhooks: 0` is the signal — it is still a 202, because having no subscribers is a valid state. A value of `-1` means the subscription lookup itself failed; the event was still published.


        **Tenant scoping.** The event is published for the tenant in the `tenant-id` header, and the caller must hold `webhook:trigger` in that tenant. A caller cannot trigger events for a tenant it does not have access to.


        **Payload limits.** `eventData` is delivered verbatim and is not schema-validated. It must serialize to no more than `webhook.trigger-api.max-payload-bytes` (256 KiB by default); a larger payload is rejected with 400 and nothing is published.


        **What subscribers receive:**


        ```json

        {

        "eventType": "domain.entity.action",

        "timestamp": "2026-09-23T09:15:00Z",

        "data": { /* your eventData, verbatim */ }

        }

        ```

        with `Content-Type: application/json`, `User-Agent: CertifyOS-Webhook-Delivery/1.0`, an `Idempotency-Key` that is stable across retries, and any headers configured on the subscription.'
      operationId: triggerWebhookEvent
      tags:
      - Webhook
      parameters:
      - description: Tenant ID
        in: header
        required: true
        name: tenant-id
        schema:
          type: string
      requestBody:
        description: Event type and payload to deliver
        content:
          application/json:
            examples:
              genericEvent:
                value:
                  eventType: domain.entity.action
                  eventData:
                    id: abc123
                    status: completed
            schema:
              $ref: '#/components/schemas/TriggerEventRequest'
        required: true
      responses:
        '202':
          description: Event accepted for asynchronous delivery
          content:
            application/json:
              examples:
                matched:
                  summary: Event matched three subscriptions
                  value:
                    eventId: '11827280442334'
                    eventType: domain.entity.action
                    matchedWebhooks: 3
                    message: Event accepted for delivery
                noSubscribers:
                  summary: Accepted, but nothing is subscribed - check for a typo
                  value:
                    eventId: '11827280442335'
                    eventType: domain.entity.actoin
                    matchedWebhooks: 0
                    message: Event accepted for delivery
              schema:
                $ref: '#/components/schemas/TriggerEventResponse'
        '400':
          description: Malformed event type, missing eventData, or payload over the size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Caller lacks webhook:trigger in this tenant
        '503':
          description: The trigger API is disabled in this environment (webhook.trigger-api.enabled=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
      - jwt: []
  /webhooks/replay/practitioner-terminated:
    post:
      summary: Replay practitioner.terminated webhooks for given practitioners
      description: 'Accepts a list of `certifyPractitionerId`s and asynchronously republishes the `practitioner.terminated` event for each one. Returns 202 immediately; replay runs in the background and there is no polling endpoint to track completion. Progress is logged server-side under the `[termination-webhook-replay]` prefix.


        Each event is rebuilt from the practitioner''s current record (`npi`, `terminationDate`, `terminationReason`), so subscribers receive the same payload shape as the original delivery. **Exception:** `terminationType` is not persisted with the termination and cannot be reconstructed — the replayed payload carries the `terminationType` supplied in this request, or an explicit `null` when it is omitted.


        A practitioner with no recorded `terminationDate` is skipped rather than published: there is no termination to report. Ids that cannot be loaded are logged and skipped so one bad entry cannot abort the batch.


        **This delivers to live subscriber endpoints.** Replays are published on the dedicated overflow queue so a large batch cannot starve normal single-event delivery, and are capped at 500 practitioners per request.'
      operationId: replayPractitionerTerminatedWebhooks
      tags:
      - Webhook
      parameters:
      - description: Tenant ID
        in: header
        required: true
        name: tenant-id
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayTerminationWebhooksRequest'
        required: true
      responses:
        '202':
          description: Replay accepted and processing in the background
          content:
            application/json:
              examples:
                replayAccepted:
                  value:
                    message: Webhook replay accepted. Processing 2 practitioners in the background.
                    practitionerCount: 2
        '400':
          description: Invalid request - empty certifyPractitionerIds, a blank id, or more than 500 entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
      - jwt: []
  /webhooks/test/publish:
    post:
      summary: Trigger manual webhook event to registered subscriptions
      description: 'Triggers a manual webhook event for the specified event type. Publishes a lightweight event message to Pub/Sub. The consumer will look up active webhooks for the tenant and deliver the event to them asynchronously.


        **Schema Validation:**


        Each event type has a corresponding JSON Schema that defines the required structure for eventData. The eventData payload is validated against the schema for the specified eventType. Invalid payloads will return a 400 Bad Request with detailed validation error messages.


        **Supported Event Types and Schemas:**


        - `credential_workflow.status.changed` → https://schemas.certifyos.com/webhook-events/credential-workflow-status-changed.schema.json


        - `facility_credential_workflow.status.changed` → https://schemas.certifyos.com/webhook-events/facility-credential-workflow-status-changed.schema.json


        - `form.submission.submitted` → data: { form: { id, versionId, label }, submissionId } (published by POST /forms/submissions; not schema-validated on this path yet)


        - `roster_job.status.changed` → roster job status-change metadata (rosterJobId, client-facing status, record counts, exportUrl); not schema-validated on this path yet


        - `facility.global_termination.completed` → data: { certifyFacilityId, facilityName, npi, tin, terminationDate, terminationReason, status } (published by POST /facilities/terminate; not schema-validated on this path yet)


        - `practitioner.terminated` → data: { certifyPractitionerId, npi, terminationType, terminationDate, terminationReason } (published by PUT /practitioners/terminate and by roster STOP rows; not schema-validated on this path yet). To re-drive real terminations rather than hand-build one here, use POST /webhooks/replay/practitioner-terminated.


        **What the webhook receiver will receive:**


        **HTTP Headers:**


        - `Content-Type: application/json`


        - `User-Agent: CertifyOS-Webhook-Delivery/1.0`


        - `Idempotency-Key: ` - A unique key for deduplication (same key across retries)


        - Any custom headers configured in the webhook subscription


        **Request Body (JSON):**


        ```json

        {

        "eventType": "credential_workflow.status.changed",

        "timestamp": "2024-01-20T09:15:00Z",

        "data": { /* your eventData payload */ }

        }

        ```


        The `data` field contains the `eventData` from your request payload. The `timestamp` is automatically set to the current time when the event is delivered.


        **Example delivered body — `form.submission.submitted`:**


        ```json

        {

        "eventType": "form.submission.submitted",

        "timestamp": "2026-04-21T06:25:51Z",

        "data": {

        "form": { "id": "...", "versionId": "...", "label": "practitioner" },

        "submissionId": "..."

        }

        }

        ```'
      operationId: triggerManualWebhookEvent
      tags:
      - Webhook
      parameters:
      - description: Tenant ID
        in: header
        required: true
        name: tenant-id
        schema:
          type: string
      requestBody:
        description: 'Manual webhook event data. Each event type has a corresponding JSON Schema that

          validates the eventData payload structure.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualWebhookEventRequest'
        required: true
      responses:
        '200':
          description: Successfully published webhook event to Pub/Sub
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
      - jwt: []
  /webhooks/{id}:
    delete:
      summary: Delete a Webhook
      description: Deletes a Webhook by their ID
      operationId: webhookDelete
      tags:
      - Webhook
      parameters:
      - description: ID of Webhook to delete
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: Tenant ID
        in: header
        required: true
        name: tenant-id
        schema:
          type: string
      responses:
        '204':
          description: Webhook successfully deleted
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '500':
          description: Internal Server Error - An unexpected error occurred
      security:
      - jwt: []
components:
  schemas:
    ApiError:
      type: object
      description: Standard API error response containing a list of error objects
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
          description: List of error objects describing validation or processing failures
    JsonNode:
      type: object
      properties:
        empty:
          type: boolean
        valueNode:
          type: boolean
        containerNode:
          type: boolean
        missingNode:
          type: boolean
        array:
          type: boolean
        object:
          type: boolean
        nodeType:
          $ref: '#/components/schemas/JsonNodeType'
        pojo:
          type: boolean
        number:
          type: boolean
        integralNumber:
          type: boolean
        floatingPointNumber:
          type: boolean
        short:
          type: boolean
        int:
          type: boolean
        long:
          type: boolean
        float:
          type: boolean
        double:
          type: boolean
        bigDecimal:
          type: boolean
        bigInteger:
          type: boolean
        textual:
          type: boolean
        boolean:
          type: boolean
        'null':
          type: boolean
        binary:
          type: boolean
    TriggerEventResponse:
      type: object
      description: Result of accepting a webhook event for asynchronous delivery
      properties:
        eventId:
          type: string
          examples:
          - '11827280442334'
          description: Pub/Sub message ID for this event. Correlates with delivery logs and with the Idempotency-Key sent to subscribers.
        eventType:
          type: string
          examples:
          - domain.entity.action
          description: Event type that was accepted
        matchedWebhooks:
          type: integer
          format: int32
          examples:
          - 3
          description: Active webhooks matching this event type at accept time. Not a delivery guarantee. A value of 0 usually means the event type is misspelled or nothing is subscribed to it; -1 means the subscription lookup failed and the count is unknown (the event was still published).
        message:
          type: string
          examples:
          - Event accepted for delivery
          description: Human-readable outcome
    TriggerResponse:
      type: object
      description: Response for manual webhook event triggering
      properties:
        message:
          type: string
          description: Success message
        eventType:
          type: string
          description: Event type that was triggered. The set of values can grow as new event types are added, so clients should tolerate values they do not recognise.
          x-extensible-enum:
          - credential_workflow.status.changed
          - facility_credential_workflow.status.changed
          - form.submission.submitted
          - facility.global_termination.completed
          - practitioner.terminated
          - roster_job.status.changed
    Instant:
      type: string
      format: date-time
      examples:
      - '2022-03-10T16:15:50Z'
    ManualWebhookEventRequest:
      type: object
      required:
      - eventType
      - eventData
      description: Request payload for manual webhook event triggering
      properties:
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
          type: string
          examples:
          - credential_workflow.status.changed
          description: 'Event type identifier. Each event type has a corresponding JSON Schema that defines

            the required structure for eventData. See WebhookEventType enum for available event types.'
        eventData:
          $ref: '#/components/schemas/JsonNode'
          type: object
          description: 'Event-specific payload data. Currently only `credential_workflow.status.changed` is validated against a published JSON Schema on this path: invalid payloads for that type return a 400 Bad Request with detailed validation error messages (see the Supported Event Types and Schemas section above for its schema URL). Other event types (e.g. `facility_credential_workflow.status.changed`, `form.submission.submitted`, `facility.global_termination.completed`, `practitioner.terminated`) are not schema-validated here today and are published as provided.'
    BadRequestErrorResponse:
      type: object
      description: Standard error response structure for 400 Bad Request validation and client errors
      properties:
        errors:
          type: array
          examples:
          - - Validation failed
            - Required field missing
          items:
            type: string
          description: List of error messages
        errorDetails:
          type: object
          description: Detailed error information with specific validation failures
    WebhookEventType:
      type: string
      enum:
      - credential_workflow.status.changed
      - facility_credential_workflow.status.changed
      - form.submission.submitted
      - facility.global_termination.completed
      - practitioner.terminated
      - roster_job.status.changed
    WebhookResponse:
      type: object
      description: Response containing a single webhook
      properties:
        id:
          type: string
          examples:
          - webhook-123
          description: Unique identifier for the webhook
        tenantId:
          type: string
          examples:
          - tenant-123
          description: ID of the tenant
        data:
          $ref: https://schemas.certifyos.com/entities/Webhook.data.schema.json
          type: object
          description: Webhook data
        createdBy:
          type: string
          examples:
          - user-123
          description: ID of the user who created the webhook
        updatedBy:
          type: string
          examples:
          - user-123
          description: ID of the user who updated the webhook
        createdAt:
          $ref: '#/components/schemas/Instant'
          type: string
          examples:
          - '2021-01-01T00:00:00Z'
          description: Timestamp of the webhook creation
        updatedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          examples:
          - '2021-01-01T00:00:00Z'
          description: Timestamp of the webhook update
    WebhookOauthConfiguration:
      type: object
      required:
      - tokenUrl
      - clientId
      - clientSecret
      description: 'OAuth client-credentials configuration. When present, a token is fetched before each delivery and injected as Authorization: Bearer <token>.'
      properties:
        tokenUrl:
          type: string
          examples:
          - https://auth.example.com/oauth/token
          pattern: ''
          description: OAuth token endpoint URL
        clientId:
          type: string
          pattern: \S
          description: OAuth client ID
        clientSecret:
          type: string
          pattern: \S
          description: OAuth client secret
        scope:
          type: string
          description: OAuth scope(s) to request, space-separated
        headers:
          type: object
          additionalProperties:
            type: string
          description: Additional headers to send with the token request
        resource:
          type: string
          examples:
          - resource
          description: Resource to request
    JsonNodeType:
      type: string
      enum:
      - ARRAY
      - BINARY
      - BOOLEAN
      - MISSING
      - 'NULL'
      - NUMBER
      - OBJECT
      - POJO
      - STRING
    GetWebhooksResponse:
      type: object
      description: Response containing a paginated list of webhooks
      properties:
        totalCount:
          type: integer
          format: int64
          examples:
          - 100
          description: Total count of webhooks
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookResponse'
          description: Array of webhook records
    ErrorObject:
      type: object
      description: Individual error object containing details about a specific validation or processing error
      properties:
        httpStatus:
          type: integer
          format: int32
          examples:
          - 400
          description: HTTP status code for this error
        reason:
          type: string
          examples:
          - VALIDATION_ERROR
          description: Error reason/code
        title:
          type: string
          examples:
          - 'Validation failed for field: eventTypes'
          description: Error title/summary
        detail:
          type: string
          examples:
          - eventTypes is required and cannot be empty or null
          description: Detailed error message
        rejectedValue:
          type: string
          description: The value that was rejected, omitted for sensitive fields such as SSN
    TriggerEventRequest:
      type: object
      required:
      - eventType
      - eventData
      description: Request to trigger a webhook event for all of a tenant's matching subscriptions
      properties:
        eventType:
          type: string
          examples:
          - domain.entity.action
          maxLength: 100
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,3}$
          description: Event type to trigger. Any lowercase domain.entity.action value of 2-4 segments is accepted; webhooks registered for this exact value receive it.
        eventData:
          type: object
          description: Arbitrary JSON payload delivered verbatim as the 'data' member of the webhook envelope. Not schema-validated - any JSON object is accepted.
    ReplayTerminationWebhooksRequest:
      type: object
      required:
      - certifyPractitionerIds
      description: Request to replay practitioner.terminated webhooks for already-terminated practitioners
      properties:
        certifyPractitionerIds:
          type: array
          maxItems: 500
          minItems: 1
          examples:
          - - cert_9d2e3f4a5b6c4d7e8f9a
            - cert_1a2b3c4d5e6f7a8b9c0d
          items:
            type: string
          description: Practitioners to replay the termination event for. Each must already be terminated; ids with no recorded terminationDate are skipped.
        terminationType:
          type: string
          examples:
          - FULL_EXIT
          description: 'Termination type to stamp on the replayed events. Optional: `terminationType` is not persisted with the termination, so it cannot be reconstructed. When omitted the replayed payload carries an explicit `null` for this field; every other field is rebuilt from the practitioner''s current record.'
    WebhookRequest:
      type: object
      required:
      - webhookUrl
      - eventTypes
      description: Request to create a new webhook
      properties:
        webhookUrl:
          type: string
          examples:
          - https://example.com/webhook
          pattern: ^https?://[^\s]+$
          description: The URL where webhook events will be sent
        eventTypes:
          type: array
          minItems: 1
          examples:
          - - credential_workflow.status.changed
            - domain.entity.action
          items:
            type: string
            maxLength: 100
            pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,3}$
          description: "Event types this webhook should receive. A webhook receives an event if, and only if, the event type matches one of these strings **exactly** (case-sensitive).\n\n\n**Open namespace.** Any lowercase `domain.entity.action` value of 2-4 dot-separated segments is accepted, so you can subscribe to your own events and publish them via POST /webhooks/events without a change to this service.\n\n\n**Event types published by CertifyOS:**\n\n- `credential_workflow.status.changed` - Triggered automatically when a credentialing workflow status changes (timeline event is created). See webhook-api-credential-workflow-events.md for detailed payload structure and documentation.\n\n- `facility_credential_workflow.status.changed` - Triggered automatically when a facility credentialing workflow status changes.\n\n- `form.submission.submitted` - Triggered when a form submission is received by POST /forms/submissions.\n\n- `roster_job.status.changed` - Triggered when a roster job reaches a client-facing status (PENDING_CORRECTION, PENDING_APPROVAL, IMPORTED, FAILED).\n\n- `facility.global_termination.completed` - Triggered once per facility when a facility global termination (POST /facilities/terminate) completes. Payload: `certifyFacilityId`, `facilityName`, `npi`, `tin`, `terminationDate`, `terminationReason`, `status`. A global termination ends everything the facility has, so there is no per-location detail. `facilityName`, `npi` and `tin` are read from the facility and are `null` when unavailable. \n\n- `practitioner.terminated` - Triggered when a practitioner is terminated via PUT /practitioners/terminate (any of the 9 `terminationType` values, including `FULL_EXIT`) or by a roster STOP row. Payload: `certifyPractitionerId`, `npi`, `terminationType`, `terminationDate`, `terminationReason`. Keys are always present; a value that is unknown or not applicable is sent as an explicit `null`."
        headers:
          type: object
          examples:
          - Authorization: Bearer token
            X-Custom-Header: custom-value
          additionalProperties:
            type: string
          description: Custom headers to include in webhook requests
        isActive:
          type: boolean
          examples:
          - true
          description: Whether the webhook is active. Defaults to true if not provided
        oauthConfiguration:
          $ref: '#/components/schemas/WebhookOauthConfiguration'
          type: object
          description: 'Optional OAuth client-credentials configuration. When provided, a token is minted before each delivery and sent as Authorization: Bearer <token>.'
  securitySchemes:
    jwt:
      type: http
      description: JWT Authentication - Provide only the raw token without Bearer prefix
      scheme: bearer
      bearerFormat: JWT
