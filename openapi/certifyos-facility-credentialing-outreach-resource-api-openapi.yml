          description: Credentialing cycle
        credentialingStatus:
          type: string
          description: Current credentialing status
    AttachmentDownloadResponse:
      type: object
      description: Response containing presigned URL for downloading email attachment
      properties:
        url:
          type: string
          description: Presigned URL for downloading the attachment
        expiresIn:
          type: integer
          format: int32
          description: Number of hours until the URL expires
        expiresAt:
          type: integer
          format: int64
          description: Unix timestamp when the URL expires
        fileName:
          type: string
          description: Original filename of the attachment
    ErrorObject:
      type: object
      description: Individual error object containing details about a specific validation or processing error
      properties:
        httpStatus:
          type: integer
          format: int32
          examples:
          - 400
          description: HTTP status code for this error
        reason:
          type: string
          examples:
          - VALIDATION_ERROR
          description: Error reason/code
        title:
          type: string
          examples:
          - 'Validation failed for field: eventTypes'
          description: Error title/summary
        detail:
          type: string
          examples:
          - eventTypes is required and cannot be empty or null
          description: Detailed error message
        rejectedValue:
          type: string
          description: The value that was rejected, omitted for sensitive fields such as SSN
