openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer Facility Credentialing Outreach Resource…
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: Facility Credentialing Outreach Resource
paths:
  /facility-credentialing-outreaches:
    post:
      summary: Send a facility credentialing outreach email
      description: Triggers a credentialing outreach email for a facility credentialing workflow by dispatching it through SendGrid and persisting a new outreach record. This operation is not idempotent - every call sends another email and creates another outreach record. Call it after the target facility credentialing workflow already exists. For a single-workflow outreach, supply workflowId. For a multi-tenant outreach that fans out to two or more recipient workflows, supply workflowIds (two or more entries) together with initiatingWorkflowId, which must be one of the entries in workflowIds; workflowId and workflowIds are mutually exclusive. Any file attachments must already be uploaded to Google Cloud Storage before calling this endpoint - the request only references them by metadata. For multi-workflow requests only, the initiating tenant (identified by the tenant-id header) must have a fully configured outreach-settings template (subject and body) for the relevant credentialing cycle, or the request is rejected with 422; single-workflow requests do not perform this template check. Multi-workflow requests also require the OUTREACH_MULTI_TENANT_ENABLED feature flag to be enabled, or they are rejected with 503; single-workflow requests are unaffected by this flag.
      operationId: sendFacilityCredentialingOutreach
      parameters:
      - description: Tenant ID of the initiating organization. Scopes the outreach record and email dispatch to this tenant, and identifies whose outreach-settings template is applied to the send.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              singleWorkflow:
                summary: Single-workflow outreach with an attachment
                value:
                  workflowId: wf-7f3e2a1b-8c4d-4e5f-9a6b-1c2d3e4f5a6b
                  toEmails:
                  - credentialing@facility.example.com
                  subject: 'Action Required: Complete Your Facility Credentialing'
                  body: Please provide the missing documentation to continue credentialing.
                  outreachReasons:
                  - Missing malpractice insurance
                  attachments:
                  - filename: checklist.pdf
                    contentType: application/pdf
                    content: JVBERi0xLjQKJ...
              multiTenant:
                summary: Multi-tenant outreach bundling two facility workflows
                value:
                  workflowIds:
                  - wf-4d9a1c2b-7d3f-4a5e-9b8c-1f2e3d4c5b6a
                  - wf-9c2e5a7b-3f1d-4c6e-8a9b-2d3e4f5a6b7c
                  initiatingWorkflowId: wf-4d9a1c2b-7d3f-4a5e-9b8c-1f2e3d4c5b6a
                  toEmails:
                  - credentialing@facility.example.com
                  subject: 'Action Required: Complete Your Facility Credentialing'
                  body: Please provide the missing documentation to continue credentialing.
                  outreachReasons:
                  - Missing malpractice insurance
            schema:
              $ref: '#/components/schemas/SendCredentialingOutreachRequest'
        required: true
      responses:
        '201':
          description: The outreach email was sent and a new outreach record was created. A single-workflow request returns a bare JSON string containing the new outreach record ID. A multi-workflow request returns an object with outreachId (the single outreach record shared by all bundled workflows) and sends (one entry per workflow with workflowId, tenantId, emailId, status of SENT or FAILED, sendgridId, and errorMessage - the last three are null on whichever branch did not occur).
          content:
            application/json:
              examples:
                singleWorkflow:
                  summary: Response for a single-workflow request
                  value: '"outreach-2b6c8f1a-9d3e-4f5a-8b7c-6e5d4c3b2a19"'
                multiTenant:
                  summary: Response for a multi-workflow request
                  value:
                    outreachId: outreach-2b6c8f1a-9d3e-4f5a-8b7c-6e5d4c3b2a19
                    sends:
                    - workflowId: wf-4d9a1c2b-7d3f-4a5e-9b8c-1f2e3d4c5b6a
                      tenantId: tenant-045f2b6a-9c3d-4e7f-8a1b-6c5d4e3f2a1b
                      emailId: email-1a2b3c4d5e6f
                      status: SENT
                      sendgridId: sg-9f8e7d6c5b4a
                      errorMessage: null
                    - workflowId: wf-9c2e5a7b-3f1d-4c6e-8a9b-2d3e4f5a6b7c
                      tenantId: tenant-8b3c1d2e-5f6a-4b7c-9d8e-1f2a3b4c5d6e
                      emailId: null
                      status: FAILED
                      sendgridId: null
                      errorMessage: 'SendGrid rejected the request: invalid recipient'
        '400':
          description: Three distinct 400 shapes are possible. (1) Bean Validation failed on the request body - toEmails, subject, or body was missing or blank; this returns the structured ApiError shape shown in the validationError example. (2) workflowId was omitted and workflowIds does not contain more than one entry, so neither the single-workflow nor multi-workflow path applies; this returns the missingWorkflowId example. (3) initiatingWorkflowId is missing or is not a member of workflowIds on a multi-workflow request; this returns the invalidInitiatingWorkflowId example.
          content:
            application/json:
              examples:
                validationError:
                  summary: Bean Validation failure on the request body
                  value:
                    errors:
                    - httpStatus: 400
                      reason: VALIDATION_ERROR
                      title: 'Validation failed for field: sendNewFacilityOutreach.request.subject'
                      detail: must not be blank
                missingWorkflowId:
                  summary: Neither workflowId nor a multi-workflow workflowIds set was supplied
                  value:
                    code: MISSING_WORKFLOW_ID
                    message: workflowId is required for single-workflow facility outreach requests. For multi-tenant outreach, supply workflowIds with more than one entry.
                invalidInitiatingWorkflowId:
                  summary: initiatingWorkflowId missing or not present in workflowIds
                  value:
                    code: INVALID_INITIATING_WORKFLOW_ID
                    message: initiatingWorkflowId is required and must be present in workflowIds when workflowIds contains more than one entry.
        '401':
          description: The request has no valid authentication token.
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The caller lacks the credentialing-outreach:create permission required to send facility outreach.
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Unprocessable request. Multi-workflow requests return OUTREACH_TEMPLATE_MISSING when the initiating tenant's outreach-settings template has no configured subject/body for the outreach type and credentialing cycle being sent. Either path returns OUTREACH_REASON_CYCLE_MISMATCH when the request carries outreach reason/instruction UUIDs configured for the opposite credentialing cycle of the workflow; send reason UUIDs belonging to the workflow's cycle instead.
          content:
            application/json:
              examples:
                templateMissing:
                  value:
                    code: OUTREACH_TEMPLATE_MISSING
                    message: Outreach template not found or incomplete for initiating tenant 'tenant-045f2b6a-9c3d-4e7f-8a1b-6c5d4e3f2a1b' (outreachType='FACILITY_CREDENTIALING', credentialingCycle='INITIAL'). Configure a subject and body in the outreach settings for this tenant before initiating a multi-tenant outreach.
                    initiatingTenantId: tenant-045f2b6a-9c3d-4e7f-8a1b-6c5d4e3f2a1b
                    outreachType: FACILITY_CREDENTIALING
                    credentialingCycle: INITIAL
                reasonCycleMismatch:
                  value:
                    code: OUTREACH_REASON_CYCLE_MISMATCH
                    message: Outreach reason(s) [reason-123] do not belong to the workflow's credentialing cycle 'RECREDENTIALING' (workflowId='workflow-123'). Use reason/instruction UUIDs configured for this cycle.
                    workflowId: workflow-123
                    credentialingCycle: RECREDENTIALING
                    mismatchedReasonIds:
                    - reason-123
        '503':
          description: Two distinct causes return 503. (1) A multi-workflow request was made while the OUTREACH_MULTI_TENANT_ENABLED feature flag is disabled in this environment; see the multiTenantDisabled example. (2) The underlying data service was temporarily unavailable while sending the outreach on either path; see the serviceUnavailable example and retry the request.
          content:
            application/json:
              examples:
                multiTenantDisabled:
                  summary: Multi-workflow request while the feature flag is off
                  value:
                    code: MULTI_TENANT_OUTREACH_DISABLED
                    message: Multi-tenant outreach is not enabled in this environment. Set OUTREACH_MULTI_TENANT_ENABLED=true and ensure DAL outreach.legacy-flow.enabled=false.
                serviceUnavailable:
                  summary: The underlying data service was temporarily unavailable
                  value:
                    code: INTERNAL_ERROR
                    message: Database service is temporarily unavailable. Please try again in a few moments.
        '500':
          description: An unexpected error occurred while sending the outreach.
          content:
            application/json:
              examples:
                internalError:
                  value:
                    code: INTERNAL_ERROR
                    message: 'Failed to send outreach: connection reset'
      tags:
      - Facility Credentialing Outreach Resource
      security:
      - jwt: []
  /facility-credentialing-outreaches/attachments/{attachmentId}/download:
    get:
      summary: Get a presigned URL to download an outreach attachment
      description: Returns a time-limited presigned Google Cloud Storage URL for downloading a single email attachment; it does not stream the file bytes directly. Call it after retrieving a facility outreach's detail via GET /facility-credentialing-outreaches/{outreachId}/details - the attachmentId to supply is found in that response's emails[].attachments[].id (or emails[].replies[].attachments[].id for reply attachments). tenant-id scopes the lookup; attachmentId must belong to an outreach visible to that tenant. The returned URL is valid for 1 hour from generation.
      operationId: downloadFacilityOutreachEmailAttachment
      parameters:
      - description: Attachment ID, found in the outreach detail response's emails[].attachments[].id (or emails[].replies[].attachments[].id).
        required: true
        name: attachmentId
        in: path
        schema:
          type: string
          pattern: \S
      - description: Tenant ID used to scope the attachment lookup to the caller's organization.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: 'The presigned download URL and its metadata: url (the presigned GCS URL), expiresIn (validity in hours, currently always 1), expiresAt (Unix millisecond expiry timestamp), and fileName (the original attachment file name).'
          content:
            application/json:
              examples:
                presignedUrl:
                  value:
                    url: https://storage.googleapis.com/certifyos-outreach-attachments/att-3a5b7c9d-1e2f-4a6b-8c9d-0e1f2a3b4c5d/checklist.pdf?X-Goog-Signature=...
                    expiresIn: 1
                    expiresAt: 1785499200000
                    fileName: checklist.pdf
              schema:
                $ref: '#/components/schemas/AttachmentDownloadResponse'
        '404':
          description: No attachment record exists for attachmentId, or the record exists but its underlying file is missing from GCS. The response body does not distinguish between these two causes - both examples below are returned as this same 404.
          content:
            application/json:
              examples:
                noAttachmentRecord:
                  summary: No attachment record exists for this ID
                  value: '"Attachment not found: Attachment not found: att-3a5b7c9d-1e2f-4a6b-8c9d-0e1f2a3b4c5d"'
                fileMissingInStorage:
                  summary: The attachment record exists but its file is missing from GCS
                  value: '"Attachment not found: Attachment file not found in storage"'
        '401':
          description: The request has no valid authentication token.
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The caller lacks the credentialing-outreach:read permission required to download outreach attachments.
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: An unexpected error occurred while generating the presigned download URL.
          content:
            application/json:
              examples:
                internalError:
                  value: '"Failed to download attachment: connection reset"'
      tags:
      - Facility Credentialing Outreach Resource
      security:
      - jwt: []
  /facility-credentialing-outreaches/bundlable-workflows:
    get:
      summary: List facility workflows eligible for multi-tenant outreach bundling
      description: Returns non-terminal facility workflows with the same NPI and credentialing cycle as the initiating workflow, across all tenants in the same facility shared group (CP-30517).
      operationId: listBundlableFacilityWorkflows
      parameters:
      - description: Facility credentialing workflow ID that initiates the outreach
        required: true
        name: initiatingWorkflowId
        in: query
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Bundlable facility workflows retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacilityBundlableWorkflowResponse'
        '400':
          description: Invalid or missing initiatingWorkflowId
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '404':
          description: Initiating workflow not found
      tags:
      - Facility Credentialing Outreach Resource
      security:
      - jwt: []
  /facility-credentialing-outreaches/workflow/{workflowId}:
    get:
      summary: List all outreaches for a facility workflow
      description: Returns a paginated list of every credentialing outreach sent for the given facility credentialing workflow. Use it to render outreach history for a facility workflow, or to obtain an outreachId to pass to the outreach detail endpoint. workflowId must be a facility credentialing workflow ID, not a practitioner credentialing workflow ID - supplying a practitioner workflow ID returns an empty list rather than an error, since an unrecognized workflowId is treated as having no outreaches. Pagination is currently hardcoded to page 0 and size 100 and cannot be changed by the caller; if a workflow has more than 100 outreaches, only the first 100 are returned and the rest are silently omitted. The response envelope (PractitionerOutreachListResponse) is reused verbatim from the practitioner outreach endpoints - its field names refer to practitioners for historical reasons, but it carries facility outreach records here.
      operationId: listFacilityCredentialingOutreaches
      parameters:
      - description: Facility credentialing workflow ID whose outreach history to retrieve. Must be a facility workflow ID, not a practitioner workflow ID.
        required: true
        name: workflowId
        in: path
        schema:
          type: string
          pattern: \S
      - description: Tenant ID used to scope the query to the caller's organization.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: 'A paginated envelope of outreach records for this facility workflow: data (the outreach records, each with attemptsCount and workflowStatus), totalCount (total matching records), and the fixed page (always 0) and size (always 100).'
          content:
            application/json:
              examples:
                outreachHistory:
                  value:
                    data:
                    - id: outreach-2b6c8f1a-9d3e-4f5a-8b7c-6e5d4c3b2a19
                      tenantId: tenant-045f2b6a-9c3d-4e7f-8a1b-6c5d4e3f2a1b
                      workflowId: wf-7f3e2a1b-8c4d-4e5f-9a6b-1c2d3e4f5a6b
                      outreachType: FACILITY_CREDENTIALING
                      reasons:
                      - id: reason-101
                        label: Missing malpractice insurance
                      active: true
                      attemptsCount: 2
                      lastAttemptedAt: '2026-07-30T14:22:00Z'
                      workflowStatus: OUTREACH_IN_PROGRESS
                      createdBy: user-9f1e2d3c
                      createdByName: Jordan Lee
                      createdAt: '2026-07-28T09:00:00Z'
                      updatedAt: '2026-07-30T14:22:00Z'
                    totalCount: 1
                    page: 0
                    size: 100
              schema:
                $ref: '#/components/schemas/PractitionerOutreachListResponse'
        '401':
          description: The request has no valid authentication token.
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The caller lacks the credentialing-outreach:read permission required to list facility outreaches.
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: An unexpected error occurred while fetching the outreach history for this workflow.
          content:
            application/json:
              examples:
                internalError:
                  value: '"Failed to fetch facility outreaches: connection reset"'
      tags:
      - Facility Credentialing Outreach Resource
      security:
      - jwt: []
  /facility-credentialing-outreaches/{outreachId}/details:
    get:
      summary: Get full detail for a facility outreach
      description: 'Returns the complete detail record for one facility outreach: the full email thread (each email with its replies and attachments) and a chronological status-transition timeline. Call it after obtaining an outreachId from the outreach list endpoint (GET /facility-credentialing-outreaches/workflow/{workflowId}) or from the outreachId in a successful POST /facility-credentialing-outreaches response. Read-only; it has no side effects. outreachId must identify an outreach record visible to the tenant supplied in the tenant-id header.'
      operationId: getFacilityCredentialingOutreachDetail
      parameters:
      - description: Outreach record ID, obtained from the outreach list endpoint or from a POST /facility-credentialing-outreaches response.
        required: true
        name: outreachId
        in: path
        schema:
          type: string
          pattern: \S
      - description: Tenant ID used to scope the lookup to the caller's organization.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: 'The outreach detail record: emails (each with direction, deliveryStatus, replies, and attachments - attachments[].id is usable with the attachment download endpoint), and timeline (chronological entries, each with a type of "outreach" or "email" and a status label).'
          content:
            application/json:
              examples:
                outreachDetail:
                  value:
                    id: outreach-2b6c8f1a-9d3e-4f5a-8b7c-6e5d4c3b2a19
                    tenantId: tenant-045f2b6a-9c3d-4e7f-8a1b-6c5d4e3f2a1b
                    workflowId: wf-7f3e2a1b-8c4d-4e5f-9a6b-1c2d3e4f5a6b
                    outreachType: FACILITY_CREDENTIALING
                    reasons:
                    - id: reason-101
                      label: Missing malpractice insurance
                    active: true
                    attemptsCount: 1
                    lastAttemptedAt: '2026-07-28T09:00:05Z'
                    workflowStatus: OUTREACH_IN_PROGRESS
                    createdBy: user-9f1e2d3c
                    createdByName: Jordan Lee
                    createdAt: '2026-07-28T09:00:00Z'
                    updatedAt: '2026-07-28T09:00:05Z'
                    emails:
                    - id: email-1a2b3c4d5e6f
                      subject: 'Action Required: Complete Your Facility Credentialing'
                      body: Please provide the missing documentation.
                      fromAddress:
                      - outreach@certifyos.com
                      toAddresses:
                      - credentialing@facility.example.com
                      direction: OUTBOUND
                      deliveryStatus: delivered
                      dispatched: true
                      sendgridId: sg-9f8e7d6c5b4a
                      createdAt: '2026-07-28T09:00:00Z'
                      updatedAt: '2026-07-28T09:00:05Z'
                      replies: []
                      attachments:
                      - id: att-3a5b7c9d-1e2f-4a6b-8c9d-0e1f2a3b4c5d
                        name: checklist.pdf
                        type: application/pdf
                        size: 48213
                    timeline:
                    - id: outreach-2b6c8f1a-9d3e-4f5a-8b7c-6e5d4c3b2a19
                      title: Outreach created
                      date: '2026-07-28T09:00:00Z'
                      type: outreach
                      status: Created
                    - id: email-1a2b3c4d5e6f
                      title: Email delivered
                      date: '2026-07-28T09:00:05Z'
                      type: email
                      status: Email Delivered
              schema:
                $ref: '#/components/schemas/OutreachDetailResponse'
        '404':
          description: No outreach record exists for outreachId under the tenant supplied in the tenant-id header.
          content:
            application/json:
              examples:
                outreachNotFound:
                  value: '"Outreach not found: Outreach not found: outreach-2b6c8f1a-9d3e-4f5a-8b7c-6e5d4c3b2a19"'
        '401':
          description: The request has no valid authentication token.
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The caller lacks the credentialing-outreach:read permission required to view facility outreach detail.
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: An unexpected error occurred while fetching the outreach detail.
          content:
            application/json:
              examples:
                internalError:
                  value: '"Failed to fetch outreach detail: connection reset"'
      tags:
      - Facility Credentialing Outreach Resource
      security:
      - jwt: []
components:
  schemas:
    PractitionerOutreachListResponse:
      type: object
      description: Paginated envelope of outreach records for a practitioner or facility credentialing workflow
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PractitionerOutreachItem'
          description: Outreach records for this workflow, ordered by creation date descending
        totalCount:
          type: integer
          format: int64
          description: Total number of outreach records matching this workflow
        page:
          type: integer
          format: int32
          examples:
          - 0
          description: Current page index. Always 0 - pagination is not yet supported
        size:
          type: integer
          format: int32
          examples:
          - 100
          description: Page size. Always 100 - a hardcoded ceiling; records beyond this are not returned
    ApiError:
      type: object
      description: Standard API error response containing a list of error objects
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
          description: List of error objects describing validation or processing failures
    Attachment:
      type: object
      properties:
        id:
          type: string
          description: Attachment ID, usable with GET /{outreach-resource}/attachments/{attachmentId}/download
        name:
          type: string
          description: Original file name of the attachment
        type:
          type: string
          examples:
          - application/pdf
          description: MIME type of the attachment
        size:
          type: integer
          format: int64
          description: File size in bytes
        reasonId:
          type: string
          description: Outreach reason this attachment answers (provider portal submissions only)
    AttachmentDTO:
      type: object
      required:
      - filename
      - content
      - contentType
      properties:
        filename:
          type: string
          pattern: \S
        content:
          type: string
          format: binary
        contentType:
          type: string
          pattern: \S
    OutreachDetailResponse:
      type: object
      description: Response containing outreach details including emails, replies, and timeline
      properties:
        id:
          type: string
          description: Outreach record ID
        tenantId:
          type: string
          description: Tenant that owns this outreach record
        workflowId:
          type: string
          description: Credentialing workflow (practitioner or facility) this outreach was sent for
        outreachType:
          type: string
          enum:
          - PRACTITIONER_CREDENTIALING
          - FACILITY_CREDENTIALING
          - PRACTITIONER_MONITORING
          examples:
          - FACILITY_CREDENTIALING
          description: Outreach category this record was created for
        reasons:
          type: array
          examples:
          - - id: reason-123
              label: Malpractice Insurance Missing
          items:
            $ref: '#/components/schemas/OutreachReasonWithLabel'
          description: 'List of outreach reasons with IDs and labels. Note: This field changed from List<String> to List<OutreachReasonWithLabel> to provide enriched reason information with labels.'
        active:
          type: boolean
          description: Whether this outreach is still open/awaiting a response
        attemptsCount:
          type: integer
          format: int32
          description: Number of outreach emails sent for this record
        lastAttemptedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp of the most recent outreach attempt
        workflowStatus:
          type: string
          description: Status of the referenced credentialing workflow at the time of this response
        createdBy:
          type: string
          description: User ID that created this outreach record
        createdByName:
          type: string
          description: Display name of the user that created this outreach record
        createdAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this outreach record was created
        updatedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this outreach record was last updated
        emails:
          type: array
          items:
            $ref: '#/components/schemas/EmailWithReplies'
          description: Full email thread for this outreach, each with its replies and attachments
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineItem'
          description: Chronological activity entries recording status transitions and key events
    Instant:
      type: string
      format: date-time
      examples:
      - '2022-03-10T16:15:50Z'
    EmailWithReplies:
      type: object
      properties:
        id:
          type: string
          description: Email record ID
        subject:
          type: string
          description: Email subject line
        body:
          type: string
          description: Email body content
        fromAddress:
          type: array
          items:
            type: string
          description: Sender email address(es)
        toAddresses:
          type: array
          items:
            type: string
          description: Recipient email addresses
        ccAddresses:
          type: array
          items:
            type: string
          description: CC email addresses
        bccAddresses:
          type: array
          items:
            type: string
          description: BCC email addresses
        direction:
          type: string
          enum:
          - INBOUND
          - OUTBOUND
          examples:
          - OUTBOUND
          description: Whether this email was sent by CertifyOS or received from a recipient
        deliveryStatus:
          type: string
          enum:
          - processed
          - deferred
          - delivered
          examples:
          - delivered
          description: Latest SendGrid delivery status for this email
        engagementData:
          type: string
          description: Raw engagement event data reported by SendGrid for this email
        dispatched:
          type: boolean
          description: Whether this email was successfully dispatched via SendGrid
        sendgridId:
          type: string
          description: SendGrid message ID for this email, null if it was never dispatched
        statusCode:
          type: integer
          format: int32
          description: HTTP status code returned by SendGrid for this email's send attempt
        submitterEmail:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this email record was created
        updatedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this email record was last updated
        replies:
          type: array
          items:
            $ref: '#/components/schemas/EmailReply'
          description: Replies received to this email
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: Files attached to this email; each id is usable with the attachment download endpoint
    TimelineItem:
      type: object
      properties:
        id:
          type: string
          description: ID of the underlying outreach or email record this timeline entry describes
        title:
          type: string
          description: Human-readable label for this timeline entry
        date:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this event occurred
        type:
          type: string
          enum:
          - outreach
          - email
          examples:
          - outreach
          description: Kind of record this entry describes
        status:
          type: string
          examples:
          - Email Delivered
          description: Status label at this point in the timeline
    OutreachReasonWithLabel:
      type: object
      description: Outreach reason with ID and label
      properties:
        id:
          type: string
          examples:
          - reason-123e4567-e89b-12d3-a456-426614174000
          description: Unique identifier for the outreach reason
        label:
          type: string
          examples:
          - Malpractice Insurance Missing
          description: Display label for the outreach reason
    SendCredentialingOutreachRequest:
      type: object
      required:
      - toEmails
      - body
      - outreachReasons
      - subject
      description: Request body for sending a credentialing outreach email
      properties:
        workflowId:
          type: string
          examples:
          - workflow-123
          description: The workflow ID for the credentialing outreach. Required for single-workflow requests. When workflowIds is provided with more than one entry, this field is optional.
        workflowIds:
          type: array
          examples:
          - - workflow-123
            - workflow-456
          items:
            type: string
          description: List of workflow IDs for multi-tenant outreach. When more than one entry is provided, initiatingWorkflowId must also be set. Single-workflow requests should leave this null and use workflowId instead.
        initiatingWorkflowId:
          type: string
          examples:
          - workflow-123
          description: The workflow ID of the initiating org for multi-tenant outreach. Required when workflowIds contains more than one entry. Must be present in the workflowIds list. The initiating workflow's tenant outreach-settings template is applied to all bundled workflows.
        toEmails:
          type: array
          minItems: 1
          examples:
          - - recipient@example.com
          items:
            type: string
          description: List of email addresses to send the outreach email to
        body:
          type: string
          examples:
          - Please complete your credentialing application.
          pattern: \S
          description: Email body content
        ccEmails:
          type: array
          examples:
          - - cc@example.com
          items:
            type: string
          description: Optional list of CC email addresses
        bccEmails:
          type: array
          examples:
          - - bcc@example.com
          items:
            type: string
          description: Optional list of BCC email addresses
        outreachReasons:
          type: array
          minItems: 1
          examples:
          - - Missing documentation
            - Expired license
          items:
            type: string
          description: List of reasons for the outreach
        outreachReasonsWithLabels:
          type: array
          examples:
          - - id: reason-123
              label: Missing documentation
          items:
            $ref: '#/components/schemas/OutreachReasonWithLabel'
          description: List of outreach reasons with their display labels. When provided, labels are persisted with the outreach record.
        subject:
          type: string
          examples:
          - 'Action Required: Complete Your Credentialing'
          pattern: \S
          description: Email subject line
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentDTO'
          description: Optional list of email attachments
        multiTenant:
          type: boolean
    EmailReply:
      type: object
      properties:
        id:
          type: string
          description: Reply record ID
        subject:
          type: string
          description: Reply subject line
        body:
          type: string
          description: Reply body content
        fromAddress:
          type: array
          items:
            type: string
          description: Sender email address(es) of the reply
        toAddresses:
          type: array
          items:
            type: string
          description: Recipient email addresses of the reply
        ccAddresses:
          type: array
          items:
            type: string
          description: CC email addresses of the reply
        direction:
          type: string
          enum:
          - INBOUND
          - OUTBOUND
          examples:
          - INBOUND
          description: Whether this reply was sent by CertifyOS or received from a recipient
        deliveryStatus:
          type: string
          description: Delivery status for this reply, when applicable
        submitterEmail:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this reply was created
        updatedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this reply was last updated
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: Files attached to this reply; each id is usable with the attachment download endpoint
    PractitionerOutreachItem:
      type: object
      properties:
        id:
          type: string
          description: Outreach record ID
        tenantId:
          type: string
          description: Tenant that owns this outreach record
        workflowId:
          type: string
          description: Credentialing workflow (practitioner or facility) this outreach was sent for
        outreachType:
          type: string
          enum:
          - PRACTITIONER_CREDENTIALING
          - FACILITY_CREDENTIALING
          - PRACTITIONER_MONITORING
          examples:
          - FACILITY_CREDENTIALING
          description: Outreach category this record was created for
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/OutreachReasonWithLabel'
          description: Outreach reasons with their display labels
        active:
          type: boolean
          description: Whether this outreach is still open/awaiting a response
        attemptsCount:
          type: integer
          format: int32
          description: Number of outreach emails sent for this record
        lastAttemptedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp of the most recent outreach attempt
        workflowStatus:
          type: string
          description: Status of the referenced credentialing workflow at the time of this response
        outreachPage:
          type: string
          examples:
          - https://app.certifyos.com/outreach?token=eyJ...
          description: Signed provider-portal link where the provider submits a response to this outreach. Present only when the tenant has the provider portal enabled, the outreach is still awaiting a response, and an outreach email exists to thread the submission onto; otherwise null.
        createdBy:
          type: string
          description: User ID that created this outreach record
        createdByName:
          type: string
          description: Display name of the user that created this outreach record
        createdAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this outreach record was created
        updatedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this outreach record was last updated
        participatingTenants:
          type: array
          examples:
          - - tenant-bcbs
            - tenant-uhc
          items:
            type: string
          description: Tenant ids this outreach was sent for, captured at send time (shared credentialing sends). Omitted for single-tenant outreaches; use tenantId instead.
        subject:
          type: string
          description: Subject of the outreach's latest outbound email. Present only in the shared credentialing listing (includeAllParticipatingTenants=true).
        toAddresses:
          type: array
          items:
            type: string
          description: To recipients of the outreach's latest outbound email. Present only in the shared credentialing listing (includeAllParticipatingTenants=true).
        ccAddresses:
          type: array
          items:
            type: string
          description: CC recipients of the outreach's latest outbound email. Present only in the shared credentialing listing (includeAllParticipatingTenants=true).
    FacilityBundlableWorkflowResponse:
      type: object
      description: Facility workflow eligible for multi-tenant outreach bundling
      properties:
        id:
          type: string
          description: Facility credentialing workflow ID
        tenantId:
