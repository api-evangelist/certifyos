openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer Credentialing Outreach Resource API
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: Credentialing Outreach Resource
paths:
  /credentialing-outreaches:
    post:
      summary: Send a practitioner credentialing outreach email
      description: 'Sends a credentialing outreach email for a practitioner workflow via SendGrid and persists an outreach record in the DAL. Call this after a practitioner credentialing workflow is active and you need to contact one or more recipients; for facility credentialing outreach, use the facility-specific outreach endpoint instead. The request body must include at least one recipient in `toEmails`. For a single-workflow outreach, supply `workflowId`. For a multi-workflow (multi-tenant) outreach, supply `workflowIds` (two or more entries) and `initiatingWorkflowId`, which must be a member of `workflowIds`; attachments are not permitted on multi-workflow requests. Multi-tenant outreach must be enabled via the OUTREACH_MULTI_TENANT_ENABLED feature flag; when disabled, a multi-workflow request returns 503. This operation is not idempotent - each call dispatches a new email via SendGrid and persists a new outreach record. Shared credentialing send: when `initiatingWorkflowId` belongs to a shared credentialing workflow, `workflowIds` (one or more of its member workflows) selects the tenants the one email covers. Every selected workflow must be a member (400 SHARED_OUTREACH_WORKFLOW_NOT_IN_RUN), none may be locked (409 SHARED_OUTREACH_TENANT_LOCKED), the caller needs outreach permission in every selected tenant (403 TENANT_OUTREACH_NOT_PERMITTED), and reasons must come from the anchor group''s outreach settings (400 SHARED_OUTREACH_REASON_NOT_CONFIGURED). Nothing is sent when a check fails. The outreach records `participatingTenants`; CC is sent as given; no workflow status changes.'
      operationId: sendCredentialingOutreach
      parameters:
      - description: Tenant ID of the initiating organization; scopes the outreach record and email dispatch to this tenant.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              singleWorkflow:
                summary: Single-workflow outreach
                value:
                  workflowId: wf-7f3e2a1b-8c4d-4e5f-9a6b-1c2d3e4f5a6b
                  toEmails:
                  - dr.jane.smith@example-clinic.com
                  ccEmails:
                  - credentialing-team@certifyos.com
                  subject: 'Action Required: Complete Your Credentialing'
                  body: Please complete your credentialing application by providing the missing documentation.
                  outreachReasons:
                  - Missing documentation
                  - Expired license
                  outreachReasonsWithLabels:
                  - id: reason-a1b2c3d4
                    label: Missing documentation
              multiWorkflow:
                summary: Multi-tenant outreach across bundled workflows
                value:
                  workflowIds:
                  - wf-7f3e2a1b-8c4d-4e5f-9a6b-1c2d3e4f5a6b
                  - wf-2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                  initiatingWorkflowId: wf-7f3e2a1b-8c4d-4e5f-9a6b-1c2d3e4f5a6b
                  toEmails:
                  - dr.jane.smith@example-clinic.com
                  subject: 'Action Required: Complete Your Credentialing'
                  body: Please complete your credentialing application by providing the missing documentation.
                  outreachReasons:
                  - Missing documentation
            schema:
              $ref: '#/components/schemas/SendCredentialingOutreachRequest'
        required: true
      responses:
        '201':
          description: 'Outreach email sent successfully. The response body shape depends on the request type: a single-workflow request (workflowId supplied) returns a bare string containing the created outreach record ID; a multi-workflow request (workflowIds with more than one entry) returns a MultiTenantOutreachResult object with an outreachId and a sends array describing the per-workflow send status.'
          content:
            application/json:
              examples:
                singleWorkflow:
                  summary: Single-workflow outreach record ID
                  value: '"outreach-a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"'
                multiWorkflow:
                  summary: Multi-tenant outreach send result
                  value:
                    outreachId: outreach-a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    sends:
                    - workflowId: wf-7f3e2a1b-8c4d-4e5f-9a6b-1c2d3e4f5a6b
                      tenantId: tenant-9f8e7d6c
                      emailId: email-3c4d5e6f-7a8b-4c9d-0e1f-2a3b4c5d6e7f
                      status: SENT
                      sendgridId: sg-1234567890abcdef
                      errorMessage: null
                    - workflowId: wf-2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                      tenantId: tenant-1a2b3c4d
                      emailId: null
                      status: FAILED
                      sendgridId: null
                      errorMessage: SendGrid rejected recipient address
        '400':
          description: 'The request failed validation: toEmails is empty, both workflowId and workflowIds are missing, initiatingWorkflowId is missing or not a member of workflowIds for a multi-workflow request, or attachments were supplied on a multi-workflow request. The response body shape differs by cause: bean-validation failures (e.g. empty toEmails) return the ApiError shape; the workflowId/initiatingWorkflowId business-rule checks return a {code, message} object instead.'
          content:
            application/json:
              examples:
                missingWorkflowId:
                  summary: Neither workflowId nor a multi-workflow workflowIds list was supplied
                  value:
                    code: MISSING_WORKFLOW_ID
                    message: workflowId is required for single-workflow requests; use workflowIds for multi-tenant outreach.
                validationError:
                  summary: A required field failed validation, e.g. an empty toEmails list
                  value:
                    errors:
                    - httpStatus: 400
                      reason: VALIDATION_ERROR
                      title: 'Validation failed for field: toEmails'
                      detail: must not be empty
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 'Shared credentialing send only: a selected tenant''s member workflow is locked. Nothing was sent; each error names one locked tenant in `rejectedValue`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Unprocessable request: either the initiating tenant''s outreach-settings template is missing or incomplete for the outreach type and credentialing cycle being sent (OUTREACH_TEMPLATE_MISSING), or the request carries outreach reason/instruction UUIDs configured for the opposite credentialing cycle of the workflow (OUTREACH_REASON_CYCLE_MISMATCH). Fix the settings or send reason UUIDs belonging to the workflow''s cycle, then retry.'
          content:
            application/json:
              examples:
                templateMissing:
                  value:
                    code: OUTREACH_TEMPLATE_MISSING
                    message: No outreach template for tenant tenant-9f8e7d6c, type PRACTITIONER_CREDENTIALING, cycle INITIAL
                    initiatingTenantId: tenant-9f8e7d6c
                    outreachType: PRACTITIONER_CREDENTIALING
                    credentialingCycle: INITIAL
                reasonCycleMismatch:
                  value:
                    code: OUTREACH_REASON_CYCLE_MISMATCH
                    message: Outreach reason(s) [reason-123] do not belong to the workflow's cycle 'RECREDENTIALING'.
                    workflowId: workflow-123
                    credentialingCycle: RECREDENTIALING
                    mismatchedReasonIds:
                    - reason-123
        '500':
          description: Internal Server Error - An unexpected error occurred. The body is a plain string, not the ApiError shape.
          content:
            application/json:
              examples:
                internalError:
                  value: '"Failed to send outreach: <error detail>"'
        '503':
          description: A multi-workflow request was made but the OUTREACH_MULTI_TENANT_ENABLED feature flag is disabled in this environment.
          content:
            application/json:
              examples:
                multiTenantDisabled:
                  value:
                    code: MULTI_TENANT_OUTREACH_DISABLED
                    message: Multi-tenant outreach is not enabled. Set OUTREACH_MULTI_TENANT_ENABLED=true to enable it.
      tags:
      - Credentialing Outreach Resource
      security:
      - jwt: []
  /credentialing-outreaches/attachments/{attachmentId}/download:
    get:
      summary: Get a presigned GCS download URL for an attachment
      description: Returns a time-limited presigned Google Cloud Storage URL for downloading a single email attachment; it does not stream the file bytes directly. Call this after retrieving an outreach's full detail via GET /credentialing-outreaches/{id}/details - the attachmentId to supply is found in OutreachDetailResponse.emails[].attachments[].id in that response. The returned URL is valid for 1 hour.
      operationId: downloadEmailAttachment
      parameters:
      - description: Attachment ID, found in OutreachDetailResponse.emails[].attachments[].id in the outreach detail response.
        required: true
        name: attachmentId
        in: path
        schema:
          type: string
      - description: Tenant ID used to scope the attachment lookup to the caller's organization.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: 'The presigned download URL and its metadata: url, expiresIn (validity in hours), expiresAt (Unix millisecond expiry timestamp), and fileName.'
          content:
            application/json:
              examples:
                downloadUrl:
                  value:
                    url: https://storage.googleapis.com/certifyos-outreach-attachments/tenant-9f8e7d6c/updated_license.pdf?X-Goog-Signature=abc123...
                    expiresIn: 1
                    expiresAt: 1785600000000
                    fileName: updated_license.pdf
              schema:
                $ref: '#/components/schemas/AttachmentDownloadResponse'
        '404':
          description: No attachment record exists in the DAL for the given attachmentId, or the DAL record exists but the underlying file is missing from GCS. The response body does not distinguish between these two causes; verify the attachmentId via the outreach detail endpoint before retrying. The body is a plain string, not the ApiError shape.
          content:
            application/json:
              examples:
                notFound:
                  value: '"Attachment not found: attachment-5e6f7a8b-9c0d-4e1f-2a3b-4c5d6e7f8a9b"'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internalError:
                  value: '"Failed to download attachment: <error detail>"'
      tags:
      - Credentialing Outreach Resource
      security:
      - jwt: []
  /credentialing-outreaches/bundlable-workflows:
    get:
      summary: List workflows eligible for multi-tenant outreach bundling
      description: Returns non-terminal workflows with the same practitioner NPI and credentialing cycle as the initiating workflow, across all tenants (CP-30514).
      operationId: listBundlableWorkflows
      parameters:
      - description: Credentialing workflow ID that initiates the outreach
        required: true
        name: initiatingWorkflowId
        in: query
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Bundlable workflows retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BundlableWorkflowResponse'
        '400':
          description: Invalid or missing initiatingWorkflowId
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - User does not have required permissions
        '404':
          description: Initiating workflow not found
      tags:
      - Credentialing Outreach Resource
      security:
      - jwt: []
  /credentialing-outreaches/workflow/{workflowId}:
    get:
      summary: List outreaches for a practitioner credentialing workflow
      description: Returns all outreach records associated with a practitioner credentialing workflow, ordered by creation date descending. Use this to display the outreach history for a single practitioner workflow; for facility workflows, use the facility-specific outreach endpoint instead. `workflowId` must be a practitioner credentialing workflow ID obtainable from the workflow management APIs - an unrecognized workflowId returns an empty list rather than a 404. The response is a PractitionerOutreachListResponse envelope; `page` and `size` are currently fixed at 0 and 100 respectively (pagination is not yet supported), so a workflow with more than 100 outreaches will not return the remainder. With `includeAllParticipatingTenants=true` and a workflow in a shared credentialing run the caller is a member of, the list covers every outreach on the run across all member workflows (each once, newest first), is paged by `page` and `size` (default 10, max 100), and each row also carries `tenantId`, `participatingTenants`, `subject`, `toAddresses` and `ccAddresses`.
      operationId: listCredentialingOutreaches
      parameters:
      - description: Practitioner credentialing workflow ID whose outreach history to retrieve.
        required: true
        name: workflowId
        in: path
        schema:
          type: string
      - description: When true and the workflow belongs to a shared credentialing run the caller is a member of, list every outreach on the run across all member workflows, paged by page and size. Defaults to false.
        name: includeAllParticipatingTenants
        in: query
        schema:
          type: boolean
          default: false
      - description: Page index (0-based); used only when includeAllParticipatingTenants=true
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - description: Page size (1-100); used only when includeAllParticipatingTenants=true
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - description: Tenant ID used to scope the query to the caller's organization.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: A PractitionerOutreachListResponse envelope containing the outreach records for this workflow (each with attemptsCount, workflowStatus, and enriched reasons), totalCount, and the fixed page/size values.
          content:
            application/json:
              examples:
                outreachList:
                  value:
                    data:
                    - id: outreach-a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                      tenantId: tenant-9f8e7d6c
                      workflowId: wf-7f3e2a1b-8c4d-4e5f-9a6b-1c2d3e4f5a6b
                      outreachType: PRACTITIONER_CREDENTIALING
                      reasons:
                      - id: reason-a1b2c3d4
                        label: Missing documentation
                      active: true
                      attemptsCount: 2
                      lastAttemptedAt: '2026-07-28T14:32:00Z'
                      workflowStatus: IN_PROGRESS
                      createdBy: user-3c4d5e6f
                      createdByName: Jamie Rivera
                      createdAt: '2026-07-20T09:15:00Z'
                      updatedAt: '2026-07-28T14:32:00Z'
                    totalCount: 1
                    page: 0
                    size: 100
              schema:
                $ref: '#/components/schemas/PractitionerOutreachListResponse'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred. The body is a plain string, not the ApiError shape.
          content:
            application/json:
              examples:
                internalError:
                  value: '"Failed to fetch outreaches: <error detail>"'
      tags:
      - Credentialing Outreach Resource
      security:
      - jwt: []
  /credentialing-outreaches/{id}:
    get:
      summary: Fetch lightweight outreach status by ID
      description: Returns a summary view of a single outreach record, suitable for lightweight status checks. Use this when you need basic outreach status and do not require the full email thread, replies, attachments, or timeline; for the full detail view, use GET /credentialing-outreaches/{id}/details instead. The id is the outreach record ID returned in the 201 body of POST /credentialing-outreaches, or from GET /credentialing-outreaches/workflow/{workflowId}.
      operationId: getCredentialingOutreach
      parameters:
      - description: Outreach record ID, returned from POST /credentialing-outreaches or GET /credentialing-outreaches/workflow/{workflowId}.
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: Tenant ID used to scope the lookup to the caller's organization.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: The outreach summary record identified by id. The `data` field is an opaque JSON node - its schema only exposes Jackson's own node-type introspection (empty/valueNode/containerNode), not the actual outreach fields it carries.
          content:
            application/json:
              examples:
                outreach:
                  value:
                    id: outreach-a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    workflowId: wf-7f3e2a1b-8c4d-4e5f-9a6b-1c2d3e4f5a6b
                    workflowIds:
                    - wf-7f3e2a1b-8c4d-4e5f-9a6b-1c2d3e4f5a6b
                    data:
                      empty: false
                      valueNode: false
                      containerNode: true
                    createdBy: user-3c4d5e6f
                    createdAt: '2026-07-20'
                    updatedAt: '2026-07-28'
              schema:
                $ref: '#/components/schemas/PractitionerOutreachResponse'
        '404':
          description: The outreach ID does not exist, or it belongs to a different tenant than the one supplied in the tenant-id header. Verify the outreachId via GET /credentialing-outreaches/workflow/{workflowId} before retrying. The body is a plain string, not the ApiError shape.
          content:
            application/json:
              examples:
                notFound:
                  value: '"Outreach not found: outreach-a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internalError:
                  value: '"Failed to fetch outreach: <error detail>"'
      tags:
      - Credentialing Outreach Resource
      security:
      - jwt: []
  /credentialing-outreaches/{id}/details:
    get:
      summary: Fetch full outreach detail with emails, replies, and timeline
      description: Returns the complete detail view of a single outreach record, including the full email thread, replies, attachments, and a chronological timeline. Use this when you need to render the outreach history in full - email bodies, recipient statuses, reply chains, or the activity timeline; for a lightweight status check without email content, use GET /credentialing-outreaches/{id} instead. The id is the outreach record ID returned in the 201 body of POST /credentialing-outreaches, or from GET /credentialing-outreaches/workflow/{workflowId}. This endpoint is read-only and has no side effects.
      operationId: getCredentialingOutreachDetail
      parameters:
      - description: Outreach record ID, returned from POST /credentialing-outreaches or GET /credentialing-outreaches/workflow/{workflowId}.
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: Tenant ID used to scope the lookup to the caller's organization.
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: An OutreachDetailResponse containing the outreach's emails (each with direction, deliveryStatus, replies, and attachments - each attachment has an id usable with GET /credentialing-outreaches/attachments/{attachmentId}/download) and a chronological timeline (each entry has a type of "outreach" or "email", and a status).
          content:
            application/json:
              examples:
                outreachDetail:
                  value:
                    id: outreach-a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    tenantId: tenant-9f8e7d6c
                    workflowId: wf-7f3e2a1b-8c4d-4e5f-9a6b-1c2d3e4f5a6b
                    outreachType: PRACTITIONER_CREDENTIALING
                    reasons:
                    - id: reason-a1b2c3d4
                      label: Missing documentation
                    active: true
                    attemptsCount: 1
                    lastAttemptedAt: '2026-07-28T14:32:00Z'
                    workflowStatus: IN_PROGRESS
                    createdBy: user-3c4d5e6f
                    createdByName: Jamie Rivera
                    createdAt: '2026-07-28T14:32:00Z'
                    updatedAt: '2026-07-28T14:32:00Z'
                    emails:
                    - id: email-3c4d5e6f-7a8b-4c9d-0e1f-2a3b4c5d6e7f
                      subject: 'Action Required: Complete Your Credentialing'
                      body: Please complete your credentialing application by providing the missing documentation.
                      fromAddress:
                      - credentialing@certifyos.com
                      toAddresses:
                      - dr.jane.smith@example-clinic.com
                      ccAddresses: []
                      bccAddresses: []
                      direction: OUTBOUND
                      deliveryStatus: delivered
                      dispatched: true
                      sendgridId: sg-1234567890abcdef
                      statusCode: 202
                      createdAt: '2026-07-28T14:32:00Z'
                      updatedAt: '2026-07-28T15:10:00Z'
                      replies:
                      - id: reply-4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f8a
                        subject: 'RE: Action Required: Complete Your Credentialing'
                        body: Attached is my updated license.
                        fromAddress:
                        - dr.jane.smith@example-clinic.com
                        toAddresses:
                        - credentialing@certifyos.com
                        ccAddresses: []
                        direction: INBOUND
                        deliveryStatus: delivered
                        createdAt: '2026-07-28T16:00:00Z'
                        updatedAt: '2026-07-28T16:00:00Z'
                        attachments:
                        - id: attachment-5e6f7a8b-9c0d-4e1f-2a3b-4c5d6e7f8a9b
                          name: updated_license.pdf
                          type: application/pdf
                          size: 245678
                      attachments: []
                    timeline:
                    - id: outreach-a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                      title: Outreach created
                      date: '2026-07-28T14:32:00Z'
                      type: outreach
                      status: Email Delivered
              schema:
                $ref: '#/components/schemas/OutreachDetailResponse'
        '404':
          description: The outreach ID does not exist, or it belongs to a different tenant than the one supplied in the tenant-id header. Verify the outreachId via GET /credentialing-outreaches/workflow/{workflowId} before retrying. The body is a plain string, not the ApiError shape.
          content:
            application/json:
              examples:
                notFound:
                  value: '"Outreach not found: outreach-a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: Unauthorized
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: Forbidden
                      title: Request Failed
                      detail: An error occurred processing your request
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internalError:
                  value: '"Failed to fetch outreach detail: <error detail>"'
      tags:
      - Credentialing Outreach Resource
      security:
      - jwt: []
components:
  schemas:
    TimelineItem:
      type: object
      properties:
        id:
          type: string
          description: ID of the underlying outreach or email record this timeline entry describes
        title:
          type: string
          description: Human-readable label for this timeline entry
        date:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this event occurred
        type:
          type: string
          enum:
          - outreach
          - email
          examples:
          - outreach
          description: Kind of record this entry describes
        status:
          type: string
          examples:
          - Email Delivered
          description: Status label at this point in the timeline
    OutreachDetailResponse:
      type: object
      description: Response containing outreach details including emails, replies, and timeline
      properties:
        id:
          type: string
          description: Outreach record ID
        tenantId:
          type: string
          description: Tenant that owns this outreach record
        workflowId:
          type: string
          description: Credentialing workflow (practitioner or facility) this outreach was sent for
        outreachType:
          type: string
          enum:
          - PRACTITIONER_CREDENTIALING
          - FACILITY_CREDENTIALING
          - PRACTITIONER_MONITORING
          examples:
          - FACILITY_CREDENTIALING
          description: Outreach category this record was created for
        reasons:
          type: array
          examples:
          - - id: reason-123
              label: Malpractice Insurance Missing
          items:
            $ref: '#/components/schemas/OutreachReasonWithLabel'
          description: 'List of outreach reasons with IDs and labels. Note: This field changed from List<String> to List<OutreachReasonWithLabel> to provide enriched reason information with labels.'
        active:
          type: boolean
          description: Whether this outreach is still open/awaiting a response
        attemptsCount:
          type: integer
          format: int32
          description: Number of outreach emails sent for this record
        lastAttemptedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp of the most recent outreach attempt
        workflowStatus:
          type: string
          description: Status of the referenced credentialing workflow at the time of this response
        createdBy:
          type: string
          description: User ID that created this outreach record
        createdByName:
          type: string
          description: Display name of the user that created this outreach record
        createdAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this outreach record was created
        updatedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this outreach record was last updated
        emails:
          type: array
          items:
            $ref: '#/components/schemas/EmailWithReplies'
          description: Full email thread for this outreach, each with its replies and attachments
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineItem'
          description: Chronological activity entries recording status transitions and key events
    ErrorObject:
      type: object
      description: Individual error object containing details about a specific validation or processing error
      properties:
        httpStatus:
          type: integer
          format: int32
          examples:
          - 400
          description: HTTP status code for this error
        reason:
          type: string
          examples:
          - VALIDATION_ERROR
          description: Error reason/code
        title:
          type: string
          examples:
          - 'Validation failed for field: eventTypes'
          description: Error title/summary
        detail:
          type: string
          examples:
          - eventTypes is required and cannot be empty or null
          description: Detailed error message
        rejectedValue:
          type: string
          description: The value that was rejected, omitted for sensitive fields such as SSN
    Attachment:
      type: object
      properties:
        id:
          type: string
          description: Attachment ID, usable with GET /{outreach-resource}/attachments/{attachmentId}/download
        name:
          type: string
          description: Original file name of the attachment
        type:
          type: string
          examples:
          - application/pdf
          description: MIME type of the attachment
        size:
          type: integer
          format: int64
          description: File size in bytes
        reasonId:
          type: string
          description: Outreach reason this attachment answers (provider portal submissions only)
    PractitionerOutreachListResponse:
      type: object
      description: Paginated envelope of outreach records for a practitioner or facility credentialing workflow
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PractitionerOutreachItem'
          description: Outreach records for this workflow, ordered by creation date descending
        totalCount:
          type: integer
          format: int64
          description: Total number of outreach records matching this workflow
        page:
          type: integer
          format: int32
          examples:
          - 0
          description: Current page index. Always 0 - pagination is not yet supported
        size:
          type: integer
          format: int32
          examples:
          - 100
          description: Page size. Always 100 - a hardcoded ceiling; records beyond this are not returned
    EmailReply:
      type: object
      properties:
        id:
          type: string
          description: Reply record ID
        subject:
          type: string
          description: Reply subject line
        body:
          type: string
          description: Reply body content
        fromAddress:
          type: array
          items:
            type: string
          description: Sender email address(es) of the reply
        toAddresses:
          type: array
          items:
            type: string
          description: Recipient email addresses of the reply
        ccAddresses:
          type: array
          items:
            type: string
          description: CC email addresses of the reply
        direction:
          type: string
          enum:
          - INBOUND
          - OUTBOUND
          examples:
          - INBOUND
          description: Whether this reply was sent by CertifyOS or received from a recipient
        deliveryStatus:
          type: string
          description: Delivery status for this reply, when applicable
        submitterEmail:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this reply was created
        updatedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this reply was last updated
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: Files attached to this reply; each id is usable with the attachment download endpoint
    PractitionerOutreachResponse:
      type: object
      properties:
        id:
          type: string
        workflowId:
          type: string
        workflowIds:
          type: array
          items:
            type: string
        data:
          $ref: '#/components/schemas/JsonNode'
        createdBy:
          type: string
        createdAt:
          $ref: '#/components/schemas/Date'
        updatedAt:
          $ref: '#/components/schemas/Date'
    Date:
      type: string
      format: date
    JsonNode:
      type: object
      properties:
        empty:
          type: boolean
        valueNode:
          type: boolean
        containerNode:
          type: boolean
        missingNode:
          type: boolean
        array:
          type: boolean
        object:
          type: boolean
        nodeType:
          $ref: '#/components/schemas/JsonNodeType'
        pojo:
          type: boolean
        number:
          type: boolean
        integralNumber:
          type: boolean
        floatingPointNumber:
          type: boolean
        short:
          type: boolean
        int:
          type: boolean
        long:
          type: boolean
        float:
          type: boolean
        double:
          type: boolean
        bigDecimal:
          type: boolean
        bigInteger:
          type: boolean
        textual:
          type: boolean
        boolean:
          type: boolean
        'null':
          type: boolean
        binary:
          type: boolean
    OutreachReasonWithLabel:
      type: object
      description: Outreach reason with ID and label
      properties:
        id:
          type: string
          examples:
          - reason-123e4567-e89b-12d3-a456-426614174000
          description: Unique identifier for the outreach reason
        label:
          type: string
          examples:
          - Malpractice Insurance Missing
          description: Display label for the outreach reason
    SendCredentialingOutreachRequest:
      type: object
      required:
      - toEmails
      - body
      - outreachReasons
      - subject
      description: Request body for sending a credentialing outreach email
      properties:
        workflowId:
          type: string
          examples:
          - workflow-123
          description: The workflow ID for the credentialing outreach. Required for single-workflow requests. When workflowIds is provided with more than one entry, this field is optional.
        workflowIds:
          type: array
          examples:
          - - workflow-123
            - workflow-456
          items:
            type: string
          description: List of workflow IDs for multi-tenant outreach. When more than one entry is provided, initiatingWorkflowId must also be set. Single-workflow requests should leave this null and use workflowId instead.
        initiatingWorkflowId:
          type: string
          examples:
          - workflow-123
          description: The workflow ID of the initiating org for multi-tenant outreach. Required when workflowIds contains more than one entry. Must be present in the workflowIds list. The initiating workflow's tenant outreach-settings template is applied to all bundled workflows.
        toEmails:
          type: array
          minItems: 1
          examples:
          - - recipient@example.com
          items:
            type: string
          description: List of email addresses to send the outreach email to
        body:
          type: string
          examples:
          - Please complete your credentialing application.
          pattern: \S
          description: Email body content
        ccEmails:
          type: array
          examples:
          - - cc@example.com
          items:
            type: string
          description: Optional list of CC email addresses
        bccEmails:
          type: array
          examples:
          - - bcc@example.com
          items:
            type: string
          description: Optional list of BCC email addresses
        outreachReasons:
          type: array
          minItems: 1
          examples:
          - - Missing documentation
            - Expired license
          items:
            type: string
          description: List of reasons for the outreach
        outreachReasonsWithLabels:
          type: array
          examples:
          - - id: reason-123
              label: Missing documentation
          items:
            $ref: '#/components/schemas/OutreachReasonWithLabel'
          description: List of outreach reasons with their display labels. When provided, labels are persisted with the outreach record.
        subject:
          type: string
          examples:
          - 'Action Required: Complete Your Credentialing'
          pattern: \S
          description: Email subject line
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentDTO'
          description: Optional list of email attachments
        multiTenant:
          type: boolean
    EmailWithReplies:
      type: object
      properties:
        id:
          type: string
          description: Email record ID
        subject:
          type: string
          description: Email subject line
        body:
          type: string
          description: Email body content
        fromAddress:
          type: array
          items:
            type: string
          description: Sender email address(es)
        toAddresses:
          type: array
          items:
            type: string
          description: Recipient email addresses
        ccAddresses:
          type: array
          items:
            type: string
          description: CC email addresses
        bccAddresses:
          type: array
          items:
            type: string
          description: BCC email addresses
        direction:
          type: string
          enum:
          - INBOUND
          - OUTBOUND
          examples:
          - OUTBOUND
          description: Whether this email was sent by CertifyOS or received from a recipient
        deliveryStatus:
          type: string
          enum:
          - processed
          - deferred
          - delivered
          examples:
          - delivered
          description: Latest SendGrid delivery status for this email
        engagementData:
          type: string
          description: Raw engagement event data reported by SendGrid for this email
        dispatched:
          type: boolean
          description: Whether this email was successfully dispatched via SendGrid
        sendgridId:
          type: string
          description: SendGrid message ID for this email, null if it was never dispatched
        statusCode:
          type: integer
          format: int32
          description: HTTP status code returned by SendGrid for this email's send attempt
        submitterEmail:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this email record was created
        updatedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this email record was last updated
        replies:
          type: array
          items:
            $ref: '#/components/schemas/EmailReply'
          description: Replies received to this email
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: Files attached to this email; each id is usable with the attachment download endpoint
    ApiError:
      type: object
      description: Standard API error response containing a list of error objects
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
          description: List of error objects describing validation or processing failures
    Instant:
      type: string
      format: date-time
      examples:
      - '2022-03-10T16:15:50Z'
    PractitionerOutreachItem:
      type: object
      properties:
        id:
          type: string
          description: Outreach record ID
        tenantId:
          type: string
          description: Tenant that owns this outreach record
        workflowId:
          type: string
          description: Credentialing workflow (practitioner or facility) this outreach was sent for
        outreachType:
          type: string
          enum:
          - PRACTITIONER_CREDENTIALING
          - FACILITY_CREDENTIALING
          - PRACTITIONER_MONITORING
          examples:
          - FACILITY_CREDENTIALING
          description: Outreach category this record was created for
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/OutreachReasonWithLabel'
          description: Outreach reasons with their display labels
        active:
          type: boolean
          description: Whether this outreach is still open/awaiting a response
        attemptsCount:
          type: integer
          format: int32
          description: Number of outreach emails sent for this record
        lastAttemptedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp of the most recent outreach attempt
        workflowStatus:
          type: string
          description: Status of the referenced credentialing workflow at the time of this response
        outreachPage:
          type: string
          examples:
          - https://app.certifyos.com/outreach?token=eyJ...
          description: Signed provider-portal link where the provider submits a response to this outreach. Present only when the tenant has the provider portal enabled, the outreach is still awaiting a response, and an outreach email exists to thread the submission onto; otherwise null.
        createdBy:
          type: string
          description: User ID that created this outreach record
        createdByName:
          type: string
          description: Display name of the user that created this outreach record
        createdAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this outreach record was created
        updatedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp this outreach record was last updated
        participatingTenants:
          type: array
          examples:
          - - tenant-bcbs
            - tenant-uhc
          items:
            type: string
          description: Tenant ids this outreach was sent for, captured at send time (shared credentialing sends). Omitted for single-tenant outreaches; use tenantId instead.
        subject:
          type: string
          description: Subject of the outreach's latest outbound email. Present only in the shared credentialing listing (includeAllParticipatingTenants=true).
        toAddresses:
          type: array
          items:
            type: string
          description: To recipients of the outreach's latest outbound email. Present only in the shared credentialing listing (includeAllParticipatingTenants=true).
        ccAddresses:
          type: array
          items:
            type: string
          description: CC recipients of the outreach's latest outbound email. Present only in the shared credentialing listing (includeAllParticipatingTenants=true).
    JsonNodeType:
      type: string
      enum:
      - ARRAY
      - BINARY
      - BOOLEAN
      - MISSING
      - 'NULL'
      - NUMBER
      - OBJECT
      - POJO
      - STRING
    AttachmentDTO:
      type: object
      required:
      - filename
      - content
      - contentType
      properties:
        filename:
          type: string
          pattern: \S
        content:
          type: string
          format: binary
        contentType:
          type: string
          pattern: \S
    AttachmentDownloadResponse:
      type: object
      description: Response containing presigned URL for downloading email attachment
      properties:
        url:
          type: string
          description: Presigned URL for downloading the attachment
        expiresIn:
          type: integer
          format: int32
          description: Number of hours until the URL expires
        expiresAt:
          type: integer
          format: int64
          description: Unix timestamp when the URL expires
        fileName:
          type: string
          description: Original filename of the attachment
    BundlableWorkflowResponse:
      type: object
      description: Workflow eligible for multi-tenant outreach bundling
      properties:
        id:
          type: string
          description: Credentialing workflow ID
        tenantId:
          type: string
          description: Tenant that owns the workflow
        tenantName:
          type: string
          description: Display name of the owning tenant
        practitionerName:
          type: string
          description: Practitioner display name
        npi:
          type: string
          description: Practitioner NPI
        credentialingCycle:
          type: string
          examples:
          - INITIAL
          description: Credentialing cycle
        credentialingStatus:
          type: string
          description: Current credentialing status
  securitySchemes:
    jwt:
      type: http
      description: JWT Authentication - Provide only the raw token without Bearer prefix
      scheme: bearer
      bearerFormat: JWT
