          - 5
          description: Total number of flags processed
        successCount:
          type: integer
          format: int32
          examples:
          - 4
          description: Number of successful updates
        failureCount:
          type: integer
          format: int32
          examples:
          - 1
          description: Number of failed updates
    BulkFlagStatusUpdateRequest:
      type: object
      description: Request to update status of multiple flags
      properties:
        type:
          type: string
          examples:
          - ids
          description: 'Selection type: "ids" (default) or "filter".'
        flagIds:
          type: array
          examples:
          - - flag-123
            - flag-456
            - flag-789
          items:
            type: string
            pattern: \S
          description: Flag IDs to update (used when type is "ids").
        filter:
          $ref: '#/components/schemas/JsonNode'
          type: object
          description: Filter selecting all matching flags (required when type is "filter").
        expectedCount:
          type: integer
          format: int32
          description: Expected number of matching flags for the filter (required when type is "filter").
        comment:
          type: string
          description: Optional comment for the status change; stored on each flag's history record.
    FlagResult:
      type: object
      description: Flag move-to-seen outcome
      properties:
        attempted:
          type: boolean
          description: Whether the move was attempted
        ok:
