    TerminateGroupSpecialtyRequest:
      description: 'Request to terminate one or more group specialties from network participation. Terminates at group-network association; optionally at group-location and group-level. Required: specialtyIds (standard Specialty IDs). Optional: networkIds (standard Network IDs to restrict scope).'
      type: object
      required:
      - specialtyIds
      - terminationEffectiveDate
      - acknowledgementConfirmed
      properties:
        specialtyIds:
          type: array
          items:
            type: string
            pattern: \S
          description: 'Required. List of Specialty IDs (standard/certify specialty identifiers) to terminate for this group. Each must be a specialty currently associated with the group. Obtain from: GET /specialties, or GET /groups/{id}/relationships/all (specialties with specialtyId).'
          examples:
          - - 207Q00000X
            - 208D00000X
          minItems: 1
        networkIds:
          type: array
          items:
            type: string
          description: 'Optional. Network IDs (standard/certify network identifiers) to restrict termination to. If null or empty, terminates from all networks the group participates in. Obtain from: GET /networks or GET /groups/{id}/relationships/all (networks).'
          examples:
          - - net_001
            - net_002
        terminationInformedDate:
          type: string
          description: Termination informed date (ISO-8601 YYYY-MM-DD).
          examples:
          - '2024-01-15'
          pattern: ^\d{4}-\d{2}-\d{2}$
        terminationEffectiveDate:
          type: string
          description: Termination effective date (ISO-8601 YYYY-MM-DD). When the specialty termination takes effect.
          examples:
          - '2024-02-01'
          pattern: ^\d{4}-\d{2}-\d{2}$
        terminationReason:
          type: string
          description: Termination reason (e.g. code or free text).
          examples:
          - SPECIALTY_DISCONTINUED
        acknowledgementConfirmed:
          type: boolean
          description: User acknowledgement that terminating specialty from the group will terminate it from its locations, participating networks and plans.
        terminateAtGroupLocationSpecialties:
          type: boolean
          description: If true, also terminate the specialty at group-location level (TenantGroupLocationSpecialty).
          default: true
        terminateAtGroupLevel:
          type: boolean
          description: If true, also terminate the specialty at group level (TenantGroupSpecialty).
          default: true
    AssociateGroupLocationNetworksResponse:
      description: Response for associating a group location with networks
      type: object
      properties:
        tenantGroupLocationId:
          type: string
          description: ID of the group location
          examples:
