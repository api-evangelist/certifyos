openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer Group API
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: Group
  description: APIs for managing group entities
paths:
  /groups:
    get:
      summary: List groups matching filter criteria
      description: Returns a paginated list of groups for the requesting tenant that match all supplied filter criteria (filters are combined with AND semantics); all filters are optional, and omitting them returns every group for the tenant. Use this endpoint to enumerate or search across groups; for a known certifyGroupId use GET /groups/{id}, and for autocomplete-style name/NPI/TIN prefix search use GET /groups/search. Pagination is offset-based via page and size; the default page size is 2 and no maximum page size is enforced.
      operationId: groupFindMany
      tags:
      - Group
      parameters:
      - description: Filters by case-insensitive substring match on the group's affiliation. Free text; not validated against an enum.
        name: affiliation
        in: query
        schema:
          type: string
      - description: Search by associated location name (partial, case-insensitive)
        name: locationName
        in: query
        schema:
          type: string
      - description: Search by associated location NPI (exact 10-digit match)
        name: locationNpi
        in: query
        schema:
          type: string
      - description: Filters by case-insensitive substring match on the group's name.
        name: name
        in: query
        schema:
          type: string
      - description: Filters by exact, case-sensitive match on the group's NPI.
        name: npi
        in: query
        schema:
          type: string
      - description: Page number for offset-based pagination (0-based index). Defaults to 0 if not specified.
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: '0'
      - description: Number of items per page in offset-based pagination. Defaults to 2 if not specified. No maximum page size is enforced.
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: '2'
      - description: Filters by exact, case-sensitive match on the group's TIN.
        name: tin
        in: query
        schema:
          type: string
      - description: Filters by exact, case-sensitive match on the group's type. Free text; not validated against an enum.
        name: type
        in: query
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Paginated envelope of group records matching the supplied filters
          content:
            application/json:
              examples:
                groupList:
                  value:
                    data:
                    - certifyGroupId: grp_9f8a7b6c5d4e
                      name: Acme Medical Group
                      npi: '1234567890'
                      tin: 12-3456789
                      type: Medical Group
                      affiliation: Independent
                    totalCount: 1
              schema:
                $ref: '#/components/schemas/PagedResponse'
        '401':
          description: Unauthorized - User is not authenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: UNAUTHORIZED
                      title: Unauthorized
                      detail: Missing or invalid authentication token
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
    post:
      summary: Create a new group for the tenant
      description: 'Creates a new group record scoped to the requesting tenant. The request body must supply at least one of npi or externalGroupId; email is validated and returns 400 if malformed, but no other fields are currently enforced by request validation (schema validation is disabled for this endpoint). Not idempotent — repeated calls with identical payloads create duplicate group records. Note: the parentHealthcareOrgId query parameter is currently accepted but has no effect on the created group regardless of the value supplied.'
      operationId: groupCreate
      tags:
      - Group
      parameters:
      - description: Parent healthcare organization ID. Currently accepted but not used — has no effect on the created group.
        example: parent-org-123
        required: false
        name: parentHealthcareOrgId
        in: query
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Group data as JSON. At least one of npi or externalGroupId is required.
        content:
          application/json:
            examples:
              createGroup:
                value:
                  name: Acme Medical Group
                  npi: '1234567890'
                  tin: 12-3456789
                  externalGroupId: ext-group-123
                  active: true
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
        required: true
      responses:
        '201':
          description: Group successfully created
          content:
            application/json:
              examples:
                groupCreated:
                  value:
                    id: grp_9f8a7b6c5d4e
                    crosswalkId: '1234567890'
              schema:
                $ref: '#/components/schemas/GroupCreateResponse'
        '400':
          description: Invalid request body — neither npi nor externalGroupId was supplied, or email failed format validation
          content:
            application/json:
              examples:
                missingIdentifier:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: VALIDATION_ERROR
                      title: Invalid request
                      detail: Either 'npi' or 'externalGroupId' field is required in request payload
              schema:
                $ref: '#/components/schemas/ApiError1'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '500':
          description: Internal server error during request processing (e.g., network timeout, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /groups/locations/{locationId}/networks:
    patch:
      summary: Update effective date for all group location network associations
      description: Updates the effective date for ALL network associations linked to the specified group location in a single bulk operation — every network row for the location is overwritten to the same date. Use this endpoint when all associations for a location share the same effective date; to update a single specific network association instead, use PATCH /groups/locations/{locationId}/networks/{networkId}/effective-date. effectiveDate is required and must be in YYYY-MM-DD format.
      operationId: updateGroupLocationNetworkDates
      tags:
      - Group
      parameters:
      - description: Group Location ID (tenantGroupLocationId)
        example: tgl-123
        required: true
        name: locationId
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Request containing effectiveDate to update
        content:
          application/json:
            examples:
              updateLocationNetworkDates:
                value:
                  effectiveDate: '2026-01-01'
            schema:
              $ref: '#/components/schemas/UpdateGroupLocationNetworkDatesRequest'
        required: true
      responses:
        '200':
          description: Group location network effective date successfully updated
          content:
            application/json:
              examples:
                locationNetworkDatesUpdated:
                  value:
                    tenantGroupLocationId: tgl-123
                    tenantGroupLocationNetworkIds:
                    - tgln_789
                    - tgln_790
              schema:
                $ref: '#/components/schemas/UpdateGroupLocationNetworkDatesResponse'
        '400':
          description: Invalid request body or missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '404':
          description: Group location or networks not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error during request processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
    post:
      summary: Associate a group location with networks
      description: Associates an existing group location with one or more networks, creating group-location–network membership records. Use this endpoint after the group location has been added to the group (via POST /groups/{groupId}/locations); call once per set of networks to associate, and use PATCH /groups/locations/{locationId}/networks to update effective dates on existing associations. Not idempotent — if an active association between this location and a requested network already exists, the server returns 409 Conflict rather than silently succeeding; resolve or terminate the existing association first.
      operationId: associateGroupLocationNetworks
      tags:
      - Group
      parameters:
      - description: Group Location ID (tenantGroupLocationId)
        example: loc-123
        required: true
        name: locationId
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Networks to associate with the group location
        content:
          application/json:
            examples:
              associateLocationNetworks:
                value:
                  networks:
                  - networkId: net_001
            schema:
              $ref: '#/components/schemas/AssociateGroupLocationNetworksRequest'
        required: true
      responses:
        '201':
          description: Group location successfully associated with networks
          content:
            application/json:
              examples:
                locationNetworksAssociated:
                  value:
                    tenantGroupLocationId: tgl_123456
                    networks:
                    - networkId: net_001
                      tenantGroupLocationNetworkId: tgln_789
              schema:
                $ref: '#/components/schemas/AssociateGroupLocationNetworksResponse'
        '400':
          description: Invalid request body or missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Group location or network not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '409':
          description: Active network association already exists
          content:
            application/json:
              examples:
                activeAssociationExists:
                  value:
                    errors:
                    - httpStatus: 409
                      reason: CONFLICT
                      title: Association conflict
                      detail: 'An active network association already exists for this location and network: net_001'
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error during request processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /groups/locations/{locationId}/networks/terminate:
    put:
      summary: Terminate a group location from specific networks
      description: Terminates the association between a group location and one or more networks, ending the location's membership in those networks. Only the location–network associations are affected; this operation does not cascade to practitioner associations, specialty associations, or any other related records for this location. Use this endpoint for targeted network termination of a location while preserving its other relationships; to terminate the location from the group entirely, use PUT /groups/locations/{locationId}/terminate instead.
      operationId: terminateGroupLocationFromNetwork
      tags:
      - Group
      parameters:
      - description: Group Location ID (tenantGroupLocationId)
        example: loc-123
        required: true
        name: locationId
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Request containing network IDs to terminate from
        content:
          application/json:
            examples:
              terminateLocationFromNetworks:
                value:
                  networkIds:
                  - net_001
                  terminationDate: '2026-02-01'
            schema:
              $ref: '#/components/schemas/TerminateGroupLocationFromNetworkRequest'
        required: true
      responses:
        '200':
          description: Successfully terminated group location from networks
          content:
            application/json:
              examples:
                locationTerminatedFromNetworks:
                  value:
                    tenantGroupLocationId: tgl_123456
                    terminatedCount: 1
                    networkIds:
                    - net_001
                    results:
                    - networkId: net_001
                      success: true
                      errorMessage: ''
              schema:
                $ref: '#/components/schemas/TerminateGroupLocationFromNetworkResponse'
        '400':
          description: Bad request - Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Group location or network not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /groups/locations/{locationId}/networks/{networkId}/effective-date:
    patch:
      summary: Update effective date for a single group location network participation
      description: Updates the effective date on one TenantGroupLocationNetwork row for the given location and network. Does not update TenantGroupLocation, practitioners, or other network rows. CP-32281.
      operationId: updateGroupLocationNetworkEffectiveDate
      tags:
      - Group
      parameters:
      - description: Group Location ID (tenantGroupLocationId)
        example: tgl-123
        required: true
        name: locationId
        in: path
        schema:
          type: string
      - description: Network ID
        example: net-456
        required: true
        name: networkId
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Request containing effectiveDate to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupLocationNetworkEffectiveDateRequest'
        required: true
      responses:
        '200':
          description: Group location network effective date successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGroupLocationNetworkEffectiveDateResponse'
        '400':
          description: Invalid request body or cross-level validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '404':
          description: Group location or location-network participation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error during request processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /groups/locations/{locationId}/networks/{networkId}/npi-par-date:
    put:
      summary: Update location-network billing NPI and participation date for a group location
      description: 'As of CP-36570: updates NPI and/or participation date on the practitioner-agnostic TenantGroupLocationNetwork and TenantGroupLocationFacilityNetwork records only, upserting into the `addressType2Npi` array (supports multiple NPIs per location-network). TenantGroupLocationPractitionerNetwork rows are no longer written by this endpoint. Preferred: pass `npiEntries` with the location-network''s complete NPI set — it REPLACES the stored array, so an NPI omitted from the list is deleted (the only way to remove one) and an entry without `npiParticipationDate` is stored with no date. Deprecated: the scalar `npi`/`npiParticipationDate` fields still work (repeat the call to add/update additional NPIs; `npi` is required to disambiguate `npiParticipationDate` when more than one NPI exists) but are mutually exclusive with `npiEntries` in the same request.'
      operationId: updateGroupLocationNetworkNpiParDate
      tags:
      - Group
      parameters:
      - description: Group Location ID (tenantGroupLocationId)
        example: tgl-123
        required: true
        name: locationId
        in: path
        schema:
          type: string
      - description: Network ID
        example: net-456
        required: true
        name: networkId
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: NPI and/or participation date to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationNetworkNpiParDateRequest'
        required: true
      responses:
        '200':
          description: Group location-network NPI successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGroupLocationNetworkNpiParDateResponse'
        '400':
          description: Invalid request body or missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '404':
          description: Group location network not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error during request processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /groups/locations/{locationId}/terminate:
    put:
      summary: Terminate a group location
      description: Terminates a group location from a group. The cascade terminates the location's practitioner associations (GroupPractitionerLocation), the location record itself (GroupLocation, TenantGroupLocation), and — by default — all of the location's still-active network associations (TenantGroupLocationNetwork), so networksAffected reflects the number of network associations terminated by this call. Set the group-location.terminate.cascade-network.enabled config flag to false to disable the network cascade (networksAffected will then always be 0, matching the legacy behavior). If the network cascade fails (lookup or termination), this call returns 500 even though the location itself has already been terminated and is not rolled back — retry the request to complete the cascade; already-terminated networks are skipped on retry. To terminate only specific network associations without terminating the location itself, call PUT /groups/locations/{locationId}/networks/terminate instead. The request body must include consentConfirmed set to true to confirm the termination; omitting it or supplying false returns 400.
      operationId: terminateGroupLocation
      tags:
      - Group
      parameters:
      - description: Group Location ID (tenantGroupLocationId)
        example: loc-123
        required: true
        name: locationId
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Request containing termination details and user consent
        content:
          application/json:
            examples:
              terminateLocation:
                value:
                  terminationDate: '2026-01-15'
                  terminationReason: LOCATION_CLOSED
                  consentConfirmed: true
            schema:
              $ref: '#/components/schemas/TerminateGroupLocationRequest'
        required: true
      responses:
        '200':
          description: Successfully terminated group location
          content:
            application/json:
              examples:
                locationTerminated:
                  value:
                    tenantGroupLocationId: tgl_123456
                    success: true
                    terminationDate: '2026-01-15'
                    terminationReason: LOCATION_CLOSED
                    practitionersAffected: 2
                    practitionersRequiringReview:
                    - prac-456
                    networksAffected: 0
                    errorMessage: ''
              schema:
                $ref: '#/components/schemas/TerminateGroupLocationResponse'
        '400':
          description: Bad request - Invalid input, validation error, or consent not confirmed
          content:
            application/json:
              examples:
                consentNotConfirmed:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: BAD_REQUEST
                      title: Invalid request
                      detail: User consent is required to terminate a group location
              schema:
                $ref: '#/components/schemas/ApiError1'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Group location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /groups/search:
    get:
      summary: Search groups by name, NPI, or TIN
      description: Returns a paginated list of groups whose name (substring), NPI (prefix), or TIN (prefix) matches the supplied query term. Results are suitable for use in autocomplete dropdowns where the user needs to disambiguate groups with similar names. The stored reference for a selected group is the 'id' field (certifyGroupId).
      operationId: groupSearch
      tags:
      - Group
      parameters:
      - description: Page number (0-based)
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: '0'
      - description: Search term matched against group name (substring, case-insensitive), NPI (prefix), and TIN (prefix). Min 2 chars, max 128 chars.
        required: true
        name: q
        in: query
        schema:
          type: string
      - description: Page size (max 50)
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: '20'
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of matching groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponse'
        '400':
          description: Invalid request — q is required, must be 2–128 chars; page and size must be non-negative
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json: {}
      security:
      - jwt: []
  /groups/{groupId}/locations:
    put:
      summary: Update details for multiple group locations
      description: Updates detail fields for one or more locations within a group in a single call, designed for bulk ingestion workflows where location data arrives as a batch from an external roster or source system. Each entry targets a specific location; this is a partial merge per location entry, not a full replace — omitted fields are preserved from the existing record rather than cleared. Use this endpoint when updating multiple locations at once; to add a new location to a group use POST /groups/{groupId}/locations.
      operationId: updateGroupLocations
      tags:
      - Group
      parameters:
      - description: ID of the group (certify group ID)
        example: grp_9f8a7b6c5d4e
        required: true
        name: groupId
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Request containing locations to update
        content:
          application/json:
            examples:
              updateGroupLocations:
                value:
                  groupId: grp_9f8a7b6c5d4e
                  locations:
                  - tenantGroupLocationId: tgl_123456
                    locationData: {}
            schema:
              $ref: '#/components/schemas/UpdateGroupLocationsRequest'
        required: true
      responses:
        '200':
          description: Successfully updated group location details
          content:
            application/json:
              examples:
                groupLocationsUpdated:
                  value:
                    tenantGroupId: tgrp_123456
                    locationAssociations:
                    - tenantGroupLocationId: tgl_123456
                      locationId: loc-123
                      status: updated
              schema:
                $ref: '#/components/schemas/GroupLocationUpdateResponse'
        '400':
          description: Bad request - Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Group or location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
    post:
      summary: Add a new location to a group
      description: Adds a new location to an existing group, creating the necessary location and group-location membership records (and, if address information is provided, linked address records). Designed for batch ingestion workflows where location data arrives from an external roster or source system, but also suitable for individual location additions. The request body only strictly requires locationData as an object — no field inside it is independently enforced by request validation. Not idempotent — repeated calls create additional location records; to update an existing location use PUT /groups/{groupId}/locations.
      operationId: addGroupLocation
      tags:
      - Group
      parameters:
      - description: Group ID (certifyGroupId)
        example: group-123
        required: true
        name: groupId
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Location data to add to the group
        content:
          application/json:
            examples:
              addLocation:
                value:
                  locationData: {}
                  addresses:
                  - addressType: physical
                    addressLine1: 123 Main Street
                    city: New York
                    state: NY
                    zipCode: '10001'
                    country: US
                    isPrimary: true
            schema:
              $ref: '#/components/schemas/AddGroupLocationRequest'
        required: true
      responses:
        '201':
          description: Successfully added location to group
          content:
            application/json:
              examples:
                locationAdded:
                  value:
                    tenantId: tenant_001
                    tenantGroupId: tgrp_123456
                    coreLocationId: loc-123
                    groupLocationId: gl_456
                    tenantGroupLocationId: tgl_789
                    coreAddressIds:
                    - addr_001
                    status: created
              schema:
                $ref: '#/components/schemas/AddGroupLocationResponse'
        '400':
          description: Bad request - Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /groups/{groupId}/networks:
    put:
      summary: Update a group's network associations
