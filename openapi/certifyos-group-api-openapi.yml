            $ref: '#/components/schemas/LocationService'
          description: List of services offered at this location
        practiceLimitations:
          type: array
          items:
            $ref: '#/components/schemas/PracticeLimitation'
          description: List of practice limitations
        accessibility:
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityItem'
          description: Accessibility information as question/answer pairs
        tags:
          type: array
          items:
            type: string
          description: List of tags for categorization
        hospitalAdmittingPrivileges:
          description: Hospital admitting privileges information
          type: object
          $ref: '#/components/schemas/JsonNode'
        networks:
          type: array
          items:
            $ref: '#/components/schemas/LocationNetwork'
          description: List of networks for this location
        includePractitioners:
          type: boolean
          description: If true, enrolls all location practitioners to the networks with their respective specialties
    UpdateGroupLocationNetworkDatesResponse:
      description: Response for updating effective dates of group location network associations
      type: object
      required:
      - tenantGroupLocationId
      - tenantGroupLocationNetworkIds
      properties:
        tenantGroupLocationId:
          type: string
          description: ID of the tenant group location that was updated
          pattern: \S
        tenantGroupLocationNetworkIds:
          type: array
          items:
            type: string
          description: IDs of updated tenant group location network associations
    Contact:
      type: object
      description: Contact information
      properties:
        name:
          type: string
          description: Contact name
          examples:
          - Jane Smith
        email:
          type: string
          description: Contact email
          examples:
          - jane@example.com
        phone:
          type: string
          description: Contact phone
          examples:
          - 555-123-4567
        title:
          type: string
          description: Contact title
          examples:
          - Credentialing Manager
        department:
          type: string
          description: Contact department
          examples:
          - Credentialing
  securitySchemes:
    jwt:
      type: http
      description: JWT Authentication - Provide only the raw token without Bearer prefix
      scheme: bearer
      bearerFormat: JWT
