      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
        required: true
      responses:
        '201':
          description: Document uploaded successfully
          content:
            application/json:
              examples:
                documentUploaded:
                  value:
                    message: File uploaded and group record updated successfully
                    fileName: w9-2026.pdf
              schema:
                type: object
        '400':
          description: Bad request - Invalid input, e.g., file is missing
          content:
            application/json:
              examples:
                fileMissing:
                  value:
                    error: File is required.
              schema:
                type: object
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '500':
          description: Internal server error
          content:
            application/json: {}
      security:
      - jwt: []
  /groups/{sourceType}/{crosswalkId}:
    put:
      summary: Update a group by source system identifier (deprecated)
      description: '**Deprecated.** Updates an existing group identified by its originating source system type and crosswalk identifier. Prefer PUT /groups/{id} for all new integrations; no removal date has currently been published for this endpoint. Unlike PUT /groups/{id}, this endpoint applies JSON Schema validation to the request body and returns 400 on failure. sourceType is validated against the core_sources table — a dynamic, tenant-managed lookup rather than a fixed enum — and the request fails with 400 if no matching source row exists.'
      operationId: groupUpdateLegacy
      deprecated: true
      tags:
      - Group
      parameters:
      - description: External identifier used to link records in the source system.
        example: '1234567890'
        required: true
        name: crosswalkId
        in: path
        schema:
          type: string
      - description: Source type identifier. Must match an existing row's source_type value in the core_sources table — a dynamic, tenant-managed lookup, not a fixed set of values (e.g. 'nppes' is a known seeded value).
        example: external
        required: true
        name: sourceType
        in: path
        schema:
          type: string
      - description: Parent healthcare organization ID (optional)
        example: parent-org-123
        required: false
        name: parentHealthcareOrgId
        in: query
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Group data as JSON, validated against the group schema
        content:
          application/json:
            examples:
              updateGroupLegacy:
                value:
                  name: Acme Medical Group
                  npi: '1234567890'
                  tin: 12-3456789
                  active: true
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
        required: true
      responses:
        '200':
          description: Group successfully updated
          content:
            application/json:
              examples:
                groupUpdated:
                  value:
                    certifyGroupId: grp_9f8a7b6c5d4e
                    name: Acme Medical Group
                    npi: '1234567890'
                    tin: 12-3456789
              schema:
                type: object
        '400':
          description: Invalid request body (schema validation failed against the group schema), or sourceType does not match any row in the core_sources table
          content:
            application/json:
              examples:
                unknownSourceType:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: BAD_REQUEST
                      title: Invalid request
                      detail: No source found with type 'external'. Ensure source exists in core_sources table.
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error during request processing (e.g., network timeout, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
