          description: 'Deprecated: use npiEntries to upsert one or more NPIs in a single call. 10-digit location billing NPI to upsert into the addressType2Npi array. Omit or null to leave unchanged (only valid when the location-network has exactly one existing NPI); empty string clears the entire array. Mutually exclusive with npiEntries.'
