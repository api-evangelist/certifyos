          type: string
          examples:
          - Jane Smith
          description: Contact name
        email:
          type: string
          examples:
          - jane@example.com
          description: Contact email
        phone:
          type: string
          examples:
          - 555-123-4567
          description: Contact phone
        title:
          type: string
          examples:
          - Credentialing Manager
          description: Contact title
        department:
          type: string
          examples:
          - Credentialing
          description: Contact department
    TerminateGroupLocationRequest:
      type: object
      required:
      - terminationDate
      - consentConfirmed
      description: Request to terminate a group location
      properties:
        terminationDate:
          type: string
          examples:
          - '2024-01-15'
          pattern: \S
          description: Termination date (ISO-8601 format, e.g., 2024-01-15). Must be >= start/effective date. Future dates allowed.
        terminationInformedDate:
          type: string
          examples:
          - '2024-01-15'
          description: Date when termination was informed (ISO-8601 format, e.g., 2024-01-15)
        terminationReason:
          type: string
          examples:
          - FACILITY_CLOSED
          description: Termination reason code. Used for compliance and audit purposes.
        consentConfirmed:
          type: boolean
          description: User consent confirmation that they understand the impact of this termination on the group, networks, plans, and practitioners
        networkIds:
          type: array
          items:
            type: string
          description: When non-empty, terminates only these networks for the location (TenantGroupLocationNetwork). Does not terminate the whole location or other networks.
        data:
          type: object
          description: Additional termination data
        continuityOfCare:
          type: boolean
          examples:
          - false
          description: Whether Continuity of Care applies for this termination. Defaults to false when omitted.
    ApiError:
      type: object
      description: Standard API error response containing a list of error objects
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
          description: List of error objects describing validation or processing failures
    TerminateGroupLocationFromNetworkResponse:
      type: object
      required:
      - tenantGroupLocationId
      - terminatedCount
      - networkIds
      - results
      description: Response for terminating a group location from networks
      properties:
        tenantGroupLocationId:
          type: string
          description: The tenant group location ID
        terminatedCount:
          type: integer
          format: int32
          description: The number of networks terminated from
        networkIds:
          type: array
          items:
            type: string
          description: List of network IDs that were terminated
        results:
          type: array
          items:
            $ref: '#/components/schemas/NetworkTerminationResult'
          description: Termination results for each network
    UpdateGroupLocationNetworkDatesResponse:
      type: object
      required:
      - tenantGroupLocationId
      - tenantGroupLocationNetworkIds
      description: Response for updating effective dates of group location network associations
      properties:
        tenantGroupLocationId:
          type: string
          pattern: \S
          description: ID of the tenant group location that was updated
        tenantGroupLocationNetworkIds:
          type: array
          items:
            type: string
          description: IDs of updated tenant group location network associations
    LocationNetwork:
      type: object
      required:
      - networkId
      properties:
        networkId:
          type: string
          description: ID of the network
        data:
          type: object
          description: Additional network data (effectiveDate, terminationDate, etc.)
