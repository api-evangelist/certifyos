                      dataPipelineRequestCreatedAt: '2026-06-01'
                      dataPipelineRequestStepLastCreatedAt: '2026-06-01'
              schema:
                $ref: '#/components/schemas/GetMonitoringPipelineRunsResponse'
        '404':
          description: Monitoring workflow not found
          content:
            application/json:
              examples:
                workflowNotFound:
                  value:
                    errors:
                    - httpStatus: 404
                      reason: NOT_FOUND
