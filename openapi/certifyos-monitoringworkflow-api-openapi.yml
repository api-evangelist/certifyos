openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer Monitoring Workflow API
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: MonitoringWorkflow
  description: APIs for managing monitoring workflows
paths:
  /monitoring-workflows:
    get:
      summary: List monitoring workflows with filtering and pagination
      description: 'Returns a paginated list of monitoring workflows for the authenticated tenant. Use this endpoint to browse or search workflows; use `GET /monitoring-workflows/{id}` when you already know a specific workflow ID. Supports two pagination modes: offset-based (`page`/`size`, default page 0, size 50) and cursor-based (`startAfterId` for forward, `endAtId` for backward). Supplying either cursor parameter switches the query to cursor-based pagination and overrides `page`/`size`; if both `startAfterId` and `endAtId` are supplied, `startAfterId` takes precedence and `endAtId` is ignored. Filtering is controlled by the `filter` query parameter, a URL-encoded JSON object mapping a field path to an operator (`eq`, `neq`, `gt`, `gte`, `lt`, `lte`, `in`, `nin`, or `contains`; `contains` is only valid on string fields), e.g. {"data.monitoringStatus":{"eq":"IN_PROGRESS"}}. The `order` parameter accepts a JSON sort specification, e.g. {"createdAt":"desc"}. When `filter` is omitted, all workflows for the tenant are returned up to the page size. Requires the `MONITORING_WORKFLOW_READ` permission. The `tenant-id` header is mandatory. For callers without the `MONITORING_WORKFLOW_NEEDS_VERIFICATION_FLAG` permission, flags with status `needsVerification` are stripped from each workflow''s flag arrays — the workflows themselves are still returned.'
      operationId: getMonitoringWorkflows
      tags:
      - MonitoringWorkflow
      parameters:
      - description: End at this document ID for backward cursor-based pagination. Ignored if startAfterId is also supplied.
        name: endAtId
        in: query
        schema:
          type: string
      - description: Filter criteria as a URL-encoded JSON object mapping field paths to an operator (eq, neq, gt, gte, lt, lte, in, nin, contains), e.g. {"data.monitoringStatus":{"eq":"IN_PROGRESS"}}. Omit to return all workflows for the tenant.
        name: filter
        in: query
        schema:
          type: string
      - description: JSON sort specification, e.g. {"createdAt":"desc"}.
        name: order
        in: query
        schema:
          type: string
      - description: Page number (0-based) for offset-based pagination. Ignored if startAfterId or endAtId is supplied.
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: '0'
      - description: Page size (default 50) for either pagination mode.
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: '50'
      - description: Start after this document ID for forward cursor-based pagination. Supplying this switches to cursor-based pagination and takes precedence over endAtId.
        name: startAfterId
        in: query
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: UNAUTHORIZED
                      title: Unauthorized
                      detail: Missing or invalid authentication token
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: FORBIDDEN
                      title: Forbidden
                      detail: User lacks MONITORING_WORKFLOW_READ permission for this tenant
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internalError:
                  value:
                    errors:
                    - httpStatus: 500
                      reason: INTERNAL_SERVER_ERROR
                      title: Internal Server Error
                      detail: Failed to get monitoring workflows
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: 'Pagination envelope: `totalCount` (total workflows matching the filter) and `data` (array of monitoring workflow records for the current page).'
          content:
            application/json:
              examples:
                monitoringWorkflowList:
                  value:
                    totalCount: 1
                    data:
                    - id: 44c8fa75-15a1-4790-a0dd-139058d1f86d
                      tenantId: tenant_123456
                      tenantPractitionerId: tp_123456
                      certifyPractitionerId: cp_123456
                      data:
                        monitoringStatus: IN_PROGRESS
                        assignedTo: user_123456
                        assignedToName: Jordan Lee
                        practitioner:
                          dea:
                          - deaNumber: AB1234563
                            expirationDate: '2027-03-31'
                      createdBy: user_123456
                      updatedBy: user_789012
                      createdAt: '2026-05-01T14:30:00Z'
                      updatedAt: '2026-06-01T09:15:00Z'
                      newFlags: []
                      sectionFlags: []
                      allFlags: []
                      allFlagsCount: 0
              schema:
                $ref: '#/components/schemas/GetMonitoringWorkflowsResponse'
        '400':
          description: Invalid request parameters, e.g. a malformed `filter` or `order` JSON value
          content:
            application/json:
              examples:
                invalidFilter:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: BAD_REQUEST
                      title: Bad Request
                      detail: 'Malformed filter parameter: not valid JSON'
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /monitoring-workflows/assignments:
    post:
      summary: Bulk-assign workflows to one or more users
      description: 'Distributes multiple monitoring workflows evenly across the provided user IDs using round-robin assignment. Use this endpoint to assign many workflows in a single call instead of one at a time via `POST /monitoring-workflows/{id}/assignment`. The request body must supply either `workflowIds` or `filter` to identify which workflows to assign — at least one is required. Workflows currently in `REVIEWED_BY_CERTIFYOS` status are automatically excluded from assignment and appear in the response `failed` array. Requires one of: `MONITORING_WORKFLOW_ASSIGN`, `MONITORING_WORKFLOW_ASSIGN_SELF`, or `MONITORING_WORKFLOW_BULK_ASSIGN`. The `tenant-id` header is mandatory. Always returns HTTP 200, even when every individual assignment fails — check the `successful` and `failed` arrays for per-workflow outcomes.'
      operationId: bulkAssignMonitoringWorkflows
      tags:
      - MonitoringWorkflow
      parameters:
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              assignByWorkflowIds:
                value:
                  workflowIds:
                  - 44c8fa75-15a1-4790-a0dd-139058d1f86d
                  - 55d9fb86-26b2-5801-b1ee-240169e2f97e
                  assignTo:
                  - user_789012
                  - user_345678
            schema:
              $ref: '#/components/schemas/BulkAssignMonitoringWorkflowRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: UNAUTHORIZED
                      title: Unauthorized
                      detail: Missing or invalid authentication token
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: FORBIDDEN
                      title: Forbidden
                      detail: User lacks any of the assign permissions required for this endpoint
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internalError:
                  value:
                    errors:
                    - httpStatus: 500
                      reason: INTERNAL_SERVER_ERROR
                      title: Internal Server Error
                      detail: Failed to create bulk assignments
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: 'Bulk assignment completed. `successful`/`failed` are arrays of `{workflowId, assignment: {assignedTo, assignedBy, assignedAt}, error}` — `assignment` is populated on success, `error` on failure. `totalProcessed`, `successCount`, and `failureCount` summarize the batch.'
          content:
            application/json:
              examples:
                allSucceeded:
                  value:
                    successful:
                    - workflowId: 44c8fa75-15a1-4790-a0dd-139058d1f86d
                      assignment:
                        assignedTo: user_789012
                        assignedBy: user_123456
                        assignedAt: '2026-06-01T14:30:00Z'
                    failed: []
                    totalProcessed: 1
                    successCount: 1
                    failureCount: 0
                partialFailure:
                  value:
                    successful:
                    - workflowId: 44c8fa75-15a1-4790-a0dd-139058d1f86d
                      assignment:
                        assignedTo: user_789012
                        assignedBy: user_123456
                        assignedAt: '2026-06-01T14:30:00Z'
                    failed:
                    - workflowId: 55d9fb86-26b2-5801-b1ee-240169e2f97e
                      error: Workflow is in REVIEWED_BY_CERTIFYOS status and cannot be reassigned
                    totalProcessed: 2
                    successCount: 1
                    failureCount: 1
              schema:
                $ref: '#/components/schemas/BulkAssignMonitoringWorkflowResponse'
        '400':
          description: Invalid request data, e.g. neither workflowIds nor filter was supplied
          content:
            application/json:
              examples:
                missingSelection:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: BAD_REQUEST
                      title: Bad Request
                      detail: Either workflowIds or filter must be provided
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /monitoring-workflows/bulk/status:
    put:
      summary: Bulk-update the monitoring status of multiple workflows
      description: 'Transitions multiple monitoring workflows to the given `workflowStatus` in a single call. Use this endpoint for batch status changes; use `PUT /monitoring-workflows/{workflowId}/status` for a single workflow. Allowed `workflowStatus` values: `IN_PROGRESS`, `OUTREACH_IN_PROGRESS`, `DATA_MISSING`, `NO_ACTION_REQUIRED`, `REVIEWED_BY_CERTIFYOS`. The optional `description` field is a free-text note attached to the transition. Requires `MONITORING_WORKFLOW_UPDATE`. The `tenant-id` header is mandatory. Always returns HTTP 200, even when some workflows fail to transition — check the `successfulWorkflowIds` and `failures` arrays.'
      operationId: bulkUpdateMonitoringWorkflowStatus
      tags:
      - MonitoringWorkflow
      parameters:
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              moveToInProgress:
                value:
                  workflowIds:
                  - 44c8fa75-15a1-4790-a0dd-139058d1f86d
                  - 55d9fb86-26b2-5801-b1ee-240169e2f97e
                  workflowStatus: IN_PROGRESS
                  description: Starting monitoring review for this cycle
              markReviewedByCertifyOS:
                value:
                  workflowIds:
                  - 44c8fa75-15a1-4790-a0dd-139058d1f86d
                  - 55d9fb86-26b2-5801-b1ee-240169e2f97e
                  workflowStatus: REVIEWED_BY_CERTIFYOS
                  description: Monitoring review complete, no action required
            schema:
              $ref: '#/components/schemas/BulkUpdateMonitoringWorkflowStatusRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: UNAUTHORIZED
                      title: Unauthorized
                      detail: Missing or invalid authentication token
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: FORBIDDEN
                      title: Forbidden
                      detail: User lacks MONITORING_WORKFLOW_UPDATE permission for this tenant
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internalError:
                  value:
                    errors:
                    - httpStatus: 500
                      reason: INTERNAL_SERVER_ERROR
                      title: Internal Server Error
                      detail: Failed to perform bulk monitoring workflow status update
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: Bulk status update completed. `totalCount`/`successCount`/`failureCount` summarize the batch; `successfulWorkflowIds` lists updated workflow IDs; `failures` is an array of `{workflowId, errorMessage}` for the ones that failed.
          content:
            application/json:
              examples:
                allSucceeded:
                  value:
                    totalCount: 2
                    successCount: 2
                    failureCount: 0
                    successfulWorkflowIds:
                    - 44c8fa75-15a1-4790-a0dd-139058d1f86d
                    - 55d9fb86-26b2-5801-b1ee-240169e2f97e
                    failures: []
                partialFailure:
                  value:
                    totalCount: 2
                    successCount: 1
                    failureCount: 1
                    successfulWorkflowIds:
                    - 44c8fa75-15a1-4790-a0dd-139058d1f86d
                    failures:
                    - workflowId: 55d9fb86-26b2-5801-b1ee-240169e2f97e
                      errorMessage: No transition defined from REVIEWED_BY_CERTIFYOS to IN_PROGRESS
              schema:
                $ref: '#/components/schemas/BulkUpdateMonitoringWorkflowStatusResponse'
        '400':
          description: Invalid request parameters, e.g. an unrecognized workflowStatus value
          content:
            application/json:
              examples:
                invalidStatus:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: BAD_REQUEST
                      title: Bad Request
                      detail: 'Unknown workflowStatus: BOGUS_STATUS'
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /monitoring-workflows/unassign:
    patch:
      summary: Bulk-remove assignments from multiple workflows
      description: 'Removes the current assignee from multiple monitoring workflows in one call. Use this endpoint for bulk unassignment; use `PATCH /monitoring-workflows/{id}/unassign` for a single workflow. The request body must supply either `workflowIds` or `filter` — at least one is required. Workflows in `REVIEWED_BY_CERTIFYOS` status are automatically excluded and appear in the response `failed` array. Requires all of: `MONITORING_WORKFLOW_ASSIGN`, `MONITORING_WORKFLOW_BULK_ASSIGN`, and `MONITORING_WORKFLOW_ASSIGN_SELF`. The `tenant-id` header is mandatory. Always returns HTTP 200, even when some unassignments fail — check the `successful` and `failed` arrays for per-workflow outcomes.'
      operationId: bulkUnassignMonitoringWorkflows
      tags:
      - MonitoringWorkflow
      parameters:
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              unassignByWorkflowIds:
                value:
                  workflowIds:
                  - 44c8fa75-15a1-4790-a0dd-139058d1f86d
                  - 55d9fb86-26b2-5801-b1ee-240169e2f97e
            schema:
              $ref: '#/components/schemas/BulkUnassignMonitoringWorkflowRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: UNAUTHORIZED
                      title: Unauthorized
                      detail: Missing or invalid authentication token
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: FORBIDDEN
                      title: Forbidden
                      detail: User lacks all of the assign permissions required for this endpoint
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internalError:
                  value:
                    errors:
                    - httpStatus: 500
                      reason: INTERNAL_SERVER_ERROR
                      title: Internal Server Error
                      detail: Failed to perform bulk unassignment
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: Bulk unassignment completed. `successful`/`failed` are arrays of `{workflowId, error}` — `error` is null on success. `totalProcessed`, `successCount`, and `failureCount` summarize the batch.
          content:
            application/json:
              examples:
                allSucceeded:
                  value:
                    successful:
                    - workflowId: 44c8fa75-15a1-4790-a0dd-139058d1f86d
                    failed: []
                    totalProcessed: 1
                    successCount: 1
                    failureCount: 0
                partialFailure:
                  value:
                    successful:
                    - workflowId: 44c8fa75-15a1-4790-a0dd-139058d1f86d
                    failed:
                    - workflowId: 55d9fb86-26b2-5801-b1ee-240169e2f97e
                      error: Workflow is in REVIEWED_BY_CERTIFYOS status and cannot be unassigned
                    totalProcessed: 2
                    successCount: 1
                    failureCount: 1
              schema:
                $ref: '#/components/schemas/BulkUnassignMonitoringWorkflowResponse'
        '400':
          description: Invalid request data, e.g. neither workflowIds nor filter was supplied
          content:
            application/json:
              examples:
                missingSelection:
                  value:
                    errors:
                    - httpStatus: 400
                      reason: BAD_REQUEST
                      title: Bad Request
                      detail: Either workflowIds or filter must be provided
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /monitoring-workflows/{id}:
    get:
      summary: Fetch a single monitoring workflow by ID
      description: Returns a single monitoring workflow identified by `id`. Use this endpoint when you already have the workflow ID; use `GET /monitoring-workflows` to search or paginate. The `tenant-id` header is mandatory and scopes the lookup. The response is enriched with resolved display names (`verifiedByName`, `assignedByName`, `assignedToName`); records with a non-null `deletedAt` inside CRUD-enabled practitioner sections (e.g. `licenses`, `dea`) are filtered out; and, for callers without the `MONITORING_WORKFLOW_NEEDS_VERIFICATION_FLAG` permission, flags with status `needsVerification` are stripped from the flag arrays. Requires `MONITORING_WORKFLOW_READ`.
      operationId: getMonitoringWorkflow
      tags:
      - MonitoringWorkflow
      parameters:
      - description: The monitoring workflow's document ID, obtained from GET /monitoring-workflows or from a previous create/update response
        example: 44c8fa75-15a1-4790-a0dd-139058d1f86d
        in: path
        required: true
        name: id
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: UNAUTHORIZED
                      title: Unauthorized
                      detail: Missing or invalid authentication token
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: FORBIDDEN
                      title: Forbidden
                      detail: User lacks MONITORING_WORKFLOW_READ permission for this tenant
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internalError:
                  value:
                    errors:
                    - httpStatus: 500
                      reason: INTERNAL_SERVER_ERROR
                      title: Internal Server Error
                      detail: Failed to get monitoring workflow ID 44c8fa75-15a1-4790-a0dd-139058d1f86d
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: The enriched monitoring workflow record.
          content:
            application/json:
              examples:
                monitoringWorkflow:
                  value:
                    id: 44c8fa75-15a1-4790-a0dd-139058d1f86d
                    tenantId: tenant_123456
                    tenantPractitionerId: tp_123456
                    certifyPractitionerId: cp_123456
                    data:
                      monitoringStatus: IN_PROGRESS
                      assignedTo: user_123456
                      assignedToName: Jordan Lee
                      practitioner:
                        dea:
                        - deaNumber: AB1234563
                          expirationDate: '2027-03-31'
                          verifiedBy: user_789012
                        licenses:
                        - licenseNumber: MD123456
                          state: CA
                          expiration: '2027-08-15'
                    createdBy: user_123456
                    updatedBy: user_789012
                    createdAt: '2026-05-01T14:30:00Z'
                    updatedAt: '2026-06-01T09:15:00Z'
                    newFlags: []
                    sectionFlags: []
                    allFlags: []
                    allFlagsCount: 0
              schema:
                $ref: '#/components/schemas/GetMonitoringWorkflowResponse'
        '404':
          description: Monitoring workflow not found, or it does not belong to the requesting tenant
          content:
            application/json:
              examples:
                workflowNotFound:
                  value:
                    errors:
                    - httpStatus: 404
                      reason: NOT_FOUND
                      title: Not Found
                      detail: Monitoring workflow 44c8fa75-15a1-4790-a0dd-139058d1f86d not found
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /monitoring-workflows/{id}/assignment:
    post:
      summary: Assign a monitoring workflow to a specific user
      description: 'Assigns the monitoring workflow identified by `id` to the user given in `assignTo`. Use this endpoint for single-workflow assignment; use `POST /monitoring-workflows/assignments` for bulk assignment. The workflow must not currently be in `REVIEWED_BY_CERTIFYOS` status — if it is, this endpoint returns HTTP 400 with `{"error": "..."}` rather than the assignment result. Requires `MONITORING_WORKFLOW_ASSIGN` or `MONITORING_WORKFLOW_ASSIGN_SELF`. The `tenant-id` header is mandatory.'
      operationId: assignMonitoringWorkflow
      tags:
      - MonitoringWorkflow
      parameters:
      - description: ID of the monitoring workflow to assign
        example: 44c8fa75-15a1-4790-a0dd-139058d1f86d
        in: path
        required: true
        name: id
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              assignToUser:
                value:
                  assignTo: user_789012
            schema:
              $ref: '#/components/schemas/CreateMonitoringWorkflowAssignmentRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: UNAUTHORIZED
                      title: Unauthorized
                      detail: Missing or invalid authentication token
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - User does not have required permissions
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: FORBIDDEN
                      title: Forbidden
                      detail: User lacks MONITORING_WORKFLOW_ASSIGN or MONITORING_WORKFLOW_ASSIGN_SELF permission
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internalError:
                  value:
                    errors:
                    - httpStatus: 500
                      reason: INTERNAL_SERVER_ERROR
                      title: Internal Server Error
                      detail: Failed to create assignment for workflow ID 44c8fa75-15a1-4790-a0dd-139058d1f86d
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: 'Assignment created: `{workflowId, assignment: {assignedTo, assignedBy, assignedAt}, error: null}`.'
          content:
            application/json:
              examples:
                assignmentSucceeded:
                  value:
                    workflowId: 44c8fa75-15a1-4790-a0dd-139058d1f86d
                    assignment:
                      assignedTo: user_789012
                      assignedBy: user_123456
                      assignedAt: '2026-06-01T14:30:00Z'
              schema:
                $ref: '#/components/schemas/AssignmentResult2'
        '404':
          description: Monitoring workflow not found
          content:
            application/json:
              examples:
                workflowNotFound:
                  value:
                    errors:
                    - httpStatus: 404
                      reason: NOT_FOUND
                      title: Not Found
