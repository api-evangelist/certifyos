        required: true
        name: workflowId
        schema:
          type: string
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              triggerNpdb:
                value:
                  pipelineName: NPDB
            schema:
              $ref: '#/components/schemas/RunPipelineRequest'
        required: true
      responses:
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: UNAUTHORIZED
                      title: Unauthorized
                      detail: Missing or invalid authentication token
