                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: FORBIDDEN
                      title: Forbidden
                      detail: User lacks MONITORING_WORKFLOW_PIPELINE_TRIGGER permission for this tenant
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error - An unexpected error occurred
          content:
            application/json:
              examples:
                internalError:
                  value:
                    errors:
                    - httpStatus: 500
                      reason: INTERNAL_SERVER_ERROR
                      title: Internal Server Error
                      detail: Failed to get pipeline runs for monitoring workflow ID 44c8fa75-15a1-4790-a0dd-139058d1f86d
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: 'Pagination envelope: `totalCount` (total matching runs) and `data` (array of pipeline run records for the current page).'
