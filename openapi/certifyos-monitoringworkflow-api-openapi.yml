    get:
      summary: List pipeline runs for a monitoring workflow
      description: Returns a paginated list of pipeline execution records (CAQH or NPDB) for the specified monitoring workflow. Use this endpoint to inspect run history; use `GET /monitoring-workflows/{workflowId}/pipeline-runs/{id}` to fetch a single run's detail. Supports offset-based pagination (`page`/`size`, default page 0, size 50) and cursor-based pagination (`cursor`); supplying `cursor` switches to cursor-based pagination and overrides `page`/`size`. The `filter` parameter accepts a JSON object using the same operators as `GET /monitoring-workflows` (`eq`, `neq`, `gt`, `gte`, `lt`, `lte`, `in`, `nin`, `contains`), e.g. {"createdAt":{"gte":"2023-01-01T00:00:00Z"}}. The `order` parameter accepts a JSON sort specification, e.g. {"createdAt":"desc"}. When `includeSteps` is `true`, each run in the response includes its pipeline step breakdown; defaults to `false` when omitted. Requires `MONITORING_WORKFLOW_PIPELINE_TRIGGER`. The `tenant-id` header is mandatory. Returns 404 when the workflow does not exist or belongs to a different tenant.
      operationId: getMonitoringPipelineRuns
      tags:
      - MonitoringWorkflow
      parameters:
      - description: ID of the monitoring workflow
        example: 44c8fa75-15a1-4790-a0dd-139058d1f86d
        in: path
        required: true
        name: workflowId
        schema:
          type: string
      - description: Cursor for cursor-based pagination. Supplying this switches to cursor-based pagination and takes precedence over page/size.
        name: cursor
        in: query
        schema:
          type: string
      - description: 'Filter criteria as a JSON object mapping field paths to an operator (eq, neq, gt, gte, lt, lte, in, nin, contains). Example: {"createdAt":{"gte":"2023-01-01T00:00:00Z"}}'
        name: filter
        in: query
        schema:
          type: string
      - description: Whether to include each run's pipeline step breakdown. Defaults to false when omitted.
        name: includeSteps
        in: query
        schema:
          type: boolean
      - description: 'JSON sort specification. Example: {"createdAt":"desc"}'
        name: order
        in: query
        schema:
          type: string
      - description: Page number (0-based) for offset-based pagination. Ignored if cursor is supplied.
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: '0'
      - description: Page size (default 50) for either pagination mode.
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: '50'
      - description: Tenant ID
        required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: UNAUTHORIZED
