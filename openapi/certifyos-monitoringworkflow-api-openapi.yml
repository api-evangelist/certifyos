        otherWorkflows:
          type: object
          additionalProperties:
            type: string
    MonitoringWorkflowResponse.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.certifyos.com/api-contracts/response/MonitoringWorkflowResponse.schema.json
      title: MonitoringWorkflowResponse
      description: 'Defines the structure for monitoring workflow response data, extending the base schema with system-computed fields.


        Computed fields are automatically derived by the system and returned as read-only values. They should not be included when creating or updating records.'
      allOf:
      - $ref: '#/components/schemas/MonitoringWorkflow.schema'
      - type: object
        properties:
          monitoringStatus:
            type: string
            description: Current status of the monitoring workflow.
            enum:
            - NOT_STARTED
            - IN_PROGRESS
            - OUTREACH_IN_PROGRESS
            - DATA_MISSING
            - NO_ACTION_REQUIRED
            - CERTIFYOS_REVIEW_COMPLETE
            example: IN_PROGRESS
            readOnly: true
          monitoringStatusLastUpdatedDate:
            type:
            - string
            - 'null'
            format: date-time
            description: Date when monitoring status was last updated.
            example: '2024-01-15T10:30:00Z'
            readOnly: true
      unevaluatedProperties: false
    MonitoringWorkflowAttachment:
      description: Attachment metadata for monitoring workflow row
      type: object
      properties:
        createdAt:
          type: string
          description: Creation timestamp
          examples:
          - '2024-01-15T10:30:00Z'
        fileType:
          type: string
          description: Document file type
          examples:
          - DEA Certificate
        fileUrl:
          type: string
          description: GCS file URL for file retrieval
          examples:
          - monitoring-workflow-attachments/workflow-123/dea/1729771200000_dea-certificate.pdf
        originalFileName:
          type: string
          description: Original file name
          examples:
          - dea-certificate.pdf
        expirationDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Expiration date
          examples:
          - '2025-12-31'
          default: '9999-12-31'
        createdBy:
          type: string
          description: User who created the record
      required:
      - fileType
      - fileUrl
      - originalFileName
    UnassignmentResult:
      type: object
      description: Result of an individual unassignment operation
      properties:
        workflowId:
          type: string
          description: ID of the monitoring workflow
          examples:
          - 44c8fa75-15a1-4790-a0dd-139058d1f86d
        error:
          type: string
          description: Error message if unassignment failed
    UpdateMonitoringWorkflowStatusRequest:
      description: Request to update monitoring workflow status
      type: object
      required:
      - workflowStatus
      - description
      properties:
        workflowStatus:
          type: string
          description: The new workflow status
          examples:
          - IN_PROGRESS
          pattern: \S
        description:
          type: string
          description: Description for the timeline event
          examples:
          - Monitoring workflow status changed to IN_PROGRESS
          pattern: \S
    BadRequestErrorResponse:
      description: Standard error response structure for 400 Bad Request validation and client errors
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
          description: List of error messages
          examples:
          - - Validation failed
            - Required field missing
        errorDetails:
          description: Detailed error information with specific validation failures
          type: array
          $ref: '#/components/schemas/JsonNode'
    BulkAssignMonitoringWorkflowRequest:
      description: Request to assign multiple monitoring workflows
      type: object
      properties:
        workflowIds:
          type: array
          items:
            type: string
          description: List of monitoring workflow IDs to assign. Either workflowIds or filter must be provided.
          examples:
          - - 44c8fa75-15a1-4790-a0dd-139058d1f86d
            - 55d9fb86-26b2-5801-b1ee-240169e2f97e
        assignTo:
          type: array
          items:
            type: string
          description: List of user IDs to assign workflows to. Workflows will be evenly distributed across these users
          examples:
          - - user_123456
            - user_789012
          minItems: 1
        filter:
          type: string
          description: Filter criteria as JSON string (URL encoded). Used to fetch workflow IDs when workflowIds is not provided. See GET /monitoring-workflows endpoint documentation for filter format.
          examples:
          - '{"data.monitoringStatus":{"eq":"PENDING"}}'
      required:
      - assignTo
    ErrorObject:
      type: object
      description: Individual error object containing details about a specific validation or processing error
      properties:
        httpStatus:
          type: integer
          format: int32
          description: HTTP status code for this error
          examples:
          - 400
        reason:
          type: string
          description: Error reason/code
          examples:
          - VALIDATION_ERROR
        title:
          type: string
          description: Error title/summary
          examples:
          - 'Validation failed for field: eventTypes'
        detail:
          type: string
          description: Detailed error message
          examples:
          - eventTypes is required and cannot be empty or null
    BulkAssignMonitoringWorkflowResponse:
      description: Response containing results of bulk assignment of monitoring workflows
      type: object
      properties:
        successful:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentResult2'
          description: List of successful assignments
        failed:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentResult2'
          description: List of failed assignments with error details
        totalProcessed:
          type: integer
          format: int32
          description: Total number of workflows processed
        successCount:
          type: integer
          format: int32
          description: Number of successful assignments
        failureCount:
          type: integer
          format: int32
          description: Number of failed assignments
  securitySchemes:
    jwt:
      type: http
      description: JWT Authentication - Provide only the raw token without Bearer prefix
      scheme: bearer
      bearerFormat: JWT
