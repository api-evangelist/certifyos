      description: Synchronously executes a data-fetch pipeline run for the specified monitoring workflow and returns once the run completes — the 200 response reflects actual completion, not just enqueue acknowledgment. Only `CAQH` and `NPDB` are valid values for `pipelineName`; `CREDENTIALING_WORKFLOW` appears in the shared pipeline-name enum but is explicitly rejected for monitoring workflows and returns 400. The tenant must have the corresponding pipeline (CAQH or NPDB) configured, or the run fails. Requires `MONITORING_WORKFLOW_PIPELINE_TRIGGER`. The `tenant-id` header is mandatory. Returns 404 when the workflow is not found.
