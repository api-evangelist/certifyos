          enum:
          - Not sent to credentialing
          - Not Started
          - In Progress
          - Data missing
          - Outreach in progress
          - PSV complete by CertifyOS
          - Credentialing restarted
          - PSV ready
          - Cred approved
          - Hold for Cred Comm
          - Cred denied
          - Facility Terminated
          - Recredentialing in progress
          - Tabled
          - Withdrawn/Cancelled
          example: In Progress
        timelines:
          type: array
          items:
            $ref: '#/components/schemas/TimelineV2Dto'
      required:
