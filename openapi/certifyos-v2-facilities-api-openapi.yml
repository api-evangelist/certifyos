        credentialingDecisionDate:
          format: date-time
          type: string
        medicalDirectorId:
          type: string
        medicalDirectorName:
          type: string
        id:
          type: string
        createdAt:
          format: date-time
          type: string
          example: YYYY-MM-DD
        createdBy:
          type: string
        createdByName:
          type: string
        updatedAt:
          format: date-time
          type: string
          example: YYYY-MM-DD
        updatedBy:
          type: string
        updatedByName:
          type: string
        surveyResponse:
          type: array
          items:
            type: object
        providers:
          type: array
          items:
            $ref: '#/components/schemas/FacilityProviderV2Dto'
        practiceLicense:
          type: array
          items:
            $ref: '#/components/schemas/PracticeLicenseV2Dto'
        businessLicense:
          type: array
          items:
            $ref: '#/components/schemas/BusinessLicenseV2Dto'
        onsiteReviews:
          type: array
          items:
            $ref: '#/components/schemas/OnSiteReviewDto'
        licensureActions:
