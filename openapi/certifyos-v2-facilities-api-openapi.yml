          - AL
          - AR
          - AS
          - AZ
          - CA
          - CO
          - CT
          - DC
          - DE
          - FL
          - FM
          - GA
          - GU
          - HI
          - IA
          - ID
          - IL
          - IN
          - KS
          - KY
          - LA
          - MA
          - MD
          - ME
          - MH
          - MI
          - MN
          - MO
          - MP
          - MS
          - MT
          - NC
          - ND
          - NE
          - NH
          - NJ
          - NM
          - NV
          - NY
          - OH
          - OK
          - OR
          - PA
          - PR
          - PW
          - RI
          - SC
          - SD
          - TN
          - TX
          - UT
          - UM
          - VA
          - VI
          - VT
          - WA
          - WI
          - WV
          - WY
          description: State where the facility is located (2-letter state code)
          example: CA
        fileType:
          type: string
          description: File processing status for the facility record
          enum:
          - Clean
          - Non_Clean
          - Pending
          example: Clean
        npi:
          type: string
          description: National Provider Identifier (NPI) - 10-digit identifier
        externalId:
          type: string
