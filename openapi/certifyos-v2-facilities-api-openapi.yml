          - AK
          - AL
          - AR
          - AS
          - AZ
          - CA
          - CO
          - CT
          - DC
          - DE
          - FL
          - FM
          - GA
          - GU
          - HI
          - IA
          - ID
          - IL
          - IN
          - KS
          - KY
          - LA
          - MA
          - MD
          - ME
          - MH
          - MI
          - MN
          - MO
          - MP
          - MS
          - MT
          - NC
          - ND
          - NE
          - NH
          - NJ
          - NM
          - NV
          - NY
          - OH
          - OK
          - OR
          - PA
          - PR
          - PW
          - RI
          - SC
          - SD
          - TN
          - TX
          - UT
          - UM
          - VA
          - VI
          - VT
          - WA
          - WI
          - WV
          - WY
          example: CA
        expirationDate:
          format: date-time
          type: string
        type:
          type: string
          description: Type of practice license
          enum:
          - State License
          - Business Permit
          - Occupational License
          - Medical gas permit
          example: State License
        status:
          type: string
          description: Current status of the practice license
          enum:
          - Active
          - Inactive
          - Expired
          - Retired
          - Revoked
          - Lapsed
          - Probation
          - Surrendered
          - Suspended
          example: Active
        license:
          type: string
        source:
          type: string
          description: Source of practice license verification
        verified_by:
          type: string
          description: Name of the person who verified this practice license information
        verified_date:
          type: string
          description: Date when this practice license information was verified
          example: YYYY-MM-DD
        issueDate:
          format: date-time
          type: string
      required:
      - id
      - state
      - expirationDate
      - type
      - status
      - license
      - source
      - verified_by
      - verified_date
      - issueDate
