          items:
            $ref: '#/components/schemas/CertificationsDto'
        npdb:
          type: array
          items:
            $ref: '#/components/schemas/NpdbDto'
        sanctions:
          type: array
          items:
            $ref: '#/components/schemas/SanctionsDto'
        perfIndicator:
