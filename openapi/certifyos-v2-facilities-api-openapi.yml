      - dba
      - type
      - tin
      - address
      - city
      - zipcode
      - contactName
      - contactPhone
      - contactEmail
      - contactFax
      - state
      - skipOnSiteReview
      - stateLicenses
      - facilitySupportingDocuments
      - accreditations
      - siteVisits
