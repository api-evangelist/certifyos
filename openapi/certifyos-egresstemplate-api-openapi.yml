      security:
      - jwt: []
    delete:
      summary: Soft-delete an egress template by ID
      description: 'Marks an egress template as inactive by setting its `status` to `inactive`. The record is not removed from the data store and remains retrievable via `GET /api/v1/egress-templates/{templateId}` and `GET /api/v1/egress-templates` (when filtering by `status=inactive`). No GCS files are deleted.


        When to use: call this to retire a template from active use without permanently destroying its configuration or mapping history.


        Preconditions: `tenant-id` header must be present. The template must belong to the requesting tenant; cross-tenant access returns 404 (not 403). If an export driven by this template is currently in progress, the request is rejected until that export completes.


        Idempotency: calling delete again on an already-inactive template succeeds and is a no-op — `version` is not incremented by this operation, on first or subsequent calls.


        Side effects: only the template''s `status` field is updated. GCS files are untouched.


        Returns: 204 No Content on success, with no response body.'
      operationId: deleteEgressTemplate
      tags:
      - EgressTemplate
      parameters:
      - description: ID of the egress template to soft-delete.
        name: templateId
        in: path
        required: true
        schema:
          type: string
      - required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '204':
          description: The template was marked inactive (or already was); no body
        '401':
          description: The request is missing a valid bearer token; re-authenticate and retry
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - httpStatus: 401
                      reason: UNAUTHORIZED
                      title: Authentication required
                      detail: A valid bearer token is required
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The authenticated caller lacks the delete-template permission for this tenant
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    errors:
                    - httpStatus: 403
                      reason: FORBIDDEN
                      title: Insufficient permissions
                      detail: The authenticated user lacks the delete-template permission for this tenant
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No template with this id exists for the requesting tenant, or it belongs to a different tenant
          content:
            application/json:
              examples:
                notFound:
                  value:
                    errors:
                    - httpStatus: 404
                      reason: NOT_FOUND
                      title: Template not found
                      detail: Template with the given ID does not exist
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /api/v1/egress-templates/{templateId}/columns:
    get:
      summary: Get parsed column mappings for a template
      description: Reads the template's stored mappings CSV and returns the parsed columns as JSON so the builder can be re-hydrated for editing.
      operationId: getEgressTemplateColumns
      tags:
      - EgressTemplate
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
      - required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Parsed columns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EgressTemplateColumnsResponse'
        '404':
          description: Template not found
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
      security:
      - jwt: []
  /api/v1/egress-templates/{templateId}/mappings:
    get:
      summary: Get a signed download URL for a template's mappings CSV
      description: Returns a short-lived signed URL for previewing/downloading the mappings CSV associated with the template.
      operationId: getEgressTemplateMappings
      tags:
      - EgressTemplate
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
      - required: true
        name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Signed download URL returned
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Insufficient permissions
        '404':
          description: Template or mappings CSV not found
      security:
      - jwt: []
components:
  schemas:
    ApiError:
      type: object
      description: Standard API error response containing a list of error objects
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
          description: List of error objects describing validation or processing failures
    JsonNode:
      type: object
      properties:
        empty:
          type: boolean
        valueNode:
          type: boolean
        containerNode:
          type: boolean
        missingNode:
          type: boolean
        array:
          type: boolean
        object:
          type: boolean
        nodeType:
          $ref: '#/components/schemas/JsonNodeType'
        pojo:
          type: boolean
        number:
          type: boolean
        integralNumber:
          type: boolean
        floatingPointNumber:
          type: boolean
        short:
          type: boolean
        int:
          type: boolean
        long:
          type: boolean
        float:
          type: boolean
        double:
          type: boolean
        bigDecimal:
          type: boolean
        bigInteger:
          type: boolean
        textual:
          type: boolean
        boolean:
          type: boolean
        'null':
          type: boolean
        binary:
          type: boolean
    EgressFieldSuggestion:
      type: object
      properties:
        name:
          type: string
        suggestedMatches:
          type: array
          items:
            $ref: '#/components/schemas/EgressFieldCatalogItem'
    EgressTemplateResponse:
      type: object
      properties:
        id:
          type: string
          description: Server-assigned unique identifier of the template.
        tenantId:
          type: string
          description: ID of the tenant that owns this template.
        createdAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp the template was created, ISO-8601.
        createdBy:
          type: string
          description: ID of the user who created the template.
        updatedAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp the template was last updated, ISO-8601.
        updatedBy:
          type: string
          description: ID of the user who last updated the template.
        templateName:
          type: string
          description: Human-readable template name.
        description:
          type: string
          description: Free-text description of the template's purpose.
        entityType:
          type: string
          description: 'Entity type this template maps: `practitioner`, `facility`, or `group`. Immutable after creation.'
        outputFormat:
          type: string
          description: Output file format produced by exports run from this template, e.g. `csv`.
        separator:
          type: string
          description: Delimiter used in the output CSV.
        status:
          type: string
          description: 'Template lifecycle status: `draft`, `active`, or `inactive` (soft-deleted).'
        version:
          type: integer
          format: int32
          description: Version number, incremented on each successful update. Not incremented by delete.
        mappingsCsvUrl:
          type: string
          description: GCS URL of the current mapping CSV for this template version.
        rowExpansionKeys:
          $ref: '#/components/schemas/JsonNode'
          type: object
          examples:
          - - locations
          description: 'JSON array of field keys that trigger row expansion on export. Each key names an array-valued field of the entity; on export one output row is emitted per element of that array instead of collapsing the array into a single cell. Supported keys: `locations`, `networks`, `groups`, `specialties`, `licenses`, `contacts`, `accreditations`, `addressType2Npi`. Null or an empty array means no expansion (one row per entity). As supplied on create/update.'
        extExportConfig:
          $ref: '#/components/schemas/JsonNode'
          type: object
          examples:
          - bigquery:
              enabled: true
            sensitive_fields:
              ssn: masked
          description: 'External export destination and sensitive-field configuration, as supplied on create/update. Recognized blocks: `bigquery` (`{"enabled": boolean, "dataset": string, "tableName": string}`) and `sensitive_fields` (per-field exposure mode, e.g. `{"ssn": "masked"}`; only `ssn` supported today, values `full` or `masked`).'
        scheduleEnabled:
          type: boolean
          description: Whether scheduled (unattended) exports are enabled for this template.
        scheduleFrequency:
          type: string
          description: 'Schedule cadence: `daily`, `weekly`, `monthly`, or `custom`. Null when no schedule is configured.'
        scheduleTime:
          type: string
          description: Time of day the schedule runs, 24-hour `HH:mm`. Null when scheduleFrequency is `custom` or no schedule is configured.
        scheduleDayOfWeek:
          type: integer
          format: int32
          description: 'Day of week the schedule runs: 1 = Sunday ... 7 = Saturday. Only set when scheduleFrequency=`weekly`.'
        scheduleDayOfMonth:
          type: integer
          format: int32
          description: Day of month (1-31) the schedule runs. Only set when scheduleFrequency=`monthly`.
        scheduleCron:
          type: string
          examples:
          - 0 0 8 ? * MON
          description: Quartz cron expression (6-7 fields, not standard 5-field Unix cron) defining the schedule. Only set when scheduleFrequency=`custom`.
        scheduleTimezone:
          type: string
          description: IANA timezone identifier the schedule runs in, e.g. `America/New_York`.
        scheduleDaysOfWeek:
          type: string
          examples:
          - 2,4,6
          description: 'Comma-separated days of week the schedule runs: 1 = Sunday ... 7 = Saturday. Only set when scheduleFrequency=`weekly`.'
        scheduleInterval:
          type: integer
          format: int32
          examples:
          - 6
          description: Interval in hours between runs (1, 2, 3, 4, 6, 8 or 12 — divisors of 24). Only set when scheduleFrequency=`hourly`.
        lastExportAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp of the most recent export run from this template, ISO-8601. Null if no export has run yet.
        nextExportAt:
          $ref: '#/components/schemas/Instant'
          type: string
          description: Timestamp of the next scheduled export run, ISO-8601. Null when scheduling is disabled.
        metadata:
          $ref: '#/components/schemas/JsonNode'
          type: object
          examples:
          - team: credentialing
            notes: quarterly roster export
          description: Arbitrary caller-defined metadata stored with the template. Not interpreted by the service; persisted and returned as-is.
        jobType:
          type: string
          description: 'Derived export trigger type for the Activity Center UI: `SCHEDULED` when a schedule is enabled, `MANUAL` otherwise. Not persisted by the data store.'
        createdByName:
          type: string
          description: Display name resolved from createdBy, when resolvable. Null if resolution failed or has not been attempted; callers should fall back to createdByEmail then createdBy in that case.
        createdByEmail:
          type: string
          description: Email resolved from createdBy, when resolvable. Null if resolution failed or has not been attempted; used as the display fallback between createdByName and the raw createdBy id.
        exportType:
          type: string
          enum:
          - FULL_ROSTER_EXPORT
          - CHANGE_FILE
          description: 'Export type (CP-41057): `FULL_ROSTER_EXPORT` (default; legacy rows read as this) or `CHANGE_FILE` (rows are the changes in a window).'
        triggerMode:
          type: string
          enum:
          - SCHEDULED
          - MANUAL
          description: 'Trigger mode of a Change File template (CP-41062): `SCHEDULED` (generates on its own schedule) or `MANUAL` (generates only through the trigger API with an explicit date range). Null for full roster exports.'
        bqExportEnabled:
          type: boolean
        bqTableName:
          type: string
        bqDataset:
          type: string
    EgressFieldCatalogResponse:
      type: object
      properties:
        entityType:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/EgressFieldCatalogItem'
    EgressTemplateListResponse:
      type: object
      properties:
