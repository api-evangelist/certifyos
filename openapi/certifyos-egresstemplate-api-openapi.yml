      - '2022-03-10T16:15:50Z'
    EgressFieldCatalogItem:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        entityGroup:
          type: string
        dataType:
          type: string
        isDate:
          type: boolean
        isExpandable:
          type: boolean
        isSensitive:
          type: boolean
        expansionKey:
          type: string
        isJoinable:
          type: boolean
        mappedEntity:
          type: string
        description:
          type: string
        hasPattern:
          type: boolean
        format:
          type: string
        message:
          type: object
          additionalProperties:
            type: string
        minLength:
          type: integer
          format: int32
        maxLength:
          type: integer
          format: int32
        enum:
          type: array
          items:
            type: string
    TemplateCreatorResponse:
      type: object
      description: A distinct egress-template creator
      properties:
        id:
          type: string
          description: Raw createdBy user ID (the value to filter the list endpoint by)
        name:
          type: string
          description: Resolved display name, or null when unresolved
        email:
          type: string
          description: Resolved email, or null when unresolved
    EgressTemplateColumnDto:
      type: object
      properties:
        outputColumn:
          type: string
        attributePath:
          type: string
        jsonExtractionPath:
          type: string
        multiValueHandling:
          type: string
        maxColumns:
          type: integer
          format: int32
        columnOrder:
          type: integer
          format: int32
        entityGroup:
          type: string
        defaultValue:
          type: string
        dataTransformations:
          type: string
        dedupeBy:
          type: string
        fallbackJsonExtractionPath:
          type: string
    ErrorObject:
      type: object
      description: Individual error object containing details about a specific validation or processing error
      properties:
        httpStatus:
          type: integer
          format: int32
          examples:
          - 400
          description: HTTP status code for this error
        reason:
          type: string
          examples:
          - VALIDATION_ERROR
          description: Error reason/code
        title:
          type: string
          examples:
          - 'Validation failed for field: eventTypes'
          description: Error title/summary
        detail:
          type: string
          examples:
          - eventTypes is required and cannot be empty or null
          description: Detailed error message
        rejectedValue:
          type: string
          description: The value that was rejected, omitted for sensitive fields such as SSN
    JsonNodeType:
      type: string
      enum:
      - ARRAY
      - BINARY
      - BOOLEAN
      - MISSING
      - 'NULL'
      - NUMBER
      - OBJECT
      - POJO
      - STRING
    SuggestEgressColumnMappingsRequest:
      type: object
      properties:
        entityType:
          type: string
        columnNames:
          type: array
          maxItems: 500
          items:
            type: string
        sampleValues:
          type: array
          maxItems: 500
          items:
            type: array
            items:
              type: string
    TemplateCreatorsResponse:
      type: object
      description: Distinct egress-template creators, with a truncation signal for the bounded scan
      properties:
        creators:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCreatorResponse'
          description: Distinct creators, in first-seen order
        truncated:
          type: boolean
          description: True when the bounded creator scan hit its page cap and the list may be incomplete; false when the full creator set was returned.
