                      ssn:
                        type: string
                      personalEmail:
                        type: string
                      personalFaxNumber:
                        type: string
                      primaryEmail:
                        type: string
                      ethnicity:
                        type: string
                      raceEthnicity:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
