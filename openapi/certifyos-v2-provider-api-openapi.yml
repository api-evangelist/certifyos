      - BearerAuth: []
  /v2/provider/{providerId}/specialties/{specialtyId}:
    patch:
      operationId: SpecialtiesV2Controller_update
      summary: Update provider specialty
      description: Update specialty details with optional sub-specialties
      parameters:
      - name: organization-id
        in: header
        schema:
          type: string
      - name: providerId
        required: true
        in: path
        schema:
          type: string
      - name: specialtyId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpecialtiesV2Dto'
      responses:
        '204':
          description: Updated.
        '400':
          description: Invalid request body.
        '401':
          description: Unauthorized if authorization token is not provided or invalid.
        '403':
          description: Forbidden if user access is not right.
        '404':
          description: Resource not found.
      tags:
      - v2/provider
      security:
      - BearerAuth: []
    delete:
      operationId: SpecialtiesV2Controller_delete
      summary: Delete provider specialty
      description: Deletes a specialty for the specified provider.
      parameters:
      - name: organization-id
        in: header
        schema:
          type: string
      - name: providerId
        required: true
        in: path
        schema:
          type: string
      - name: specialtyId
        required: true
        in: path
        schema:
          type: string
      responses:
        '204':
          description: Deleted.
        '401':
          description: Unauthorized if authorization token is not provided or invalid.
        '403':
          description: Forbidden if user access is not right.
        '404':
          description: Resource not found.
      tags:
      - v2/provider
      security:
      - BearerAuth: []
