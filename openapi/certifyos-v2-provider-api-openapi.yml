                          type: string
                      mailingAddress:
                        type: object
                        additionalProperties: false
                        properties:
                          address1:
                            type: string
                          address2:
                            type: string
                          city:
                            type: string
                          state:
                            type: string
                          zipCode:
                            type: string
                          country:
                            type: string
                      homePhoneNumber:
                        type: string
                      practiceSetting:
                        type: string
                      citizenshipCountry:
                        type: string
                      workPermitStatus:
                        type: string
                      usWorkEligibleFlag:
                        type: boolean
                      visaNumber:
                        type: string
                      practitionerType:
                        type: object
                        additionalProperties: false
                        properties:
                          name:
                            type: string
                      homeAddress:
                        type: object
                        additionalProperties: false
                        properties:
                          address1:
                            type: string
                          address2:
                            type: string
                          city:
                            type: string
                          state:
                            type: string
