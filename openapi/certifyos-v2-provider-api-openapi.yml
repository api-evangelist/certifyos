  /v2/provider/{providerId}/credentialing-workflows:
    post:
      operationId: ProviderV2Controller_createCredentialingWorkflow
      summary: Creates a credentialing workflow for the provider.
      description: "Initiates a new credentialing workflow for the specified \n      provider. The workflow will automatically trigger the pipeline to \n      fetch the required provider information needed for credentialing."
      parameters:
      - name: organization-id
        in: header
        schema:
          type: string
      - name: providerId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Credentialing workflow ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  providerId:
                    type: string
        '201':
          description: ''
        '400':
          description: "Bad request because of any of the following reasons:\n\n    1. Wrong parameters provided in the request.\n\n    2. Workflow exists in not complete state for the provider."
        '401':
          description: Unauthorized if authorization token is not provided or invalid.
        '403':
          description: Forbidden if user access is not right.
        '404':
          description: Provider is not found.
      tags:
      - v2/provider
      security:
      - BearerAuth: []
  /v2/provider/{providerId}/psv/signed-url:
    get:
      operationId: ProviderV2Controller_gePSVPdfSignedUrl
      summary: Retrieve signed URL for provider PSV PDF
      description: Returns a signed URL for downloading the PSV (Primary Source Verification) PDF for the specified provider. The signed URL is time-limited and allows secure access to the PSV document.
      parameters:
      - name: organization-id
        in: header
        schema:
          type: string
      - name: providerId
        required: true
        in: path
        description: The unique identifier of the provider whose PSV PDF signed URL is to be retrieved.
        schema:
          type: string
      responses:
        '200':
          description: Signed URL for the provider PSV PDF.
          content:
            application/json:
              schema:
                example:
                  signedUrl: https://storage.googleapis.com/bucket/psv.pdf?X-Goog-Signature=...
        '400':
          description: Invalid input parameters.
        '401':
          description: Authorization token is missing or invalid.
        '403':
          description: User does not have permission to access this resource.
        '404':
          description: Provider or PSV PDF not found.
      tags:
      - v2/provider
      security:
      - BearerAuth: []
  /v2/provider/{providerId}/groups:
