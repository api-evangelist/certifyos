      title: Core Group Operational Value Open Base Schema
      description: Foundation schema defining properties for core group operational value data.
      type: object
      properties:
        affiliation:
          title: Affiliation
          type: string
          description: Affiliation name or code associated with the group.
        npi:
          title: National Provider Identifier
          type: string
          description: The National Provider Identifier (NPI) of the group. The NPI is a unique 10-digit identification number issued to healthcare providers by the Centers for Medicare and Medicaid Services (CMS).
        name:
          title: Name
          type: string
          description: The name of the group or healthcare organization.
        tin:
          title: TIN
          type: string
          description: The Tax Identification Number (TIN) of the group. This is typically an Employer Identification Number (EIN) issued by the Internal Revenue Service (IRS).
        type:
          title: Type
          type: string
          description: The type or classification of the group (e.g., 'Multi-specialty', 'Single-specialty', 'Hospital', etc.).
        legalTaxName:
          title: Legal Tax Name
          type: string
          description: The legal tax name of the group as registered with tax authorities. This is the official name used for tax reporting purposes.
        active:
          title: Active
          type: boolean
          description: Indicates whether the group is currently active and operational. Inactive groups are typically those that have been terminated or are no longer providing services.
        telemedicineAvailable:
          title: Telemedicine Available
          type: boolean
          description: Indicates whether the group offers telemedicine services. When true, the group provides remote healthcare services via telecommunications technology.
        taxInfo:
          $ref: '#/components/schemas/TaxInfo.schema'
          description: Represents the legal tax entity information associated with the group, including legal tax name, tax entity states, and references to IRS documentation files.
        bedCount:
          title: Bed Count
          type: integer
          description: The number of beds available at the group's facility. This is typically relevant for hospitals, nursing homes, and other inpatient facilities.
        dea:
          title: DEA
          type: string
          description: The Drug Enforcement Administration (DEA) registration number. This is required for healthcare providers who prescribe, dispense, or handle controlled substances.
