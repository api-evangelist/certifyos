        schema:
          type: string
      - description: Whether to return transformed response. When true, returns a flattened and deduplicated structure with organized arrays. When false (default), returns raw nested relationship data.
        required: false
        name: transformed
        in: query
        schema:
          type: boolean
          default: false
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: 'All the relationships that the practitioner belongs to successfully retrieved. Response structure varies based on the ''transformed'' parameter: When transformed=false, returns raw data with nested structure containing tenantPractitionerId, tenantPractitionerSpecialties, and groupMemberships. When transformed=true, returns a transformed structure with flattened arrays: networks, groups, groupLocations, groupSpecialties, practitionerSpecialties, networksPlansData, locationsGroupsData, specialtiesData, groupsData, and groupMemberships.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/JsonNode'
                - $ref: '#/components/schemas/TransformedPractitionerRelationships'
                description: 'Response structure depends on the ''transformed'' query parameter. When transformed=false: returns JsonNode with nested structure containing ''data'' with tenantPractitionerId, tenantPractitionerSpecialties, and groupMemberships. When transformed=true: returns TransformedPractitionerRelationships with flattened structure with top-level arrays (networks, groups, groupLocations, groupSpecialties, practitionerSpecialties, networksPlansData, locationsGroupsData, specialtiesData, groupsData, groupMemberships).'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Practitioner not found with the given source type and crosswalk ID for tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
