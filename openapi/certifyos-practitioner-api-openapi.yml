  /practitioners/terminate:
    put:
      summary: Terminate a practitioner with cascade
      description: 'Terminates a practitioner and applies the appropriate termination cascade based on the supplied `terminationType`; different termination types update different sets of records and follow different cascade rules. Use this when a practitioner''s engagement is ending in full or in part — for terminating a single role at a specific location-network assignment, use `PUT /practitioners/practitioner-role-assignments/{id}/terminate`, and for ending a specialty only, use `PUT /practitioners/tenant-practitioner-specialties/terminate`. The request body must include `terminationType`; an active credentialing or monitoring workflow blocks termination with a 409 response until the workflow is resolved (except `FULL_EXIT`, which bypasses this guard). The 9 supported `terminationType` values are: `GROUP` (requires `tenantPractitionerId`, `tenantGroupId`, `terminationDate`; terminates the group membership plus all network, location, and location-network associations under it, optionally narrowed to one network via `networkId`), `NETWORK` (requires `networkId`; terminates the network participation and cascades to all location-network associations under that network), `GROUP_LOCATIONS` (requires `tenantGroupLocationId`; terminates that location association, and additionally cascades to end network enrollment at that location only when both the `practitioner.termination.group-locations.cascade-network.enabled` config flag is on and the request sends `acknowledgedLocationNetworkTermination=true` — omitting it keeps the legacy GPL-only termination, not an error), `LOCATION_NETWORK` (requires `tenantGroupLocationPractitionerNetworkId`, or the `tenantGroupLocationId`/`networkId` pair; terminates that location-network record and cascades only to its location-network specialties), `NETWORK_SPECIALTY` and `GROUP_SPECIALTY` (identical cascade logic; each independently terminates the network-participation specialty when `tenantGroupPractitionerNetworkId`/`tenantGroupPractitionerSpecialtyId` are supplied and/or the location-network specialty when `tenantGroupLocationPractitionerNetworkId`/`tenantGroupPractitionerLocationSpecialtyId` are supplied, skipping whichever pair is absent rather than erroring), `GROUP_LOCATION_SPECIALTY` (independently terminates the group-location specialty when `tenantGroupPractitionerLocationId`/`tenantPractitionerSpecialtyId` are supplied and/or the location-network specialty when the same network-specialty ID pair above is supplied), `INFERRED_LOCATION` (requires `tenantGroupLocationId` but NOT `tenantGroupId` — terminates all group and network relationships at that location across every group the practitioner belongs to there; multiple matches are expected and all are terminated, not an error), and `FULL_EXIT` (**`certifyPractitionerId` is MANDATORY** — this is the only termination type that does not use `tenantPractitionerId`; a request with `terminationType=FULL_EXIT` and no `certifyPractitionerId` returns 400. `tenantGroupId` and every other scope field must also be omitted — wipes every group, network, and location relationship the practitioner has). `INFERRED_LOCATION` and `FULL_EXIT` may return 400 if not yet available for the calling tenant, when `tenantGroupLocationId` is missing for `INFERRED_LOCATION`, or when `certifyPractitionerId` is missing for `FULL_EXIT`. `INFERRED_LOCATION` additionally returns 400 when the practitioner has no active relationships matching the request at that location at all — unlike the 404 the 7 legacy types return when their scoped association isn''t found. `FULL_EXIT` has no equivalent "nothing found" error: a practitioner with zero group/network relationships still succeeds with 200 — there''s nothing to cascade-terminate at the group level, but the practitioner and CorePractitioner crosswalk are still expired and any active credentialing/monitoring work is still cancelled.'
      operationId: terminatePractitioner
      tags:
      - Practitioner
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Termination scope and effective date; required fields depend on `terminationType`. For `terminationType=FULL_EXIT`, `certifyPractitionerId` is MANDATORY and `tenantPractitionerId`/`tenantGroupId` must be omitted — see the `terminateFullExit` example.
        content:
          application/json:
            examples:
              terminateNetwork:
                summary: NETWORK — identified by tenantPractitionerId
                value:
                  tenantPractitionerId: 8f14e2a1-6b3c-4d5e-9f7a-1b2c3d4e5f6a
                  tenantGroupId: 3c9e1f2a-7b4d-4e5f-8a6b-2c3d4e5f6a7b
                  terminationType: NETWORK
                  networkId: 9d2e3f4a-5b6c-4d7e-8f9a-1b2c3d4e5f6a
                  terminationDate: '2025-10-25'
                  terminationReason: Provider left the network
              terminateFullExit:
                summary: FULL_EXIT — certifyPractitionerId is MANDATORY, tenantPractitionerId/tenantGroupId are omitted
                value:
                  certifyPractitionerId: cert_9d2e3f4a5b6c4d7e8f9a
                  terminationType: FULL_EXIT
                  terminationDate: '2025-10-25'
                  terminationReason: Practitioner left the organization
            schema:
              $ref: '#/components/schemas/TerminationRequest'
        required: true
      responses:
        '200':
          description: 'A result map reflecting the practitioner records updated by the termination cascade. For the 7 other termination types the response is unchanged: a flat two-key map, `message` and `tenantGroupPractitionerId`. For `FULL_EXIT`/`INFERRED_LOCATION` the response is additive and richer: `message`, `tenantGroupPractitionerIds` (plural), `tenantPractitionerExpired`, `workflowsCancelledCount`, and (when `tenantPractitionerExpired` is true) `corePractitionerTerminationDateSet` plus, if that is false, `corePractitionerTerminationDateSkippedReason`. `INFERRED_LOCATION` additionally includes `groupPractitionerLocationIds` and `cascadedGroupExpirations`. For `FULL_EXIT`, `tenantGroupPractitionerIds` is an empty array when the practitioner has no group/network relationships at all — the CorePractitioner crosswalk is still expired in that case, this is not an error. Since CP-37330 `tenantPractitionerExpired` means "the practitioner-level expiry step ran", not that the TenantPractitioner row was stamped: the termination is recorded on the CorePractitioner `tenant:` slice. On `FULL_EXIT` `corePractitionerTerminationDateSet` is therefore always true and the skip-reason key never appears — an unresolvable NPI now fails the request instead. Both keys remain reachable on `INFERRED_LOCATION`, which keeps the soft-skip.'
          content:
            application/json:
              examples:
                networkTerminated:
                  value:
                    message: Practitioner terminated from network and associated locations
                    tenantGroupPractitionerId: 3c9e1f2a-7b4d-4e5f-8a6b-2c3d4e5f6a7b
        '400':
          description: Bad request - Invalid input, date conflict, or location not found, including a `terminationType=FULL_EXIT` or `terminationType=INFERRED_LOCATION` request missing the mandatory `certifyPractitionerId` (both types identify the practitioner that way; `tenantPractitionerId` is ignored for them). For `FULL_EXIT` also returned when `terminationDate` or `terminationInformedDate` is not a valid `YYYY-MM-DD` date (an out-of-range month or day is rejected, never coerced), or when the practitioner's operational value carries no NPI so the termination could not be recorded on any crosswalk. A transient failure of that NPI lookup is reported as a server error rather than a 400.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Association not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict - Termination blocked by active credentialing or monitoring workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              examples:
                unexpectedError:
                  value:
                    error: An unexpected error occurred
      security:
      - jwt: []
  /practitioners/terminate-partial:
    put:
      summary: Terminate several practitioner relationships, and/or states to credential, in…
      description: 'Multi-scope sibling of `PUT /practitioners/terminate`, built for the monitoring termination drawer (CP-36182). That endpoint accepts exactly ONE scope per call; this one takes the whole selection and fans out over the same per-scope service internally, so guard checks, per-type validation, date validation and cascades behave identically.


        **Scope types accepted:** `GROUP`, `NETWORK`, `GROUP_LOCATIONS`, `LOCATION_NETWORK`. `FULL_EXIT` and `INFERRED_LOCATION` are rejected with 400 — full termination is already a single call, so use `PUT /practitioners/terminate` for it.


        **Identity:** the practitioner is identified by `certifyPractitionerId`; `tenantPractitionerId` is resolved server-side from it plus the `tenant-id` header, scoped to that tenant.


        **Additionally** removes the supplied `statesToCredential` from the practitioner''s contributing crosswalk (writing an empty array, never null, when none remain), marks the acted-on flag seen with the termination note, and re-syncs the monitoring workflow so flags for removed states are re-evaluated.


        **Returns 200 even on partial failure** — inspect `status` and `scopeResults`. A 2xx does NOT mean everything applied. Only whole-request problems (validation, auth, kill switch) come back as 4xx/5xx.


        Gated by `practitioner.termination.partial-composite.enabled` (default false); returns 404 as if the endpoint did not exist while disabled.'
      operationId: terminatePractitionerPartial
      tags:
      - Practitioner
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: The relationship scopes and/or states to terminate
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialTerminationRequest'
        required: true
      responses:
        '200':
          description: Applied. `status` is SUCCESS, PARTIAL_SUCCESS or FAILED; `scopeResults` carries per-scope detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartialTerminationResponse'
        '400':
          description: 'Validation failure: no scopes and no states, a malformed scope, an unsupported terminationType, or the practitioner could not be resolved in this tenant'
          content:
            application/json: {}
        '401':
          description: Missing or invalid JWT
        '403':
          description: Missing UPDATE_PRACTITIONER permission
        '404':
          description: The endpoint is disabled by its kill switch
      security:
      - jwt: []
  /practitioners/terminate/rollback:
    put:
      summary: Roll back an accidental practitioner termination
      description: 'Reverses a termination that should not have happened (CP-37299): removes the termination date, reason and informed-date from EVERY level they were set for this practitioner — core slice, tenant practitioner, group, group-network, location, location-network and location-network-specialty rows — and regenerates each row''s stored status from its surviving effective date, so relationships read Active or Pending again instead of Inactive.


        **One atomic write.** Every row clears together or none does; a failed call leaves the practitioner exactly as terminated as before.


        **Practitioner-wide, not level-scoped.** There are no scope fields: pass `tenantPractitionerId` OR `certifyPractitionerId` (exactly one). A `certifyPractitionerId` clears every contributing slice this tenant owns; slices belonging to other tenants are never touched.


        **This is an undo, not a reinstatement.** For a practitioner re-entering a network after a gap — which needs a second effective/termination range — this is the wrong endpoint.


        **Monitoring flags** closed by the termination are reopened, then recalculated so any that are no longer valid (a licence renewed while the practitioner was terminated) are retired again rather than resurfacing. Only flags the termination itself closed are reopened -- flags a reviewer marked seen are left alone. This runs after the field clear commits and is fail-soft: inspect the `flags` block in the response, since a 200 means the dates were cleared, not necessarily that the flag side landed.


        **Not reverted:** credentialing workflows cancelled by the termination stay cancelled; NPDB/CAQH enrolment is not restored. `nextCredentialingDate` is deliberately left untouched, since an undo is not a re-credentialing event.


        **Not idempotent.** A second call for the same practitioner returns 400, because by then there is no termination left to roll back.


        **Failure is safe.** The write is one all-or-nothing batch, so a 4xx or 5xx leaves the practitioner exactly as terminated as before and the call can be retried. A data-access-layer fault surfaces as 502, not 500.


        Gated by `practitioner.termination.rollback.enabled` (default true); returns 404 as if the endpoint did not exist while disabled.'
      operationId: rollbackPractitionerTermination
      tags:
      - Practitioner
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: The practitioner whose termination should be reversed. Exactly one identifier; unknown fields are ignored rather than rejected.
        content:
          application/json:
            examples:
              byTenantPractitionerId:
                summary: Reverse one tenant-scoped practitioner
                value:
                  tenantPractitionerId: 3c9e1f2a-7b4d-4e5f-8a6b-2c3d4e5f6a7b
              byCertifyPractitionerId:
                summary: Reverse every slice this tenant owns for a global practitioner
                value:
                  certifyPractitionerId: aa8d2031-7460-414c-a32c-25b8f875c208
            schema:
              $ref: '#/components/schemas/TerminationRollbackRequest'
        required: true
      responses:
        '200':
          description: Rolled back. `clearedRecords` is how many rows were written and `rollbackTraceId` correlates the structured events for this reversal. A 200 means the termination fields were cleared; the `flags` block reports separately whether the monitoring side landed, so callers that care must inspect `reopenOk` and `recalculateOk` rather than trusting the status code alone.
          content:
            application/json:
              examples:
                rolledBack:
                  summary: Seven rows cleared, all flags reopened and revalidated
                  value:
                    message: Practitioner termination rolled back
                    tenantPractitionerId: 3c9e1f2a-7b4d-4e5f-8a6b-2c3d4e5f6a7b
                    tenantPractitionerIds:
                    - 3c9e1f2a-7b4d-4e5f-8a6b-2c3d4e5f6a7b
                    clearedRecords: 7
                    rollbackTraceId: 34167ca8-7f6d-4482-b259-c011bac092bc
                    flags:
                      matched: 3
                      reopened: 3
                      reopenOk: true
                      recalculated: true
                      recalculateOk: true
                      monitoringWorkflowId: wf-1
              schema:
                type: object
                examples:
                - message: Practitioner termination rolled back
                  tenantPractitionerId: 3c9e1f2a-7b4d-4e5f-8a6b-2c3d4e5f6a7b
                  tenantPractitionerIds:
                  - 3c9e1f2a-7b4d-4e5f-8a6b-2c3d4e5f6a7b
                  clearedRecords: 7
                  rollbackTraceId: 34167ca8-7f6d-4482-b259-c011bac092bc
                  flags:
                    matched: 3
                    reopened: 3
                    reopenOk: true
                    recalculated: true
                    recalculateOk: true
                    monitoringWorkflowId: wf-1
                description: Outcome of a termination rollback
                properties:
                  message:
                    type: string
                    examples:
                    - Practitioner termination rolled back
                  tenantPractitionerId:
                    type: string
                    examples:
                    - 3c9e1f2a-7b4d-4e5f-8a6b-2c3d4e5f6a7b
                    description: The practitioner acted on; for a certifyPractitionerId request this is the first resolved slice
                  tenantPractitionerIds:
                    type: array
                    items:
                      type: string
                    description: Every slice cleared — one entry for a tenantPractitionerId request, one per contributing slice for a certifyPractitionerId request
                  clearedRecords:
                    type: integer
                    examples:
                    - 7
                    description: Rows written by the atomic batch
                  rollbackTraceId:
                    type: string
                    examples:
                    - 34167ca8-7f6d-4482-b259-c011bac092bc
                    description: Correlates the structured events emitted for this reversal
                  flags:
                    type: object
                    description: 'Monitoring-flag outcome: matched, reopened, reopenOk, recalculated, recalculateOk, monitoringWorkflowId. Reported, not folded into the status code, because the field clear and the flag reopen can genuinely disagree'
        '400':
          description: Bad request - neither or both identifiers were supplied, or this practitioner carries no termination to roll back. The second case is what a repeat call returns, since the endpoint is not idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not Found - practitioner does not exist, or the endpoint is disabled by its kill switch (`practitioner.termination.rollback.enabled=false`), which answers as if the route were not mapped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error - the atomic batch did not commit; nothing was changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: Bad Gateway - the data-access layer rejected or failed the atomic batch. The batch is all-or-nothing, so nothing was changed and the practitioner is exactly as terminated as before; the call is safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service Unavailable - could not reach the data-access layer at all. Nothing was changed; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /practitioners/{caqhProviderId}/caqh-pdqs:
    get:
      summary: Retrieve the CAQH data fetched from PDQS for a practitioner
      description: 'Returns the CAQH PDQS (Provider Data Quality Solution) data for the practitioner identified by `{caqhProviderId}` (the CAQH provider ID), if that data has already been pulled into our system. If it hasn''t been pulled in yet, this returns 404 -- the CAQH PDQS pipeline must be triggered to fetch the practitioner''s data before it can be retrieved from this endpoint. The response is trimmed to `certifyId`, `caqhProviderId`, and `data` (the actual CAQH profile payload, e.g. `practitionerInformation`, `practitionerLicense`, etc.); no pipeline/ingestion metadata or other internal fields are included. Any `ssn` field nested in `data` is masked to only the last 4 digits (e.g. `*****1234`) by default. Send the `X-PII-View: true` header to receive the unmasked SSN; this requires practitioner PII read permission (`READ_PRACTITIONER_PII`) for the tenant and returns 403 otherwise.'
      operationId: getPractitionerCaqhPdqs
      tags:
      - Practitioner
      parameters:
      - description: CAQH provider ID
        example: '3176802'
        required: true
        name: caqhProviderId
        in: path
        schema:
          type: string
      - description: Include unmasked SSN in response; requires practitioner read:pii permission (READ_PRACTITIONER_PII)
        in: header
        name: X-PII-View
        schema:
          type: string
