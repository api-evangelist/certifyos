                    firstName: Jane
                    lastName: Doe
                    npi: '1234567890'
                    gender: Female
                    practitionerType:
                    - MD
                    dateOfBirth: '1980-04-12'
                    providerCreatedDate: '2025-01-15'
                    practitionerRoles:
                    - PCP
                terminatedPractitioner:
                  summary: Practitioner with termination details present
                  value:
                    id: 6a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                    firstName: Jane
                    lastName: Doe
                    npi: '1234567890'
                    gender: Female
                    practitionerType:
                    - MD
                    dateOfBirth: '1980-04-12'
                    providerCreatedDate: '2025-01-15'
                    practitionerRoles:
                    - PCP
                    terminationDate: '2026-08-07'
                    terminationReason: voluntary exit
