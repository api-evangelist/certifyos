          type: string
      - description: Include PII in response; requires explicit permission
        in: header
        name: X-PII-View
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: The practitioner's full profile data, including PII fields when requested via `X-PII-View`.
