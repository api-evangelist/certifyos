        npiParticipationDate:
          type: string
          deprecated: true
          examples:
          - '2024-01-15'
          description: 'Deprecated: use npiEntries instead. Location NPI Participation Date (ISO-8601 date string, e.g. "2024-01-15"). Pass null to leave the existing value unchanged. Mutually exclusive with npiEntries.'
        npiEntries:
          type: array
          items:
            $ref: '#/components/schemas/NpiParDateEntry'
          description: 'Preferred over npi/npiParticipationDate. FULL REPLACEMENT of the addressType2Npi array: send every NPI this location-network should have, as any stored NPI omitted from the list is deleted (this is how an NPI is removed) and an entry omitting npiParticipationDate clears that NPI''s date. Mutually exclusive with npi/npiParticipationDate — set exactly one of the two shapes, never both.'
