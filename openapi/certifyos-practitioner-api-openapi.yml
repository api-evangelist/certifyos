          description: The tenant_groups row. data.groupId is the certify group id — use for group-scope filtering. The nested group ref carries the group name/NPI/TIN display enrichment (group.data.name/npi/tin); null until DAL enrichment populates it.
        tenantGroupLocation:
          $ref: '#/components/schemas/PractitionerEntityRef'
          type: object
