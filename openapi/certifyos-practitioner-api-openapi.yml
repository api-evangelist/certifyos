          description: Navigation links for the response
          required:
          - self
          properties:
            self:
              type: string
              format: uri
              description: Link to the current page of results
            next:
              type:
              - string
              - 'null'
              format: uri
              description: Link to the next page of results, or null if this is the last page
            prev:
