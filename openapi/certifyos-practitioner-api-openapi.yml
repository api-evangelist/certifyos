  /practitioners/practitioner-locations/{id}/roles/correct:
    patch:
      summary: Correct a role key on a practitioner-location record
      description: Renames an existing role key on the specified practitioner-location association record (for example, renaming `PCP` to `Specialist`) while preserving all existing role metadata such as `effectiveDate` and `terminationDate`. This is a data-correction operation — it does not trigger termination events or lifecycle changes. Use it when a role was recorded with the wrong key at the group-practitioner-location level and needs correcting in place; for correcting a role key at the core practitioner level, use `PATCH /practitioners/{id}/roles/correct` instead. `{id}` is the GroupPractitionerLocation record identifier, obtained from the practitioner's location relationship data, and the role key being renamed must already exist on the record.
      operationId: correctLocationRole
      tags:
      - Practitioner
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              correctLocationRole:
                value:
