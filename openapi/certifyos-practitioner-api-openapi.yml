    UpdatePractitionerLocationsRequest:
      description: Request to create or update a practitioner's location associations. Use the same endpoint to edit existing location data (e.g. update NPI(s)). Each location's locationData may include 'npi' (single string or array of strings) for group practice location NPI(s).
      type: object
      required:
      - tenantGroupId
      - locations
      properties:
        tenantGroupId:
          type: string
          description: tenantGroupId (ID of the group to which the practitioner belongs)
          examples:
          - group-123
        locations:
          type: array
          items:
            $ref: '#/components/schemas/UpdatePractitionerLocationRequest'
          description: List of locations to update with this practitioner. Each location's locationData may include 'npi' (single string or array of strings) for group practice location NPI(s). Persisted data is sanitized to match the TenantGroupPractitionerLocation schema.
          minItems: 1
