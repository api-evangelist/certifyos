openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer Practitioner API
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: Practitioner
  description: Endpoints for managing practitioner information and associations.
paths:
  /practitioners:
    get:
      summary: List practitioners matching filter criteria
      description: 'Returns a paginated list of practitioners matching the supplied filter criteria; all filters are combined with AND logic, and omitting a filter returns all practitioners accessible to the caller. Use this endpoint to search across practitioners by name, NPI, CAQH ID, external ID, type, roles, or delegation status — for a single known practitioner, prefer `GET /practitioners/{id}` instead, and for bulk NPI lookup, supply multiple `npi` values (the response shape changes when NPI bulk-search mode is active, adding `identifiersSearched` and `matchedCount` fields). The `tenant-id` header identifies which tenant''s data is queried; include the `X-PII-View: true` header to receive PII fields, which requires the `practitioner read:pii` permission — callers without it receive 403. The `size` parameter''s default of 2 is intentional, and unlike the NPI bulk-search and roster-ID list parameters, api-layer does not enforce any maximum on `size` — it is passed through unclamped.'
      operationId: practitionerFindMany
      tags:
      - Practitioner
      parameters:
      - description: Search by Caqh Provider Id
        name: caqhProviderId
        in: query
        schema:
          type: string
      - description: Filter by delegation status (Direct, Delegated, CredNotRequired, or DeDelegated)
        name: delegationStatus
        in: query
        schema:
          type: string
      - description: Search by External Id
        name: externalId
        in: query
        schema:
          type: string
      - description: 'Filter criteria as JSON (must be URL encoded). Multiple filters are combined with AND logic.


          **Filterable Fields:**

          - `credentialingStatus` (String): Workflow status (eq, neq, in, nin, contains)

          - `practitionerStatus` (String): Stored practitioner status — `INACTIVE`, `PENDING`, `ACTIVE`, `IN_NETWORK`, `TERMINATED` (eq, neq, in, nin, contains)

          - `data.lineOfBusiness` (Array): Line of business values (in, nin)

          - `data.userDefinedFields.*` (Any): User-defined fields with dot notation (eq, neq, in, nin, contains)

          - `data.*` (Any): Any data field (eq, neq, in, nin, contains, gt, gte, lt, lte)


          **Operations:**

          - String: `eq`, `neq`, `in`, `nin`, `contains`

          - Array: `in`, `nin` (use `in` for arrays, not `eq`)

          - Numeric/Date: `eq`, `neq`, `gt`, `gte`, `lt`, `lte`


          **Examples:**

          ```json

          {"credentialingStatus":{"eq":"PSV_READY"}}

          {"credentialingStatus":{"in":["PSV_READY","PSV_COMPLETED"]}}

          {"practitionerStatus":{"in":["ACTIVE","IN_NETWORK"]}}

          {"practitionerStatus":{"nin":["TERMINATED"]}}

          {"data.lineOfBusiness":{"in":["MEDICARE","MEDICAID"]}}

          {"data.userDefinedFields.market":{"in":["MARKET1","MARKET2"]}}

          {"credentialingStatus":{"eq":"PSV_READY"},"data.lineOfBusiness":{"in":["MEDICARE"]}}

          ```


          **Notes:**

          - Filter must be URL encoded when sent as query parameter

          - `tenantId` from header always takes precedence (cannot be overridden)

          - Credentialing status derived from latest workflow timeline event

          - Practitioner status is a stored, indexed column (no legacy join); `null` means never computed

          - String operations are case-sensitive

          '
        name: filter
        in: query
        schema:
          type: string
      - description: Search by Practitioner First Name
        name: firstName
        in: query
        schema:
          type: string
      - description: Search by Practitioner Last Name
        name: lastName
        in: query
        schema:
          type: string
      - description: Filter by licensed states (comma-separated list of state codes)
        name: licensedStates
        in: query
        schema:
          type: string
      - description: 'Search by NPI. May contain one or more values for bulk search (copy-paste): separate with comma, newline, tab, semicolon, or space. When one or more NPI values are provided via this parameter, the response includes optional identifiersSearched, matchedCount, notFoundCount, unmatchedIdentifiers. When the query parameter is omitted (standard list request), those fields are null.'
        name: npi
        in: query
        schema:
          type: string
      - description: 'Sort criteria as JSON (must be URL encoded).

          Format: `{"orderBy":"fieldName","orderByDirection":"ASC|DESC"}`.


          **Accepted now; sort activates once the DAL client bump deploys (CP-32265).** The endpoint accepts this parameter and threads it through the api-layer so the OpenAPI contract is stable and callers can adopt sort immediately. The value is currently held (not yet forwarded to the DAL) because the pinned DAL client (v1.181.0) does not yet expose an `order` param on the practitioner OV list endpoint. DAL PR #1351 adds it; sort begins reaching the DAL as soon as this service is bumped to the client version that publishes it — the immediate post-DAL-merge step. Until then a sorted request returns the same rows as an unsorted one.


          **Sortable field (on activation):**

          - `credentialingDueDate` — Credentialing due date from the latest credentialing workflow (index-backed on the DAL, NULLs sort last).

          - Example: `{"orderBy":"credentialingDueDate","orderByDirection":"ASC"}`

          '
        name: order
        in: query
        schema:
          type: string
      - description: Page number for offset-based pagination (0-based index). Defaults to 0 if not specified.
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: '0'
      - description: Search by Practitioner Roles (comma-separated list)
        name: practitionerRoles
        in: query
        schema:
          type: string
      - description: Search by Practitioner Type (comma-separated list)
        name: practitionerType
        in: query
        schema:
          type: string
      - description: 'Search by Roster: comma-separated roster IDs (UUIDs), max 20 per request. Returns practitioners linked to any of the given rosters. Omit for a standard (non-roster) search.'
        name: rosterIds
        in: query
        schema:
          type: string
      - description: Number of items per page in offset-based pagination. Defaults to 2 if not specified.
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: '2'
      - description: Filter by states to credential (comma-separated list of state codes)
        name: statesToCredential
        in: query
        schema:
          type: string
      - description: Include PII in response; requires practitioner read:pii permission
        in: header
        name: X-PII-View
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: List of Practitioner
          content:
            application/json:
              examples:
                practitionersList:
                  value:
                    data:
                    - id: 6a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                      firstName: Jane
                      lastName: Doe
                      npi: '1234567890'
                      practitionerType:
                      - MD
                    totalCount: 1
              schema:
                $ref: '#/components/schemas/PagedPractitionerGetResponse'
        '400':
          description: Invalid pagination parameters, or an NPI bulk-search list that exceeds the configured maximum (default 100 identifiers).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
    post:
      summary: Create a new practitioner for the tenant
      description: 'Creates a new practitioner record scoped to the requesting tenant. Use this when onboarding a new provider who does not yet exist in the system; if the practitioner already exists for this tenant, the server returns 409 — use `PUT /practitioners/{id}` to update an existing record instead. The request body accepts three payload shapes: a wrapped object with a top-level `data` field, a direct practitioner object, or an extended form that also includes `groups` and `networks` for simultaneous association; the payload is validated against the practitioner JSON schema before persistence. Tenant UDF values go under `data.userDefinedFields`, keyed by the field names returned by `GET /udf-schemas/entity-type/practitioner`; UDF keys sent at the top level of the practitioner object are rejected with 400. Creating a practitioner here does not itself trigger a downstream credentialing workflow.'
      operationId: practitionerCreate
      tags:
      - Practitioner
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Practitioner data as JSON
        content:
          application/json:
            examples:
              createPractitioner:
                value:
                  data:
                    firstName: Jane
                    lastName: Doe
                    npi: '1234567890'
                    practitionerType:
                    - MD
                    gender: Female
                    dateOfBirth: '1980-04-12'
                    userDefinedFields:
                      udfBatchDescription: Batch 2026-10
            schema:
              $ref: '#/components/schemas/CreatePractitionerRequest'
        required: true
      responses:
        '201':
          description: The created practitioner record, including the server-assigned `certifyPractitionerId`.
          content:
            application/json:
              examples:
                practitionerCreated:
                  value:
                    id: 6a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                    crosswalkId: crosswalk-778899
                    tenantPractitionerId: 9d2e3f4a-5b6c-4d7e-8f9a-1b2c3d4e5f6a
              schema:
                $ref: '#/components/schemas/PractitionerCreateResponse'
        '400':
          description: Invalid request body (e.g., schema validation failed), or unsupported source type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict - Practitioner already exists for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error during request processing (e.g., network timeout, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /practitioners/group-practitioner-location-network-specialties/effective-date:
    put:
      summary: Update effective date on a group-location-network specialty
      description: Updates the effective start date on a practitioner's specialty association at the group-location-network level. Use this when the effective date on an existing group-level location-network specialty record needs correction; this operates at the most specific level of the specialty hierarchy (group, then location, then network) — for the location-only level use `PUT /practitioners/group-practitioner-location-specialties/effective-date`, and for the group level use `PUT /practitioners/group-practitioner-specialties/effective-date`. The target specialty association must already exist.
      operationId: updateGroupPractitionerLocationNetworkSpecialtyEffectiveDate
      tags:
      - Practitioner
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              updateEffectiveDate:
                value:
                  id: 6a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                  effectiveDate: '2026-01-15'
            schema:
              $ref: '#/components/schemas/UpdateGroupPractitionerLocationNetworkSpecialtyEffectiveDateRequest'
        required: true
      responses:
        '200':
          description: Practitioner location network specialty effective date successfully updated
          content:
            application/json:
              examples:
                effectiveDateUpdated:
                  value:
                    result:
                      id: 6a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
              schema:
                type: object
        '400':
          description: Invalid request body or missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Group practitioner location network specialty not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error during request processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /practitioners/group-practitioner-location-network-specialties/specialty:
    patch:
      summary: Correct specialty on a group-location-network specialty record
      description: Replaces the specialty identifier on a practitioner specialty association at the group-location-network level. This is a data-correction operation — it does not trigger termination events, lifecycle changes, or downstream workflow notifications. Use it when the wrong specialty was linked at this level and the record needs correcting in place without triggering a termination cycle; for corrections at the group-location level without a network, use `PATCH /practitioners/group-practitioner-location-specialties/specialty` instead. The specialty association record must already exist, and the replacement specialty must be a valid, active tenant specialty.
      operationId: correctGroupPractitionerLocationNetworkSpecialty
      tags:
      - Practitioner
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              correctLocationNetworkSpecialty:
                value:
                  tenantGroupPractitionerLocationNetworkSpecialtyId: 6a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                  newTenantSpecialtyId: 9d2e3f4a-5b6c-4d7e-8f9a-1b2c3d4e5f6a
            schema:
              $ref: '#/components/schemas/CorrectLocationNetworkSpecialtyRequest'
        required: true
      responses:
        '200':
          description: Specialty corrected successfully. This delegates, two hops down, to the same correction logic as `PATCH /practitioners/tenant-practitioner-specialties/specialty`, so the response has the same flat `id`/`tenantSpecialtyId`/`data` shape.
          content:
            application/json:
              examples:
                specialtyCorrected:
                  value:
                    id: 6a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                    tenantSpecialtyId: 9d2e3f4a-5b6c-4d7e-8f9a-1b2c3d4e5f6a
                    data:
                      boardCertified: true
              schema:
                type: object
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - Authenticated but lacking CORRECT_PRACTITIONER permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Group practitioner location network specialty not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict - Practitioner already has this specialty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              examples:
                unexpectedError:
                  value:
                    error: An unexpected error occurred
      security:
      - jwt: []
  /practitioners/group-practitioner-location-specialties/effective-date:
    put:
      summary: Update effective date on a group-location specialty
      description: Updates the effective start date on a practitioner's specialty association at the group-location level, without network specificity. Use this when the effective date on an existing group-level location specialty record needs correction; for the more specific group-location-network level, use `PUT /practitioners/group-practitioner-location-network-specialties/effective-date`, and for the group-only level, use `PUT /practitioners/group-practitioner-specialties/effective-date`. The target specialty association must already exist.
