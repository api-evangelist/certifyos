        GroupOVResponse:
          type: object
          description: Represents a group operational value that the practitioner belongs to. Contains the group's core identifiers, operational data, and contributing slice information.
          required:
          - certifyGroupId
          - tenantId
          properties:
            certifyGroupId:
              type: string
              description: The unique Certify identifier for the group (certifyPractitionerId equivalent for groups)
            tenantId:
              type: string
              description: The tenant identifier that owns this group relationship
