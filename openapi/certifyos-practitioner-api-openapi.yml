    TerminationRequest:
      type: object
      required:
      - terminationType
      - terminationDate
      properties:
        networkId:
          type: string
          examples:
          - network_abc
          description: Optional network ID scope for termination
        tenantGroupLocationId:
          type: string
          examples:
          - tgl_abc
          description: Optional tenant group location ID scope for termination. Required for INFERRED_LOCATION.
        tenantPractitionerId:
          type: string
          examples:
          - tp_abc
          description: Tenant practitioner ID. Required for the 7 legacy termination types. IGNORED for FULL_EXIT and INFERRED_LOCATION, which both identify the practitioner via certifyPractitionerId instead.
        certifyPractitionerId:
          type: string
          examples:
          - certify_abc
          description: Certify practitioner ID. MANDATORY when terminationType is FULL_EXIT or INFERRED_LOCATION -- both identify the practitioner this way, in place of tenantPractitionerId, and a request for either type without it fails with 400. Ignored for the 7 legacy termination types.
        tenantGroupId:
          type: string
          examples:
          - tg_abc
          description: Tenant group ID. Required for all termination types except INFERRED_LOCATION and FULL_EXIT, which resolve the practitioner's group(s) without it.
        terminationType:
          type: string
          examples:
          - NETWORK
          pattern: \S
          description: Termination scope (NETWORK | GROUP | GROUP_LOCATIONS | LOCATION_NETWORK | NETWORK_SPECIALTY | GROUP_SPECIALTY | GROUP_LOCATION_SPECIALTY | INFERRED_LOCATION | FULL_EXIT)
        terminationDate:
          type: string
          examples:
          - '2025-10-25'
          pattern: \S
          description: Termination effective date (YYYY-MM-DD). For FULL_EXIT a malformed value is rejected with 400 rather than coerced — parsing is strict, so an out-of-range month or day (e.g. 2026-15-15) is an error, not a roll-over into the following year.
        terminationReason:
          type: string
          examples:
          - reasons
          description: Termination reason
        terminationInformedDate:
          type: string
          examples:
          - '2025-10-25'
          description: Date when termination was informed (YYYY-MM-DD). Optional; when supplied on a FULL_EXIT request it is validated the same way as terminationDate.
        continuityOfCare:
          type: boolean
          examples:
          - false
          description: Whether Continuity of Care applies for this termination. Defaults to false when omitted.
        tenantSpecialtyId:
          type: string
          examples:
          - ts_abc
          description: Optional tenant specialty ID scope for termination
        tenantGroupPractitionerLocationId:
          type: string
          examples:
          - tgpl_abc
          description: Optional tenant group practitioner location ID scope for termination
        tenantGroupPractitionerNetworkId:
          type: string
          examples:
          - tgp_abc
          description: Optional tenant group practitioner network ID scope for termination
        tenantGroupLocationPractitionerNetworkId:
          type: string
          examples:
          - tgpl_abc
          description: Optional tenant group location practitioner network ID scope for termination
        tenantGroupPractitionerLocationSpecialtyId:
          type: string
          examples:
          - tgpl_abc
          description: Optional tenant group practitioner location specialty ID scope for termination
        tenantGroupPractitionerSpecialtyId:
          type: string
          examples:
          - tgpl_abc
          description: Optional tenant group practitioner specialty ID scope for termination
        tenantPractitionerSpecialtyId:
          type: string
          examples:
          - ps_abc
          description: Optional practitioner specialty ID scope for termination
        acknowledgedLocationNetworkTermination:
          type: boolean
          examples:
          - true
          description: 'Optional opt-in for GROUP_LOCATIONS: when true (and the practitioner.termination.group-locations.cascade-network.enabled config flag is also on), terminating the practitioner from the selected group location also ends their network enrollment at that location (TenantGroupLocationPractitionerNetwork) — group membership (TenantGroupPractitioner) and group-wide network enrollment (TenantGroupPractitionerNetwork) are never affected either way. Omitting this field (or sending false) is not an error; it just keeps the legacy GPL-only termination, so existing callers that don''t send it are unaffected.'
