    patch:
      summary: Remove a role from the core practitioner record
      description: Removes a role key from the core practitioner record; the role is set to null and stripped, so it will no longer be included when the practitioner's profile is composed from source records. Use this to permanently remove a role at the core practitioner level — this is not a termination, it removes the role entry entirely rather than setting a termination date. For terminating a role at a specific location-network assignment, use `PUT /practitioners/practitioner-role-assignments/{id}/terminate`; for removing a role at the group-practitioner-location level, use `PATCH /practitioners/practitioner-locations/{id}/roles/remove`. `{id}` is the `certifyPractitionerId`, and the role key being removed must exist on the core practitioner record.
      operationId: removePractitionerRole
      tags:
      - Practitioner
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
