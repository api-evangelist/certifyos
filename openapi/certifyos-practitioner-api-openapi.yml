      description: Updates the practitioner's data for a specific location-network assignment, including effective dates, panel status, whether the practitioner is accepting new patients, roles, specialties, languages, and office hours. Use this when location-network specific attributes for a practitioner need to be changed; if `applyToAllNetworks` is true in the request body, the update is applied to all networks the practitioner is linked to at this location, with the `{networkId}` path parameter used for routing only rather than restricting the scope. `{networkId}` is used once for an existence check regardless of the flag; the actual network set to update is otherwise determined by a query scoped only to the location, except as a fallback (when that query returns nothing) where it falls back to just `{networkId}`. `{practitionerId}` is the `certifyPractitionerId`, and the practitioner must already be associated with the specified location and network.
      operationId: updatePractitionerLocationNetwork
      tags:
      - Practitioner
      parameters:
      - description: ID of the tenant group location
        in: path
        required: true
        name: locationId
        schema:
          type: string
          pattern: \S
      - description: ID of the network
        in: path
        required: true
        name: networkId
        schema:
          type: string
          pattern: \S
      - description: ID of the practitioner (certify practitioner ID)
        in: path
        required: true
        name: practitionerId
        schema:
          type: string
          pattern: \S
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Request containing group ID and location-network specific data
        content:
          application/json:
            examples:
              updateLocationNetwork:
                value:
                  groupId: 8e8a377a-39f0-4032-9067-dbb23bc52c84
                  applyToAllNetworks: false
            schema:
              $ref: '#/components/schemas/UpdatePractitionerLocationNetworkRequest'
        required: true
      responses:
        '200':
          description: Successfully updated practitioner location-network details. When `applyToAllNetworks` is false, the response is a flat object with a single `networkId` field; when true, the response instead has a `networkUpdates` array and no top-level `networkId` — these are genuinely two different response shapes, not just different field values.
          content:
            application/json:
              examples:
                singleNetwork:
                  summary: applyToAllNetworks=false
                  value:
                    tenantGroupPractitionerId: 9d2e3f4a-5b6c-4d7e-8f9a-1b2c3d4e5f6a
                    tenantGroupLocationId: 6a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                    networkId: 7a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                    groupPractitionerLocationId: 3c9e1f2a-7b4d-4e5f-8a6b-2c3d4e5f6a7b
                    tenantGroupLocationPractitionerNetworkId: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
                    status: updated
                allNetworks:
                  summary: applyToAllNetworks=true
                  value:
                    tenantGroupPractitionerId: 9d2e3f4a-5b6c-4d7e-8f9a-1b2c3d4e5f6a
                    tenantGroupLocationId: 6a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                    groupPractitionerLocationId: 3c9e1f2a-7b4d-4e5f-8a6b-2c3d4e5f6a7b
                    networkUpdates:
                    - networkId: 7a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                      tenantGroupLocationPractitionerNetworkId: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
                      status: updated
              schema:
                oneOf:
                - $ref: '#/components/schemas/PractitionerLocationNetworkUpdateResponse'
                - $ref: '#/components/schemas/PractitionerLocationNetworksUpdateResponse'
        '400':
          description: Bad request - Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Practitioner, location, or network not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /practitioners/{practitionerId}/locations/{locationId}/networks/{networkId}/npi-par-date:
    put:
      summary: Update NPI and participation date at a location-network
      description: 'As of CP-36570: updates only the practitioner-agnostic TenantGroupLocationNetwork `addressType2Npi` array (NPI + participation date, supports multiple NPIs per location-network) — no TenantGroupLocationPractitionerNetwork row is written by this endpoint anymore. `{practitionerId}` and the practitioner''s association with the location/network are still validated for authorization/existence scoping, but the write itself is location-network scoped, not per-practitioner — NPI is a location-network attribute and cannot be edited at the practitioner-location level alone. Preferred: pass `npiEntries` with the location-network''s complete NPI set — it REPLACES the stored `addressType2Npi` array, so an NPI omitted from the list is deleted (the only way to remove one) and an entry without `npiParticipationDate` is stored with no date. Deprecated: the scalar `npi`/`npiParticipationDate` fields still work — pass `null` for either to leave that value unchanged, repeat the call to add/update additional NPIs, `npi` is required to disambiguate `npiParticipationDate` when more than one NPI exists — but they are mutually exclusive with `npiEntries` in the same request. `{practitionerId}` is the `certifyPractitionerId`.'
      operationId: updatePractitionerLocationNpiParDate
      tags:
      - Practitioner
      parameters:
      - description: ID of the tenant group location
        in: path
        required: true
        name: locationId
        schema:
          type: string
          pattern: \S
      - description: ID of the network
        in: path
        required: true
        name: networkId
        schema:
          type: string
          pattern: \S
      - description: ID of the practitioner (certify practitioner ID)
        in: path
        required: true
        name: practitionerId
        schema:
          type: string
          pattern: \S
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: NPI and participation date to update
        content:
          application/json:
            examples:
              updateNpiParDate:
                value:
                  groupId: 8e8a377a-39f0-4032-9067-dbb23bc52c84
                  npi: '1234567890'
                  npiParticipationDate: '2026-01-15'
            schema:
              $ref: '#/components/schemas/UpdatePractitionerLocationNpiParDateRequest'
        required: true
      responses:
        '200':
          description: The updated location-network assignment record.
          content:
            application/json:
              examples:
                npiParDateUpdated:
                  value:
                    tenantGroupPractitionerId: 9d2e3f4a-5b6c-4d7e-8f9a-1b2c3d4e5f6a
                    tenantGroupLocationId: 6a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                    networkId: 7a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                    groupPractitionerLocationId: 3c9e1f2a-7b4d-4e5f-8a6b-2c3d4e5f6a7b
                    tenantGroupLocationPractitionerNetworkId: 'null'
                    status: updated
              schema:
                $ref: '#/components/schemas/PractitionerLocationNetworkUpdateResponse'
        '400':
          description: Bad request - Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Practitioner, location, or network not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /practitioners/{practitionerId}/specialties:
    get:
      summary: List specialties associated with a practitioner
      description: Returns all specialties the specified practitioner is associated with at the tenant level. Use this to retrieve a practitioner's specialty list; for the raw tenant practitioner specialty records with their internal IDs needed for deletion or correction operations, see the operations under `/tenant-practitioner-specialties`, and for creating a new specialty association, use `POST /practitioners/{practitionerId}/specialties`. `{practitionerId}` is the `certifyPractitionerId`. Terminated associations are included; this endpoint does not filter by termination status.
      operationId: getPractitionerSpecialties
      tags:
      - Practitioner
      parameters:
      - description: ID of the practitioner to get specialties for
        in: path
        required: true
        name: practitionerId
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved specialties for the practitioner
          content:
            application/json:
              examples:
                practitionerSpecialties:
                  value:
                  - tenantPractitionerSpecialtyId: 6a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                    tenantSpecialtyId: 9d2e3f4a-5b6c-4d7e-8f9a-1b2c3d4e5f6a
                    specialtyName: Cardiology
                    isPrimary: true
                    createdAt: '2026-01-15'
              schema:
                type: array
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Practitioner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
    post:
      summary: Associate a practitioner with a specialty
      description: 'Associates the practitioner with a specialty at the tenant level, with best-effort cascade to group, location, and network levels. The practitioner-level specialty is always attempted first; lower-level associations are created on a best-effort basis, and failures at those levels do not cause the overall request to fail. Use this when a practitioner gains a new specialty that should be recorded across all applicable levels. `{practitionerId}` is the `certifyPractitionerId`, and the request body must identify the specialty to associate: either `tenantSpecialtyId` or `practitionerRole` must be present, and `data` is required only when `tenantSpecialtyId` is supplied.'
      operationId: associatePractitionerWithSpecialty
      tags:
      - Practitioner
      parameters:
      - description: ID of the practitioner to associate with the specialty
        in: path
        required: true
        name: practitionerId
        schema:
          type: string
      - description: The tenant identifier
        in: header
        required: true
        name: tenant-id
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              associateSpecialty:
                value:
                  tenantSpecialtyId: 9d2e3f4a-5b6c-4d7e-8f9a-1b2c3d4e5f6a
                  groupSpecialtyEffectiveDate: '2026-01-15'
                  data:
                    effectiveDate: '2026-01-15'
                    terminationDate: '2027-01-15'
                    isPrimary: true
            schema:
              $ref: '#/components/schemas/CreateTenantPractitionerSpecialtyRequest'
        required: true
      responses:
        '200':
          description: Practitioner specialty created. Response includes created specialties per level and, when applicable, 'notCreated' listing levels that could not be created (e.g. missing group/location/network associations) with reason and message.
          content:
            application/json:
              examples:
                specialtyAssociated:
                  value:
                    practitionerSpecialty:
                      id: 6a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                      tenantPractitionerId: 9d2e3f4a-5b6c-4d7e-8f9a-1b2c3d4e5f6a
                      tenantSpecialtyId: 3c9e1f2a-7b4d-4e5f-8a6b-2c3d4e5f6a7b
                    notCreated:
                    - level: NETWORK_LOCATION
                      reason: MISSING_DEPENDENCY
                      message: No location-network association exists for this practitioner; associate the practitioner with a location-network first.
              schema:
                $ref: '#/components/schemas/AssociatePractitionerSpecialtyResponse'
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              examples:
                invalidRequest:
                  value:
                    error: Practitioner ID cannot be null or empty
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Practitioner or specialty not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict - Practitioner already associated with specialty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - jwt: []
  /practitioners/{practitionerId}/tenant-practitioner-specialties/{tpsId}:
    delete:
      summary: Permanently delete a practitioner specialty and dependents
      description: Permanently and irreversibly deletes the specified practitioner specialty record along with all dependent specialty records at the group-location and group-location-network levels, in a single atomic transaction; this cannot be undone. Use it only when a specialty record must be completely removed, for example when it was created in error — to end a specialty with a termination date instead (reversible, preserves history), use `PUT /practitioners/tenant-practitioner-specialties/terminate`. `{practitionerId}` is the `certifyPractitionerId`, and `{tpsId}` is the internal identifier for the `TenantPractitionerSpecialty` record, obtained from the specialty list returned by `GET /practitioners/{practitionerId}/specialties` or related queries. The specialty must not be the primary specialty (`isPrimary=true`); attempting to delete the primary specialty returns an error.
      operationId: removeTenantPractitionerSpecialty
      tags:
      - Practitioner
      parameters:
      - name: practitionerId
        in: path
        required: true
        schema:
          type: string
      - name: tpsId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: 'A confirmation payload for the deleted specialty and its dependent records: `{"message": "Specialty removed successfully", "tenantPractitionerSpecialtyId": "<id>"}`.'
          content:
            application/json:
              examples:
                specialtyRemoved:
                  value:
                    message: Specialty removed successfully
                    tenantPractitionerSpecialtyId: 6a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
        '400':
          description: Bad request — cannot remove primary specialty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: TenantPractitionerSpecialty not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              examples:
                unexpectedError:
                  value:
                    error: An unexpected error occurred
      security:
      - jwt: []
