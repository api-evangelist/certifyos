                      tenantGroupPractitioner:
                        id: 9d2e3f4a-5b6c-4d7e-8f9a-1b2c3d4e5f6a
                    links:
                      self: /practitioners/1234567890/relationships/locations?page=0&size=50
                    totalCount: 1
              schema:
                $ref: '#/components/schemas/PractitionerLocationsPagedResponse'
