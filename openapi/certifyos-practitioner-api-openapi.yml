    post:
      summary: Associate a practitioner with a specialty
      description: Associates a practitioner with the specified specialty and returns the association details. Practitioner-level specialty is always attempted first; group, location, and network levels are best-effort. On success (200), the response includes all successfully created specialties per level and a 'notCreated' list for any level that could not be created (e.g. missing dependencies), so clients can fix and retry. 4xx is returned only when practitioner-level creation fails.
      operationId: associatePractitionerWithSpecialty
      tags:
      - Practitioner
      parameters:
      - description: ID of the practitioner to associate with the specialty
        in: path
        required: true
        name: practitionerId
        schema:
          type: string
      - description: The tenant identifier
        in: header
        required: true
        name: tenant-id
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantPractitionerSpecialtyRequest'
        required: true
      responses:
        '200':
          description: Practitioner specialty created. Response includes created specialties per level and, when applicable, 'notCreated' listing levels that could not be created (e.g. missing group/location/network associations) with reason and message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociatePractitionerSpecialtyResponse'
        '400':
          description: Bad request - Invalid input
          content:
            application/json: {}
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Insufficient permissions
        '404':
          description: Practitioner or specialty not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '409':
          description: Conflict - Practitioner already associated with specialty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /practitioners/{practitionerId}/tenant-practitioner-specialties/{tpsId}:
    delete:
      summary: Permanently remove a practitioner specialty (hard delete with FK cascade)
      description: Hard-deletes a TenantPractitionerSpecialty record and all dependent group_practitioner_location_specialties and tenant_group_practitioner_location_network_specialties rows in a single atomic Spanner transaction. The specialty must not be the primary specialty (isPrimary=true).
      operationId: removeTenantPractitionerSpecialty
      tags:
      - Practitioner
      parameters:
      - name: practitionerId
        in: path
        required: true
        schema:
          type: string
      - name: tpsId
        in: path
        required: true
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Specialty removed successfully
          content:
            application/json: {}
        '400':
          description: Bad request — cannot remove primary specialty
          content:
            application/json: {}
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: TenantPractitionerSpecialty not found
          content:
            application/json: {}
        '500':
          description: Internal server error
          content:
            application/json: {}
      security:
      - jwt: []
