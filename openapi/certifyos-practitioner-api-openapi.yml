        groupLocation:
          $ref: '#/components/schemas/PractitionerGroupLocationRef'
          type: object
          description: The group_locations row. data.locationId is the certify location id; data.groupId is the certify group id cross-reference. The nested location ref carries the location name/practiceHours display enrichment (location.data.name/practiceHours); null until DAL enrichment populates it.
        locationEntityAddresses:
          type: array
          items:
            $ref: '#/components/schemas/PractitionerLocationEntityAddressRef'
          description: Address rows for this location (location_entity_addresses). Includes service and office addresses. Each entry's own data blob carries addressType/isPrimary; the nested entityAddress ref carries the hydrated address fields (addressLine1/2, city, state, zip, county, country); entityAddress is null until DAL enrichment populates that join.
        tenantGroupLocationPractitionerNetworks:
          type: array
          items:
            $ref: '#/components/schemas/PractitionerNetworkParticipationRef'
          description: Network-participation rows at this group-location (tenant_group_location_practitioner_networks, TGLPN). Each entry pairs a TGLPN record with its referenced network entity. When the networkId filter is active on the request, only the matching TGLPN entry is included here.
        tenantGroupLocationNetworks:
          type: array
          items:
            $ref: '#/components/schemas/PractitionerNetworkParticipationRef'
