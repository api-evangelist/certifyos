  /practitioners/{id}/relationships/locations:
    get:
      summary: List locations in a practitioner's relationship graph
      description: Returns a paginated list of group_practitioner_locations (GPL) associations for the practitioner, each including relationship context such as the group, tenant group location, and any linked location-network (TGLPN) records. Use this when you need location data with relationship context; for a simpler list without relationship graph data, use `GET /practitioners/{practitionerId}/locations` instead. `{id}` is the `certifyPractitionerId`. This endpoint previously returned unstructured raw relationship data and is now a typed, paginated response (breaking change as of 2026-07-01); the operationId retains its legacy plural form for OpenAPI stability even though the underlying method is `getPractitionerLocationRelationships`. Terminated associations are included; none of the available filters (`certifyGroupId`, `networkId`, `locationSearch`) filter by termination status.
      operationId: getPractitionerLocationsRelationships
      tags:
      - Practitioner
      parameters:
      - description: Certify practitioner id. Maps to the OV entityId (certify_practitioner_id).
        example: '1234567890'
        required: true
        name: id
        in: path
        schema:
          type: string
      - description: Filter by certify group id. Only GPLs whose group resolves to this id are returned. Omit to include all groups.
        example: grp-abc-123
        name: certifyGroupId
        in: query
        schema:
          type: string
      - description: Filter by location name (case-insensitive substring match against the resolved location name). Omit/blank to include all locations.
        example: main street
        name: locationSearch
        in: query
        schema:
          type: string
      - description: Filter by network id. Only GPLs that have a matching TGLPN row for this network id are returned (EXISTS semantics — GPL rows are never duplicated). The tenantGroupLocationPractitionerNetworks array on each item is also filtered to this network when set. The tenantGroupLocationNetworks (TGLN) fallback array is not gated by this filter — all TGLN entries for the item's group-location are included regardless of the requested networkId. Omit to include all networks.
        example: net-xyz-456
        name: networkId
        in: query
        schema:
          type: string
      - description: 'Page number (0-based), for offset-based pagination. Default: 0.'
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: '0'
      - description: 'Page size (clamped to max 100). Default: 50.'
        name: size
        in: query
        schema:
          type: integer
