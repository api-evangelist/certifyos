openapi: 3.2.0
info:
  description: API for Certify application
  title: Certify API Layer Facility API
  version: 1.0.0
servers:
- url: http://localhost:9000
  description: Local Development Server
- url: https://api-service.staging.certifyos.com
  description: Staging Server
- url: https://api-service.internal.certifyos.com
  description: Internal Server
- url: https://api-service.test.certifyos.com
  description: Test Server
- url: https://api-service.demo.certifyos.com
  description: Demo Server
- url: https://api-service.certifyos.com
  description: Production Server
tags:
- name: Facility
  description: APIs for managing facility entities
paths:
  /facilities:
    post:
      summary: Create a facility for the tenant
      description: Creates a CoreFacility and its TenantFacility association for the tenant (create path; certifyFacilityId is not yet known). Use this to establish a new facility record; use PUT /facilities/{id} instead when the certifyFacilityId is already known. A crosswalk ID is generated from the facility's tenant-scoped identity (NPI+TIN, NCPDP, externalId, or an address hash, depending on tenant identity configuration) — this crosswalk, not any single submitted field, is what the platform treats as the facility's unique identity key. Request body is validated against the facility-upsert JSON Schema and, for tenants configured with isFacilityExternalIdAsCrosswalk=true, against additional externalId/address-hash uniqueness rules (see FacilityValidationService). The primary address, if present, may be standardized via the address cleanser before being persisted. When facility.upsert.sync-survivorship.enabled is true (default), a synchronous (not queued/async) survivorship call is also triggered to the core data layer. Returns HTTP 201 with an ID map only (crosswalkId, corefacilityId, tenantfacilityId, and related batch-alias IDs) — not the full facility object; call GET /facilities/{id} afterwards to read back the created record. See PUT /facilities/{id} for the update path. Tenant UDF values go under `userDefinedFields`, keyed by the field names returned by `GET /udf-schemas/entity-type/facility`; UDF keys sent at the top level of the payload are rejected with 400.
      operationId: facilityUpsert
      tags:
      - Facility
      parameters:
      - description: Tenant ID
        in: header
        required: true
        name: tenant-id
        schema:
          type: string
      requestBody:
        description: Facility create payload
        content:
          application/json:
            examples:
              createFacility:
                value:
                  name: Acme Medical Center
                  npi: '1234567890'
                  tin: '123456789'
                  facilityType: Hospital
                  addresses:
                  - address1: 123 Main St
                    city: Springfield
                    state: IL
                    zipcode: '62704'
                    country: US
                    isPrimary: true
                  userDefinedFields:
                    udfBatchDescription: Batch 2026-10
            schema:
              $ref: '#/components/schemas/FacilityUpsertRequest'
        required: true
      responses:
        '201':
          description: Facility successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityUpsertResponse'
        '400':
          description: 'Invalid request body. One of: a list of JSON Schema validation messages; {"errors": ["..."]} from tenant-specific validation (e.g. externalId/address-hash rules); or a plain-string message for other invalid requests (e.g. duplicate NPI/TIN, missing name/npi/tin).'
          content:
            application/json: {}
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
    get:
      summary: Search facilities by filter criteria with pagination
      description: 'Returns a paginated list of facilities matching the supplied filter criteria. Use this to search or list facilities for a tenant; use GET /facilities/{id} instead when you already know the facility identifier. Supports offset-based pagination via page/size. Search by Roster (CP-35452): the rosterIds query param filters to facilities belonging to one or more selected rosters; combines with other filters using AND logic. Filtering by credentialingCycle, nextCredentialingDate, credentialingStatus, and User Defined Fields (UDFs) is supported through the filter parameter. UDF fields can be filtered using the path format: `data.userDefinedFields.{fieldName}` for simple fields or `data.userDefinedFields.{parent}.{child}` for nested fields.'
      operationId: facilityFindMany
      tags:
      - Facility
      parameters:
      - description: Filter by delegation status (Direct or Delegated)
        name: delegationStatus
        in: query
        schema:
          type: string
      - description: Filter by external ID
        name: externalId
        in: query
        schema:
          type: string
      - description: "Filter criteria as JSON (must be URL encoded). Multiple filters are combined with AND logic.\n\n**Filterable Fields:**\n\n**Credentialing Fields:**\n- `credentialingCycle` (String): Credentialing cycle type - `INITIAL` or `RECREDENTIALING` (eq, neq, in, nin, contains)\n- `nextCredentialingDate` (Date): Next credentialing date in ISO format `YYYY-MM-DD` (eq, neq, gt, gte, lt, lte, in, nin)\n- `credentialingStatus` (String): Current credentialing status (eq, neq, in, nin, contains)\n\n**User Defined Fields (UDFs):**\n- `userDefinedFields.*` (Dynamic): Any user-defined field stored in `data.userDefinedFields` object\n  - **Field Path Format**: Use `userDefinedFields.{fieldName}` or `userDefinedFields.{fieldName}.{subfield}` for nested fields\n  - **Important**: Clients should use only the `userDefinedFields.*` format (without `data.` prefix).\n    The backend automatically transforms `userDefinedFields.*` to `data.userDefinedFields.*` internally.\n  - **Supported Operations** (varies by field type):\n    - **String fields**: `eq`, `neq`, `in`, `nin`, `contains`\n    - **Numeric fields**: `eq`, `neq`, `gt`, `gte`, `lt`, `lte`, `in`, `nin`\n    - **Array fields**: `eq`, `in` (checks if array contains the value)\n    - **Boolean fields**: `eq`, `neq`\n  - **Examples**: `userDefinedFields.market`, `userDefinedFields.location.region`\n\n**Other Data Fields:**\n- `data.ncpdpId` (String): Pharmacy NCPDP identifier (eq, in, contains) — prefer query params `ncpdpId` / `ncpdpIdContains` for simple cases\n- `data.*` (Any): Any data field (eq, neq, in, nin, contains, gt, gte, lt, lte)\n\n**Operations:**\n- **String**: `eq`, `neq`, `in`, `nin`, `contains`\n- **Date**: `eq`, `neq`, `gt`, `gte`, `lt`, `lte`, `in`, `nin`\n- **Numeric**: `eq`, `neq`, `gt`, `gte`, `lt`, `lte`, `in`, `nin`\n- **Array**: `eq`, `in` (checks if array contains the value)\n- **Boolean**: `eq`, `neq`\n\n**Examples:**\n\n**Credentialing Filters:**\n```json\n{\"credentialingCycle\":{\"eq\":\"INITIAL\"}}\n{\"nextCredentialingDate\":{\"gte\":\"2025-01-01\"}}\n{\"credentialingStatus\":{\"eq\":\"CRED_APPROVED\"}}\n{\"credentialingCycle\":{\"eq\":\"INITIAL\"},\"nextCredentialingDate\":{\"gte\":\"2025-01-01\",\"lte\":\"2025-12-31\"}}\n{\"credentialingStatus\":{\"in\":[\"CRED_APPROVED\",\"PSV_READY\"]},\"credentialingCycle\":{\"eq\":\"RECREDENTIALING\"}}\n```\n\n**NCPDP Filters:**\n```json\n{\"data.ncpdpId\":{\"eq\":\"2334234\"}}\n{\"data.ncpdpId\":{\"in\":[\"1111111\",\"3333333\"]}}\n{\"data.ncpdpId\":{\"contains\":\"342\"}}\n```\n\n**User Defined Fields (UDFs):**\n```json\n{\"userDefinedFields.market\":{\"eq\":\"MARKET1\"}}\n{\"userDefinedFields.market\":{\"in\":[\"MARKET1\",\"MARKET2\"]}}\n{\"userDefinedFields.location.region\":{\"eq\":\"NORTH\"}}\n```\n**Note**: Clients must use the `userDefinedFields.*` format (without `data.` prefix).\nThe backend automatically transforms these to `data.userDefinedFields.*` internally.\n\n**Combined Filters:**\n```json\n{\"credentialingStatus\":{\"eq\":\"CRED_APPROVED\"},\"userDefinedFields.market\":{\"eq\":\"MARKET1\"}}\n{\"credentialingCycle\":{\"eq\":\"INITIAL\"},\"nextCredentialingDate\":{\"gte\":\"2025-01-01\"},\"userDefinedFields.market\":{\"in\":[\"MARKET1\",\"MARKET2\"]}}\n```\n\n**Notes:**\n- Filter must be URL encoded when sent as query parameter\n- `tenantId` from header always takes precedence (cannot be overridden)\n- Credentialing fields are derived from the most recent CRED_APPROVED timeline event\n- Date format must be ISO 8601: `YYYY-MM-DD`\n- String operations are case-sensitive\n- UDF field names are case-sensitive - use exact field names as stored in your data\n- UDF fields are dynamically supported - any field under `userDefinedFields.*` can be filtered\n  (use `userDefinedFields.*` format, not `data.userDefinedFields.*`)\n- UDF nested fields are supported using dot notation: `userDefinedFields.parent.child`\n"
        name: filter
        in: query
        schema:
          type: string
      - description: Filter by line of business (comma-separated list, e.g., MEDICARE,MEDICAID)
        name: lineOfBusiness
        in: query
        schema:
          type: string
      - description: Filter by facility name
        name: name
        in: query
        schema:
          type: string
      - description: Filter by NCPDP ID (exact match). Accepts one 7-digit value, or multiple values separated by comma/newline/tab/semicolon/space for {@code in} matching (CP-33006). Each value must be exactly 7 digits.
        name: ncpdpId
        in: query
        schema:
          type: string
      - description: Filter by NCPDP ID substring ({@code contains}). Does not require a full 7-digit value (CP-33006). Prefer {@code ncpdpId} for exact UI search.
        name: ncpdpIdContains
        in: query
        schema:
          type: string
      - description: 'Filter by facility NPI. May contain one or more values for bulk search (copy-paste): separate with comma, newline, tab, semicolon, or space. When one or more NPI values are provided via this parameter, the response includes optional identifiersSearched, matchedCount, notFoundCount, unmatchedIdentifiers. When the query parameter is omitted (standard list request), those fields are null.'
        name: npi
        in: query
        schema:
          type: string
      - description: Page number for offset-based pagination (0-based index). Defaults to 0 if not specified.
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: '0'
      - description: 'Search by Roster (CP-35452): comma-separated roster UUIDs. May contain one or more values, max facility.roster-search.max-ids (default 20). Combines with other query params and `filter` using AND logic. Omit or leave blank for a standard (non-roster) list request.'
        name: rosterIds
        in: query
        schema:
          type: string
      - description: Number of items per page in offset-based pagination. Defaults to 10 if not specified.
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: '10'
      - description: Filter by facility TIN
        name: tin
        in: query
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: List of Facilities
          content:
            application/json:
              examples:
                standardList:
                  value:
                    data:
                    - id: cf_9f1b2c3d
                      name: Acme Medical Center
                      npi: '1234567890'
                    totalCount: 1
                bulkNpiSearch:
                  value:
                    data:
                    - id: cf_9f1b2c3d
                      name: Acme Medical Center
                      npi: '1234567890'
                    totalCount: 1
                    identifiersSearched: 2
                    matchedCount: 1
                    notFoundCount: 1
                    unmatchedIdentifiers:
                    - '9999999999'
              schema:
                $ref: '#/components/schemas/PagedResponse'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /facilities/supporting-documents/bulk:
    post:
      summary: Bulk upload supporting documents to multiple facilities
      description: 'Uploads one or more files exactly once each and links them as shared supporting-document attachments (source: "Bulk") to every selected facility. Facilities may be selected explicitly via certifyFacilityIds (JSON string form field), or via isSelectAll=true plus a filter JSON string (same encoding as GET /facilities). When isSelectAll is true, certifyFacilityIds is ignored; when false, filter is ignored. Target set size is capped (default 1000; see api-layer.facility.bulk-document-upload.max-facilities). HTTP 200 is returned for both full and partial success: per-file and per-facility outcomes are reported independently in the response body. When the feature kill switch is off, the endpoint returns 404 with an empty body (CP-35450).'
      operationId: bulkCreateFacilitySupportingDocuments
      tags:
      - Facility
      parameters:
      - description: Tenant identifier
        in: header
        required: true
        name: tenant-id
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                fileType:
                  type: string
                state:
                  type: string
                expirationDate:
                  type: string
                certifyFacilityIds:
                  type: string
                filter:
                  type: string
                isSelectAll:
                  type: boolean
                  default: false
        required: true
      responses:
        '200':
          description: Bulk upload processed (full or partial success); see body for per-file and per-facility outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkFacilitySupportingDocumentUploadResponse'
        '400':
          description: 'Bad request - missing files/fileType, invalid certifyFacilityIds/filter JSON, no facilities resolved, or too many facilities targeted. Body shape is {"error": "<message>"}.'
          content:
            application/json:
              schema:
                type: object
                examples:
                - error: fileType is required.
                properties:
                  error:
                    type: string
                    examples:
                    - fileType is required.
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Not Found - bulk supporting-document upload is disabled for this environment (empty body)
          content:
            application/json: {}
        '500':
          description: 'Internal server error. Body shape is {"error": "<message>"}.'
          content:
            application/json:
              schema:
                type: object
                examples:
                - error: Failed to process bulk supporting document upload.
                properties:
                  error:
                    type: string
                    examples:
                    - Failed to process bulk supporting document upload.
      security:
      - jwt: []
  /facilities/tenant-facility-specialties/specialty:
    patch:
      summary: Correct a facility-level specialty record
      description: Updates a TenantFacilitySpecialty record (Level 1) by replacing the tenant_specialty_id, updating the effective date, or both. At least one of newTenantSpecialtyId or effectiveDate must be provided. Use this for data-correction scenarios where a facility's direct specialty association needs to be updated without triggering credentialing lifecycle events — it does not propagate changes to group, location, or network specialty records. For corrections that need to cascade to group-level records, use PATCH /facilities/tenant-group-facility-specialties/specialty instead. Does not trigger termination events or lifecycle changes. Returns the raw updated record (id, tenantSpecialtyId, data) as an untyped JSON object, not a curated response DTO.
      operationId: updateTenantFacilitySpecialty
      tags:
      - Facility
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectFacilitySpecialtyRequest'
        required: true
      responses:
        '200':
          description: Specialty updated successfully
          content:
            application/json:
              examples:
                specialtyCorrected:
                  value:
                    id: tfs_001
                    tenantSpecialtyId: spec_cardiology
                    data:
                      effectiveDate: '2026-08-01'
              schema:
                type: object
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Tenant facility specialty not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '409':
          description: Conflict - Facility already has this specialty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /facilities/tenant-group-facility-location-specialties/specialty:
    patch:
      summary: Correct the specialty at the group-facility-location level
      description: Resolves the FK chain from TenantGroupFacilityLocationSpecialty (Level 4) to the parent TenantGroupFacilitySpecialty (Level 3) and replaces its tenant_specialty_id by updating that Level-3 record. Use this for data-correction scenarios where a group-facility-location specialty record is linked to the wrong specialty and you need to scope the correction to a single location without cascading across all locations — for the broader group-facility correction, use PATCH /facilities/tenant-group-facility-specialties/specialty instead. Does not trigger termination events. Because this operation delegates to the Level-3 update, the response body is shaped like the Level-3 record (id, tenantSpecialtyId, data) — not a Level-4-specific record.
      operationId: correctTenantGroupFacilityLocationSpecialty
      tags:
      - Facility
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectGroupFacilityLocationSpecialtyRequest'
        required: true
      responses:
        '200':
          description: Specialty corrected successfully
          content:
            application/json:
              examples:
                specialtyCorrected:
                  value:
                    id: tgfs_001
                    tenantSpecialtyId: spec_cardiology
                    data:
                      effectiveDate: '2026-08-01'
              schema:
                type: object
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Group facility location specialty not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '409':
          description: Conflict - Group facility already has this specialty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /facilities/tenant-group-facility-network-specialties/specialty:
    patch:
      summary: Correct the specialty at the group-facility-network level
      description: Resolves the FK chain from TenantGroupFacilityNetworkSpecialty (Level 5) to the parent TenantGroupFacilitySpecialty (Level 3) and replaces its tenant_specialty_id by updating that Level-3 record. Use this for data-correction scenarios where a group-facility-network specialty record is linked to the wrong specialty and you need to scope the correction to a single network association without cascading across all locations — for the broader group-facility correction, use PATCH /facilities/tenant-group-facility-specialties/specialty instead. Does not trigger termination events. Because this operation delegates to the Level-3 update, the response body is shaped like the Level-3 record (id, tenantSpecialtyId, data) — not a Level-5-specific record.
      operationId: correctTenantGroupFacilityNetworkSpecialty
      tags:
      - Facility
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectGroupFacilityNetworkSpecialtyRequest'
        required: true
      responses:
        '200':
          description: Specialty corrected successfully
          content:
            application/json:
              examples:
                specialtyCorrected:
                  value:
                    id: tgfs_001
                    tenantSpecialtyId: spec_cardiology
                    data:
                      effectiveDate: '2026-08-01'
              schema:
                type: object
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Group facility network specialty not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '409':
          description: Conflict - Group facility already has this specialty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /facilities/tenant-group-facility-specialties/specialty:
    patch:
      summary: Correct the specialty on a group facility specialty record
      description: Replaces the tenant_specialty_id on a TenantGroupFacilitySpecialty record (Level 3) in data-correction mode. Use this for data-correction scenarios where a group-level facility specialty association is incorrect and the correction must propagate to its child records — cascades to the group-facility-location and group-facility-network specialty records (Levels 4, 5) that are children of this association via FK chain. For correcting only a facility-level (non-group) record, use PATCH /facilities/tenant-facility-specialties/specialty instead. Does not trigger termination events. Returns the raw updated Level-3 record (id, tenantSpecialtyId, data) as an untyped JSON object.
      operationId: correctTenantGroupFacilitySpecialty
      tags:
      - Facility
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectGroupFacilitySpecialtyRequest'
        required: true
      responses:
        '200':
          description: Specialty corrected successfully
          content:
            application/json:
              examples:
                specialtyCorrected:
                  value:
                    id: tgfs_001
                    tenantSpecialtyId: spec_cardiology
                    data:
                      effectiveDate: '2026-08-01'
              schema:
                type: object
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Tenant group facility specialty not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '409':
          description: Conflict - Group facility already has this specialty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /facilities/terminate:
    post:
      summary: Globally terminate one or more facilities
      description: 'Terminates each facility without the caller naming a group, network or location: every active group, network and location relationship across all of the facility''s locations ends and the facility''s tenant-level record is terminated with the given date and reason (and, when supplied, terminationInformedDate: the date the termination notice was provided, stored beside the termination date on the same records and restored by a rollback). Practitioner relationships are never changed. Supply certifyLocationId to terminate only that location (the group affiliation ends too when it was the facility''s last location in it, and the tenant-level record stays active). Relationships that already carry a termination (any termination date, past, today or future) are left exactly as they were and reported as skipped: a future-dated termination is a regular termination, and a wrong date is corrected by rolling the request back and terminating again. Open credentialing workflows are cancelled immediately, whatever the effective date; the response says how many. The cancellation is the Credentialing API''s own operation and is simply called: if it passes the termination stands, if it fails (for example for a tabled workflow) the termination is reversed and the error carries the cancel failure''s message (502 for a single facility, because a dependency failed; several facilities report it per facility as a failed item). Rolling a request back restores the records only; it does not reopen workflows. A single facility is processed synchronously and an already-terminated facility is rejected with 409; several facilities succeed or fail independently and the response reports each. Use the returned requestId with POST /facilities/terminations/{requestId}/rollback to undo exactly what this request changed. A webhook (facility.global_termination.completed) is sent once per terminated facility.'
      operationId: terminateFacilitiesGlobal
      tags:
      - Facility
      parameters:
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        description: Facilities to terminate with reason, effective date and consent
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminateFacilitiesRequest'
        required: true
      responses:
        '200':
          description: Termination processed; per-facility results in items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalTerminationResponse'
        '400':
          description: Validation failed (missing reason naming the field, bad date, no consent, too many ids)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '409':
          description: The single facility is already terminated and has no active relationship left to end, or a facility of the request already has a termination in progress (nothing was created; retry once the earlier request has finished)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '502':
          description: A single facility's open credentialing workflow could not be cancelled (a dependency failed), so the termination was reversed; the detail carries the cancel failure's message
