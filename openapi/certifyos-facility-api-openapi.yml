          items:
            $ref: '#/components/schemas/FacilityUpsertAddress'
          description: Addresses associated with the facility
        businessPurpose:
          $ref: '#/components/schemas/FacilityUpsertBusinessPurpose'
          type: object
          description: Facility business purpose flags
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/FacilityUpsertContact'
          description: Contacts associated with the facility
        serviceAddress:
          $ref: '#/components/schemas/FacilityUpsertTypedAddress'
          type: object
          description: Primary service address. When provided, addressLine1, city, state, and zip are required.
        officeAddress:
          $ref: '#/components/schemas/FacilityUpsertTypedAddress'
          type: object
          description: Office address
        billingAddress:
          $ref: '#/components/schemas/FacilityUpsertTypedAddress'
          type: object
          description: Billing address
        mailingAddress:
          $ref: '#/components/schemas/FacilityUpsertTypedAddress'
          type: object
          description: Mailing address
        irsAddress:
          $ref: '#/components/schemas/FacilityUpsertTypedAddress'
          type: object
          description: IRS/W9 address
        userDefinedFields:
          type: object
          description: Custom tenant-defined fields. Replaces the entire userDefinedFields object (PUT semantics).
        lastCredentialingDate:
          type: string
          format: date
          description: Date of the last credentialing (YYYY-MM-DD). Required when initialCredentialingDate is provided.
        initialCredentialingDate:
          type: string
          format: date
          description: Date the facility was initially credentialed (YYYY-MM-DD)
        nextCredentialingDate:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Date of the next credentialing due (YYYY-MM-DD)
        groupDetails:
          type: array
          items:
            $ref: '#/components/schemas/FacilityUpsertGroupDetail'
          description: Tenant group associations for the facility
    UpdateFacilityGroupEffectiveDateRequest:
      type: object
      properties:
        effectiveDate:
          type: string
        terminationDate:
          type: string
        cascadeToNetworkParticipation:
          type: boolean
        changeReason:
          type: string
    CorrectGroupFacilityLocationSpecialtyRequest:
      type: object
      required:
      - tenantGroupFacilityLocationSpecialtyId
      - newTenantSpecialtyId
      properties:
        tenantGroupFacilityLocationSpecialtyId:
          type: string
          examples:
          - tgfls_abc123
          pattern: \S
          description: ID of the TenantGroupFacilityLocationSpecialty record
        newTenantSpecialtyId:
          type: string
          examples:
          - ts_xyz789
          pattern: \S
          description: ID of the new TenantSpecialty to replace the current one
        changeReason:
          type: string
          examples:
          - Correcting specialty mapping per annual review
          description: Optional human-readable reason for the change, captured for audit trail.
    ManageFacilitySpecialtiesResponse:
      type: object
      properties:
        updatedSpecialties:
          type: array
          items:
            type: object
          description: Results from updated specialty records
        addedSpecialties:
          type: array
          items:
            $ref: '#/components/schemas/AssociateFacilitySpecialtyResponse'
          description: Results from newly added specialty associations
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SpecialtyNotCreated'
          description: Operations that failed, empty when all succeeded
    BulkUploadFailedLink:
      type: object
      description: A single facility that failed to link during a bulk upload
      properties:
        certifyFacilityId:
          type: string
          examples:
          - cf_abc123
          description: Certify facility ID that failed to link
        error:
          type: string
          description: Failure reason
    GlobalTerminationItemResult:
      type: object
      description: Outcome of one entity in a global termination request
      properties:
        itemId:
          type: string
          description: Item id
        entityId:
          type: string
          description: Entity id this item targeted
        status:
          $ref: '#/components/schemas/TerminationItemStatus'
          type: string
          description: SUCCEEDED, FAILED or SKIPPED_ALREADY_TERMINATED
        errorDetail:
          type: string
          description: Failure or skip detail
        rowsTerminated:
          type: integer
          format: int32
          description: Number of relationship rows ended
        skippedRows:
          type: array
          items:
            $ref: '#/components/schemas/SkippedRow'
          description: Rows left untouched because they were already terminated
        credentialingWorkflows:
          type: string
          description: CANCELLED when open credentialing workflows were cancelled (immediately, whatever the effective date), NONE when there were none. If the cancellation fails the facility is not terminated and the item is FAILED, with the cancel failure's message
        workflowsCancelled:
          type: integer
          format: int32
          description: Number of credentialing workflows cancelled
    UpdateFacilityLocationNetworkNpiParDateResponse:
      type: object
      description: Response after updating facility location-network NPI and participation date
      properties:
        tenantGroupLocationId:
          type: string
          examples:
          - tgl-123
          description: Tenant group location ID
        networkId:
          type: string
          examples:
          - net-456
          description: Network ID
        tenantGroupLocationNetworkId:
          type: string
          examples:
          - tgln-789
          description: Updated TenantGroupLocationNetwork ID
        tenantGroupLocationFacilityNetworkId:
          type: string
          examples:
          - tglfn-012
          description: Primary updated TenantGroupLocationFacilityNetwork ID
        facilityNetworkRowsUpdated:
          type: integer
          format: int32
          examples:
          - 1
          description: Count of facility-network rows updated at this location-network
    TerminationItemStatus:
      type: string
      enum:
      - PENDING
      - IN_PROGRESS
      - COMPLETING
      - SUCCEEDED
      - FAILED
      - SKIPPED_ALREADY_TERMINATED
    FacilityUpsertNetworkLink:
      type: object
      required:
      - networkId
      description: A network association for a facility group
      properties:
        networkId:
          type: string
          minLength: 1
          description: Network ID
        effectiveDate:
          type: string
          format: date
          description: Effective date of the network association (YYYY-MM-DD)
    NetworkAssociationEntry:
      type: object
      required:
      - networkId
      description: A single network with its own effective date
      properties:
        networkId:
          type: string
          examples:
          - network-456
          pattern: \S
          description: Network ID for this association
        effectiveDate:
          type: string
          examples:
          - '2026-04-01'
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Effective date applied to this network
    FacilityUpsertBusinessPurposeFlag:
      type: object
      description: A business purpose flag and its reason
      properties:
        value:
          type: boolean
          description: The flag value
        reason:
          type: string
          description: The reason for the flag value
    FacilityUpsertGroupDetail:
      type: object
      required:
      - tenantGroupId
      description: A tenant group association for the facility
      properties:
        tenantGroupId:
          type: string
          description: Tenant group ID
        effectiveDate:
          type: string
          format: date
          description: Effective date of the group association (YYYY-MM-DD)
        networkLinks:
          type: array
          items:
            $ref: '#/components/schemas/FacilityUpsertNetworkLink'
          description: Network associations for this group
    CorrectFacilitySpecialtyRequest:
      type: object
      required:
      - tenantFacilitySpecialtyId
      properties:
        tenantFacilitySpecialtyId:
          type: string
          examples:
          - tfs_abc123
          pattern: \S
          description: ID of the existing TenantFacilitySpecialty record to update
        newTenantSpecialtyId:
          type: string
          examples:
          - ts_xyz789
          description: ID of the new TenantSpecialty to replace the current one. Optional if effectiveDate or isPrimary is provided.
        effectiveDate:
          type: string
          examples:
          - '2026-01-15'
          description: New effective date for the specialty record in ISO format (YYYY-MM-DD). Optional if newTenantSpecialtyId or isPrimary is provided.
        isPrimary:
          type: boolean
          examples:
          - true
          description: Whether this specialty should be marked as primary. Optional if newTenantSpecialtyId or effectiveDate is provided.
        changeReason:
          type: string
          examples:
          - Correcting specialty mapping per annual review
          description: Optional human-readable reason for the change, captured for audit trail.
    FacilityLocationsPagedResponse:
      type: object
      required:
      - data
      description: Paginated list of TGFL-anchored facility location associations.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FacilityLocationRelationship'
          description: Items on the current page.
        links:
          $ref: '#/components/schemas/PageLinks'
          type: object
          description: HATEOAS-style navigation links (self, next, prev).
        totalCount:
          type: integer
          format: int64
          description: Total number of matching TGFL records (across all pages).
    FacilityUpsertTypedAddress:
      type: object
      description: A single-purpose facility address
      properties:
        addressLine1:
          type: string
          description: Address line 1
        addressLine2:
          type: string
          description: Address line 2
        city:
          type: string
          description: City
        state:
          type: string
          examples:
          - CA
          pattern: ^[A-Z]{2}$
          description: Two-letter US state code
        county:
          type: string
          description: County
        country:
          type: string
          description: Country
        zip:
          type: string
          description: Zip code
        zipExtension:
          type: string
          description: ZIP+4 extension returned by the address cleanser (CP-28784)
        latitude:
          type: number
          format: double
          description: Latitude returned by the address cleanser (CP-28784)
        longitude:
          type: number
          format: double
          description: Longitude returned by the address cleanser (CP-28784)
        stateFips:
          type: string
          description: State FIPS code returned by the address cleanser (CP-28784)
        countyFips:
          type: string
          description: County FIPS code returned by the address cleanser (CP-28784)
        formattedAddress:
          type: string
          description: Fully formatted address returned by the address cleanser (CP-28784)
    AddSpecialtyItem:
      type: object
      required:
      - tenantSpecialtyId
      properties:
        tenantSpecialtyId:
          type: string
          examples:
          - ts_cardiology_001
          pattern: \S
          description: ID of the tenant specialty to associate
        effectiveDate:
          type: string
          examples:
          - '2026-01-01'
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Effective date in YYYY-MM-DD format
        isPrimary:
          type: boolean
          examples:
          - false
          description: Whether this specialty is primary
    FacilityEntityRef:
      type: object
      required:
      - id
      description: Reference to a related entity with its unique id and OV data blob.
      properties:
        id:
          type: string
          description: Unique identifier of the related entity.
        data:
          type: object
          description: Operational-value data blob (schema-on-read; keys vary by entity type).
    RollbackFacilityTerminationByValueRequest:
      type: object
      required:
      - terminationDate
      - terminationReason
      description: Identifies the exact termination to undo on one facility, by its date and reason
      properties:
        terminationDate:
          type: string
          examples:
          - '2026-04-01'
          pattern: \S
          description: Termination date of the termination to undo (ISO-8601)
        terminationReason:
          type: string
          maxLength: 1024
          pattern: \S
          description: Termination reason of the termination to undo, exactly as recorded
