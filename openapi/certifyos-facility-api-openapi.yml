  /facilities/{id}/relationships/all:
    get:
      summary: Get all relationships for a facility
      description: 'Returns a single, deeply-nested snapshot of every relationship a facility participates in — groups (groupMemberships[]), the networks and contracts under each group (facilityNetworks[]), the facility''s locations both independent of any group (tenantFacilityLocations[]) and nested under each group (groupMemberships[].facilityLocations[] with their own network/plan participation), and practitioners. Use this to get a comprehensive view of a facility''s associations in a single call instead of querying individual relationship endpoints separately. Note: practitioners are only present nested under groupMemberships[].facilityLocations[].practitionersAtLocation[] (i.e. scoped to a specific group-location) — there is no facility-wide practitioner roster field on this endpoint; a prior facility-wide practitioner array was intentionally removed to avoid oversized rows, so consumers needing the full practitioner roster for a facility must call a dedicated practitioner endpoint instead.'
