      - description: Certify location ID
        required: true
        name: certifyLocationId
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Impact preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityLocationTerminationImpactResponse'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json: {}
        '404':
          description: Facility or location not found on this facility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError1'
      security:
      - jwt: []
  /facilities/{id}:
    put:
      summary: Update a facility and its tenant association
      description: Update a facility and its tenant association
      operationId: facilityUpdate
      tags:
      - Facility
      parameters:
      - description: Facility ID
        required: true
        name: id
        in: path
        schema:
          type: string
      - name: tenant-id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonNode'
        required: true
      responses:
        '201':
          description: Facility successfully updated
          content:
