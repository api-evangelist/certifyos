          description: Networks (and optional plan ids) the location participates in via the facility
    TerminateFacilitiesRequest:
      type: object
      required:
      - facilityIds
      - reason
      - effectiveDate
      - consentConfirmed
      description: Request to globally terminate one or more facilities
      properties:
        facilityIds:
          type: array
          minItems: 1
          examples:
          - - fac-abc123
          items:
            type: string
            maxLength: 36
            pattern: \S
          description: Certify facility ids to terminate (1..N, subject to the configured maximum)
        reason:
          type: string
          examples:
          - Facility closed
          maxLength: 1024
          pattern: \S
          description: Reason for the termination (required)
        effectiveDate:
          type: string
          examples:
          - '2026-04-01'
          description: Effective termination date (ISO-8601). May be past, present or future; a future-dated termination is a regular termination (open credentialing workflows are cancelled immediately, and a repeat request is rejected as already terminated until this one is rolled back).
        consentConfirmed:
          type: boolean
          examples:
          - true
          description: User must acknowledge impact before termination
        certifyLocationId:
          type: string
          examples:
          - loc-123
          maxLength: 36
          description: Optional. When set, terminates only this location's relationships (the group affiliation ends too if this was the facility's last location in the group); the facility's tenant-level record is not terminated. Omit for a global termination.
        terminationInformedDate:
          type: string
          examples:
          - '2026-03-01'
          description: Optional. Date the termination notice was provided (ISO-8601). Stored with the termination date, on the same records, and returned by GET /facilities/{id}. Format is validated like the location and network termination requests; no ordering against effectiveDate is enforced. Rolling the request back restores the value the records had before.
