components:
  schemas:
    ApiError1:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject1'
    TerminateFacilityLocationRequest:
      description: Request to terminate a facility location from the facility
      type: object
      properties:
        facilityTerminationDate:
          type: string
          description: Effective termination date for the facility–location relationship (ISO-8601). When omitted, only network participation is terminated (network-only mode).
          examples:
          - '2026-04-01'
        networkTerminationDate:
          type: string
          description: Effective termination date for network and plan participation for this location (ISO-8601). Required when facilityTerminationDate is omitted.
          examples:
          - '2026-04-01'
        terminationReason:
          type: string
          description: Reason for termination. Optional in all termination modes — both full-facility and network-only callers may omit this field.
          examples:
          - Contract Expired
        terminationInformedDate:
          type: string
          description: Date the termination notice was provided (ISO-8601)
        comments:
          type: string
          description: Optional comments persisted on terminated records
        consentConfirmed:
          type: boolean
          description: User must acknowledge impact before termination
          examples:
          - true
        networkId:
          type: string
          description: When provided in network-only mode (facilityTerminationDate is null), scopes termination to this specific network ID only. When omitted in network-only mode, all networks for the location are terminated.
      required:
      - consentConfirmed
    SpecialtyAssociationLevel:
      type: string
      enum:
      - GROUP
      - LOCATION
      - NETWORK_GROUP
      - NETWORK_LOCATION
    CorrectGroupFacilitySpecialtyRequest:
      type: object
      required:
      - tenantGroupFacilitySpecialtyId
      - newTenantSpecialtyId
      properties:
        tenantGroupFacilitySpecialtyId:
          type: string
          description: ID of the existing TenantGroupFacilitySpecialty record to correct
          examples:
          - tgfs_abc123
          pattern: \S
        newTenantSpecialtyId:
          type: string
          description: ID of the new TenantSpecialty to replace the current one
          examples:
          - ts_xyz789
          pattern: \S
        changeReason:
          type: string
          description: Optional human-readable reason for the change, captured for audit trail.
          examples:
          - Correcting specialty mapping per annual review
    CorrectFacilitySpecialtyRequest:
      type: object
      required:
      - tenantFacilitySpecialtyId
      properties:
        tenantFacilitySpecialtyId:
          type: string
          description: ID of the existing TenantFacilitySpecialty record to update
          examples:
          - tfs_abc123
          pattern: \S
        newTenantSpecialtyId:
          type: string
          description: ID of the new TenantSpecialty to replace the current one. Optional if effectiveDate or isPrimary is provided.
          examples:
          - ts_xyz789
        effectiveDate:
          type: string
          description: New effective date for the specialty record in ISO format (YYYY-MM-DD). Optional if newTenantSpecialtyId or isPrimary is provided.
          examples:
          - '2026-01-15'
        isPrimary:
          type: boolean
          description: Whether this specialty should be marked as primary. Optional if newTenantSpecialtyId or effectiveDate is provided.
          examples:
          - true
        changeReason:
          type: string
          description: Optional human-readable reason for the change, captured for audit trail.
          examples:
          - Correcting specialty mapping per annual review
    SpecialtyNotCreatedReason:
      type: string
      enum:
      - MISSING_DEPENDENCY
      - DOWNSTREAM_ERROR
      - CONFLICT
      - VALIDATION_ERROR
    FacilityInsuranceOvRequest:
      description: Facility insurance payload for full-array replace in CoreFacility data.insurances (OV)
      type: object
      properties:
        id:
          type: string
          description: Optional client-side id
        policyNumber:
          type: string
          description: Policy number (Number field in UI)
          examples:
          - POL-12345
        type:
          type: string
          description: Insurance type
          examples:
          - General Liability
        status:
          type: string
          description: Insurance status
          examples:
          - Active
        effectiveDate:
          type: string
          description: Effective date (YYYY-MM-DD)
          examples:
          - '2025-01-01'
        expirationDate:
          type: string
          description: Expiration date (YYYY-MM-DD)
          examples:
          - '2026-01-01'
        occurrenceCoverageAmount:
          type: string
          description: Occurrence coverage amount, numeric when present
          examples:
          - '1000000'
        aggregateCoverageAmount:
          type: string
          description: Aggregate coverage amount, numeric when present
          examples:
          - '2000000'
        unlimitedCoverage:
          type: boolean
          description: Unlimited coverage flag
          examples:
          - false
        carrierName:
          type: string
          description: Carrier name
          examples:
          - ABC Insurance
        source:
          type: string
          description: Source field
          examples:
          - Manual entry
        attachments:
          description: Optional attachment array
          type: object
          $ref: '#/components/schemas/JsonNode'
        action:
          type: string
          description: Set to delete for soft-delete
          examples:
          - delete
        deletedAt:
          type: string
          description: Soft-delete timestamp
        deletedBy:
          type: string
          description: Soft-delete actor
        createdAt:
          type: string
          description: Created timestamp
        createdBy:
          type: string
          description: Created by
        updatedAt:
          type: string
          description: Updated timestamp
        updatedBy:
          type: string
          description: Updated by
        verifiedDate:
          type: string
          description: Verified date
        verifiedBy:
          type: string
          description: Verified by
    SupportingDocumentUpdateRequest1:
      type: object
      required:
      - fileUrl
      properties:
        fileUrl:
          type: string
          description: URL of the supporting document file
          examples:
          - https://storage.example.com/documents/certificate.pdf
          pattern: \S
        fileType:
          type: string
          description: Type of the supporting document
          examples:
          - PDF
        originalFileName:
          type: string
          description: Original name of the uploaded file
          examples:
          - facility_license.pdf
        createdAt:
          description: Date when the document was created
          type: string
          examples:
          - '2022-01-15'
          $ref: '#/components/schemas/Date'
        createdBy:
          type: string
          description: Email of the user who created the document
          examples:
          - user@example.com
        state:
          type: string
          description: State associated with the document
          examples:
          - CA
        expirationDate:
          description: Expiration date of the document
          type: string
          examples:
          - '2025-12-31'
          $ref: '#/components/schemas/Date'
        source:
          type: string
          description: Source of the document
          examples:
          - manual
    TenantFacilityLocationSpecialtyResponse:
      type: object
      properties:
        id:
          type: string
        tenantFacilityLocationId:
          type: string
        tenantId:
          type: string
        tenantSpecialtyId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Date'
        updatedAt:
          $ref: '#/components/schemas/Date'
        data:
          $ref: '#/components/schemas/JsonNode'
    JsonNodeType:
      type: string
      enum:
      - ARRAY
      - BINARY
      - BOOLEAN
      - MISSING
      - 'NULL'
      - NUMBER
      - OBJECT
      - POJO
      - STRING
    AssociateFacilityNetworkRequest:
      description: Request to associate a facility with a network
      type: object
      required:
      - groupId
      - networkId
      properties:
        groupId:
          type: string
          description: ID of the group that the network belongs to
          examples:
          - group-123
          pattern: \S
        networkId:
          type: string
          description: ID of the network to associate with
          examples:
          - network-456
          pattern: \S
        networkEffectiveDate:
          type: string
          description: Effective date for the facility-network association
          examples:
          - '2026-04-01'
          pattern: ^\d{4}-\d{2}-\d{2}$
        groupEffectiveDate:
          type: string
          description: Effective date for the TenantGroupFacility relationship
          examples:
          - '2026-03-15'
          pattern: ^\d{4}-\d{2}-\d{2}$
    FacilityCertificateOvRequest:
      description: Facility certificate payload for full-array replace in CoreFacility data.certifications (OV)
      type: object
      properties:
        id:
