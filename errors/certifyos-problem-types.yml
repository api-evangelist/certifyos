envelopes:
- name: ApiError
  shape: '{ "errors": [ ErrorObject ] }'
  used_by: [api-service, roster-service]
  fields:
    httpStatus: HTTP status code for this error (integer)
    reason: error reason/code, e.g. VALIDATION_ERROR
    title: 'error title/summary, e.g. "Validation failed for field: eventTypes"'
    detail: detailed error message
- name: BadRequestErrorResponse
  shape: '{ "errors": ["string"], "errorDetails": [ ... ] }'
  used_by: [api-service, roster-service]
  note: >-
    The 400 envelope on most write operations. errors[] is a flat list of
    strings; errorDetails carries structured validation failures.
- name: NpiValidationErrorResponse
  shape: '{ "status": 400, "error": "Bad Request", "message": "..." }'
  used_by: [api-service]
  note: A third, inconsistent envelope used only by the NPI validation endpoint.
