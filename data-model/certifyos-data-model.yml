join_entity_pattern:
  description: >-
    Roughly half the published entity schemas are Tenant*/Group* join tables that
    scope shared reference data (specialties, networks, plans, participations,
    locations) to a tenant, a group, a practitioner and a network simultaneously.
  examples:
  - TenantGroupPractitionerLocationNetworkSpecialty
  - GroupPractitionerLocationNetworkParticipationSpecialty
  - TenantGroupNetworkSpecialty
  - TenantPractitionerSpecialty
  implication: >-
    Participation is modelled at the intersection of practitioner x location x
    group x network x specialty, which is why the list endpoints ship a
    URL-encoded JSON filter grammar rather than flat query parameters.
